<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cookie Run Classic — คุกกี้รัน คลาสสิค</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<meta name="theme-color" content="#6e2117">
<meta property="og:title" content="Cookie Run Classic — คุกกี้รัน คลาสสิค">
<meta property="og:description" content="เกมวิ่งคุกกี้สุดคลาสสิค: หนีเตาอบ เก็บเยลลี่ เลือกตัวละคร อัปเกรด แข่งอันดับ — เล่นฟรีบนมือถือและคอม">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%;
    background:#2a1a0e;
    overflow:hidden;
    font-family:'Trebuchet MS','Tahoma',sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,#4a2c14 0%,#1d1006 100%);
  }
  canvas {
    display:block;
    image-rendering:auto;
    box-shadow:0 0 60px rgba(0,0,0,.6);
    border-radius:6px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
'use strict';
/* ============================================================
   COOKIE RUN CLASSIC  —  คุกกี้รัน คลาสสิค
   วิ่ง กระโดด สไลด์ เก็บเยลลี่ ก่อนพลังคุกกี้จะหมด!
   + เลือกตัวละคร / ร้านค้าอัปเกรด / ตารางอันดับ
   ============================================================ */

const W = 960, H = 540;
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
// เรนเดอร์ตามความละเอียดจอจริง (retina) ให้ภาพคมชัด ไม่เบลอตอนขยายเต็มจอ
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
canvas.width = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);

/* offscreen canvas สำหรับเรนเดอร์ตัวละครแบบ unified silhouette
   (วาดรวมเป็นก้อนเดียว → ไล่แสงทั้งตัวพาสเดียว → ภาพเนียนไร้รอยต่อ) */
const charCanvas = document.createElement('canvas');
const CSS = 2;                       // ซูเปอร์แซมเปิล 2x ให้ขอบคม
const C_OX = 100, C_OY = 160;        // จุดกำเนิด (กึ่งกลางเท้า) ในพิกัด offscreen
const HS = 1.12;                     // สเกลหัว (ผลวัดสไปรต์จริง: หัว ≈58% ของความสูง)
const SQ = 0.88;                     // บีบแนวตั้งรวม → สัดส่วนป้อมแบบสไปรต์จริง
charCanvas.width = 200 * CSS;
charCanvas.height = 205 * CSS;
const charCtx = charCanvas.getContext('2d');
// แคนวาสประกอบร่างขั้นสุดท้าย: ตีเส้นขอบรอบทุกชิ้น + เงาเซลเชด
const olTmp = document.createElement('canvas');
olTmp.width = charCanvas.width; olTmp.height = charCanvas.height;
const olTmpCtx = olTmp.getContext('2d');
const olOut = document.createElement('canvas');
olOut.width = charCanvas.width; olOut.height = charCanvas.height;
const olOutCtx = olOut.getContext('2d');
const olRim = document.createElement('canvas');
olRim.width = charCanvas.width; olRim.height = charCanvas.height;
const olRimCtx = olRim.getContext('2d');
/* แคชสไปรต์สัตว์เลี้ยงตัวตามในเกม */
const petCC = document.createElement('canvas');
petCC.width = charCanvas.width; petCC.height = charCanvas.height;
const petCCtx = petCC.getContext('2d');
let petCCid = null, petCCt = -1;
function finishSprite(olc) {
  // 1) เงาดำรูปเดียวกับตัวละคร — สีขอบดึงจากสีตัวคุกกี้ (hue เดียวกัน เข้มกว่า)
  olTmpCtx.setTransform(1, 0, 0, 1, 0, 0);
  olTmpCtx.clearRect(0, 0, olTmp.width, olTmp.height);
  olTmpCtx.drawImage(charCanvas, 0, 0);
  olTmpCtx.globalCompositeOperation = 'source-in';
  olTmpCtx.fillStyle = olc || '#4a2c12';
  olTmpCtx.fillRect(0, 0, olTmp.width, olTmp.height);
  olTmpCtx.globalCompositeOperation = 'source-over';
  // 2) ปั๊มเส้นขอบ 8 ทิศรอบตัว แล้ววางตัวจริงทับ
  olOutCtx.setTransform(1, 0, 0, 1, 0, 0);
  olOutCtx.clearRect(0, 0, olOut.width, olOut.height);
  const d = 3.4;
  for (const [dx, dy] of [[d,0],[-d,0],[0,d],[0,-d],[d*0.7,d*0.7],[-d*0.7,d*0.7],[d*0.7,-d*0.7],[-d*0.7,-d*0.7]])
    olOutCtx.drawImage(olTmp, dx, dy);
  olOutCtx.drawImage(charCanvas, 0, 0);
  // 3) เซลเชด: เงาอุ่นด้านล่าง + แสงนวลด้านบน (คลิปตามรูปร่าง)
  olOutCtx.globalCompositeOperation = 'source-atop';
  const g = olOutCtx.createLinearGradient(0, 0, 0, olOut.height);
  g.addColorStop(0, 'rgba(255,255,255,.10)');
  g.addColorStop(0.35, 'rgba(255,255,255,0)');
  g.addColorStop(0.62, 'rgba(120,60,20,0)');
  g.addColorStop(1, 'rgba(120,60,20,.16)');
  olOutCtx.fillStyle = g;
  olOutCtx.fillRect(0, 0, olOut.width, olOut.height);
  olOutCtx.globalCompositeOperation = 'source-over';
  // 4) ริมไลต์: เส้นแสงบาง ๆ ตามขอบด้านบน (ด้านรับแสง) แบบสไปรต์ทางการ
  olRimCtx.setTransform(1, 0, 0, 1, 0, 0);
  olRimCtx.globalCompositeOperation = 'source-over';
  olRimCtx.clearRect(0, 0, olRim.width, olRim.height);
  olRimCtx.drawImage(charCanvas, 0, 0);
  olRimCtx.globalCompositeOperation = 'destination-out';
  olRimCtx.drawImage(charCanvas, 0, 4.5);
  olRimCtx.globalCompositeOperation = 'source-in';
  olRimCtx.fillStyle = '#fff6dc';
  olRimCtx.fillRect(0, 0, olRim.width, olRim.height);
  olOutCtx.globalAlpha = 0.3;
  olOutCtx.drawImage(olRim, 0, 1.5);
  olOutCtx.globalAlpha = 1;
}

let screenRot = false;   // หมุนจอ 90° เมื่อถือมือถือแนวตั้ง เพื่อให้เกมแนวนอนเต็มจอ
function fit() {
  const portrait = innerHeight > innerWidth;
  screenRot = portrait;
  if (portrait) {
    // หมุนเกม 90° → ด้านยาวของเกม (960) แมปกับด้านยาวของจอ (สูง) เต็มจอมือถือ
    const s = Math.min(innerHeight / W, innerWidth / H);
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    canvas.style.transform = 'rotate(90deg)';
    canvas.style.transformOrigin = 'center center';
  } else {
    const s = Math.min(innerWidth / W, innerHeight / H);
    canvas.style.width  = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    canvas.style.transform = 'none';
  }
}
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
fit();

/* ---------- helpers ---------- */
/* แหล่งสุ่มสลับได้: ระหว่างสร้างด่านใช้ seed คงที่ → คอร์สเหมือนเดิมทุกรอบ (ฝึกจำทางได้) */
let rngSrc = Math.random;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let courseRng = Math.random;
const rnd  = (a, b) => a + rngSrc() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function hexLerp(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
  const bl = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${bl})`;
}
/* ปรับสีสว่างขึ้น/มืดลง (รับได้ทั้ง #hex และ rgb(...)) */
function shade(col, amt) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  r = clamp(r + amt, 0, 255); g = clamp(g + amt, 0, 255); b = clamp(b + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
/* ผลศึกษาสไปรต์ทางการ 92 ภาพ: เส้นขอบแต่ละชิ้นเป็น "สี hue เดียวกับพื้นแต่เข้มกว่า"
   (ความสว่างขอบ ≈ 0.73 เท่าของสีพื้น) → dk คูณช่องสีตรง ๆ เพื่อคงเฉดสีเดิม */
function dk(col, f) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    if (!m) return col;
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  return `rgb(${(r * f) | 0},${(g * f) | 0},${(b * f) | 0})`;
}
/* โหมดตีเส้นอัตโนมัติ: ระหว่างวาดเครื่องแต่งกาย ทุก fill() ตีขอบสีเดียวกันที่เข้มขึ้นให้เอง
   (ยกเว้นรายละเอียดจิ๋วบนหน้า ที่เกมจริงไม่ตีขอบ) */
let AUTOL = false;
const NO_OL = new Set(['freckles', 'stubble', 'blushdot', 'tear', 'fangs', 'facepaint', 'patch']);
/* โหมดยืนหันหน้าตรงแบบภาพทางการ: แขน-ขาสมมาตร + หน้าอยู่กึ่งกลางหัว
   (ท่าวิ่งในเกมยังเป็นมุมข้างเหมือนเดิม) */
let FRONT = false;
const FACE_P = new Set(['glasses', 'patch', 'freckles', 'blushdot', 'fangs', 'tear', 'stubble', 'facepaint', 'beard', 'mustache', 'jawbeard']);
const _protoFill = CanvasRenderingContext2D.prototype.fill;
CanvasRenderingContext2D.prototype.fill = function (...a) {
  _protoFill.apply(this, a);
  if (!AUTOL) return;
  const fs = this.fillStyle;
  if (typeof fs !== 'string' || fs.startsWith('rgba')) return;  // ข้ามไล่เฉด/สีโปร่งแสง
  const p2 = a[0] instanceof Path2D ? a[0] : null;
  this.save();
  // 1) เส้นขอบสี hue เดียวกันเข้มกว่า (กฎจากผลวัดสไปรต์จริง)
  this.strokeStyle = dk(fs, 0.68);
  this.lineWidth = 2.2;
  this.lineJoin = 'round'; this.lineCap = 'round';
  p2 ? this.stroke(p2) : this.stroke();
  // 2) เซลเชดรายชิ้น: แถบไฮไลต์ขอบบน + เงาขอบล่าง ตามรูปทรงของชิ้นนั้น
  //    ใช้เกรเดียนต์แนวดิ่งทั้งสไปรต์ แปลงพิกัดกลับด้วย inverse transform
  try {
    p2 ? this.clip(p2) : this.clip();
    const m = this.getTransform().invertSelf();
    const Hc = this.canvas.height;
    const g = this.createLinearGradient(m.e, m.f, m.c * Hc + m.e, m.d * Hc + m.f);
    g.addColorStop(0, 'rgba(255,255,255,.34)');
    g.addColorStop(0.36, 'rgba(255,255,255,.05)');
    g.addColorStop(0.52, 'rgba(70,35,10,0)');
    g.addColorStop(1, 'rgba(70,35,10,.30)');
    this.strokeStyle = g;
    this.lineWidth = 6.5;
    p2 ? this.stroke(p2) : this.stroke();
  } catch (e) {}
  this.restore();
};

/* ---------- persistent save ---------- */
/* ---------- โปรไฟล์ผู้เล่น: ล็อกอินก่อนเข้าเกม แยกเซฟต่อโปรไฟล์ ----------
   โปรไฟล์แรก (id '') ใช้คีย์ cr_ เดิม → เซฟเก่าไม่หาย */
function rawGet(k, d) {
  try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
  catch (e) { return d; }
}
function rawSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let PROFILES = rawGet('cr_profiles', null);
if (!PROFILES) {
  // ครั้งแรก: ถ้ามีเซฟเก่า สร้างโปรไฟล์ให้จากชื่อเดิม
  const legacyName = rawGet('cr_name', null);
  PROFILES = rawGet('cr_coins', null) !== null || legacyName
    ? [{ id: '', name: legacyName || 'ผู้เล่น 1' }] : [];
  rawSet('cr_profiles', PROFILES);
}
let ACTIVE = rawGet('cr_active', PROFILES.length ? PROFILES[0].id : null);
if (ACTIVE !== null && !PROFILES.some(pf => pf.id === ACTIVE)) ACTIVE = PROFILES.length ? PROFILES[0].id : null;
const profPrefix = () => 'cr_' + (ACTIVE ? ACTIVE + '_' : '');
const SAVE = {
  get(k, d) { return ACTIVE === null ? d : rawGet(profPrefix() + k, d); },
  set(k, v) {
    if (ACTIVE === null) return;
    rawSet(profPrefix() + k, v);
    queueCloudSave();   // ทุกการเซฟสำคัญ → ซิงก์ขึ้นคลาวด์อัตโนมัติ (ดีบาวน์ซ์)
  }
};
function loginProfile(id) {
  if (id === ACTIVE) { setState('menu'); AudioSys.click(); return; }
  rawSet('cr_active', id);
  location.reload();   // โหลดเซฟของโปรไฟล์นั้นใหม่ทั้งหมด
}
/* ---------- บัญชีคลาวด์: ล็อกอินอีเมล (Gmail) + PIN ซิงก์เซฟข้ามเครื่อง ---------- */
const cloudSession = () => rawGet('cr_cloud', null);
function cloudApi(body, keepalive) {
  return fetch('/api/account', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    keepalive: !!keepalive,   // ให้ request รอดตอนปิดแท็บ/สลับแอป
  }).then(r => r.json());
}
function collectSaveData() {
  const pre = profPrefix();
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(pre)) continue;
    if (['cr_profiles', 'cr_active', 'cr_cloud'].includes(k)) continue;
    if (pre === 'cr_' && /^cr_p[0-9a-z]+_/.test(k)) continue;   // legacy: ข้ามคีย์ของโปรไฟล์อื่น
    out[k.slice(pre.length)] = rawGet(k, null);
  }
  out.__t = Date.now();   // ตราเวลาเซฟ ใช้ตัดสินว่าข้อมูลฝั่งไหนใหม่กว่า
  return out;
}
let cloudBusy = false;
function cloudSave(silent, keepalive) {
  const cs = cloudSession();
  if (!cs || ACTIVE === null || cloudBusy) return;
  const pf = PROFILES.find(q => q.id === ACTIVE);
  if (!pf || pf.email !== cs.email) return;   // ซิงก์เฉพาะโปรไฟล์ที่ผูกอีเมลนี้
  cloudBusy = true;
  rawSet(profPrefix() + '__t', Date.now());
  cloudApi({ action: 'save', email: cs.email, pin: cs.pin, data: collectSaveData() }, keepalive)
    .then(r => {
      cloudBusy = false;
      if (!silent) floatText(W / 2, 110, r.ok ? '☁️ ซิงก์เซฟขึ้นคลาวด์แล้ว!' : '☁️ ซิงก์ไม่สำเร็จ', r.ok ? '#7ec8ff' : '#ff8888', true);
    })
    .catch(() => { cloudBusy = false; });
}
/* ซิงก์อัตโนมัติ: ทุกครั้งที่มีการเซฟสำคัญ (ซื้อของ/อัปเกรด/จบเกม/เช็กอิน)
   รอ 2.5 วิให้การเปลี่ยนแปลงชุดเดียวกันรวมกันก่อนค่อยอัปโหลด */
let cloudQT = null;
function queueCloudSave() {
  if (!rawGet('cr_cloud', null)) return;
  clearTimeout(cloudQT);
  cloudQT = setTimeout(() => cloudSave(true), 2500);
}
/* สลับแอป/ปิดแท็บ → รีบอัปโหลดทันที (keepalive ให้ request รอด) */
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(cloudQT); cloudBusy = false; cloudSave(true, true); }
});
addEventListener('pagehide', () => { clearTimeout(cloudQT); cloudBusy = false; cloudSave(true, true); });
/* เปิดเกม → ดึงเซฟล่าสุดจากคลาวด์มาเทียบ ใครใหม่กว่าใช้อันนั้น
   (แก้ปัญหา "ล็อกอินเครื่องอื่นแล้วข้อมูลหาย") */
function cloudPullOnBoot() {
  const cs = cloudSession();
  if (!cs || ACTIVE === null) return;
  const pf = PROFILES.find(q => q.id === ACTIVE);
  if (!pf || pf.email !== cs.email) return;
  cloudApi({ action: 'load', email: cs.email, pin: cs.pin }).then(r => {
    if (!r.ok || !r.data || !Object.keys(r.data).length) { cloudSave(true); return; }
    const localT = rawGet(profPrefix() + '__t', 0) || 0;
    const cloudT = r.data.__t || 0;
    if (cloudT > localT + 1500) {
      // คลาวด์ใหม่กว่า → ดึงลงมาทับ แล้วโหลดใหม่ (กันวนด้วย sessionStorage)
      if (sessionStorage.getItem('cr_pulled') === String(cloudT)) return;
      const pre = profPrefix();
      Object.keys(r.data).forEach(k => rawSet(pre + k, r.data[k]));
      sessionStorage.setItem('cr_pulled', String(cloudT));
      location.reload();
    } else if (localT > cloudT + 1500) {
      cloudSave(true);   // เครื่องนี้ใหม่กว่า → อัปขึ้นแทน
    }
  }).catch(() => {});
}
setTimeout(cloudPullOnBoot, 600);
function cloudLogin() {
  const prev = cloudSession() || {};
  const email = prompt('อีเมล (Gmail) ของคุณ:', prev.email || '');
  if (!email || !email.includes('@')) return;
  const pin = prompt('PIN ของบัญชี (ตัวเลข 4 หลักขึ้นไป — ครั้งแรก = ตั้งใหม่):', '');
  if (!pin || pin.trim().length < 4) { alert('PIN ต้องยาวอย่างน้อย 4 ตัว'); return; }
  const em = email.trim().toLowerCase();
  cloudApi({ action: 'login', email: em, pin: pin.trim() }).then(r => {
    if (!r.ok) {
      alert(r.reason === 'wrong-pin' ? 'PIN ไม่ถูกต้อง!' :
            r.reason === 'bad-email' ? 'รูปแบบอีเมลไม่ถูกต้อง' :
            'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
      return;
    }
    rawSet('cr_cloud', { email: em, pin: pin.trim() });
    let pf = PROFILES.find(q => q.email === em);
    if (!pf) {
      if (PROFILES.length >= 4) { alert('โปรไฟล์เต็ม (สูงสุด 4)'); return; }
      pf = { id: 'p' + Date.now().toString(36), name: em.split('@')[0].slice(0, 12), email: em };
      PROFILES.push(pf);
      rawSet('cr_profiles', PROFILES);
      rawSet('cr_' + pf.id + '_name', pf.name);
    }
    if (r.data && Object.keys(r.data).length) {
      // มีเซฟบนคลาวด์ → ทับเฉพาะเมื่อคลาวด์ใหม่กว่าเซฟในเครื่อง
      const pre = 'cr_' + (pf.id ? pf.id + '_' : '');
      const localT = rawGet(pre + '__t', 0) || 0;
      const cloudT = r.data.__t || 0;
      if (cloudT >= localT) {
        Object.keys(r.data).forEach(k => rawSet(pre + k, r.data[k]));
        sessionStorage.setItem('cr_pulled', String(cloudT));
      }
      // ถ้าเครื่องนี้ใหม่กว่า → เก็บของเครื่องไว้ เดี๋ยว cloudPullOnBoot อัปขึ้นให้เอง
    }
    rawSet('cr_active', pf.id);
    location.reload();
  }).catch(() => alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'));
}

function petDesc(fx) {
  const v = fx.v;
  switch (fx.k) {
    case 'magnet': return ['ดูดเยลลี่รอบตัว', 'รัศมี +' + v];
    case 'coin': return ['เหรียญที่เก็บ +' + v, 'ต่อเหรียญ'];
    case 'regen': return ['ฟื้นพลัง +' + v, 'ต่อวินาที'];
    case 'jelly': return ['เสกเยลลี่พิเศษ', 'ทุก ' + v + ' วิ'];
    case 'pts': return ['โบนัสแต้ม', 'ทุก ' + v + ' วิ'];
    case 'skill': return ['ชาร์จเกจสกิล', '+' + v + '/วิ'];
    case 'destroy': return ['ทำลายสิ่งกีดขวาง', 'ทุก ' + v + ' วิ'];
    case 'coinrain': return ['โปรยเหรียญ', 'ทุก ' + v + ' วิ'];
    case 'bt': return ['BONUS TIME', 'นานขึ้น +' + v + ' วิ'];
    case 'score': return ['แต้มทุกชนิด', '+' + Math.round((v - 1) * 100) + '%'];
    case 'combo': return ['คอมโบค้างนาน', '+' + v + ' วิ'];
    case 'hp': return ['พลังชีวิตสูงสุด', '+' + v];
    case 'boost': return ['Rocket Start', '+' + v + ' วิ'];
    case 'drain': return ['พลังลดช้าลง', Math.round((1 - v) * 100) + '%'];
    case 'bear': return ['แต้มหมีเยลลี่', '+' + Math.round((v - 1) * 100) + '%'];
  }
  return ['ผู้ช่วยนักวิ่ง'];
}
function PE(id, name, grade, cost, shape, col, fx, ex) {
  return { id, name, grade, cost, shape, c1: col[0], c2: col[1] || '#ffffff', c3: col[2] || '#4a2410',
    fx: fx || { k: 'pts', v: 8 }, ex: ex || 0, desc: petDesc(fx || { k: 'pts', v: 8 }) };
}

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.32;
      this.musicGain.connect(this.master);

  beep(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;

    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master); src.start(t);

    if (this.step % 4 === 0) {   // kick

      o.type = 'sine'; o.frequency.setValueAtTime(150, t);

      o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.14);
    }
    if (this.step % 2 === 1) {   // hi-hat
      const len = Math.floor(this.ctx.sampleRate * 0.03);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const g = this.ctx.createGain(); g.gain.value = 0.05 * kind;
      src.connect(g); g.connect(this.musicGain); src.start(t);

        const o2 = this.ctx.createOscillator(), g2 = this.ctx.createGain();
        o2.type = 'sine'; o2.frequency.value = m * 1.5;
        g2.gain.setValueAtTime(0.02, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
        o2.connect(g2); g2.connect(this.musicGain); o2.start(t); o2.stop(t + 0.13);
      }
      if (b) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = b;
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.19);
      }
      this.drumHit(t, tr.drum);
      this.step++;
      // ปรับจังหวะตามเพลง
      const target = tr.tempo;
      if (this._tempo !== target) { this._tempo = target; clearInterval(this.musicTimer);
        this.musicTimer = setInterval(tick, target); }
    };
    this._tempo = 130;
    this.musicTimer = setInterval(tick, 130);
  },
  stopMusic() { clearInterval(this.musicTimer); this.musicTimer = null; }
};

   → วิ่งตามเยลลี่ = ผ่านเสมอ (ลายเซ็นเกมเพลย์ของต้นฉบับ) */
function jumpArcJellies(x0, type) {
  const v = G.speed;
  const step = 1 / 120;
  let y = GROUND_Y - 36, vy = JUMP_V, x = x0, lastX = x0 - 999;
  for (let t = 0; t < 2; t += step) {
    vy += effGrav(vy) * step;
    y += vy * step;
    x += v * step;
    if (vy > 0 && y >= GROUND_Y - 36) break;
    if (x - lastX >= 47) { J(x, y, type || 'bar'); lastX = x; }
  }
  return x - x0;   // ระยะโดดจริง ณ ความเร็วปัจจุบัน
}
const spdK = () => G.speed / G.baseSpeed;   // ตัวคูณระยะตามความเร็ว

function rowJellies(x, n, y = GROUND_Y - 36, type = 'bar') {
  for (let i = 0; i < n; i++) J(x + i * 46, y, type);
  return n * 46;
}
function arcJellies(x, n, peak = 150) {
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const y = GROUND_Y - 36 - Math.sin(t * Math.PI) * peak;
    J(x + i * 52, y, 'bar');
  }
  return n * 52;
}

    if (Math.random() < 0.5) OB(x + 120 + w * 0.5, 'spike');
    return w + 240;
  },
  // 11: ชั้นลอยสองช่วง + หมี
  x => {
    const y = GROUND_Y - 160;
    platforms.push({ x: x + 60, w: 330, y });
    platforms.push({ x: x + 60 + 330 + 130, w: 300, y: y - 60 });
    for (let i = 0; i < 5; i++) J(x + 100 + i * 55, y - 34, 'bar');
    for (let i = 0; i < 4; i++) J(x + 555 + i * 55, y - 94, 'bar');
    spawnBear(x + 60 + 330 + 130 + 300 - 40, y - 60 - 62);
    pits.push({ x: x + 60 + 330 + 10, w: 110 });
    return 60 + 330 + 130 + 300 + 200;
  },
];

const bonusPathY = wx => 250 + Math.sin(wx * 0.004) * 105;

/* ตัวอักษรเยลลี่ "BONUS" — ซิกเนเจอร์ของเกมจริง */
const LETTERS = {
  B: ['1110','1001','1110','1001','1110'],
  O: ['0110','1001','1001','1001','0110'],
  N: ['1001','1101','1011','1001','1001'],
  U: ['1001','1001','1001','1001','0110'],
  S: ['0111','1000','0110','0001','1110'],
};
let bonusLetterQueue = [];
let bonusBearSpawned = false;

function spawnBonusPattern() {
  // ช่วงแรกของโบนัส: สะกดคำว่า BONUS ด้วยเยลลี่
  if (bonusLetterQueue.length) {
    const map = LETTERS[bonusLetterQueue.shift()];
    const x = spawnX;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 4; c++)
        if (map[r][c] === '1') J(x + c * 27, 176 + r * 27, 'bar');
    spawnX = x + 4 * 27 + 46;
    return;
  }
  const x = spawnX;
  for (let i = 0; i < 12; i++) {
    const wx = x + i * 50;
    const y = bonusPathY(wx);
    J(wx, y, 'bar');
    J(wx, y - 46, i % 3 === 0 ? 'coin' : 'bar');
    J(wx, y + 46, i % 4 === 0 ? 'pink' : 'bar');
  }
  spawnX = x + 12 * 50;
}

/* เกาะโจรสลัด: มีแต่เหรียญ ยาใหญ่ และอุปสรรคเบา ๆ */
function spawnCoinPattern() {
  const x = spawnX;
  const r = rnd(0, 1);
  let w;
  if (r < 0.06) {
    rowJellies(x, 4, GROUND_Y - 36, 'coin');
    J(x + 4 * 46 + 20, GROUND_Y - 46, 'potion');
    w = 4 * 46 + 180;
  } else if (r < 0.3) {
    // โค้งเหรียญข้ามอุปสรรค
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      J(x + i * 52, GROUND_Y - 36 - Math.sin(t * Math.PI) * 160, 'coin');
    }
    if (rnd(0, 1) < 0.6) OB(x + 7 * 26 - 26, rnd(0, 1) < 0.5 ? 'spike' : 'rock');
    w = 7 * 52 + 130;
  } else if (r < 0.5) {
    // ชั้นลอย + เหรียญสองชั้น
    const y = GROUND_Y - 150, pw2 = rndi(5, 7) * 60;
    platforms.push({ x: x + 60, w: pw2, y });
    for (let i = 0; i < Math.floor(pw2 / 52) - 1; i++) J(x + 90 + i * 52, y - 34, 'coin');
    for (let i = 0; i < 5; i++) J(x + 100 + i * 56, GROUND_Y - 36, 'coin');
    w = pw2 + 200;
  } else if (r < 0.62) {
    // ฝนเหรียญซิกแซก
    for (let i = 0; i < 10; i++)
      J(x + i * 46, GROUND_Y - 36 - (i % 4 < 2 ? 0 : 120), 'coin');
    w = 10 * 46 + 110;
  } else {
    w = rowJellies(x, rndi(5, 9), GROUND_Y - 36, 'coin') + 110;
    if (rnd(0, 1) < 0.3) pits.push({ x: x + w - 60, w: rndi(110, 150) });
  }
  spawnX = x + w + rnd(40, 110);
}

function spawnPattern() {
  if (G.bonusT > 0) { spawnBonusPattern(); return; }
  if (G.mode === 'coins') { spawnCoinPattern(); return; }
  const x = spawnX;
  let w;
  const roll = rnd(0, 1);
  if (roll < 0.04)        w = spawnItem(x, 'potion');
  else if (roll < 0.068)  w = spawnItem(x, 'giant');
  else if (roll < 0.096)  w = spawnItem(x, 'magnet');
  else if (roll < 0.118)  w = spawnItem(x, 'star');
  else if (roll < 0.142)  w = spawnItem(x, 'blast');
  else if (roll < 0.157)  w = spawnItem(x, 'btjelly');   // เยลลี่พาเข้า BONUS TIME ทันที (แบบเกมจริง)
  else if (roll < 0.19)   w = spawnItem(x, 'box');
  else {
    const hard = Math.min(G.stage, 6);
    const pool = [0,1,1,2,2,3,4,5,6,7,9,10,10,11]
      .concat(hard >= 2 ? [3,5,8,10] : [0])
      .concat(hard >= 3 ? [7,8,11] : []);
    w = PATTERNS[pool[rndi(0, pool.length - 1)]](x);
    // ตัวอักษร BONUSTIME ตัวถัดไปโปรยไว้กลางทาง (แบบเกมจริง)
    // วัตถุดิบอบขนม (ดรอปหายาก)
    if (G.mode === 'normal' && rnd(0, 1) < 0.055) {
      jellyList.push({ x: x + rnd(80, Math.max(120, w - 60)), y: GROUND_Y - rnd(90, 190),
                       type: 'ingr', kind: rndi(0, 4), t: rnd(0, TAU), dead: false });
    }
    if (G.btProgress < 9 && rnd(0, 1) < 0.24 * (1 + trV('letter') * 0.6)) {
      const lj = { x: x + rnd(60, Math.max(80, w - 60)), y: GROUND_Y - rnd(120, 205),
                   type: 'letter', ch: BT_WORD[G.btProgress], t: rnd(0, TAU), dead: false };
      jellyList.push(lj);
    }
  }
  spawnX = x + w + rnd(50, 130) * spdK();
}
function spawnItem(x, type) {
  rowJellies(x, 4);
  J(x + 4 * 46 + 20, GROUND_Y - 46, type);
  return 4 * 46 + 180;
}

function doJump() {
  if (G.state === 'play' && CFX().k === 'squad') {
    G.cfxCount = (G.cfxCount || 0) + 1;
    if (G.cfxCount >= CFX().n) {
      G.cfxCount = 0;
      let nd = 0;
      for (let i = obstacles.length - 1; i >= 0 && nd < 3; i--) {
        const ox = obstacles[i].x - worldX;
        if (ox > P.x + 30 && ox < W + 40) {
          sparkle(ox, GROUND_Y - 26, 16, '#ff8ab0');
          debris(ox, GROUND_Y - 26, 13, '#8a5a2e');
          obstacles.splice(i, 1); nd++;
        }
      }
      G.coins += 5; G.score += Math.round(250 * lvMul()) * nd;
      banner('📣 ทีมเชียร์บุก! ทำลาย ' + nd + ' + 5🪙', '#ff8ab0');
      AudioSys.power();
    }
  }
  if (G.state !== 'play') return;
  if (P.dead || P.fallingPit || G.bonusT > 0) return;
  if (P.sliding) {
    P.sliding = false;
    P.y -= (P.h - P.h * 0.52) * (P.giantT > 0 ? 1.6 : 1);
  }
  if (P.onGround) {
    P.vy = JUMP_V * (P.giantT > 0 ? 0.94 : 1);
    P.onGround = false; P.jumps = 1;
    P.squash = -0.28;
    AudioSys.jump();
    puff(P.x, P.y + P.h, 6);
  } else if (P.jumps >= 1 && P.jumps < CH().jumps) {
    P.vy = JUMP2_V;
    P.jumps++;
    // สกิลนับจำนวนโดด 2 ชั้น (จิ้งจอกเก้าหาง: ครบแล้วแปลงร่าง)
    if (CFX().trig === 'djump') {
      G.cfxCount = (G.cfxCount || 0) + 1;
      if (G.cfxCount >= CFX().n) {
        G.cfxCount = 0;
        G.formT = CFX().dur; skillBurst('#ffd76e', true); skillCut(CFX().tag || '✨ แปลงร่าง!', '#ffd76e');
        G.shake = 6; AudioSys.power();
        banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#ffd24a');
      }
    }
    if (CFX().k === 'jumpPts') {
      FX.rings.push({ t: 0, c: '#bfe8ff', x: P.x + 28, y: P.y + 30 });
      const jp = Math.round(CFX().v * lvMul());
      G.score += jp;
      floatText(P.x + 30, P.y - 16, '+' + jp + ' ✨', '#aee4ff');
    }
    AudioSys.jump2();
    puff(P.x, P.y + P.h, 8, '#fff');
  }
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  AudioSys.init(); AudioSys.resume();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (G.state === 'menu') { G.boostSel = {}; setState('prep'); }
    else if (G.state === 'prep') prepGo();
    else if (G.state === 'over') { if (G.overT > 1) startGame(G.mode); }
    else if (['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
    else doJump();
  }
  if (e.code === 'Escape' && ['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'play') togglePause();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); doSlide(true); }
  if (e.code === 'KeyM') { AudioSys.muted = !AudioSys.muted; }
  if (e.code === 'KeyX' && G.state === 'play') useSkill();
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') doSlide(false);

});

/* ---------- UI buttons ---------- */
let uiButtons = [];
function uiClick(x, y) {
  // ไล่จากปุ่มที่วาดหลังสุดก่อน (ป๊อปอัป/เลเยอร์บนต้องชนะปุ่มข้างใต้)
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      AudioSys.click();
      b.cb();
      return true;
    }
  }
  return false;
}
function canvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  if (screenRot) {
    // จอถูกหมุน 90° (rotate) — แปลงพิกัดกลับให้ตรงกับพิกัดเกม
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cw = parseFloat(canvas.style.width) || (W), ch = parseFloat(canvas.style.height) || (H);
    const u = (clientY - cy), v = -(clientX - cx);   // อินเวิร์สของ rotate(90deg)
    return [(u + cw / 2) / cw * W, (v + ch / 2) / ch * H];
  }
  return [(clientX - r.left) / r.width * W, (clientY - r.top) / r.height * H];
}
function pointerDown(x, y, id) {
  if (POPUP_STATES.includes(G.state)) {
    // ป๊อปอัพถูกย่อรอบกึ่งกลางจอ — แปลงพิกัดกลับก่อนเช็คปุ่ม
    const pk = popupScale();
    x = (x - W / 2) / pk + W / 2;
    y = (y - H / 2) / pk + H / 2;
  }
  if (G.state === 'play') {
    if (G.paused) { togglePause(); return; }
    if (Math.hypot(x - W / 2, y - 30) < 26) { togglePause(); return; }   // ปุ่มพักกลางบน
    if (Math.hypot(x - W / 2, y - (H - 66)) < 44) { useSkill(); return; } // ปุ่มสกิลกลางล่าง
    if (x < W / 2) { if (id !== undefined) touches[id] = 'L'; else mouseFly = true; doJump(); }
    else { if (id !== undefined) touches[id] = 'R'; doSlide(true); }
    return;
  }
  if (uiClick(x, y)) return;
  if (G.state === 'over' && G.overT > 1.2) startGame(G.mode);
}

const touches = {};
let mouseFly = false;   // เมาส์กดค้างฝั่งซ้าย (ใช้บังคับบินขึ้นช่วงโบนัส)

/* ---- ลากเลื่อนกริดเลือกตัวละคร/สัตว์เลี้ยง (swipe) ---- */
let gridDrag = null;
const inGridZone = (x, y) => (G.state === 'select' || G.state === 'pets') && y > 64 && y < 290;
const gridSKey = () => G.state === 'select' ? 'selScroll' : 'petScroll';

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  AudioSys.init(); AudioSys.resume();
  for (const t of e.changedTouches) {
    const [x, y] = canvasXY(t.clientX, t.clientY);
    if (!gridDrag && inGridZone(x, y)) {
      gridDrag = { id: t.identifier, sx: x, sy: y, lx: x, moved: 0, vel: 0 };
      G[gridSKey() + 'V'] = 0;
      continue;   // รอดูว่าลากหรือแตะ ค่อยตัดสินตอนปล่อย
    }
    pointerDown(x, y, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!gridDrag) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== gridDrag.id) continue;
    const [x] = canvasXY(t.clientX, t.clientY);
    const dx = x - gridDrag.lx;
    gridDrag.lx = x; gridDrag.moved += Math.abs(dx); gridDrag.vel = dx;
    G[gridSKey()] = (G[gridSKey()] || 0) - dx;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (gridDrag && t.identifier === gridDrag.id) {
      if (gridDrag.moved < 10) pointerDown(gridDrag.sx, gridDrag.sy, t.identifier);   // แตะเฉยๆ = คลิกการ์ด
      else G[gridSKey() + 'V'] = -gridDrag.vel;                                        // ปล่อยแล้วไหลต่อ
      gridDrag = null;
    }
    if (touches[t.identifier] === 'R') doSlide(false);
    delete touches[t.identifier];
  }
});
canvas.addEventListener('mousedown', e => {
  AudioSys.init(); AudioSys.resume();
  const [x, y] = canvasXY(e.clientX, e.clientY);
  if (inGridZone(x, y)) {
    gridDrag = { id: 'm', sx: x, sy: y, lx: x, moved: 0, vel: 0 };
    G[gridSKey() + 'V'] = 0;
    return;
  }
  pointerDown(x, y);
});
canvas.addEventListener('mousemove', e => {
  if (!gridDrag || gridDrag.id !== 'm') return;
  const [x] = canvasXY(e.clientX, e.clientY);
  const dx = x - gridDrag.lx;
  gridDrag.lx = x; gridDrag.moved += Math.abs(dx); gridDrag.vel = dx;
  G[gridSKey()] = (G[gridSKey()] || 0) - dx;
});
canvas.addEventListener('mouseup', () => {
  if (gridDrag && gridDrag.id === 'm') {
    if (gridDrag.moved < 8) pointerDown(gridDrag.sx, gridDrag.sy);
    else G[gridSKey() + 'V'] = -gridDrag.vel;
    gridDrag = null;
  }
  doSlide(false); mouseFly = false;
});
// ล้อเมาส์เลื่อนกริดได้ด้วย
canvas.addEventListener('wheel', e => {
  if (G.state !== 'select' && G.state !== 'pets') return;
  e.preventDefault();
  G[gridSKey()] = (G[gridSKey()] || 0) + (e.deltaY || e.deltaX) * 0.9;
}, { passive: false });

  if (G.mode === 'normal' && !epUnlocked(G.episode)) G.episode = 0;
  courseRng = mulberry32(G.mode === 'coins' ? 777001 : G.mode === 'tower' ? 555002 : EP().seed);
  setState('play');
  G.time = G.time; G.dist = 0; G.score = 0; G.coins = 0; G.jellies = 0;
  G.combo = 0; G.comboTimer = 0;

          + (PFX().k === 'hp' ? Math.round(PFX().v * petFxMul()) : 0) + trV('hp') + Math.round(petTPv('energy'));
  G.combi = PT().id === CH().mate;   // คู่ซี้คุกกี้-สัตว์เลี้ยง = แต้ม +15%
  G.formT = 0; G.cfxT = 0;

  G.hp = G.hpMax;
  G.stage = 1; G.stageTimer = 0;
  G.hpDrain = 3.2 + (G.mode === 'normal' ? EP().drain : 0);
  G.speed = G.baseSpeed + (G.mode === 'normal' ? EP().spd : 0); G.newBest = false; G.rankPos = -1;
  P.y = GROUND_Y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;

  G.bonusT = 0; G.revives = CH().revives + trV('revive') + (PFX().k === 'revive' ? 1 : 0);
  G.liftLeft = (PFX().k === 'lift' ? Math.round(PFX().v * petFxMul()) : 0) + trV('lift');

  G.runHit = 0; G.goal = G.mode === 'story' ? LV().goal : 0; G.cleared = false;
  bossReset();
  G.btProgress = 0; G.runBoxes = 0;
  G.runPowder = 0; G.powderT = 0;
  jellyList = []; obstacles = []; pits = []; particles = []; floaters = []; platforms = [];
  Pet.x = 60; Pet.y = 280;

  ovenAmt = (G.mode === 'normal' && G.episode > 0) ? 0 : 1;   // ตอนแรกเท่านั้นที่เริ่มในเตาอบ
  if (G.mode === 'coins') banner('🏴‍☠️ เกาะโจรสลัด: กวาดเหรียญให้มากที่สุด!', '#ffd24a');
  else if (G.mode === 'tower') { banner('🧊 หอคอยน้ำแข็ง — ชั้นที่ 1!', '#8fd3ff'); skyPrev = 3; skyCur = 3; }
  else if (G.mode === 'story') banner('🗺️ ด่าน ' + (G.episode + 1) + ': ' + EP().name + ' — วิ่งให้ถึงเส้นชัย!', '#ffdd44');

function gameOver() {
  if (G.state !== 'play') return true;
  if (G.revives > 0) {
    G.revives--;
    spawnActor('pillar', { c: 'rgba(255,240,180,.55)' });
    skillBurst('#ffe9a0', true);
    if (CFX().trig === 'revive') {
      G.formT = CFX().dur; skillBurst('#ffd76e', true); skillCut(CFX().tag || '✨ แปลงร่าง!', '#ffd76e');
      banner((CFX().tag || '🔥') + ' คืนชีพพร้อมพลัง! อมตะ ' + CFX().dur + ' วิ!', '#ff9d2e');
    }
    if (CFX().k === 'reviveHp') G.hp = Math.min(G.hpMax, G.hp + CFX().v);
    G.hp = G.hpMax * 0.6;
    P.invT = 3;
    G.flash = 0;
    banner('✨ ชุบชีวิต! REVIVE! ✨', '#ffd24a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 26, '#ffd24a');
    return false;
  }
  // RELAY: คุกกี้ตัวสำรองวิ่งต่อจากจุดที่ล้ม (แบบเกมจริง)
  if (G.relayIdx >= 0 && !G.relayUsed && G.relayIdx !== G.charIdx && G.owned.includes(G.relayIdx)) {
    G.relayUsed = true;
    G.mainCharIdx = G.charIdx;
    G.charIdx = G.relayIdx;
    // รีเซ็ตสถานะความสามารถของตัวใหม่
    G.formT = 0; G.cfxT = 0;
    G.obSmashLeft = CFX().k === 'obSmash' ? CFX().v : 0;
    G.combi = PT().id === CH().mate;
    G.hpMax = 100 + CH().hpBonus + G.upg.hp * 12 + (G.runBoost.energy ? 40 : 0)
            + (PFX().k === 'hp' ? Math.round(PFX().v * petFxMul()) : 0) + trV('hp') + Math.round(petTPv('energy'));
    G.hp = G.hpMax;
    P.invT = 3; P.dead = false; P.fallingPit = false;
    P.y = Math.min(P.y, GROUND_Y - P.h - 120); P.vy = 0;
    G.flash = 0; G.shake = 8;
    banner('🏃 RELAY!! ' + CH().name + ' รับไม้ต่อ!', '#7bd94a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 30, '#7bd94a');
    return false;
  }
  // เสนอ Continue ด้วยคริสตัล (ครั้งเดียวต่อรอบ แบบเกมจริง)
  if (!G.continueUsed && G.crystals >= 3) {
    G.state = 'continue';
    G.continueT = 6;
    P.dead = true;
    AudioSys.stopMusic();
    return true;
  }
  settleGameOver();
  return true;
}

function doContinue() {
  G.crystals -= 3; SAVE.set('crystals', G.crystals);
  G.continueUsed = true;
  G.state = 'play';
  P.dead = false; P.fallingPit = false;
  G.hp = G.hpMax * 0.6;
  P.y = Math.min(P.y, GROUND_Y - P.h - 120); P.vy = 0;
  P.invT = 3;
  banner('💎 CONTINUE! ลุยต่อ!', '#7ee0ff');
  AudioSys.power();
  AudioSys.startMusic();
}

function calcStars() {
  const lv = LV();
  let n = 1;                              // ดาว 1: ถึงเส้นชัย
  if (G.jellies >= lv.jelly) n++;         // ดาว 2: เก็บเยลลี่ครบ
  if (G.runHit <= lv.maxHit) n++;         // ดาว 3: โดนชนไม่เกินกำหนด
  return n;
}
function levelClear() {
  G.cleared = true;
  G.stars = calcStars();
  if (G.mainCharIdx >= 0) { G.charIdx = G.mainCharIdx; G.mainCharIdx = -1; }
  // บันทึกดาวสูงสุดของด่าน + ปลดล็อกด่านถัดไป
  if (!G.starBest) G.starBest = [0,0,0,0,0];
  if (G.stars > (G.starBest[G.episode] || 0)) { G.starBest[G.episode] = G.stars; SAVE.set('starBest', G.starBest); }
  if (G.dist > G.distBest) { G.distBest = Math.floor(G.dist); SAVE.set('distBest', G.distBest); }
  G.earned = Math.floor((G.coins + Math.floor(G.score / 300) + G.stage * 25) * (1 + trV('coin') + petTPv('coinEnd') + combiV('coin')) * (CH().coinMul || 1)) + G.stars * 100;
  G.bank += G.earned; SAVE.set('coins', G.bank);
  G.crystals += G.stars; SAVE.set('crystals', G.crystals);   // รางวัลคริสตัลตามดาว
  G.earnedPowder = G.runPowder + Math.floor(G.dist / 400) + G.stars * 2;   // ✨ ผงเวทมนตร์ที่ได้รอบนี้
  G.powder += G.earnedPowder; SAVE.set('powder', G.powder);
  const st = G.stats; st.runs++; st.dist += Math.floor(G.dist); st.jellies += G.jellies; SAVE.set('stats', st);
  cloudSave(true);
  setState('clear'); G.clearT = 0;
  P.dead = false;
  AudioSys.finish(); setTimeout(() => AudioSys.clear(), 400);
  FX.flashT = 0.5; FX.flashC = '#ffe98e'; FX.raysT = 0.9; FX.raysC = '#ffd24a';
  for (let q = 0; q < 4; q++) FX.rings.push({ t: -q * 0.1, c: q % 2 ? '#ffd24a' : '#ffffff', x: P.x + 28, y: P.y + P.h / 2 });
  sparkle(P.x + 28, P.y + 20, 50, '#ffd24a');
  AudioSys.power();
}
function settleGameOver() {
  if (G.mainCharIdx >= 0) { G.charIdx = G.mainCharIdx; G.mainCharIdx = -1; }   // คืนตัวหลักหลังจบรอบ
  if (G.dist > G.distBest) { G.distBest = Math.floor(G.dist); SAVE.set('distBest', G.distBest); }
  const st = G.stats;
  st.runs++; st.dist += Math.floor(G.dist); st.bears += G.runBears;
  st.jellies += G.jellies; st.coins += G.earned || 0; st.bt += G.runStars;
  st.maxCombo = Math.max(st.maxCombo, G.maxCombo);
  SAVE.set('stats', st);
  // เลื่อนลีก: รับรางวัลคริสตัลครั้งเดียวต่อขั้น (นับคะแนนรอบนี้ด้วย)
  const bestNow = Math.max(G.best, G.score);
  let lt = 0; LEAGUES.forEach((l, i) => { if (bestNow >= l.min) lt = i; });
  if (lt > G.leagueClaim) {
    const gain = (lt - G.leagueClaim) * 3;
    G.crystals += gain; G.leagueClaim = lt;
    SAVE.set('crystals', G.crystals); SAVE.set('leagueClaim', lt);
    banner(LEAGUES[lt].icon + ' เลื่อนขั้นลีก ' + LEAGUES[lt].name + '! +' + gain + '💎', '#ffd24a');
  }
  checkMedals();
  cloudSave(true);   // ซิงก์เซฟขึ้นคลาวด์อัตโนมัติ (ถ้าล็อกอินอีเมลอยู่)
  setState('over'); G.overT = 0;
  P.dead = true;
  puff(P.x + 28, P.y + P.h - 6, 16, '#a97b45');
  sparkle(P.x + 28, P.y + 30, 8, '#ffce2e');
  AudioSys.stopMusic();
  AudioSys.over();
  G.score = Math.floor(G.score);
  if (G.score > G.best) { G.best = G.score; G.newBest = true; SAVE.set('best', G.best); }
  // เปิดกล่องปริศนา: เหรียญ + โอกาสได้คริสตัล 20%
  G.boxCoins = 0; G.boxGems = 0;
  for (let i = 0; i < G.runBoxes; i++) {
    G.boxCoins += Math.round(rndi(60, 250) * (CFX().k === 'boxLuck' ? CFX().v : 1) * (1 + trV('box')));
    if (Math.random() < 0.2 * (1 + trV('gem'))) G.boxGems++;
  }
  if (G.boxGems > 0) { G.crystals += G.boxGems; SAVE.set('crystals', G.crystals); }
  G.earned = Math.floor((G.coins + Math.floor(G.score / 300) + G.stage * 25 + G.boxCoins) * (1 + trV('coin') + petTPv('coinEnd') + combiV('coin')) * (G.runBoost.coin ? 2 : 1) * (CH().coinMul || 1));
  G.bank += G.earned;
  SAVE.set('coins', G.bank);
  G.earnedPowder = G.runPowder + Math.floor(G.dist / 400);   // ✨ ผงเวทมนตร์ที่ได้รอบนี้
  G.powder += G.earnedPowder; SAVE.set('powder', G.powder);
  const entry = { s: G.score, d: Math.floor(G.dist), c: G.charIdx, t: Date.now() };
  G.board.push(entry);
  G.board.sort((a, b) => b.s - a.s);
  G.board = G.board.slice(0, 10);
  G.rankPos = G.board.indexOf(entry);
  SAVE.set('board', G.board);
  submitOnline();
  // เช็คภารกิจ (+1 คริสตัลด้วย)
  const m = MISSIONS[G.missionIdx];
  if (m && m.check({ dist: G.dist, jellies: G.jellies, score: G.score, combo: G.maxCombo,
                     bears: G.runBears, stars: G.runStars, stage: G.stage })) {
    G.missionDone = true;
    G.missionReward = m.reward;
    G.bank += m.reward;
    G.crystals += 1; SAVE.set('crystals', G.crystals);
    G.missionIdx++;
    SAVE.set('coins', G.bank);
    SAVE.set('mission', G.missionIdx);
  }
  return true;
}
function banner(text, color) { G.banner = { text, color }; G.bannerT = 0; }

/* ============================================================
   บอสท้ายด่านผจญภัย: โผล่ช่วง 25% สุดท้าย มีหลอดเลือด

   ============================================================ */
const BOSSES = {
  oven:    { icon: '🔥', name: 'อสูรเตาอบ',    c1: '#e0451e', c2: '#7a1e0c', eye: '#ffe066' },
  jungle:  { icon: '🦖', name: 'ไดโนยักษ์',     c1: '#3f8a3f', c2: '#245224', eye: '#ff4040' },
  dragon:  { icon: '🐉', name: 'มังกรเพลิง',    c1: '#c8342a', c2: '#7a1810', eye: '#ffd24a' },
  wizard:  { icon: '🧙', name: 'จอมเวทดำ',      c1: '#5a3a9a', c2: '#2e1a52', eye: '#8fe0ff' },
  dessert: { icon: '🍰', name: 'เค้กมรณะ',       c1: '#e06a9a', c2: '#8a2e5a', eye: '#ffffff' },
};
const Boss = { active: false, hp: 0, hpMax: 0, x: 0, atkT: 0, hitT: 0, roarT: 0, def: null, defeatT: 0 };
function bossReset() { Boss.active = false; Boss.defeatT = 0; }
function bossStart() {
  const id = (EP() && EP().id) || 'oven';
  Boss.def = BOSSES[id] || BOSSES.oven;
  Boss.active = true;
  Boss.hpMax = 100; Boss.hp = 100;
  Boss.x = W + 120; Boss.atkT = 1.6; Boss.hitT = 0; Boss.roarT = 1; Boss.defeatT = 0;
  banner('⚔️ บอส: ' + Boss.def.name + ' ปรากฏตัว!', '#ff6a4a');
  AudioSys.crash(); AudioSys.power();
  FX.flashT = 0.4; FX.flashC = '#ff6a4a'; G.shake = 14;
}
function bossDamage(n) {
  if (!Boss.active || Boss.defeatT > 0) return;
  Boss.hp = Math.max(0, Boss.hp - n);
  Boss.hitT = 0.16;
  if (Boss.hp <= 0) {
    Boss.defeatT = 0.01;
    banner('💥 พิชิตบอส ' + Boss.def.name + '!', '#ffd24a');
    G.shake = 20; FX.flashT = 0.5; FX.flashC = '#ffe98e';
    sparkle(Boss.x, 200, 60, '#ffd24a');
    AudioSys.clear();
  }
}
function bossUpdate(dt) {
  if (!Boss.active) return;
  Boss.roarT = Math.max(0, Boss.roarT - dt);
  Boss.hitT = Math.max(0, Boss.hitT - dt);
  if (Boss.defeatT > 0) { Boss.defeatT += dt; Boss.x += 240 * dt; return; }
  // บอสไล่มาอยู่ขอบขวา
  Boss.x += (W - 120 - Boss.x) * Math.min(1, dt * 2);
  // โจมตี: ปล่อยสิ่งกีดขวาง/ลูกไฟเป็นระยะ
  Boss.atkT -= dt;
  if (Boss.atkT <= 0) {
    Boss.atkT = 1.5 + Math.random() * 0.8;
    spawnActor('bossfire', { x0: Boss.x - 40, y0: 190, tx: P.x + 30, c: Boss.def.c1 });
    Boss.roarT = 0.5;
  }
  // ค่อย ๆ ลดเลือดตามความคืบหน้าเข้าเส้นชัย (วิ่งไปข้างหน้า = ตีบอส)
  const prog = clamp((G.dist - G.goal * 0.75) / (G.goal * 0.25), 0, 1);
  const targetHp = 100 * (1 - prog);
  if (Boss.hp > targetHp) bossDamage(Boss.hp - targetHp);
}
function drawBoss() {
  if (!Boss.active) return;
  const d = Boss.def;
  const bob = Math.sin(G.time * 2.5) * 8 + (Boss.roarT > 0 ? -10 : 0);
  const shk = Boss.hitT > 0 ? rnd(-5, 5) : 0;
  ctx.save();
  ctx.translate(Boss.x + shk, 210 + bob);
  if (Boss.defeatT > 0) { ctx.rotate(Boss.defeatT * 2); ctx.globalAlpha = Math.max(0, 1 - Boss.defeatT); }
  const s = 1 + (Boss.roarT > 0 ? 0.08 : 0);
  ctx.scale(s, s);
  // เงาตัวบอสก้อนใหญ่
  ctx.fillStyle = d.c2;
  ctx.beginPath(); ctx.ellipse(0, 20, 78, 60, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = Boss.hitT > 0 ? '#ffffff' : d.c1;
  ctx.beginPath(); ctx.ellipse(0, 0, 72, 62, 0, 0, TAU); ctx.fill();
  // เขา/หนามตามธีม
  ctx.fillStyle = d.c2;
  for (const sg of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(sg * 40, -48); ctx.lineTo(sg * 58, -92); ctx.lineTo(sg * 22, -56); ctx.closePath(); ctx.fill();
  }
  // ตาดุ
  ctx.fillStyle = d.eye;
  ctx.beginPath(); ctx.ellipse(-26, -6, 15, 12, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(26, -6, 15, 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#2a1010';
  const ex = clamp((P.x - Boss.x) * 0.02, -5, 5);
  ctx.beginPath(); ctx.arc(-26 + ex, -4, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(26 + ex, -4, 6, 0, TAU); ctx.fill();
  // คิ้วโกรธ
  ctx.strokeStyle = d.c2; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-40, -22); ctx.lineTo(-14, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, -22); ctx.lineTo(14, -12); ctx.stroke();
  // ปากอ้าคำราม + เขี้ยว
  ctx.fillStyle = '#3a1008';
  ctx.beginPath(); ctx.ellipse(0, 28, 30, Boss.roarT > 0 ? 22 : 12, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffffff';
  for (const fx2 of [-18, -6, 6, 18]) {
    ctx.beginPath(); ctx.moveTo(fx2 - 4, 18); ctx.lineTo(fx2, 30); ctx.lineTo(fx2 + 4, 18); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // หลอดเลือดบอสด้านบน
  if (Boss.defeatT === 0) {
    const bw = 520, bx = (W - bw) / 2, by = 84;
    ctx.fillStyle = 'rgba(20,10,4,.6)'; roundRect(bx - 6, by - 6, bw + 12, 30, 10); ctx.fill();
    ctx.fillStyle = '#3a1810'; roundRect(bx, by, bw, 18, 8); ctx.fill();
    const hpw = bw * (Boss.hp / Boss.hpMax);
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#ff4030'); hg.addColorStop(1, '#ff8a4a');
    ctx.fillStyle = hg; roundRect(bx, by, Math.max(0, hpw), 18, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillText(d.icon + ' ' + d.name, W / 2, by + 14);
  }
}

function drawActors() {
  for (const a of ACTORS) {
    if (a.type === 'bossfire') {
      const k = Math.min(1, a.t / 0.55);
      const x = lerp(a.x0, a.tx, k), y = lerp(a.y0, GROUND_Y - 40, k) - Math.sin(k * Math.PI) * 70;
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = a.c; ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = a.c; ctx.beginPath(); ctx.arc(-8, 6, 9, 0, TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (a.type === 'bomb') {
      const k = Math.min(1, a.t / 0.5);
      const x = lerp(a.x0, a.tx, k), y = lerp(a.y0, GROUND_Y - 40, k) - Math.sin(k * Math.PI) * 130;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a.t * 9);
      ctx.fillStyle = '#2e2830';
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 13, -0.5, 0.9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c8a05e'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(4, -12); ctx.quadraticCurveTo(10, -18, 14, -16); ctx.stroke();
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.arc(15, -16, 3.2 + Math.sin(G.time * 30) * 1.2, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (a.type === 'ball') {
      const k = Math.min(1, a.t / 0.5);
      const x = lerp(a.x0, a.tx, k);
      const y = GROUND_Y - 40 - Math.abs(Math.sin(k * Math.PI * 2)) * 90 * (1 - k * 0.5);
      ctx.strokeStyle = a.c; ctx.globalAlpha = 0.4; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 42, y + 6); ctx.lineTo(x - 10, y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.arc(x, y, a.r || 10, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(x, y, (a.r || 10) * 0.55, -1.2, 0.6); ctx.stroke();
    } else if (a.type === 'spear') {
      const k = Math.min(1, a.t / 0.28);
      const x = lerp(a.x0, a.tx, k), y = lerp(a.y0, GROUND_Y - 48, k);
      ctx.save(); ctx.translate(x, y); ctx.rotate(0.25);
      ctx.strokeStyle = a.c; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(16, 0); ctx.stroke();
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.moveTo(16, -6); ctx.lineTo(30, 0); ctx.lineTo(16, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (a.type === 'slash') {
      const k = a.t / 0.35;
      ctx.save(); ctx.translate(a.tx, GROUND_Y - 60); ctx.rotate(-0.5 + k * 0.4);
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = a.c; ctx.lineCap = 'round';
      for (const [rr, w] of [[46 + k * 44, 11], [30 + k * 32, 6]]) {
        ctx.lineWidth = w * (1 - k * 0.5);
        ctx.beginPath(); ctx.arc(0, 0, rr, -1.9, 0.6); ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (a.type === 'army') {
      const bx = -80 + a.t * 720;
      for (let i = 0; i < a.n; i++) {
        const x = bx - i * 54, y = GROUND_Y - 14 - Math.abs(Math.sin(a.t * 14 + i)) * 8;
        if (x < -60 || x > W + 60) continue;
        ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        const sw = Math.sin(a.t * 22 + i) * 6;
        ctx.beginPath(); ctx.moveTo(x - 5, y - 4); ctx.lineTo(x - 5 + sw, y + 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 5, y - 4); ctx.lineTo(x + 5 - sw, y + 10); ctx.stroke();
        if (a.kind === 'roll') {
          ctx.fillStyle = '#26262c';
          roundRect(x - 16, y - 30, 32, 28, 9); ctx.fill();
          ctx.fillStyle = '#f2ecd8';
          roundRect(x - 16, y - 21, 32, 8, 4); ctx.fill();
          ctx.fillStyle = '#4aa84a';
          ctx.beginPath(); ctx.arc(x, y - 17, 3, 0, TAU); ctx.fill();
        } else {
          ctx.fillStyle = '#eaa9c9';
          ctx.beginPath(); ctx.arc(x, y - 18, 15, 0, TAU); ctx.fill();
          ctx.fillStyle = '#c8303e';
          roundRect(x - 14, y - 21, 28, 6, 3); ctx.fill();
        }
        ctx.fillStyle = '#2e2018';
        ctx.beginPath(); ctx.arc(x - 4, y - 20, 1.7, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 4, y - 20, 1.7, 0, TAU); ctx.fill();
      }
    } else if (a.type === 'drop') {
      const k = Math.min(1, a.t / 0.5);
      const y = lerp(-50, GROUND_Y - 36, k * k);
      ctx.save(); ctx.translate(a.tx, y); ctx.rotate(Math.PI);
      ctx.fillStyle = '#e8c89a';
      ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(-13, -6); ctx.lineTo(13, -6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.arc(0, -12, 14, 0, TAU); ctx.fill();
      ctx.restore();
    } else if (a.type === 'bolt') {
      const al = 1 - a.t / 0.3;
      ctx.globalAlpha = al;
      for (const [w, cc] of [[9, a.c], [3.5, '#ffffff']]) {
        ctx.strokeStyle = cc; ctx.lineWidth = w; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(a.tx + 14, 0);
        ctx.lineTo(a.tx - 8, GROUND_Y * 0.35); ctx.lineTo(a.tx + 10, GROUND_Y * 0.55);
        ctx.lineTo(a.tx - 6, GROUND_Y - 40);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (a.type === 'fly') {
      const life = a.icon === 'whale' ? 1.1 : 0.9;
      const k = a.t / life;
      const x = a.x0 + k * (a.icon === 'whale' ? 620 : 480);
      const y = a.icon === 'whale' ? a.y0 - Math.sin(k * Math.PI) * 170
                                   : a.y0 + Math.sin(a.t * 7) * 22 - k * 30;
      ctx.save(); ctx.translate(x, y);
      ctx.globalAlpha = Math.min(1, (1 - k) * 3);
      if (a.icon === 'ghost') {
        ctx.fillStyle = a.c;
        ctx.beginPath(); ctx.arc(0, -6, 13, Math.PI, 0);
        ctx.lineTo(13, 8);
        for (let q2 = 0; q2 < 3; q2++) ctx.quadraticCurveTo(9 - q2 * 8, 14 - (q2 % 2) * 5, 4 - q2 * 8, 8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#3a2a4a';
        ctx.beginPath(); ctx.arc(-4, -6, 2.2, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -6, 2.2, 0, TAU); ctx.fill();
      } else if (a.icon === 'flask') {
        ctx.rotate(Math.sin(a.t * 9) * 0.3);
        ctx.fillStyle = a.c;
        ctx.beginPath(); ctx.moveTo(-4, -12); ctx.lineTo(-4, -4);
        ctx.quadraticCurveTo(-12, 6, -6, 12); ctx.lineTo(7, 12);
        ctx.quadraticCurveTo(13, 6, 5, -4); ctx.lineTo(5, -12);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c8a05e';
        ctx.fillRect(-6, -15, 12, 4);
      } else if (a.icon === 'card') {
        ctx.rotate(a.t * 6);
        ctx.fillStyle = a.c;
        roundRect(-8, -11, 16, 22, 3); ctx.fill();
        ctx.fillStyle = '#c02830';
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
      } else if (a.icon === 'magic') {
        ctx.rotate(a.t * 4);
        ctx.fillStyle = a.c;
        for (let q2 = 0; q2 < 5; q2++) {
          const aa = q2 * TAU / 5;
          ctx.beginPath(); ctx.ellipse(Math.cos(aa) * 10, Math.sin(aa) * 10, 5, 3, aa, 0, TAU); ctx.fill();
        }
      } else if (a.icon === 'whale') {
        ctx.rotate(-Math.cos(k * Math.PI) * 0.5);
        ctx.fillStyle = a.c;
        ctx.beginPath(); ctx.ellipse(0, 0, 34, 17, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-30, -4); ctx.quadraticCurveTo(-46, -16, -42, 2);
        ctx.quadraticCurveTo(-46, 14, -30, 6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#eafcff';
        ctx.beginPath(); ctx.ellipse(6, 8, 22, 7, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#1e3a50';
        ctx.beginPath(); ctx.arc(18, -5, 2.6, 0, TAU); ctx.fill();
      } else if (a.icon === 'fan') {
        ctx.rotate(Math.sin(a.t * 8) * 0.5);
        ctx.fillStyle = a.c;
        ctx.beginPath(); ctx.moveTo(0, 8); ctx.arc(0, 8, 20, -Math.PI * 0.85, -Math.PI * 0.15);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
        for (const aa of [-0.7, -0.5, -0.3]) {
          ctx.beginPath(); ctx.moveTo(0, 8);
          ctx.lineTo(Math.cos(aa * Math.PI) * 19, 8 + Math.sin(aa * Math.PI) * 19); ctx.stroke();
        }
      }
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (a.type === 'drift') {
      for (let i = 0; i < a.n; i++) {
        const xt = a.x0 + i * 26 + a.t * 110 + Math.sin(a.t * 5 + i * 2) * 14;
        const yt = a.y0 - a.t * 85 - i * 9;
        ctx.globalAlpha = Math.max(0, 1 - a.t / 1.1) * 0.9;
        ctx.fillStyle = a.c;
        ctx.save(); ctx.translate(xt, yt);
        if (a.shape === 'petal') {
          ctx.rotate(a.t * 4 + i);
          ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 3.6, 0, 0, TAU); ctx.fill();
        } else if (a.shape === 'note') {
          ctx.beginPath(); ctx.ellipse(-2, 4, 4.4, 3.2, -0.3, 0, TAU); ctx.fill();
          ctx.strokeStyle = a.c; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(1.6, 3); ctx.lineTo(1.6, -9); ctx.quadraticCurveTo(7, -8, 8, -4); ctx.stroke();
        } else if (a.shape === 'bubble') {
          ctx.globalAlpha *= 0.7;
          ctx.beginPath(); ctx.arc(0, 0, 6 + (i % 3) * 2, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(-2, -2.5, 1.8, 0, TAU); ctx.fill();
        } else {
          ctx.rotate(a.t * 3 + i);
          ctx.beginPath(); ctx.ellipse(0, 0, 7, 3, 0.6, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    } else if (a.type === 'coins') {
      for (let i = 0; i < 12; i++) {
        const ang = -2.1 + i * 0.21, sp = 300 + (i % 3) * 70;
        const x = a.x0 + Math.cos(ang) * sp * a.t;
        const y = a.y0 + Math.sin(ang) * sp * a.t + 640 * a.t * a.t;
        ctx.globalAlpha = Math.max(0, 1 - a.t / 0.9);
        ctx.fillStyle = '#ffd24a';
        ctx.save(); ctx.translate(x, y);
        ctx.scale(Math.abs(Math.sin(a.t * 12 + i)) * 0.7 + 0.3, 1);
        ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#c8951e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 4.4, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    } else if (a.type === 'pillar') {
      const al = Math.max(0, 1 - a.t / 0.7);
      const wdt = 60 * (1 - a.t * 0.6);
      const g2 = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      g2.addColorStop(0, 'rgba(255,250,220,0)');
      g2.addColorStop(0.5, a.c);
      g2.addColorStop(1, 'rgba(255,250,220,.1)');
      ctx.globalAlpha = al * 0.7;
      ctx.fillStyle = g2;
      ctx.fillRect(P.x + 28 - wdt / 2, 0, wdt, GROUND_Y);
      ctx.fillStyle = '#fff8d8';
      for (let q2 = 0; q2 < 6; q2++) {
        const yy = GROUND_Y - ((a.t * 500 + q2 * 90) % GROUND_Y);
        ctx.beginPath(); ctx.arc(P.x + 28 + Math.sin(q2 * 2.4) * wdt * 0.4, yy, 3.4, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (a.type === 'shield') {
      const al = Math.max(0, 1 - a.t / 0.45);
      ctx.save(); ctx.translate(P.x + 28, P.y + P.h / 2);
      ctx.globalAlpha = al * 0.85;
      ctx.strokeStyle = a.c; ctx.lineWidth = 4.4;
      ctx.beginPath(); ctx.ellipse(0, 0, 58 + a.t * 30, 64 + a.t * 30, 0, 0, TAU); ctx.stroke();
      ctx.globalAlpha = al * 0.25;
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.ellipse(0, 0, 58 + a.t * 30, 64 + a.t * 30, 0, 0, TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    } else if (a.type === 'heal') {
      ctx.fillStyle = a.c;
      for (let q2 = 0; q2 < 5; q2++) {
        const yy = P.y + 30 - a.t * 120 - q2 * 14;
        const xx = P.x + 10 + q2 * 12 + Math.sin(a.t * 8 + q2) * 8;
        ctx.globalAlpha = Math.max(0, 1 - a.t / 0.7) * 0.9;
        ctx.fillRect(xx - 1.7, yy - 5.5, 3.4, 11);
        ctx.fillRect(xx - 5.5, yy - 1.7, 11, 3.4);
      }
      ctx.globalAlpha = 1;
    } else if (a.type === 'slam') {
      const k = a.t / 0.5;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = a.c; ctx.lineWidth = 8 * (1 - k) + 2;
      ctx.beginPath(); ctx.ellipse(P.x + 28, GROUND_Y - 4, 30 + k * 130, 12 + k * 20, 0, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(200,160,106,.7)';
      for (let q2 = 0; q2 < 6; q2++) {
        const aa = q2 * TAU / 6;
        ctx.beginPath();
        ctx.arc(P.x + 28 + Math.cos(aa) * (40 + k * 110), GROUND_Y - 8 - Math.sin(k * Math.PI) * 26, 5 * (1 - k), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
}

FORM_DRAW.devil = function (anim) {   // 😈 ซูเปอร์เดวิล

    ctx.quadraticCurveTo(52, -30, 66, -6);

    ctx.quadraticCurveTo(36, 3, 30, 14);
    ctx.quadraticCurveTo(20, 6, 12, 12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

const FX = { flashT: 0, flashC: '#ffffff', rings: [], waveT: 0, circleT: 0, circleC: '#8fd8ff', starT: 0, starC: '#ffe98e', beamT: 0, beamC: '#ff6f9f', raysT: 0, raysC: '#ffd24a', linesT: 0, emberT: 0, stopT: 0, zoomT: 0, cutT: 0, cutText: '', cutC: '#ffd24a', cutIdx: 0 };
function skillBurst(color, big) {
  FX.flashT = big ? 0.55 : 0.35; FX.flashC = color;
  FX.rings.push({ t: 0, c: '#ffffff', x: P.x + 28, y: P.y + P.h / 2 },
                { t: -0.09, c: color, x: P.x + 28, y: P.y + P.h / 2 },
                { t: -0.18, c: '#fff6c8', x: P.x + 28, y: P.y + P.h / 2 });
  FX.raysT = big ? 0.7 : 0.45; FX.raysC = color;
  AudioSys.skill();
  FX.linesT = big ? 0.5 : 0.3;
  G.shake = Math.max(G.shake || 0, big ? 16 : 10);
  FX.stopT = big ? 0.15 : 0.08;    // หยุดเวลาแวบเดียวแบบเกมจริง
  FX.zoomT = big ? 0.45 : 0.28;    // ซูมกล้องกระแทก
  sparkle(P.x + 30, P.y + 20, big ? 34 : 20, color);
  sparkle(P.x + 30, P.y + 10, big ? 18 : 10, '#ffffff');
  FX.impactT = big ? 0.42 : 0.3; FX.impactC = color;   // แฟลร์กระแทกเปล่งวาบตอนร่ายสกิล
  FX.impactX = P.x + 28; FX.impactY = P.y + P.h / 2;
}
const SKILL_SIG = {

  alchemist: () => { FX.circleT = 1; FX.circleC = '#b07ae0'; skillBurst('#b07ae0'); },
  prophet: () => { FX.circleT = 1; FX.circleC = '#e8b03a'; skillBurst('#e8b03a'); },

function skillCut(text, color) {

const CAT_SIG = {
  strike: c => { FX.linesT = 0.6; FX.raysC = c; skillBurst(c, true); },
  heal:   c => { FX.circleT = 0.95; FX.circleC = c; skillBurst(c, true); },

  blast:  c => { FX.circleT = 0.95; FX.circleC = c; FX.rings.push({ t: -0.12, c, x: P.x + 28, y: P.y + P.h / 2 }); skillBurst(c, true); },
  bless:  c => { FX.starT = 1.05; FX.starC = c; skillBurst(c, true); },
};
function skillFX(id, fallback, big) {
  if (SKILL_SIG[id]) { SKILL_SIG[id](); return; }
  const ch = CHARS[G.charIdx];
  const cat = ch && CAT_SIG[ch.sk];
  if (cat) cat(ch.button || fallback || '#ffd24a');
  else skillBurst(fallback || '#ffd24a', big);
}
function updateFX(dt) {
  FX.flashT = Math.max(0, FX.flashT - dt);
  FX.waveT = Math.max(0, FX.waveT - dt * 0.9);
  FX.circleT = Math.max(0, FX.circleT - dt * 0.8);
  FX.starT = Math.max(0, FX.starT - dt * 0.8);
  FX.beamT = Math.max(0, FX.beamT - dt * 1.6);
  FX.raysT = Math.max(0, FX.raysT - dt * 1.4);
  FX.linesT = Math.max(0, FX.linesT - dt * 2);
  FX.zoomT = Math.max(0, FX.zoomT - dt * 1.7);
  FX.impactT = Math.max(0, (FX.impactT || 0) - dt * 2.3);
  FX.cutT = Math.max(0, FX.cutT - dt * 1.05);
  for (const r of FX.rings) r.t += dt * 2.4;
  FX.rings = FX.rings.filter(r => r.t < 1);
  // ✨ ออร่าประจำตัวตอนวิ่ง: ประกายสีธีมของแต่ละคุกกี้ (ครบทุกตัว)
  if (G.state === 'play' && !G.paused) {
    FX.trailT = (FX.trailT || 0) + dt;
    if (FX.trailT > 0.14) {
      FX.trailT = 0;
      const c2 = CHARS[G.charIdx];
      sparkle(P.x + rnd(-6, 20), P.y + P.h - rnd(2, 16), 1, Math.random() < 0.5 ? (c2.icing || '#fff8f0') : (c2.button || '#ffd24a'));
    }
  }
  // เอมเบอร์ลอยต่อเนื่องระหว่างร่างแปลง
  if (G.formT > 0 && G.state === 'play') {
    FX.emberT += dt;
    if (FX.emberT > 0.07) {
      FX.emberT = 0;
      sparkle(P.x + rnd(0, 56), P.y + rnd(10, P.h), 2, ['#ffd24a', '#ffe98e', '#fff6c8'][rndi(0, 2)]);
    }
  }
}
function drawFX() {
  // 💥 แฟลร์กระแทกตอนร่ายสกิล: วงวาบ + กากบาทแสงพุ่ง
  if ((FX.impactT || 0) > 0) {
    const k = FX.impactT / 0.42, gr = (1 - k) * 190 + 20;
    ctx.save(); ctx.translate(FX.impactX, FX.impactY);
    ctx.globalAlpha = Math.min(1, k * 1.4) * 0.9;
    // วงวาบขาว
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, gr * 0.28, 0, TAU); ctx.fill();
    ctx.strokeStyle = FX.impactC; ctx.lineWidth = 5 * k + 1;
    ctx.beginPath(); ctx.arc(0, 0, gr, 0, TAU); ctx.stroke();
    // กากบาทแสง 4 แฉก
    ctx.fillStyle = FX.impactC; ctx.globalAlpha = Math.min(1, k * 1.6) * 0.8;
    for (let q = 0; q < 4; q++) {
      ctx.rotate(TAU / 4);
      const L = gr * 1.5;
      ctx.beginPath(); ctx.moveTo(0, -6 * k - 1); ctx.lineTo(L, 0); ctx.lineTo(0, 6 * k + 1); ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // ⚡ แสงเรย์หมุนรอบตัว (ตอนเปิดสกิล)
  if (FX.raysT > 0) {
    const al = Math.min(1, FX.raysT * 2.2) * 0.4;
    ctx.save(); ctx.translate(P.x + 28, P.y + P.h / 2);
    ctx.rotate(G.time * 3);
    ctx.fillStyle = FX.raysC; ctx.globalAlpha = al;
    for (let q = 0; q < 8; q++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(210, -20); ctx.lineTo(210, 20);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // 💨 เส้นสปีดขอบจอแบบอนิเมะ
  if (FX.linesT > 0) {
    const al = Math.min(1, FX.linesT * 3) * 0.5;
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = al; ctx.lineCap = 'round';
    for (let q = 0; q < 14; q++) {
      const yy = (q * 137 + 40) % H;
      const ln = 60 + (q % 4) * 45;
      const xx = (q % 2 ? W - 10 : 10) + (q % 2 ? -1 : 1) * ((G.time * 900 + q * 60) % 130);
      ctx.lineWidth = 2 + (q % 3) * 2;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + (q % 2 ? -ln : ln), yy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // วงแหวนคลื่นกระแทก
  for (const r of FX.rings) {
    if (r.t < 0) continue;
    const rr = 20 + r.t * 250;
    ctx.globalAlpha = (1 - r.t) * 0.7;
    ctx.strokeStyle = r.c; ctx.lineWidth = 7 * (1 - r.t) + 2;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rr, rr * 0.78, 0, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 🌊 คลื่นยักษ์ (นางฟ้าทะเล) กวาดขวาทั้งจอ
  if (FX.waveT > 0) {
    const t = 1.1 - FX.waveT;
    const wx = -240 + t * (W + 500);
    ctx.globalAlpha = Math.min(1, FX.waveT * 2.4) * 0.88;
    for (const [off, cc, sc] of [[44, '#2e6ab8', 1.12], [0, '#4a9ae0', 1], [-28, '#bfe8ff', 0.85]]) {
      ctx.fillStyle = cc;
      ctx.beginPath();
      ctx.moveTo(wx - 270 + off, GROUND_Y + 30);
      ctx.quadraticCurveTo(wx - 150 + off, GROUND_Y - 300 * sc, wx + off, GROUND_Y - 330 * sc);
      ctx.quadraticCurveTo(wx + 74 + off, GROUND_Y - 342 * sc, wx + 42 + off, GROUND_Y - 262 * sc);
      ctx.quadraticCurveTo(wx - 40 + off, GROUND_Y - 300 * sc, wx - 95 + off, GROUND_Y - 180);
      ctx.lineTo(wx + 60 + off, GROUND_Y + 30);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#eaf8ff';
    for (let q = 0; q < 8; q++) {
      ctx.beginPath();
      ctx.arc(wx - 20 + Math.sin(q * 2.7) * 95, GROUND_Y - 255 + Math.cos(q * 1.9) * 65, 7 + (q % 3) * 4, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 🔮 วงเวทหมุนใต้เท้า (สายเวท)
  if (FX.circleT > 0) {
    const rot = G.time * 2.6;
    ctx.save(); ctx.translate(P.x + 28, GROUND_Y - 4); ctx.scale(1, 0.32);
    ctx.globalAlpha = Math.min(1, FX.circleT * 2) * 0.8;
    ctx.strokeStyle = FX.circleC; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(0, 0, 88, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.stroke();
    for (const ph of [0, Math.PI / 3]) {
      ctx.beginPath();
      for (let q = 0; q < 3; q++) {
        const aa = rot + ph + q * TAU / 3;
        ctx[q ? 'lineTo' : 'moveTo'](Math.cos(aa) * 88, Math.sin(aa) * 88);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // 🌟 ฝนดาวตก (แสงจันทร์/หิมะ/แครอล)
  if (FX.starT > 0) {
    const a = Math.min(1, FX.starT * 2);
    for (let q = 0; q < 18; q++) {
      const sx = ((q * 173 + Math.floor(G.time * 2.5) * 67) % (W + 80)) - 40;
      const sy = ((G.time * 480 + q * 217) % (GROUND_Y + 70)) - 40;
      ctx.globalAlpha = a * (0.45 + (q % 3) * 0.22);
      ctx.strokeStyle = FX.starC; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 24, sy - 36); ctx.stroke();
      ctx.fillStyle = FX.starC;
      ctx.beginPath(); ctx.arc(sx, sy, 4.2, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 🎊 คอนเฟตตีสีรุ้งตอน BONUS TIME
  if (G.bonusT > 0.5) {
    const CC = ['#ff6b8d', '#ffd24a', '#7ec8ff', '#8fd8a0', '#c8a0f0'];
    for (let q = 0; q < 14; q++) {
      const cx2 = ((q * 149 + Math.floor(G.time * 1.7) * 83) % (W + 40)) - 20;
      const cy2 = ((G.time * 260 + q * 173) % (H + 40)) - 20;
      ctx.save(); ctx.translate(cx2, cy2); ctx.rotate(G.time * 5 + q);
      ctx.fillStyle = CC[q % 5]; ctx.globalAlpha = 0.85;
      ctx.fillRect(-4, -2.5, 8, 5);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  // 💗 ฮาร์ตบีม (พิงก์ช็อกโก)
  if (FX.beamT > 0) {
    const by = P.y + 24;
    const g = ctx.createLinearGradient(P.x + 40, 0, W, 0);
    g.addColorStop(0, FX.beamC); g.addColorStop(1, 'rgba(255,150,190,0)');
    ctx.globalAlpha = Math.min(1, FX.beamT * 3) * 0.85;
    ctx.fillStyle = g;
    ctx.fillRect(P.x + 40, by - 16, W - P.x - 40, 32);
    ctx.fillStyle = '#ffd0e0';
    ctx.fillRect(P.x + 40, by - 6, W - P.x - 40, 12);
    ctx.fillStyle = '#ff8fb8';
    for (let q = 0; q < 5; q++) {
      const hx = P.x + 90 + ((G.time * 700 + q * 150) % (W - P.x - 120));
      ctx.save(); ctx.translate(hx, by + Math.sin(G.time * 9 + q) * 18); ctx.rotate(-0.2); ctx.scale(1.6, 1.6);
      ctx.beginPath();
      ctx.moveTo(0, 2); ctx.quadraticCurveTo(-1, -2, -3.5, -2); ctx.quadraticCurveTo(-6.5, 0, 0, 6.5);
      ctx.quadraticCurveTo(6.5, 0, 3.5, -2); ctx.quadraticCurveTo(1, -2, 0, 2);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

/* ฟักไข่สุ่มสัตว์เลี้ยง: ตัวซ้ำ = เลเวลอัป (แบบเกมจริง) */
function hatchEgg(premium) {
  if (premium) {
    if (G.crystals < 5) { AudioSys.deny(); floatText(W / 2, 100, 'คริสตัลไม่พอ (ต้องใช้ 5💎)', '#ff8888', true); return; }
    G.crystals -= 5; SAVE.set('crystals', G.crystals);
  } else {
    if (G.bank < 800) { AudioSys.deny(); floatText(W / 2, 100, 'เหรียญไม่พอ (ต้องใช้ 800🪙)', '#ff8888', true); return; }
    G.bank -= 800; SAVE.set('coins', G.bank);
  }
  let pick;
  const allIdx = PETS.map((q, i2) => i2);
  if (premium) {
    // ไข่ทอง: การันตีตัวใหม่ (ถ้ามี) เน้นเกรดสูง
    const pool = allIdx.filter(i2 => !G.petsOwned.includes(i2));
    if (pool.length) {
      const hi = pool.filter(i2 => 'SLE'.includes(PETS[i2].grade));
      const src = hi.length && Math.random() < 0.75 ? hi : pool;
      pick = src[rndi(0, src.length - 1)];
    } else pick = allIdx[rndi(0, allIdx.length - 1)];
  } else {
    // ไข่ธรรมดา: สุ่มตามเกรด C30/B26/A18/S23/L2/E1
    const r = Math.random() * 100;
    const g = r < 30 ? 'C' : r < 56 ? 'B' : r < 74 ? 'A' : r < 97 ? 'S' : r < 99 ? 'L' : 'E';
    const gp = allIdx.filter(i2 => PETS[i2].grade === g);
    pick = gp[rndi(0, gp.length - 1)];
  }
  AudioSys.buy();
  if (!G.petsOwned.includes(pick)) {
    G.petsOwned.push(pick);
    G.petIdx = pick;
    SAVE.set('petsOwned', G.petsOwned); SAVE.set('pet', pick);
    floatText(W / 2, 100, '🥚 ฟักได้ตัวใหม่: ' + PETS[pick].name + '!', '#ffd24a', true);
  } else if ((G.petLv[pick] || 1) < 8) {
    G.petLv[pick] = (G.petLv[pick] || 1) + 1;
    SAVE.set('petLv', G.petLv);
    floatText(W / 2, 100, '🥚 ได้ ' + PETS[pick].name + ' ซ้ำ → Lv.' + G.petLv[pick] + '!', '#7bd94a', true);
  } else {
    const refund = premium ? 1000 : 300;
    G.bank += refund; SAVE.set('coins', G.bank);
    floatText(W / 2, 100, PETS[pick].name + ' เลเวลเต็มแล้ว → คืน ' + refund + '🪙', '#ffe9b8', true);
  }
}
