/* ============================================================
   UPDATE
   ============================================================ */
const isInvincible = () => P.invT > 0 || P.giantT > 0 || P.boostT > 0 || G.bonusT > 0;
const canSmash = () => P.giantT > 0 || P.boostT > 0;

function hurt(amount) {
  if (isInvincible() || P.dead) return;
  G.hp -= amount;
  G.combo = 0;
  P.invT = 2.0;
  P.stumbleT = 0.5;
  G.shake = 12; G.flash = 0.5;
  AudioSys.crash();
  sparkle(P.x + P.w / 2, P.y + P.h / 2, 14, '#ff6b6b');
  if (G.hp <= 0) { G.hp = 0; gameOver(); }
}

function update(dt) {
  G.time += dt;
  if (G.bannerT < 99) G.bannerT += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  G.fade = Math.max(0, G.fade - dt * 2.6);
  if (skyT < 1) skyT = Math.min(1, skyT + dt / 1.8);

  for (const c of clouds) {
    c.x -= (c.v + (G.state === 'play' ? G.speed * 0.04 : 4)) * dt;
    if (c.x < -160) { c.x = W + rnd(20, 120); c.y = rnd(30, 170); }
  }
  for (const b of bokeh) {
    b.x -= (b.v + (G.state === 'play' ? G.speed * 0.06 : 3)) * dt;
    b.y += Math.sin(G.time * 0.7 + b.tw) * 6 * dt;
    b.y -= 30 * ovenAmt * dt;                     // ในเตา: ประกายไฟลอยขึ้น
    if (b.y < 10) b.y = 430;
    if (b.x < -40) { b.x = W + rnd(10, 60); b.y = rnd(30, 430); }
  }
  // ฉากเตาอบค่อย ๆ เปลี่ยนเป็นโลกภายนอกเมื่อถึงด่าน 3
  const ovTarget = (G.state === 'play' || G.state === 'over') && G.stage < 3 && G.mode !== 'tower' ? 1 : 0;
  ovenAmt += (ovTarget - ovenAmt) * Math.min(1, 1.3 * dt);
  if (ovTarget === 1 && ovenAmt > 0.99) ovenAmt = 1;
  P.squash += (0 - P.squash) * Math.min(1, 10 * dt);
  P.stumbleT = Math.max(0, P.stumbleT - dt);
  for (const t of trail) {
    t.t += dt;
    t.x -= (G.state === 'play' ? G.speed * 1.1 : 60) * dt;
  }
  trail = trail.filter(t => t.t < 0.45);

  if (G.state !== 'play') {
    if (G.state === 'over') G.overT += dt;
    if (G.state === 'continue') {
      G.continueT -= dt;
      if (G.continueT <= 0) settleGameOver();
    }
    updateParticles(dt);
    P.anim += dt * 8;
    Pet.wing += dt * 14;
    return;
  }

  /* --- ความเร็ว & ด่าน --- */
  G.stageTimer += dt;
  if (G.stageTimer >= G.stageLen && G.speed < G.maxSpeed) {
    G.stageTimer = 0; G.stage++;
    G.speed = Math.min(G.maxSpeed, G.speed + 62);
    G.hpDrain += 0.35;
    skyPrev = skyCur;
    skyCur = G.mode === 'tower' ? 3 : G.stage < 3 ? 0 : (G.stage - 3) % SKIES.length;
    skyT = 0;
    if (G.mode !== 'tower' && G.stage === 3) banner('🎉 หนีออกจากเตาอบสำเร็จ! 🎉', '#ffd24a');
    else banner('SPEED UP!  ⚡ ด่าน ' + G.stage, '#7ee0ff');
    AudioSys.speedup();
  }

  /* --- HP ลดตามเวลา --- */
  if (PT().id === 'cloud') G.hp = Math.min(G.hpMax, G.hp + (1.0 + (petLvNow() - 1) * 0.15) * dt);
  if (G.bonusT <= 0) G.hp -= G.hpDrain * (hasTr(2) ? 0.85 : 1) * dt;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }

  const spdMul = (P.giantT > 0 ? 1.12 : 1) * (P.boostT > 0 ? 2.1 : 1) * (G.bonusT > 0 ? 1.35 : 1);
  const move = G.speed * dt * spdMul;
  worldX += move;
  G.dist += move / 40;
  G.score += move * 0.02;

  while (spawnX < worldX + W + 700) {
    rngSrc = courseRng;      // สร้างด่านด้วย seed คงที่
    spawnPattern();
    rngSrc = Math.random;
  }

  /* --- หอคอยน้ำแข็ง: ผ่านชั้นทุก 20 วิ --- */
  if (G.mode === 'tower') {
    G.floorT += dt;
    if (G.floorT >= 20) {
      G.floorT = 0;
      G.floorNow++;
      G.coins += 40;
      G.speed = Math.min(G.maxSpeed, G.speed + 22);
      if (G.floorNow % 5 === 0) {
        G.crystals++; SAVE.set('crystals', G.crystals);
        banner('🧊 ชั้น ' + G.floorNow + '! รางวัล +40🪙 +1💎', '#8fd3ff');
      } else banner('🧊 ผ่านชั้น ' + (G.floorNow - 1) + '! ขึ้นชั้น ' + G.floorNow, '#8fd3ff');
      if (G.floorNow > G.towerBest) { G.towerBest = G.floorNow; SAVE.set('towerBest', G.towerBest); }
      AudioSys.speedup();
    }
  }

  /* --- timers --- */
  P.invT = Math.max(0, P.invT - dt);
  P.giantT = Math.max(0, P.giantT - dt);
  P.magnetT = Math.max(0, P.magnetT - dt);
  P.boostT = Math.max(0, P.boostT - dt);
  G.scoreMulT = Math.max(0, G.scoreMulT - dt);
  if (G.bonusT > 0) {
    G.bonusT -= dt;
    // หมีเยลลี่ยักษ์รอปิดท้ายโบนัสไทม์ (แบบเกมจริง)
    if (G.bonusT <= 1.1 && !bonusBearSpawned) {
      bonusBearSpawned = true;
      const wx = worldX + W + 60;
      J(wx, bonusPathY(wx), 'bear');
    }
    if (G.bonusT <= 0) { G.bonusT = 0; bonusLetterQueue = []; P.invT = Math.max(P.invT, 1.5); }
  }
  G.comboTimer -= dt;
  if (G.comboTimer <= 0) G.combo = 0;
  P.anim += dt * (8 + G.speed / 90);

  // ฝุ่นแป้งฟุ้งใต้เท้าตอนวิ่ง
  if (P.onGround && !P.sliding && Math.random() < 0.25)
    puff(P.x + rnd(0, 18), GROUND_Y - 3, 1, '#c59a63');
  // ประกายทองระยิบพลิ้วตามหลัง (แบบเกมจริง)
  if (Math.random() < 0.35)
    particles.push({ x: P.x - 4, y: P.y + rnd(12, 66), vx: rnd(-60, -20), vy: rnd(-40, 15),
                     life: rnd(0.3, 0.55), t: 0, c: Math.random() < 0.7 ? '#ffd76a' : '#fff0c0',
                     r: rnd(1.8, 3.4), star: true });

  // สายรุ้งตามหลังช่วงพลังพิเศษ
  if (P.boostT > 0 || G.bonusT > 0 || P.giantT > 0) {
    const scale0 = P.giantT > 0 ? 1.6 : 1;
    const ph0 = (P.sliding ? P.h * 0.52 : P.h) * scale0;
    trail.push({ x: P.x + 6, y: P.y + ph0 * 0.5, hue: (G.time * 240) % 360, t: 0 });
  }

  /* --- สัตว์เลี้ยง --- */
  Pet.wing += dt * 14;
  const petTX = P.x - 62, petTY = P.y - 34 + Math.sin(G.time * 4) * 10;
  Pet.x += (petTX - Pet.x) * 6 * dt;
  Pet.y += (petTY - Pet.y) * 6 * dt;
  for (const j of jellyList) {
    if (j.dead) continue;
    const jx = j.x - worldX;
    if (jx < -40 || jx > 300) continue;
    if (['potion','giant','magnet','star','bear','blast','box','letter'].includes(j.type)) continue;
    const petR = 36 + (PT().id === 'maca' ? (petLvNow() - 1) * 4 : 0);   // มาการอง: เลเวลเพิ่มรัศมี
    if (Math.hypot(jx - Pet.x, j.y - Pet.y) < petR) { j.dead = true; collectJelly(j, jx); }
  }

  /* --- ฟิสิกส์ผู้เล่น --- */
  const scale = P.giantT > 0 ? 1.6 : 1;

  if (P.onGround && !P.fallingPit && G.bonusT <= 0) {
    const dh = (P.h - P.h * 0.52) * scale;
    if (slideHeld && !P.sliding) {
      P.sliding = true;
      P.y += dh;
      AudioSys.slide();
    } else if (!slideHeld && P.sliding) {
      P.sliding = false;
      P.y -= dh;
    }
  }

  const pw = P.w * scale;
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  const footX = P.x + pw * 0.5;

  if (G.bonusT > 0) {
    /* บินบังคับเอง: ค้างโดด = ขึ้น, ค้างสไลด์ = ดิ่ง, ปล่อย = ร่อนลงช้า ๆ */
    P.fallingPit = false; P.sliding = false;
    const flyUp = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] ||
                  Object.values(touches).includes('L') || mouseFly;
    P.vy += (flyUp ? -2700 : slideHeld ? 2700 : 1150) * dt;
    P.vy = clamp(P.vy, -450, 450);
    P.y += P.vy * dt;
    const yMin = 76, yMax = GROUND_Y - ph - 4;
    if (P.y < yMin) { P.y = yMin; P.vy = Math.max(P.vy, 0); }
    if (P.y > yMax) { P.y = yMax; P.vy = Math.min(P.vy, 0); }
    P.onGround = false; P.jumps = 1;
    if (Math.random() < 0.6) sparkle(P.x - 10, P.y + ph / 2, 1, '#ffd24a');
  } else {
    const prevFoot = P.y + ph;
    P.vy += effGrav(P.vy) * dt;
    if (slideHeld && !P.onGround)
      P.vy += GRAV * 1.4 * dt;               // ดิ่งลงเร็ว (fast fall)
    P.y += P.vy * dt;

    let overPit = false;
    for (const p of pits) {
      const px = p.x - worldX;
      if (footX > px + 14 && footX < px + p.w - 14) overPit = true;
    }

    if (!P.fallingPit) {
      let landed = false;
      if (P.vy >= 0) {
        for (const pl of platforms) {
          const px = pl.x - worldX;
          if (footX > px && footX < px + pl.w &&
              prevFoot <= pl.y + 10 && P.y + ph >= pl.y) {
            P.y = pl.y - ph;
            if (!P.onGround) { puff(footX, pl.y, 4); P.squash = 0.32; }
            P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
            break;
          }
        }
      }
      if (!landed && P.y + ph >= GROUND_Y) {
        if (overPit && !canSmash()) {
          P.fallingPit = true;
          AudioSys.fall();
        } else {
          P.y = GROUND_Y - ph;
          if (!P.onGround) { puff(P.x + pw / 2, GROUND_Y, 4); P.squash = 0.32; }
          P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
        }
      }
      if (!landed) P.onGround = false;
    } else {
      if (P.y > H + 60) hurtFromPit();
    }
  }

  /* --- เก็บเยลลี่ --- */
  const cx = P.x + pw / 2, cy = P.y + ph / 2;
  for (const j of jellyList) {
    if (j.dead) continue;
    let jx = j.x - worldX;
    if (jx < -80) { j.dead = true; continue; }
    if (jx > W + 80) break;
    if ((P.magnetT > 0 || P.boostT > 0 || G.bonusT > 0 || hasTr(3)) && !['potion','giant','magnet','star','blast','box','letter'].includes(j.type)) {
      const dx = cx - jx, dy = cy - j.y;
      const d = Math.hypot(dx, dy);
      // ช่วงโบนัสดูดรัศมีสั้นลง จะได้เห็นตัวอักษร BONUS ชัด ๆ ก่อนบินทะลุ
      const attractR = G.bonusT > 0 ? 135 : (P.magnetT > 0 || P.boostT > 0) ? 260 : 95;
      if (d < attractR) { j.x += dx / d * 620 * dt; j.y += dy / d * 620 * dt; jx = j.x - worldX; }
    }
    const r = JSIZE[j.type] / 2 + (P.giantT > 0 ? 30 : 14);
    if (Math.abs(jx - cx) < r + pw / 2 - 8 && Math.abs(j.y - cy) < r + ph / 2 - 4) {
      j.dead = true;
      collectJelly(j, jx);
    }
  }
  jellyList = jellyList.filter(j => !j.dead);

  /* --- ชนสิ่งกีดขวาง --- */
  for (const o of obstacles) {
    if (o.dead) continue;
    const ox = o.x - worldX;
    if (ox < -120) { o.dead = true; continue; }
    if (ox > W + 60) break;
    if (G.bonusT > 0) continue;
    let hit = false;
    if (o.type === 'bar') {
      const barBottom = GROUND_Y - 62;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + 110 && P.y < barBottom) hit = true;
    } else {
      const ow = o.type === 'spike' ? 46 : 56, oh = o.type === 'spike' ? 46 : 52;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + ow && P.y + ph > GROUND_Y - oh + 6) hit = true;
    }
    if (hit) {
      if (canSmash()) {
        o.dead = true;
        sparkle(ox + 20, GROUND_Y - 40, 16, '#ffd24a');
        G.score += 100; floatText(ox, GROUND_Y - 90, 'SMASH! +100', '#ffd24a', true);
        AudioSys.noise(0.15, 0.3);
      } else {
        hurt(14 + G.stage);
      }
    }
  }
  obstacles = obstacles.filter(o => !o.dead);
  pits = pits.filter(p => p.x - worldX > -400);
  platforms = platforms.filter(p => p.x + p.w - worldX > -200);

  updateParticles(dt);
}

function hurtFromPit() {
  G.hp -= (20 + G.stage * 2) * CH().pitGuard;
  G.combo = 0;
  G.shake = 14; G.flash = 0.6;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }
  P.fallingPit = false;
  P.y = GROUND_Y - P.h - 200; P.vy = 100;
  P.invT = 2.5;
  floatText(P.x, 220, 'อุ๊ปส์! ตกหลุม!', '#ff8888', true);
}

function collectJelly(j, jx) {
  const mult = P.giantT > 0 ? 2 : 1;
  switch (j.type) {
    case 'bar': case 'coin': case 'pink': case 'bear': {
      G.combo++; G.comboTimer = CH().comboT;
      const comboBonus = Math.min(G.combo, 50);
      let base = JSCORE[j.type];
      if (j.type === 'bear') base = j.v === 'b' ? 5000 : j.v === 'p' ? 2500 : 1000;   // หมี 3 ระดับ
      let pts = (base + comboBonus) * mult;
      pts *= 1 + G.upg.jelly * 0.06;                         // เยลลี่พลัส
      pts *= lvMul();                                        // เลเวลคุกกี้
      if (j.type === 'bear' && hasTr(0)) pts *= 2;          // จี้หมีทองคำ
      if (G.scoreMulT > 0) pts *= 2;                         // สกิลนินจา
      pts = Math.round(pts);
      G.score += pts; G.jellies++;
      G.skill = Math.min(100, G.skill + 1.7 * (hasTr(5) ? 1.3 : 1));   // ชาร์จเกจสกิล
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (j.type === 'coin')
        G.coins += PT().id === 'chick' ? 2 + (petLvNow() >= 4 ? 1 : 0) + (petLvNow() >= 8 ? 1 : 0) : 1;
      if (j.type === 'bear') {
        G.runBears++;
        AudioSys.bear();
        const bc = j.v === 'p' ? '#ff8fc0' : '#ffb347';
        sparkle(jx, j.y, j.v === 'b' ? 34 : 24, bc);
        floatText(jx, j.y - 30, '+' + pts + (j.v === 'b' ? ' BIG BEAR!!' : j.v === 'p' ? ' PINK BEAR!' : ' BEAR JELLY!'), bc, true);
        G.hp = Math.min(G.hpMax, G.hp + (j.v === 'b' ? 20 : 10));
      } else {
        AudioSys.jelly(G.combo);
        sparkle(jx, j.y, 5, j.type === 'coin' ? '#ffd700' : j.type === 'pink' ? '#ff7bac' : '#ffe066');
        if (j.type !== 'bar' || G.combo % 10 === 0)
          floatText(jx, j.y - 24, '+' + pts, '#fff');
      }
      if (G.combo > 0 && G.combo % 25 === 0)
        banner('สุดยอด! ' + G.combo + ' COMBO!', `hsl(${(G.combo * 14) % 360},90%,65%)`);
      break;
    }
    case 'potion':
      G.hp = Math.min(G.hpMax, G.hp + 30);
      AudioSys.potion();
      sparkle(jx, j.y, 16, '#7bff9b');
      floatText(jx, j.y - 30, '+HP พลังคืนมา!', '#7bff9b', true);
      break;
    case 'giant':
      P.giantT = 6 * itemMul();
      AudioSys.power();
      sparkle(jx, j.y, 20, '#ffd24a');
      banner('ยักษ์โหมด! GIANT MODE!', '#ffd24a');
      break;
    case 'magnet':
      P.magnetT = 8 * itemMul();
      AudioSys.power();
      sparkle(jx, j.y, 20, '#7ecbff');
      banner('แม่เหล็กเยลลี่!', '#7ecbff');
      break;
    case 'star': {
      // Star Jelly: แตกเป็นคอนเฟตตีให้เก็บกวาด (แบบเกมจริง)
      AudioSys.bear();
      sparkle(jx, j.y, 26, '#ffe066');
      banner('⭐ STAR JELLY! เก็บคอนเฟตตี!', '#ffe066');
      for (let i = 0; i < 16; i++)
        jellyList.push({ x: worldX + jx + rnd(70, 480), y: rnd(130, GROUND_Y - 60),
                         type: 'confetti', t: rnd(0, TAU), dead: false });
      break;
    }
    case 'letter': {
      G.btProgress++;
      G.score += 300;
      AudioSys.jelly(20 + G.btProgress);
      sparkle(jx, j.y, 10, '#ff9dd6');
      floatText(jx, j.y - 26, j.ch + ' !', '#ff9dd6', true);
      if (G.btProgress >= 9) {
        G.btProgress = 0;
        startBonusTime();
      }
      break;
    }
    case 'blast':
      P.boostT = Math.max(P.boostT, 2.4);
      AudioSys.power();
      sparkle(jx, j.y, 18, '#ff9d2e');
      banner('🚀 BLAST!!', '#ff9d2e');
      break;
    case 'box':
      G.runBoxes++;
      AudioSys.potion();
      sparkle(jx, j.y, 14, '#e8b23c');
      floatText(jx, j.y - 28, '📦 MYSTERY BOX!', '#e8b23c', true);
      break;
  }
}

/* เข้าสู่ BONUS TIME (จากการเก็บอักษร BONUSTIME ครบ) */
function startBonusTime() {
  G.runStars++;
  bonusLetterQueue = ['B','O','N','U','S'];
  bonusBearSpawned = false;
  G.bonusT = 6.5 + G.upg.bonus * 0.7;
  P.vy = -120;
  AudioSys.bear();
  banner('🎉 BONUSTIME ครบ! ค้างปุ่มบิน ขึ้น/ลง 🎉', '#ffe066');
}

function updateParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.x -= (G.state === 'play' ? G.speed * 0.5 : 0) * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= 45 * dt; f.x -= (G.state==='play'?G.speed*0.3:0)*dt; }
  floaters = floaters.filter(f => f.t < 1.4);
}

/* ============================================================
   DRAW
   ============================================================ */
function draw() {
  uiButtons = [];
  if (window.__poseTest) { drawPoseSheet(); return; }
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);

  drawSky();
  drawBackHills();
  drawOvenWall();
  drawBokeh();
  drawGroundAndPits();
  drawOven();
  drawPlatforms();
  drawTrail();
  drawJellies();
  drawObstacles();
  if (G.state === 'play' || G.state === 'over' || G.state === 'continue') drawPlayer();
  if (G.state === 'play') drawPet();
  drawParticles();

  ctx.restore();

  if (G.bonusT > 0) {
    const a = Math.min(1, G.bonusT / 0.5) * 0.16;
    const g = ctx.createRadialGradient(W/2, H/2, 150, W/2, H/2, 620);
    g.addColorStop(0, 'rgba(255,220,90,0)');
    g.addColorStop(1, `rgba(255,190,40,${a + 0.08})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // vignette นุ่ม ๆ
  const vg = ctx.createRadialGradient(W/2, H/2, 280, W/2, H/2, 640);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,15,0,.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (G.state === 'play') drawHUD();
  if (G.state === 'menu') drawMenu();
  if (G.state === 'prep') drawPrep();
  if (G.state === 'select') drawSelect();
  if (G.state === 'pets') drawPets();
  if (G.state === 'treasure') drawTreasure();
  if (G.state === 'shop') drawShop();
  if (G.state === 'rank') drawRank();
  if (G.state === 'over') drawGameOver();
  if (G.state === 'continue') drawContinue();
  drawFloaters();
  drawBanner();

  if (G.fade > 0) {
    ctx.fillStyle = `rgba(42,26,14,${G.fade * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- ambient effects ---------- */
function drawBokeh() {
  for (const b of bokeh) {
    if (ovenAmt > 0.4) {
      // ประกายไฟ/ถ่านลอยในเตาอบ
      const a = (0.25 + Math.abs(Math.sin(G.time * 2.2 + b.tw)) * 0.45) * ovenAmt;
      const r = b.r * 0.28 + 1.2;
      ctx.fillStyle = `rgba(255,150,50,${a * 0.5})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,220,120,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    } else {
      const a = 0.08 + Math.abs(Math.sin(G.time * 0.8 + b.tw)) * 0.08;
      ctx.fillStyle = `hsla(${b.hue},85%,80%,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = `hsla(${b.hue},85%,92%,${a * 0.8})`;
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.45, 0, TAU); ctx.fill();
    }
  }
}

/* ---------- ผนังอิฐในเตาอบ (ฉากด่าน 1-2 แบบเกมจริง) ---------- */
function drawOvenWall() {
  if (ovenAmt < 0.01) return;
  ctx.save();
  ctx.globalAlpha = ovenAmt;
  // ฐานผนัง
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3f0f0a');
  g.addColorStop(0.5, '#6e2117');
  g.addColorStop(1, '#521510');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 8);
  // อิฐก้อนใหญ่ (parallax ช้า)
  const bw = 172, bh = 70;
  const scroll = worldX * 0.35;
  for (let row = 0; row < 7; row++) {
    const y = row * bh - 22;
    if (y > GROUND_Y) break;
    const shift = (row % 2) * (bw / 2);
    const off = -((scroll + shift) % bw);
    for (let x = off - bw; x < W + bw; x += bw) {
      const wx = Math.round((x + scroll + shift) / bw) * 13 + row * 7;
      const v = ((wx % 7) + 7) % 7 / 7;
      ctx.fillStyle = `rgb(${118 + v * 26},${40 + v * 13},${28 + v * 9})`;
      roundRect(x + 4, y + 4, bw - 8, Math.min(bh - 8, GROUND_Y + 4 - y), 9); ctx.fill();
      ctx.fillStyle = 'rgba(255,160,110,.09)';
      roundRect(x + 9, y + 8, bw - 18, 11, 5); ctx.fill();
      ctx.fillStyle = 'rgba(30,6,3,.25)';
      roundRect(x + 9, y + bh - 18, bw - 18, 8, 4); ctx.fill();
    }
  }
  // แสงไฟจากด้านล่างสาดขึ้นผนัง (วูบวาบ)
  const fg = ctx.createLinearGradient(0, GROUND_Y - 170, 0, GROUND_Y + 8);
  fg.addColorStop(0, 'rgba(255,120,40,0)');
  fg.addColorStop(1, `rgba(255,130,40,${0.16 + Math.sin(G.time * 7) * 0.05})`);
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND_Y - 170, W, 178);
  // มืดด้านบน
  const dg = ctx.createLinearGradient(0, 0, 0, 90);
  dg.addColorStop(0, 'rgba(15,3,1,.5)'); dg.addColorStop(1, 'rgba(15,3,1,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W, 90);
  ctx.restore();
}
function drawTrail() {
  for (const t of trail) {
    const k = 1 - t.t / 0.45;
    ctx.fillStyle = `hsla(${t.hue},95%,65%,${k * 0.4})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 4 + 13 * k, 0, TAU); ctx.fill();
  }
}

/* ---------- โหมดส่องตัวละครระยะใกล้ (ใช้ปรับดีไซน์) ---------- */
function drawPoseSheet() {
  ctx.fillStyle = '#efe0c8';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#5a3413';
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  // แถวบน: วงจรวิ่ง 8 เฟรมสไปรต์
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.translate(68 + i * 118, 252);
    ctx.scale(1.32, 1.32);
    drawCookieRun((i + 0.01) * TAU / 8 / 1.15);
    ctx.restore();
    ctx.fillText('F' + (i + 1), 68 + i * 118, 278);
  }
  // แถวล่าง: โดดขึ้น / ร่วงลง / สไลด์ / ยืน
  const oldVy = P.vy;
  const lower = [
    ['โดดขึ้น', () => { P.vy = -500; drawCookieJump(false); }],
    ['ร่วงลง', () => { P.vy = 500; drawCookieJump(false); }],
    ['ตีลังกา', () => drawCookieJump(true)],
    ['สไลด์', () => drawCookieSlide(0.5)],
    ['ยืน', () => cookieBody(0, 0.4, -0.4, 2.7, 3.5, 0)],
  ];
  lower.forEach(([label, fn], i) => {
    ctx.save();
    ctx.translate(105 + i * 190, 492);
    ctx.scale(1.55, 1.55);
    fn();
    ctx.restore();
    ctx.fillText(label, 105 + i * 190, 516);
  });
  P.vy = oldVy;
}

/* ---------- background ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, skyBlend('top'));
  g.addColorStop(0.45, skyBlend('mid'));
  g.addColorStop(1, skyBlend('bot'));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const night = skyBlend('night');

  // ดาวตอนกลางคืน
  if (night > 0.03) {
    for (const s of stars) {
      ctx.globalAlpha = night * (0.4 + Math.abs(Math.sin(G.time * 1.6 + s.tw)) * 0.6);
      ctx.fillStyle = '#fff8e0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // พระอาทิตย์คุกกี้ / พระจันทร์เสี้ยว
  ctx.save();
  ctx.translate(790, 95);
  if (night < 0.5) {
    ctx.globalAlpha = 1 - night;
    // แฉกแสงหมุนช้า ๆ
    ctx.save();
    ctx.rotate(G.time * 0.06);
    ctx.fillStyle = 'rgba(255,240,190,.10)';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-26, -150); ctx.lineTo(26, -150);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // แสงฟุ้งรอบดวง
    ctx.fillStyle = 'rgba(255,235,180,.25)';
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('sun');
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,160,90,.55)';
    for (const [dx, dy] of [[-12,-8],[10,-14],[14,8],[-6,12],[2,-2]])
      { ctx.beginPath(); ctx.arc(dx, dy, 3.4, 0, TAU); ctx.fill(); }
  } else {
    ctx.globalAlpha = night;
    ctx.fillStyle = 'rgba(244,240,224,.18)';
    ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f4f0e0';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('top');
    ctx.beginPath(); ctx.arc(16, -8, 34, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // เมฆวิปครีมสองชั้น (เงาล่าง + เนื้อบน)
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    const puffs = [[0,0,26],[24,-8,20],[48,0,24],[24,8,22],[70,4,16]];
    ctx.fillStyle = night > 0.5 ? 'rgba(120,120,170,.45)' : 'rgba(255,190,150,.5)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy + 6, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = night > 0.5 ? 'rgba(185,185,225,.6)' : 'rgba(255,250,240,.95)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawBackHills() {
  // ปราสาทขนมหวานไกลสุด (parallax ช้าสุด)
  const off0 = -(worldX * 0.08) % 800;
  ctx.fillStyle = skyBlend('far');
  for (let x = off0 - 800; x < W + 800; x += 800) {
    drawCastle(x + 180, 402);
    drawCastle(x + 560, 402);
  }
  // เนินขนม (ไล่เฉดจากยอดสว่างลงมา)
  const off1 = -(worldX * 0.18) % 500;
  const hillCol = skyBlend('hill');
  const hg = ctx.createLinearGradient(0, 250, 0, 460);
  hg.addColorStop(0, shade(hillCol, 26));
  hg.addColorStop(1, shade(hillCol, -8));
  ctx.fillStyle = hg;
  for (let x = off1 - 500; x < W + 500; x += 500) {
    ctx.beginPath();
    ctx.moveTo(x, 400);
    ctx.quadraticCurveTo(x + 125, 250, x + 250, 400);
    ctx.quadraticCurveTo(x + 375, 290, x + 500, 400);
    ctx.lineTo(x + 500, 460); ctx.lineTo(x, 460);
    ctx.fill();
  }
  // ต้นอมยิ้ม
  const off2 = -(worldX * 0.45) % 640;
  for (let x = off2 - 640; x < W + 640; x += 320) {
    drawLollipop(x + 60, 442, 1, ((x / 320 | 0) % 2) === 0);
  }
}
function drawCastle(x, baseY) {
  // เงาปราสาทไอศกรีม (ใช้ fillStyle ที่ตั้งไว้แล้ว)
  ctx.beginPath();
  ctx.rect(x - 40, baseY - 70, 80, 70);          // ตัวปราสาท
  ctx.rect(x - 62, baseY - 46, 22, 46);          // หอซ้าย
  ctx.rect(x + 40, baseY - 46, 22, 46);          // หอขวา
  ctx.moveTo(x - 62, baseY - 46); ctx.lineTo(x - 51, baseY - 74); ctx.lineTo(x - 40, baseY - 46);
  ctx.moveTo(x + 40, baseY - 46); ctx.lineTo(x + 51, baseY - 74); ctx.lineTo(x + 62, baseY - 46);
  ctx.moveTo(x - 40, baseY - 70); ctx.lineTo(x, baseY - 108); ctx.lineTo(x + 40, baseY - 70);
  ctx.fill();
}
function drawLollipop(x, groundY, s, alt) {
  ctx.save();
  ctx.translate(x, groundY); ctx.scale(s, s);
  ctx.fillStyle = '#f7e6c9';
  ctx.fillRect(-5, -120, 10, 120);
  const r = 34;
  ctx.beginPath(); ctx.arc(0, -140, r, 0, TAU);
  ctx.fillStyle = alt ? '#ff6b8d' : '#7ecbff'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 6;
  ctx.beginPath();
  for (let a = 0; a < TAU * 2.4; a += 0.15) {
    const rr = a / (TAU * 2.4) * (r - 6);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr - 140;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function drawGroundAndPits() {
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, '#c98d4e');
  g.addColorStop(0.15, '#a96f37');
  g.addColorStop(1, '#7a4a20');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // ขอบไอซิ่ง + ครีมหยด (ซ่อนตอนอยู่ในเตาอบ)
  if (ovenAmt < 0.95) {
  ctx.fillStyle = '#f2d8a7';
  const off = -(worldX % 64);
  for (let x = off - 64; x < W + 64; x += 64) {
    ctx.beginPath();
    ctx.arc(x + 32, GROUND_Y + 3, 10, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillRect(0, GROUND_Y, W, 6);
  const offD = -(worldX % 192);
  for (let x = offD - 192; x < W + 192; x += 192) {
    ctx.beginPath();
    ctx.moveTo(x + 20, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 26, GROUND_Y + 22, x + 20, GROUND_Y + 24);
    ctx.quadraticCurveTo(x + 14, GROUND_Y + 22, x + 20, GROUND_Y + 5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 120, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 127, GROUND_Y + 17, x + 120, GROUND_Y + 19);
    ctx.quadraticCurveTo(x + 113, GROUND_Y + 17, x + 120, GROUND_Y + 5);
    ctx.fill();
  }
  // เม็ดน้ำตาลหลากสีโรยบนไอซิ่ง
  const offS = -(worldX % 96);
  const sprCols = ['#ff6b8d', '#7ecbff', '#7bd94a', '#ffd24a', '#c592ff'];
  for (let x = offS - 96, i = 0; x < W + 96; x += 32, i++) {
    const wx = Math.round((x + worldX) / 32);
    ctx.save();
    ctx.translate(x + 16, GROUND_Y + 1 + (wx % 3));
    ctx.rotate((wx * 1.7) % TAU);
    ctx.fillStyle = sprCols[((wx % 5) + 5) % 5];
    roundRect(-4, -1.6, 8, 3.2, 1.6); ctx.fill();
    ctx.restore();
  }
  }  // จบส่วนไอซิ่ง/เม็ดน้ำตาล

  ctx.fillStyle = 'rgba(90,50,20,.55)';
  const off2 = -(worldX % 160);
  for (let x = off2 - 160; x < W + 160; x += 160) {
    ctx.beginPath(); ctx.arc(x + 40, GROUND_Y + 42, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 110, GROUND_Y + 70, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 75, GROUND_Y + 95, 6, 0, TAU); ctx.fill();
  }

  /* --- ในเตาอบ: พื้นตะแกรงเหล็ก + ไฟลุกข้างล่าง (แบบเกมจริง) --- */
  if (ovenAmt > 0.01) {
    ctx.save();
    ctx.globalAlpha = ovenAmt;
    // แสงไฟใต้ตะแกรง
    const fgr = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    fgr.addColorStop(0, '#2a0a04');
    fgr.addColorStop(0.4, '#77220a');
    fgr.addColorStop(1, '#e8641e');
    ctx.fillStyle = fgr;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // เปลวไฟลุกวูบวาบ
    for (let x = -20; x < W + 40; x += 46) {
      const ph = Math.sin(G.time * 9 + x * 0.7) * 0.5 + 0.5;
      const fh = 30 + ph * 34;
      const fx = x + Math.sin(G.time * 5 + x) * 5;
      ctx.fillStyle = 'rgba(255,110,25,.8)';
      ctx.beginPath();
      ctx.moveTo(fx - 17, H);
      ctx.quadraticCurveTo(fx - 15, H - fh * 0.6, fx, H - fh - 20);
      ctx.quadraticCurveTo(fx + 15, H - fh * 0.6, fx + 17, H);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,210,74,.85)';
      ctx.beginPath();
      ctx.moveTo(fx - 8, H);
      ctx.quadraticCurveTo(fx - 7, H - fh * 0.4, fx, H - fh * 0.72 - 10);
      ctx.quadraticCurveTo(fx + 7, H - fh * 0.4, fx + 8, H);
      ctx.fill();
    }
    // รางตะแกรงบน
    ctx.fillStyle = '#3a3a46';
    ctx.fillRect(0, GROUND_Y, W, 13);
    ctx.fillStyle = '#5c5c6c';
    ctx.fillRect(0, GROUND_Y, W, 4.5);
    ctx.fillStyle = '#1e1e26';
    ctx.fillRect(0, GROUND_Y + 13, W, 3);
    // ซี่ตะแกรงแนวตั้ง (มองเห็นไฟลอดช่อง)
    const goff = -(worldX % 76);
    for (let x = goff - 76; x < W + 76; x += 76) {
      ctx.fillStyle = '#31313c';
      ctx.fillRect(x, GROUND_Y + 14, 22, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fillRect(x + 2.5, GROUND_Y + 14, 4.5, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(x + 17, GROUND_Y + 14, 5, H - GROUND_Y - 14);
    }
    ctx.restore();
  }

  for (const p of pits) {
    const px = p.x - worldX;
    if (px > W || px + p.w < 0) continue;
    ctx.fillStyle = '#1d1006';
    ctx.fillRect(px, GROUND_Y, p.w, H - GROUND_Y);
    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 60);
    gg.addColorStop(0, 'rgba(0,0,0,.65)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(px, GROUND_Y, p.w, 60);
    ctx.fillStyle = '#8a5a28';
    ctx.fillRect(px - 4, GROUND_Y, 6, 18);
    ctx.fillRect(px + p.w - 2, GROUND_Y, 6, 18);
  }
}

/* ---------- เตาอบตอนเริ่มเกม: คุกกี้หนีออกมาจากตรงนี้! ---------- */
function drawOven() {
  if (G.state !== 'play' && G.state !== 'over') return;
  const sx = -20 - worldX;
  if (sx < -360) return;
  ctx.save();
  ctx.translate(sx, GROUND_Y);
  // ตัวเตา
  ctx.fillStyle = '#4a2c16';
  roundRect(0, -292, 296, 292, 26); ctx.fill();
  ctx.fillStyle = '#5f3a1e';
  roundRect(10, -282, 276, 272, 20); ctx.fill();
  // ปล่องควัน
  ctx.fillStyle = '#4a2c16';
  roundRect(210, -344, 46, 60, 8); ctx.fill();
  // ควันลอย
  for (let i = 0; i < 3; i++) {
    const t = (G.time * 0.5 + i * 0.33) % 1;
    ctx.fillStyle = `rgba(240,230,215,${(1 - t) * 0.4})`;
    ctx.beginPath();
    ctx.arc(233 + Math.sin(t * 5) * 10, -350 - t * 70, 10 + t * 14, 0, TAU);
    ctx.fill();
  }
  // ช่องเตาเปิด เรืองแสงส้มข้างใน
  const gg = ctx.createLinearGradient(0, -210, 0, -20);
  gg.addColorStop(0, '#2a1206');
  gg.addColorStop(0.55, '#7a2f0a');
  gg.addColorStop(1, '#e8792a');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.moveTo(48, -20);
  ctx.lineTo(48, -170);
  ctx.arc(148, -170, 100, Math.PI, 0);
  ctx.lineTo(248, -20);
  ctx.closePath(); ctx.fill();
  // แสงไฟลุกวูบวาบ
  ctx.fillStyle = `rgba(255,170,60,${0.25 + Math.sin(G.time * 9) * 0.12})`;
  ctx.beginPath(); ctx.ellipse(148, -60, 80, 36, 0, 0, TAU); ctx.fill();
  // บานประตูเหวี่ยงเปิด
  ctx.fillStyle = '#3a2210';
  roundRect(-44, -200, 40, 186, 10); ctx.fill();
  ctx.fillStyle = '#57351c';
  roundRect(-38, -192, 28, 170, 8); ctx.fill();
  ctx.fillStyle = '#c9a15f';
  ctx.beginPath(); ctx.arc(-24, -108, 6, 0, TAU); ctx.fill();  // ลูกบิด
  // ขาเตา
  ctx.fillStyle = '#33200f';
  roundRect(18, -6, 34, 14, 5); ctx.fill();
  roundRect(244, -6, 34, 14, 5); ctx.fill();
  ctx.restore();
}

function drawPlatforms() {
  for (const pl of platforms) {
    const x = pl.x - worldX;
    if (x + pl.w < -40 || x > W + 40) continue;
    ctx.fillStyle = '#b0793f';
    roundRect(x, pl.y, pl.w, 30, 10); ctx.fill();
    ctx.fillStyle = '#8a5a28';
    roundRect(x, pl.y + 18, pl.w, 12, 6); ctx.fill();
    ctx.fillStyle = '#f2d8a7';
    roundRect(x + 3, pl.y, pl.w - 6, 8, 4); ctx.fill();
    ctx.fillStyle = 'rgba(90,50,20,.4)';
    for (let dx = 22; dx < pl.w - 12; dx += 44) {
      ctx.beginPath(); ctx.arc(x + dx, pl.y + 17, 3.5, 0, TAU); ctx.fill();
    }
  }
}

function drawPet(pet) {
  const p = pet || PT();
  ctx.save();
  if (!pet) ctx.translate(Pet.x, Pet.y);
  const flap = Math.sin(Pet.wing) * 0.7;
  if (p.id === 'maca') {
    ctx.fillStyle = '#ffe9b8';
    ctx.save(); ctx.rotate(-0.5 - flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-10, -6, 12, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = ballGrad(0, 0, 14, '#ff9db8');
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 4.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7ba0';
    ctx.beginPath(); ctx.arc(0, -5, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(5, -4, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -4, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffb84a';
    ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(20, 1); ctx.lineTo(14, 3); ctx.fill();
    ctx.fillStyle = '#ffd9e4';
    ctx.save(); ctx.rotate(0.3 + flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-8, 4, 10, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (p.id === 'chick') {
    // ลูกเจี๊ยบทอฟฟี่
    ctx.fillStyle = '#ffe98a';
    ctx.save(); ctx.rotate(-0.4 - flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-11, -4, 11, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = ballGrad(0, 0, 15, '#ffd84a');
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffce2e';
    ctx.beginPath(); ctx.arc(0, 5, 12, 0, Math.PI); ctx.fill();
    // หงอนทอฟฟี่
    ctx.fillStyle = '#e0453a';
    ctx.beginPath(); ctx.arc(0, -14, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-5, -12, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(5, -3, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -3, 2.1, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff9d2e';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(21, 2); ctx.lineTo(14, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,.5)';
    ctx.beginPath(); ctx.arc(2, 4, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.save(); ctx.rotate(0.3 + flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-8, 5, 9, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    // ปุยเมฆน้ำตาล
    const bob = Math.sin(Pet.wing * 0.5) * 2;
    ctx.translate(0, bob);
    ctx.fillStyle = '#f6efe4';
    for (const [dx, dy, r] of [[-10,2,9],[0,-4,12],[11,2,9],[0,5,10]])
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(200,150,190,.35)';
    ctx.beginPath(); ctx.ellipse(0, 9, 13, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(-1, -2, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -2, 2.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4a2410'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(3, 2, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,150,.5)';
    ctx.beginPath(); ctx.arc(-6, 2, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 2, 2.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- jellies & items ---------- */
function drawJellies() {
  for (const j of jellyList) {
    const x = j.x - worldX;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(G.time * 4 + j.t) * 4;
    const y = j.y + bob;
    ctx.save();
    ctx.translate(x, y);
    switch (j.type) {
      case 'bar': {
        // แสงเรืองนุ่ม ๆ ด้านหลัง
        ctx.fillStyle = 'rgba(255,220,90,.16)';
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        const w = 26, h = 13;
        ctx.fillStyle = '#e8a90c';
        roundRect(-w/2, -h/2, w, h, 6); ctx.fill();
        ctx.fillStyle = '#ffce2e';
        roundRect(-w/2, -h/2, w, h - 3.5, 6); ctx.fill();
        ctx.fillStyle = '#ffe883';
        roundRect(-w/2 + 1.5, -h/2 + 1.5, w - 3, 4.5, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        roundRect(-w/2+3, -h/2+2, w-16, 3.4, 2); ctx.fill();
        break;
      }
      case 'pink': {
        ctx.fillStyle = 'rgba(255,123,172,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0568c';
        heart(0, 1.8, 15); ctx.fill();
        ctx.fillStyle = '#ff7bac';
        heart(0, 0, 15); ctx.fill();
        ctx.fillStyle = '#ffa8ca';
        heart(-1, -2, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(-5, -6, 3.2, 0, TAU); ctx.fill();
        break;
      }
      case 'coin': {
        ctx.fillStyle = 'rgba(255,216,74,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
        ctx.fillStyle = '#b8830a';
        ctx.beginPath(); ctx.arc(0, 1.6, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffd84a';
        ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.ellipse(-3.4, -4.2, 4.2, 2.4, -0.6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('C', 0, 1);
        break;
      }
      case 'bear': {
        if (j.v === 'b') { ctx.scale(1.5, 1.5); drawBearJelly('#ffab2e'); }
        else drawBearJelly(j.v === 'p' ? '#ff8fc0' : '#ffab2e');
        break;
      }
      case 'potion': {
        ctx.fillStyle = '#e94f4f';
        ctx.beginPath(); ctx.arc(0, 3, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f9f4ea';
        ctx.fillRect(-5, -16, 10, 8);
        ctx.fillStyle = '#c9c2b4';
        ctx.fillRect(-6, -18, 12, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, 0, 12, 5); ctx.fillRect(-2.5, -3.5, 5, 12);
        itemBubble('#7bff9b');
        break;
      }
      case 'giant': {
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff9d2e';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G', 0, 1);
        itemBubble('#ffd24a');
        break;
      }
      case 'magnet': {
        ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, -2, 10, Math.PI, 0, false); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(10, 8); ctx.stroke();
        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-10, 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(10, 12); ctx.stroke();
        itemBubble('#7ecbff');
        break;
      }
      case 'letter': {
        // ลูกกวาดอักษร BONUSTIME
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.15);
        ctx.fillStyle = 'rgba(255,157,214,.25)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e5579a';
        roundRect(-13, -13, 26, 26, 8); ctx.fill();
        ctx.fillStyle = '#ff8fc0';
        roundRect(-13, -13, 26, 21, 8); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        roundRect(-10, -10, 20, 7, 4); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(j.ch, 0, 1.5);
        ctx.textBaseline = 'alphabetic';
        break;
      }
      case 'confetti': {
        ctx.rotate(G.time * 4 + j.t);
        ctx.fillStyle = `hsl(${(j.t * 120) % 360},90%,65%)`;
        roundRect(-7, -4.5, 14, 9, 3.5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        roundRect(-5, -3, 6, 3, 1.5); ctx.fill();
        break;
      }
      case 'blast': {
        // เยลลี่จรวดพุ่ง
        ctx.rotate(-0.5);
        ctx.fillStyle = '#ff9d2e';
        roundRect(-6, -14, 12, 24, 6); ctx.fill();
        ctx.fillStyle = '#e0453a';
        ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(0, -22); ctx.lineTo(6, -12); ctx.fill();
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(0, 20 + Math.sin(G.time * 14) * 3); ctx.lineTo(5, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(0, -6, 3.4, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        itemBubble('#ff9d2e');
        break;
      }
      case 'box': {
        // กล่องปริศนา
        ctx.rotate(Math.sin(G.time * 2.5 + j.t) * 0.1);
        ctx.fillStyle = '#8a5a28';
        roundRect(-14, -11, 28, 24, 5); ctx.fill();
        ctx.fillStyle = '#a97b45';
        roundRect(-14, -11, 28, 9, 5); ctx.fill();
        ctx.fillStyle = '#e8b23c';
        ctx.fillRect(-3, -11, 6, 24);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 3);
        ctx.textBaseline = 'alphabetic';
        itemBubble('#e8b23c');
        break;
      }
      case 'star': {
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.25);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? 16 : 7;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.beginPath(); ctx.arc(-3, -4, 3, 0, TAU); ctx.fill();
        itemBubble('#ffe066');
        break;
      }
    }
    ctx.restore();
  }
}
/* ฟองแก้วครอบไอเทม (แบบเกมจริง) */
function itemBubble(c) {
  const bobA = Math.sin(G.time * 5) * 0.06;
  ctx.fillStyle = 'rgba(215,238,255,.14)';
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI * (1.12 + bobA), Math.PI * (1.42 + bobA)); ctx.stroke();
  ctx.strokeStyle = c; ctx.globalAlpha = 0.35 + Math.sin(G.time * 6) * 0.2;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function glowRing(c) {
  ctx.strokeStyle = c; ctx.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(G.time * 6) * 3, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBearJelly(c) {
  c = c || '#ffab2e';
  const hl = 'rgba(255,255,255,.55)';
  ctx.fillStyle = ballGrad(0, -4, 30, c);
  ctx.beginPath(); ctx.arc(-13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.fill();
  roundRect(-14, 2, 28, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 24, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(c, -48); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.stroke();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(-6, -13, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4a10';
  ctx.beginPath(); ctx.arc(-6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  glowRing(c);
}

/* ---------- obstacles ---------- */
function drawObstacles() {
  for (const o of obstacles) {
    const x = o.x - worldX;
    if (x < -140 || x > W + 60) continue;
    ctx.save();
    ctx.translate(x, GROUND_Y);
    if (o.type === 'spike') {
      for (let i = 0; i < 3; i++) {
        const bx = i * 16 - 2;
        ctx.fillStyle = i % 2 ? '#ff5f7e' : '#ff8fa8';
        ctx.beginPath();
        ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i===1?8:0)); ctx.lineTo(bx + 16, 0);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.moveTo(bx + 3, -6); ctx.lineTo(bx + 7, -32); ctx.lineTo(bx + 9, -6);
        ctx.fill();
      }
    } else if (o.type === 'rock') {
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(6, -34); ctx.lineTo(22, -50) ; ctx.lineTo(42, -42);
      ctx.lineTo(56, -18); ctx.lineTo(54, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#40230f'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#8a5a35';
      ctx.beginPath();
      ctx.moveTo(8, -30); ctx.lineTo(22, -44); ctx.lineTo(36, -38); ctx.lineTo(30, -20);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(24, -40, 4, 0, TAU); ctx.fill();
    } else if (o.type === 'bar') {
      const y = -62;
      ctx.fillStyle = '#f6e7d0';
      roundRect(0, -H, 14, H + y, 6); ctx.fill();
      roundRect(96, -H, 14, H + y, 6); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -H, 14, H + y); ctx.rect(96, -H, 14, H + y); ctx.clip();
      ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 7;
      for (let yy = -H; yy < y + 20; yy += 20) {
        ctx.beginPath(); ctx.moveTo(-8, yy); ctx.lineTo(24, yy + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(88, yy); ctx.lineTo(120, yy + 20); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = '#b0793f';
      roundRect(-8, y - 26, 126, 26, 8); ctx.fill();
      ctx.fillStyle = '#8a5a28';
      roundRect(-8, y - 26, 126, 10, 5); ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('▼ SLIDE ▼', 55, y - 34);
    }
    ctx.restore();
  }
}

/* ---------- player ---------- */
function drawPlayer() {
  if (P.fallingPit && P.y > H) return;
  const scale = P.giantT > 0 ? 1.6 : 1;
  const blink = P.invT > 0 && Math.floor(G.time * 14) % 2 === 0;
  if (blink) return;

  ctx.save();
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  ctx.translate(P.x + P.w * scale / 2, P.y + ph);

  if (!P.fallingPit) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const shY = GROUND_Y - (P.y + ph);
    ctx.beginPath();
    ctx.ellipse(0, shY + 6, 30 * scale * (1 - clamp(shY/300,0,0.5)), 8 * scale, 0, 0, TAU);
    ctx.fill();
  }

  ctx.scale(scale, scale);
  // squash & stretch (จุดหมุนอยู่ที่เท้า)
  if (Math.abs(P.squash) > 0.01 && !P.sliding)
    ctx.scale(1 + P.squash * 0.45, 1 - P.squash * 0.4);
  if (P.giantT > 0 && P.giantT < 1.2 && Math.floor(G.time * 10) % 2 === 0)
    ctx.globalAlpha = 0.6;

  if (P.boostT > 0 || G.bonusT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(G.time * 12) * 0.15;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.ellipse(-6, -P.h / 2, 46, 52, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,60,.65)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = -14 - i * 16, ln = 30 + ((P.anim * 9 + i * 3) % 4) * 10;
      ctx.beginPath(); ctx.moveTo(-32, yy); ctx.lineTo(-32 - ln, yy); ctx.stroke();
    }
  }

  if (G.bonusT > 0 && !P.dead)
    ctx.rotate(clamp(P.vy * 0.0007, -0.32, 0.32));   // เอียงหัวตามทิศบิน

  const run = P.anim;
  if (P.dead) {
    // ล้มคว่ำหมุนตัวตอนพลังหมด (แบบเกมจริง)
    const t = clamp(G.overT * 1.5, 0, 1);
    ctx.translate(0, -Math.sin(Math.min(t, 1) * Math.PI) * 26);
    ctx.rotate(Math.min(t * 2.4, Math.PI / 2));
    cookieBody(0, 0.8, -0.5, 3.3, 2.3, 0);
  } else {
    if (P.stumbleT > 0)
      ctx.rotate(Math.sin(G.time * 36) * 0.14 * (P.stumbleT / 0.5));
    if (P.sliding) drawCookieSlide(run);
    else if (!P.onGround) drawCookieJump(P.jumps >= 2);
    else drawCookieRun(run);
  }

  if (P.magnetT > 0) {
    ctx.strokeStyle = 'rgba(126,203,255,.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -G.time * 60;
    ctx.beginPath(); ctx.arc(0, -P.h/2, 66, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ============================================================
   ตัวละครแบบภาพวาด 2D — เฉดแสงเงา พื้นผิว เครื่องแต่งกาย
   (จุดกำเนิด = กึ่งกลางเท้า) — ch = ตัวละคร
   ============================================================ */
function ballGrad(x, y, r, c) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.12, x, y, r);
  g.addColorStop(0, shade(c, 40));
  g.addColorStop(0.55, c);
  g.addColorStop(1, shade(c, -26));
  return g;
}

function cookieBody(bodyTilt, legA, legB, armA, armB, headBob, ch, joints) {
  ch = ch || CH();
  joints = joints || {};
  const kA = joints.kA !== undefined ? joints.kA : 0.14;
  const kB = joints.kB !== undefined ? joints.kB : 0.14;
  const eA = joints.eA !== undefined ? joints.eA : 0.5;
  const eB = joints.eB !== undefined ? joints.eB : 0.5;
  const B = ch.body, ICING = ch.icing;
  const RIM = shade(B, -78);
  const EYE = ch.eye || '#1e78d2';

  /* ---------- เรนเดอร์ลง offscreen แล้วค่อยแปะกลับ ---------- */
  const main = ctx;
  ctx = charCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  ctx.setTransform(CSS, 0, 0, CSS, C_OX * CSS, C_OY * CSS);
  ctx.rotate(bodyTilt);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  /* --- ของประดับด้านหลังตัว (วาดก่อนเงารวม) --- */
  if (ch.id === 'angel') {
    const f = Math.sin(P.anim * 2.2) * 0.16;
    ctx.save();
    ctx.translate(-13, -60);
    ctx.rotate(-0.35 + f);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 0 ? '#ffffff' : i === 1 ? '#f2ecff' : '#e4dcf8';
      ctx.beginPath();
      ctx.ellipse(-12 - i * 7, 2 + i * 5.5, 17 - i * 3, 7.5 - i * 1.2, -0.55 - i * 0.16, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  if (ch.id === 'ninja') {
    const w1 = Math.sin(P.anim * 2.4) * 5, w2 = Math.sin(P.anim * 2.4 + 1.2) * 7;
    ctx.fillStyle = '#c4372e';
    ctx.beginPath();
    ctx.moveTo(-9, -66);
    ctx.quadraticCurveTo(-29, -64 + w1, -46, -56 + w2);
    ctx.quadraticCurveTo(-48, -50 + w2, -42, -48 + w2);
    ctx.quadraticCurveTo(-27, -54 + w1, -7, -58);
    ctx.closePath(); ctx.fill();
  }

  /* ---------- ซิลูเอตรวมเป็นก้อนเดียว: พาสขอบ → พาสเนื้อ ----------
     ทุกชิ้นทับกันด้วยสีเดียว รอยต่อภายในจึงหายหมด
     เหลือเส้นขอบเส้นเดียวรอบตัวจริง ๆ แบบงานอาร์ตต้นฉบับ */
  const drawParts = (mode) => {
    const col = mode === 'rim' ? RIM : B;
    const grow = mode === 'rim' ? 4.8 : 0;   // ขยายเส้น
    const pad = mode === 'rim' ? 2.3 : 0;    // ขยายรูปทรง
    const segP = (len, w) => {
      ctx.strokeStyle = col; ctx.lineWidth = w + grow;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
    };
    // ขา
    const legP = (hip, knee) => {
      ctx.save();
      ctx.translate(0, -30);
      ctx.rotate(hip);
      segP(13, 12);
      ctx.translate(0, 13);
      ctx.rotate(knee);
      segP(11, 11.4);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(2.5, 13, 9 + pad, 6.4 + pad, 0, 0, TAU); ctx.fill();
      ctx.restore();
    };
    legP(legA, kA); legP(legB, kB);
    // ลำตัว
    ctx.fillStyle = col;
    roundRect(-15 - pad, -64 - pad, 30 + pad * 2, 37 + pad * 2, 14 + pad); ctx.fill();
    // แขน
    const armP = (sh, el) => {
      ctx.save();
      ctx.translate(0, -57);
      ctx.rotate(sh);
      segP(11, 10);
      ctx.translate(0, 11);
      ctx.rotate(el);
      segP(9, 9.4);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(0, 12, 6.8 + pad, 0, TAU); ctx.fill();
      ctx.restore();
    };
    armP(armA, eA); armP(armB, eB);
    // หัว
    ctx.save();
    ctx.translate(0, -86 + headBob);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0.5, 0, 31.5 + pad, 27.5 + pad, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };
  drawParts('rim');    // เงาขอบทั้งตัว (เส้นเดียวรอบนอก)
  drawParts('fill');   // เนื้อสีทั้งตัว (ก้อนเดียวเนียน)

  /* ---------- รายละเอียดบนเนื้อ ---------- */
  // เกล็ดคุกกี้จาง ๆ
  ctx.fillStyle = 'rgba(70,40,15,.15)';
  for (const [dx, dy, r] of [[-8, -34, 1.4], [6, -31, 1.2], [9, -50, 1.2]])
    { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }

  if (ch.id === 'brave') {
    const skull = (sx, sy, s) => {
      ctx.save();
      ctx.translate(sx, sy); ctx.scale(s, s);
      ctx.fillStyle = '#f6f1e8';
      ctx.beginPath(); ctx.arc(0, -0.6, 4.4, 0, TAU); ctx.fill();
      roundRect(-2.6, 2.2, 5.2, 2.8, 1.3); ctx.fill();
      ctx.fillStyle = '#4a3625';
      ctx.beginPath(); ctx.ellipse(-1.7, -0.9, 1.15, 1.5, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(1.7, -0.9, 1.15, 1.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(74,54,37,.8)';
      ctx.fillRect(-1.3, 2.8, 0.9, 1.6); ctx.fillRect(0.5, 2.8, 0.9, 1.6);
      ctx.restore();
    };
    skull(0, -52.5, 1.15);
    skull(0, -37, 0.95);
  } else {
    ctx.strokeStyle = shade(ICING, -20); ctx.lineWidth = 5.6;
    ctx.beginPath();
    ctx.moveTo(-11.5, -37);
    ctx.lineTo(-5.8, -43); ctx.lineTo(0, -37); ctx.lineTo(5.8, -43); ctx.lineTo(11.5, -37);
    ctx.stroke();
    ctx.strokeStyle = ICING; ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-11.5, -38);
    ctx.lineTo(-5.8, -44); ctx.lineTo(0, -38); ctx.lineTo(5.8, -44); ctx.lineTo(11.5, -38);
    ctx.stroke();
    ctx.fillStyle = ballGrad(0, -53, 4.6, ch.button);
    ctx.beginPath(); ctx.arc(0, -53, 4.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-1.5, -54.6, 1.5, 0, TAU); ctx.fill();
  }
  if (ch.id === 'berry') {
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    for (const [dx, dy] of [[-8, -33], [7, -31], [-4, -28], [9, -48], [-10, -50]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 1.5, 2.3, 0.4, 0, TAU); ctx.fill(); }
  }

  /* --- หัว: ผม/หมวก/หน้า --- */
  ctx.save();
  ctx.translate(0, -86 + headBob);

  if (ch.id === 'berry') {
    ctx.fillStyle = ballGrad(0, -11, 30, '#e8506e');
    ctx.beginPath();
    ctx.arc(0, -4, 30.6, Math.PI * 1.02, Math.PI * 1.98);
    ctx.quadraticCurveTo(21, -1, 11, -9);
    ctx.quadraticCurveTo(5.5, 0, -1, -9);
    ctx.quadraticCurveTo(-8, 0, -15.5, -9);
    ctx.quadraticCurveTo(-23, -1, -30, -9);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade('#e8506e', -50); ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = 'rgba(255,244,220,.95)';
    for (const [sx, sy, a] of [[-17, -19, 0.5], [-2, -25, 0], [13, -18, -0.4], [-9, -13, 0.3], [7, -12, -0.2]])
      { ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, 0, 1.8, 2.9, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = '#4ca64c';
    for (const a of [-0.6, 0, 0.6]) {
      ctx.save(); ctx.translate(0, -31); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0, -5, 4.8, 9.2, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#3a7a3a'; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(0, -33); ctx.lineTo(2, -42); ctx.stroke();
  } else {
    const qf = Math.floor(G.time * 12) / 12;
    const f1 = Math.sin(qf * 9) * 1.6, f2 = Math.sin(qf * 9 + 1.3) * 2.0;
    const hairPath = (dy) => {
      ctx.beginPath();
      ctx.moveTo(-19, -19 + dy);
      ctx.lineTo(2, -29.5 + f1 * 0.6 + dy);
      ctx.lineTo(-10, -18.5 + dy);
      ctx.lineTo(12, -26.5 + f2 + dy);
      ctx.stroke();
    };
    ctx.strokeStyle = 'rgba(165,170,190,.55)'; ctx.lineWidth = 5.4;
    hairPath(1.4);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.6;
    hairPath(0);
    ctx.strokeStyle = 'rgba(165,170,190,.5)'; ctx.lineWidth = 4.6;
    ctx.beginPath(); ctx.moveTo(-14, -25.8); ctx.lineTo(6, -30.8 + f1); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.8;
    ctx.beginPath(); ctx.moveTo(-14, -27); ctx.lineTo(6, -32 + f1); ctx.stroke();
  }

  if (ch.id === 'ninja') {
    ctx.fillStyle = '#c4372e';
    roundRect(-30, -12, 60, 11.5, 5.5); ctx.fill();
    ctx.fillStyle = '#e0453a';
    roundRect(-30, -12, 60, 6.2, 4); ctx.fill();
    ctx.fillStyle = '#c4372e';
    ctx.beginPath();
    ctx.moveTo(-30, -6.5); ctx.lineTo(-49, 2); ctx.lineTo(-45, 9.5); ctx.lineTo(-29, 0.5);
    ctx.closePath(); ctx.fill();
  } else if (ch.id === 'angel') {
    ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
  }

  // ตาแก้วใส
  const eye = (ex, ey, r) => {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(ex, ey, r + 2.4, r * 1.12 + 2.4, 0, 0, TAU); ctx.fill();
    const ig = ctx.createRadialGradient(ex - r * 0.35, ey - r * 0.4, r * 0.1, ex, ey, r * 1.05);
    ig.addColorStop(0, '#7ecdff');
    ig.addColorStop(0.5, EYE);
    ig.addColorStop(1, shade(EYE, -75));
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.ellipse(ex, ey, r, r * 1.12, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(ex, ey, r, r * 1.12, 0, 0, TAU); ctx.stroke();
  };
  eye(3.5, -1.5, 5.2);
  eye(20.5, -1.5, 4.8);
  // คิ้วไอซิ่งขาว
  ctx.strokeStyle = 'rgba(165,170,190,.5)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-4.5, -11.3); ctx.lineTo(8, -7.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16.5, -7.3); ctx.lineTo(28.5, -10.8); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.2;
  ctx.beginPath(); ctx.moveTo(-4.5, -12.5); ctx.lineTo(8, -8.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16.5, -8.5); ctx.lineTo(28.5, -12); ctx.stroke();
  // ยิ้มแดงเคลือบเงา
  ctx.strokeStyle = shade('#d5342b', -35); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(2, 10.2); ctx.quadraticCurveTo(12, 16.2, 22, 9.7); ctx.stroke();
  ctx.strokeStyle = '#e23324'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(2, 9.5); ctx.quadraticCurveTo(12, 15.5, 22, 9); ctx.stroke();
  ctx.strokeStyle = RIM; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(1, 7); ctx.quadraticCurveTo(0.2, 9.2, 1.8, 10.5); ctx.stroke();
  if (ch.id === 'berry') {
    ctx.fillStyle = ch.cheek;
    ctx.beginPath(); ctx.ellipse(-8.5, 8, 5, 3.6, 0.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(27, 8, 4.2, 3.2, -0.1, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* --- ไม้เท้าลูกกวาด --- */
  if (ch.id === 'brave') {
    ctx.save();
    const cq = Math.floor(((P.anim * 1.15 % TAU) + TAU) % TAU / TAU * 8) / 8 * TAU;
    ctx.translate(38, -54 + Math.sin(cq - 0.6) * 2.6);
    ctx.rotate(0.12 + Math.sin(cq - 0.6) * 0.1 + (P.onGround ? 0 : -0.14));
    const canePath = () => {
      ctx.beginPath();
      ctx.moveTo(0, 44);
      ctx.lineTo(0, -26);
      ctx.arc(9, -26, 9, Math.PI, Math.PI * 1.98, false);
    };
    ctx.strokeStyle = 'rgba(96,60,30,.6)'; ctx.lineWidth = 11;
    canePath(); ctx.stroke();
    ctx.strokeStyle = '#fdfaf4'; ctx.lineWidth = 8;
    canePath(); ctx.stroke();
    ctx.strokeStyle = '#e03028'; ctx.lineWidth = 8;
    ctx.setLineDash([9, 11.5]);
    ctx.lineDashOffset = -4;
    canePath(); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = B;
    ctx.beginPath(); ctx.arc(0, 14, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.arc(0, 14, 7, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* ---------- แสงรวมทั้งตัวพาสเดียว (source-atop = ลงเฉพาะเนื้อตัวละคร)
     นี่คือหัวใจความ "เนียน": ทั้งตัวรับแสงดวงเดียวกัน ไม่ใช่เฉดแยกชิ้น ---------- */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-atop';
  // แสงหลักบน-ซ้าย
  const lightX = (C_OX - 26) * CSS, lightY = (C_OY - 105) * CSS;
  const lg = ctx.createRadialGradient(lightX, lightY, 8 * CSS, lightX, lightY, 120 * CSS);
  lg.addColorStop(0, 'rgba(255,255,255,.34)');
  lg.addColorStop(0.45, 'rgba(255,255,255,.10)');
  lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, charCanvas.width, charCanvas.height);
  // เงาถ่วงล่าง-ขวา
  const dg = ctx.createLinearGradient(0, (C_OY - 130) * CSS, 30 * CSS, C_OY * CSS + 40 * CSS);
  dg.addColorStop(0, 'rgba(120,60,15,0)');
  dg.addColorStop(0.72, 'rgba(120,60,15,0)');
  dg.addColorStop(1, 'rgba(110,52,12,.24)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, charCanvas.width, charCanvas.height);
  // ประกายตา + แสงยิ้ม แต้มทับหลังผ่านแสง (ให้คมเสมอ)
  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(CSS, 0, 0, CSS, C_OX * CSS, C_OY * CSS);
  ctx.rotate(bodyTilt);
  ctx.save();
  ctx.translate(0, -86 + headBob);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(3.5 - 1.7, -1.5 - 2.4, 2.0, 1.5, -0.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20.5 - 1.6, -1.5 - 2.2, 1.85, 1.4, -0.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5 + 1.8, -1.5 + 2.4, 0.85, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(20.5 + 1.7, -1.5 + 2.2, 0.8, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(5, 10.6); ctx.quadraticCurveTo(12, 13.6, 19, 10.2); ctx.stroke();
  ctx.restore();

  /* ---------- แปะกลับลงฉากหลัก ---------- */
  ctx = main;
  ctx.drawImage(charCanvas, -C_OX, -C_OY, 200, 190);
}


function drawCookieRun(t, ch) {
  t *= 1.15;
  /* จังหวะแบบสไปรต์เกมจริง: ล็อกท่าเป็นสเต็ป 8 เฟรมต่อรอบ (~12fps)
     ทำให้ท่า "คม" เป็นเฟรม ๆ ไม่ใช่ tween ลื่น ๆ */
  const STEPS = 8;
  const tq = Math.floor(((t % TAU) + TAU) % TAU / TAU * STEPS) / STEPS * TAU;
  const s = Math.sin(tq), c = Math.cos(tq);
  const sB = Math.sin(tq + Math.PI);
  /* squash & stretch ในวงจรวิ่ง: หดตอนเท้ากระแทกพื้น ยืดตอนถีบตัวลอย */
  const sy = 1 - 0.06 * Math.cos(tq * 2 + 0.5);
  ctx.save();
  ctx.translate(0, -Math.abs(c) * 3.4);          // ตัวเด้งตามก้าว
  ctx.scale(2 - sy, sy);                          // ยืด-หดรักษาปริมาตร (จุดหมุนที่เท้า)
  /* ท่าควบแบบต้นฉบับ: สวิงหน้าแรงกว่าหลัง + เข่าพับสูงตอนตวัดขากลับ */
  const hipA = s < 0 ? s * 1.3 : s * 0.95;
  const hipB = sB < 0 ? sB * 1.3 : sB * 0.95;
  const kneeA = 0.1 + Math.pow(Math.max(0, Math.sin(tq - 0.7)), 1.3) * 1.55;
  const kneeB = 0.1 + Math.pow(Math.max(0, Math.sin(tq + Math.PI - 0.7)), 1.3) * 1.55;
  cookieBody(
    0.21 + Math.sin(tq * 2) * 0.03,               // เอนหน้ามากขึ้นแบบวิ่งหนี
    hipA, hipB,
    2.45 + sB * 1.0, 2.45 + s * 1.0,              // แขนปั๊มกว้างขึ้น
    Math.abs(c) * -2.6,
    ch,
    { kA: kneeA, kB: kneeB, eA: 0.72 + sB * 0.35, eB: 0.72 + s * 0.35 }
  );
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap='round';
  for (let i = 0; i < 3; i++) {
    const yy = -30 - i * 18, ln = 14 + ((t * 7 + i * 2) % 3) * 5;
    ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
  }
}
function drawCookieJump(second) {
  if (second) {
    // ตีลังกาม้วนตัว — หมุนทีละสเต็ป 10 เฟรมแบบสไปรต์
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(Math.floor((P.anim * 1.8 % TAU) / (TAU / 10)) * (TAU / 10));
    ctx.translate(0, 40);
    cookieBody(0, 1.15, -0.7, 2.5, 3.2, 0, undefined,
      { kA: 1.5, kB: 1.35, eA: 1.25, eB: 1.2 });
    ctx.restore();
  } else if (P.vy < 0) {
    // พุ่งขึ้น: เข่าหน้ายกพับ ขาหลังเหยียดถีบ แขนสะบัดขึ้น
    cookieBody(0.17, -0.75, 1.05, 1.9, 3.55, 1,
      undefined,
      { kA: 1.35, kB: 0.25, eA: 0.9, eB: 0.35 });
  } else {
    // ร่วงลง: ขาถ่างเตรียมรับพื้น แขนกางทรงตัว
    cookieBody(0.1, 0.55, -0.8, 2.15, 3.35, -1,
      undefined,
      { kA: 0.5, kB: 0.75, eA: 0.45, eB: 0.6 });
  }
}
function drawCookieSlide(t) {
  // สไลด์เท้านำ ตัวเอนราบ แขนหลังกวาดพื้น
  ctx.save();

}

/* ---------- particles & floaters ---------- */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      ctx.fillRect(-p.r, -p.r/3, p.r*2, p.r/1.5);
      ctx.fillRect(-p.r/3, -p.r, p.r/1.5, p.r*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / 1.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `bold ${f.big ? 24 : 17}px Trebuchet MS`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawBtn(x, y, w, h, label, cb, opt = {}) {
  uiButtons.push({ x, y, w, h, cb, disabled: opt.disabled });
  const base = opt.disabled ? '#8a8178' : (opt.color || '#ff8b3d');
  const dark = opt.disabled ? '#6e675f' : (opt.dark || '#d96a1e');
  // เงา
  ctx.fillStyle = 'rgba(60,25,0,.4)';
  roundRect(x, y + 4, w, h, h / 2.4); ctx.fill();
  // ปุ่ม
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, base); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(x, y, w, h, h / 2.4); ctx.fill();
  // ไฮไลต์บน
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(x + 6, y + 4, w - 12, h * 0.32, h * 0.16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, h / 2.4); ctx.stroke();

}

/* ---------- HUD ---------- */
function drawHUD() {
  const bx = 24, by = 20, bw = 330, bh = 26;
  ctx.fillStyle = 'rgba(60,30,0,.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 14); ctx.fill();
  const hpFrac = G.hp / G.hpMax;
  const hpC = hpFrac > 0.5 ? '#7bd94a' : hpFrac > 0.25 ? '#ffce2e' : '#ff5f5f';
  ctx.fillStyle = '#3d2410';
  roundRect(bx, by, bw, bh, 11); ctx.fill();
  if (hpFrac > 0.01) {
    ctx.fillStyle = hpC;
    roundRect(bx, by, Math.max(14, bw * hpFrac), bh, 11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(bx + 3, by + 3, Math.max(8, bw * hpFrac - 6), 8, 5); ctx.fill();
  }

  // หน้าคุกกี้ที่หัวแถบพลัง
  ctx.save();
  ctx.translate(bx + 2, by + bh / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().body;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().icing;
  ctx.beginPath(); ctx.arc(0, -3, 18, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(10, -15, 4, -9);
  ctx.quadraticCurveTo(0, -16, -4, -9);
  ctx.quadraticCurveTo(-8, -16, -12, -7);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.ellipse(-4, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a28'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(1, 6, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  if (hpFrac < 0.25 && Math.floor(G.time * 3) % 2 === 0) {
    ctx.fillStyle = '#ff5f5f';
    ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'left';
    ctx.fillText('⚠ พลังใกล้หมด! เก็บยาเพิ่มพลัง!', bx + 10, by + bh + 22);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Trebuchet MS';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.8)';
  const sc = Math.floor(G.score).toLocaleString();
  ctx.strokeText(sc, W - 26, 46);
  ctx.fillStyle = '#fff';
  ctx.fillText(sc, W - 26, 46);
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.strokeStyle = 'rgba(60,30,0,.7)'; ctx.lineWidth = 3;
  const meta = `🏃 ${Math.floor(G.dist)} m    🍬 ${G.jellies}    🪙 ${G.coins}`;
  ctx.strokeText(meta, W - 26, 72);
  ctx.fillText(meta, W - 26, 72);
  // ชั้นหอคอย
  if (G.mode === 'tower') {
    ctx.textAlign = 'right';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,40,70,.8)';
    const ft = '🧊 ชั้น ' + G.floorNow + '  (' + Math.ceil(20 - G.floorT) + ' วิ)';
    ctx.strokeText(ft, W - 26, 118);
    ctx.fillStyle = '#aee4ff';
    ctx.fillText(ft, W - 26, 118);
  }
  // ความคืบหน้าตัวอักษร BONUSTIME
  if (G.bonusT <= 0 && G.mode === 'normal') {
    ctx.font = 'bold 15px Trebuchet MS';
    for (let i = 0; i < 9; i++) {
      const cx2 = W - 26 - (8 - i) * 15;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.7)';
      ctx.strokeText(BT_WORD[i], cx2, 94);
      ctx.fillStyle = i < G.btProgress ? '#ff9dd6' : 'rgba(255,255,255,.28)';
      ctx.fillText(BT_WORD[i], cx2, 94);
    }
  }

  if (G.combo >= 5) {
    ctx.textAlign = 'center';
    const pop = 1 + Math.max(0, 0.4 - G.comboTimer) * 0.6;
    ctx.save();
    ctx.translate(W / 2, 96);
    ctx.scale(pop, pop);
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText(G.combo + ' COMBO!', 0, 0);
    ctx.fillStyle = `hsl(${(G.combo * 14) % 360},90%,65%)`;
    ctx.fillText(G.combo + ' COMBO!', 0, 0);
    ctx.restore();
  }

  let iy = by + bh + (G.hp / G.hpMax < 0.25 ? 38 : 14) + 8;
  ctx.textAlign = 'left'; ctx.font = 'bold 15px Trebuchet MS';
  if (P.giantT > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🍭 ยักษ์: ' + P.giantT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (P.magnetT > 0) {
    ctx.fillStyle = '#7ecbff';
    ctx.fillText('🧲 แม่เหล็ก: ' + P.magnetT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.bonusT > 0) {
    ctx.fillStyle = '#ffe066';
    ctx.fillText('⭐ BONUS TIME: ' + G.bonusT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.revives > 0) {
    ctx.fillStyle = '#ffb0c8';
    ctx.fillText('💖 ชุบชีวิต x' + G.revives, bx, iy);
  }

  /* ปุ่มโปร่งแสง Jump / Slide มุมล่างจอ (แบบเกมจริง) */
  const bubbleBtn = (x, label, pressed) => {
    ctx.save();
    ctx.globalAlpha = pressed ? 0.5 : 0.24;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.fill();
    ctx.globalAlpha = pressed ? 0.95 : 0.5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, H - 72, 41, Math.PI * 1.12, Math.PI * 1.42); ctx.stroke();
    ctx.font = 'bold 21px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.55)';
    ctx.strokeText(label, x, H - 64);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, H - 64);
    ctx.restore();
  };
  bubbleBtn(82, 'Jump', !P.onGround);
  bubbleBtn(W - 82, 'Slide', P.sliding);

  // ปุ่มสกิลไม้ตายกลางล่าง (Magic Candy)
  {
    const sx = W / 2, sy = H - 66, r = 40;
    const ready = G.skill >= 100;
    ctx.save();
    ctx.globalAlpha = ready ? 0.95 : 0.55;
    ctx.fillStyle = 'rgba(50,25,5,.6)';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    // วงเกจชาร์จ
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = ready ? '#ffe066' : '#7ee0ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * (G.skill / 100)); ctx.stroke();
    // ไอคอนลูกกวาดสกิล
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍭', sx, sy + 1);
    ctx.textBaseline = 'alphabetic';
    if (ready) {
      const pul = 1 + Math.sin(G.time * 8) * 0.08;
      ctx.strokeStyle = `rgba(255,224,102,${0.5 + Math.sin(G.time * 8) * 0.3})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(sx, sy, r * pul + 4, 0, TAU); ctx.stroke();
      ctx.font = 'bold 14px Trebuchet MS';
      ctx.fillStyle = '#ffe066';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.8)';
      ctx.strokeText('สกิลพร้อม! (X)', sx, sy + r + 20);
      ctx.fillText('สกิลพร้อม! (X)', sx, sy + r + 20);
    }
    ctx.restore();
  }

  // ปุ่มพักเกมกลางบน
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(60,30,0,.5)';
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff';
  roundRect(W / 2 - 7, 22, 5, 16, 2); ctx.fill();
  roundRect(W / 2 + 2, 22, 5, 16, 2); ctx.fill();
  ctx.restore();

  // จอพักเกม
  if (G.paused) {

function drawBanner() {
  if (!G.banner || G.bannerT > 1.6) return;
  const a = G.bannerT < 0.25 ? G.bannerT / 0.25 : G.bannerT > 1.25 ? (1.6 - G.bannerT) / 0.35 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(G.banner.text, W / 2, 200);
  ctx.fillStyle = G.banner.color;
  ctx.fillText(G.banner.text, W / 2, 200);
  ctx.globalAlpha = 1;
}

function drawMenu() {

    [60, 260, 2, 1.6], [850, 330, 0, 1.7],
  ];
  decor.forEach(([dx, dy, kind, sc], i) => {
    ctx.save();
    ctx.translate(dx, dy + Math.sin(G.time * 1.4 + i * 1.7) * 8);
    ctx.rotate(Math.sin(G.time * 0.9 + i) * 0.25);
    ctx.scale(sc, sc);
    ctx.globalAlpha = 0.5;
    if (kind === 0) {           // เยลลี่แท่ง
      ctx.rotate(0.5);
      ctx.fillStyle = '#ffce2e'; roundRect(-13, -6.5, 26, 13, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(-10, -4.5, 10, 4, 2); ctx.fill();

      ctx.fillStyle = '#ff7bac'; heart(0, 0, 13); ctx.fill();
    } else {                    // ดาว
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = k % 2 === 0 ? 13 : 5.5;
        const a = -Math.PI / 2 + k * Math.PI / 5;
        k === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);

      ctx.closePath(); ctx.fill();

/* ---------- เตรียมพร้อมก่อนวิ่ง: เลือกบูสต์ใช้ครั้งเดียว ---------- */
function prepTotal() {
  return BOOSTS.reduce((s, b) => s + (G.boostSel[b.id] ? b.cost : 0), 0);
}
function prepGo() {
  const total = prepTotal();
  if (total > G.bank) { AudioSys.deny(); floatText(W / 2, 120, 'เหรียญไม่พอสำหรับบูสต์!', '#ff8888', true); return; }
  if (total > 0) { G.bank -= total; SAVE.set('coins', G.bank); AudioSys.buy(); }
  startGame('normal', Object.assign({}, G.boostSel));
}
function drawPrep() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';

      () => {
        if (!G.boostSel[b.id] && prepTotal() + b.cost > G.bank) { AudioSys.deny(); return; }
        G.boostSel[b.id] = !G.boostSel[b.id];
