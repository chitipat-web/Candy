function drawJellies() {
  for (const j of jellyList) {
    const x = j.x - worldX;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(G.time * 4 + j.t) * 4;
    const y = j.y + bob;
    ctx.save();
    ctx.translate(x, y);
    switch (j.type) {
      case 'bar': {
        // แสงเรืองนุ่ม ๆ ด้านหลัง
        ctx.fillStyle = 'rgba(255,220,90,.16)';
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        const w = 26, h = 13;
        ctx.fillStyle = '#e8a90c';
        roundRect(-w/2, -h/2, w, h, 6); ctx.fill();
        ctx.fillStyle = '#ffce2e';
        roundRect(-w/2, -h/2, w, h - 3.5, 6); ctx.fill();
        ctx.fillStyle = '#ffe883';
        roundRect(-w/2 + 1.5, -h/2 + 1.5, w - 3, 4.5, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        roundRect(-w/2+3, -h/2+2, w-16, 3.4, 2); ctx.fill();
        break;
      }
      case 'pink': {
        ctx.fillStyle = 'rgba(255,123,172,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0568c';
        heart(0, 1.8, 15); ctx.fill();
        ctx.fillStyle = '#ff7bac';
        heart(0, 0, 15); ctx.fill();
        ctx.fillStyle = '#ffa8ca';
        heart(-1, -2, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(-5, -6, 3.2, 0, TAU); ctx.fill();
        break;
      }
      case 'coin': {
        // เหรียญ 3 ระดับ: เงิน (s) / ทอง (g) / ทองใหญ่ (b) แบบเกมจริง
        const big = j.cv === 'b', gold = j.cv === 'g' || big;
        if (big) ctx.scale(1.5, 1.5);
        const rim = gold ? '#b8830a' : '#8a909c', body = gold ? '#e8a90c' : '#b8bec8', face = gold ? '#ffd84a' : '#e0e6ee';
        ctx.fillStyle = gold ? 'rgba(255,216,74,.2)' : 'rgba(220,228,240,.18)';
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
        ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(0, 1.6, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = face; ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.ellipse(-3.4, -4.2, 4.2, 2.4, -0.6, 0, TAU); ctx.fill();
        ctx.fillStyle = rim;
        ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('C', 0, 1);
        if (big) {   // ประกายรอบเหรียญใหญ่
          ctx.strokeStyle = 'rgba(255,240,160,.85)'; ctx.lineWidth = 1.6;
          for (let q = 0; q < 4; q++) {
            const a = G.time * 2 + q * TAU / 4;
            ctx.beginPath(); ctx.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
            ctx.lineTo(Math.cos(a) * 17.5, Math.sin(a) * 17.5); ctx.stroke();
          }
        }
        break;
      }
      case 'bear': {
        if (j.v === 'b') { ctx.scale(1.5, 1.5); drawBearJelly('#ffab2e'); }
        else drawBearJelly(j.v === 'p' ? '#ff8fc0' : '#ffab2e');
        break;
      }
      case 'potion': {
        ctx.fillStyle = '#e94f4f';
        ctx.beginPath(); ctx.arc(0, 3, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f9f4ea';
        ctx.fillRect(-5, -16, 10, 8);
        ctx.fillStyle = '#c9c2b4';
        ctx.fillRect(-6, -18, 12, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, 0, 12, 5); ctx.fillRect(-2.5, -3.5, 5, 12);
        itemBubble('#7bff9b');
        break;
      }
      case 'giant': {
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff9d2e';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G', 0, 1);
        itemBubble('#ffd24a');
        break;
      }
      case 'magnet': {
        ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, -2, 10, Math.PI, 0, false); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(10, 8); ctx.stroke();
        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-10, 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(10, 12); ctx.stroke();
        itemBubble('#7ecbff');
        break;
      }
      case 'letter': {
        // ลูกกวาดอักษร BONUSTIME
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.15);
        ctx.fillStyle = 'rgba(255,157,214,.25)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e5579a';
        roundRect(-13, -13, 26, 26, 8); ctx.fill();
        ctx.fillStyle = '#ff8fc0';
        roundRect(-13, -13, 26, 21, 8); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        roundRect(-10, -10, 20, 7, 4); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(j.ch, 0, 1.5);
        ctx.textBaseline = 'alphabetic';
        break;
      }
      case 'ingr': {
        // ถุงวัตถุดิบอบขนม
        ctx.rotate(Math.sin(G.time * 2.6 + j.t) * 0.12);
        ctx.fillStyle = 'rgba(255,233,184,.25)';
        ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
        ctx.fillStyle = INGRS[j.kind].c;
        roundRect(-12, -12, 24, 24, 9); ctx.fill();
        ctx.strokeStyle = 'rgba(90,52,19,.55)'; ctx.lineWidth = 2.4;
        roundRect(-12, -12, 24, 24, 9); ctx.stroke();
        ctx.font = '15px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(INGRS[j.kind].icon, 0, 1);
        ctx.textBaseline = 'alphabetic';
        break;
      }
      case 'confetti': {
        ctx.rotate(G.time * 4 + j.t);
        ctx.fillStyle = `hsl(${(j.t * 120) % 360},90%,65%)`;
        roundRect(-7, -4.5, 14, 9, 3.5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        roundRect(-5, -3, 6, 3, 1.5); ctx.fill();
        break;
      }
      case 'blast': {
        // เยลลี่จรวดพุ่ง
        ctx.rotate(-0.5);
        ctx.fillStyle = '#ff9d2e';
        roundRect(-6, -14, 12, 24, 6); ctx.fill();
        ctx.fillStyle = '#e0453a';
        ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(0, -22); ctx.lineTo(6, -12); ctx.fill();
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(0, 20 + Math.sin(G.time * 14) * 3); ctx.lineTo(5, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(0, -6, 3.4, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        itemBubble('#ff9d2e');
        break;
      }
      case 'box': {
        // กล่องปริศนา
        ctx.rotate(Math.sin(G.time * 2.5 + j.t) * 0.1);
        ctx.fillStyle = '#8a5a28';
        roundRect(-14, -11, 28, 24, 5); ctx.fill();
        ctx.fillStyle = '#a97b45';
        roundRect(-14, -11, 28, 9, 5); ctx.fill();
        ctx.fillStyle = '#e8b23c';
        ctx.fillRect(-3, -11, 6, 24);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 3);
        ctx.textBaseline = 'alphabetic';
        itemBubble('#e8b23c');
        break;
      }
      case 'star': {
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.25);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? 16 : 7;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.beginPath(); ctx.arc(-3, -4, 3, 0, TAU); ctx.fill();
        itemBubble('#ffe066');
        break;
      }
      case 'btjelly': {
        // เยลลี่ BONUS TIME สีรุ้งเรืองแสง
        ctx.rotate(Math.sin(G.time * 3.2 + j.t) * 0.18);
        const gl2 = 0.5 + Math.sin(G.time * 5 + j.t) * 0.3;
        ctx.fillStyle = `rgba(255,160,220,${gl2 * 0.45})`;
        ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
        const rg = ctx.createLinearGradient(-10, -10, 10, 10);
        rg.addColorStop(0, '#ff8ab0'); rg.addColorStop(0.5, '#ffd24a'); rg.addColorStop(1, '#7ec8ff');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 11, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.ellipse(-3.5, -4, 4, 2.6, -0.5, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Trebuchet MS';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('B!', 0, 1); ctx.textBaseline = 'alphabetic';
        itemBubble('#ff9dd6');
        break;
      }
      case 'powder': {
        // ✨ ผงเวทมนตร์ Magic Powder — ขวดผงเรืองแสงม่วง
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.16);
        const gl = 0.5 + Math.sin(G.time * 6 + j.t) * 0.3;
        ctx.fillStyle = `rgba(190,130,255,${gl * 0.5})`;
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        // ขวดแก้ว
        ctx.fillStyle = '#c79aff';
        roundRect(-8, -6, 16, 18, 5); ctx.fill();
        ctx.fillStyle = '#e8d4ff';
        roundRect(-8, -6, 16, 7, 5); ctx.fill();
        ctx.fillStyle = '#9a6ae0';
        ctx.fillRect(-5, -12, 10, 6);   // จุก
        // ประกายผง
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 3; i++) {
          const a = G.time * 3 + i * 2.1;
          ctx.beginPath(); ctx.arc(Math.cos(a) * 5, Math.sin(a) * 5 + 2, 1.6, 0, TAU); ctx.fill();
        }
        itemBubble('#b98aff');
        break;
      }
    }
    ctx.restore();
  }
}
/* ฟองแก้วครอบไอเทม (แบบเกมจริง) */
function itemBubble(c) {
  const bobA = Math.sin(G.time * 5) * 0.06;
  ctx.fillStyle = 'rgba(215,238,255,.14)';
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI * (1.12 + bobA), Math.PI * (1.42 + bobA)); ctx.stroke();
  ctx.strokeStyle = c; ctx.globalAlpha = 0.35 + Math.sin(G.time * 6) * 0.2;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function glowRing(c) {
  ctx.strokeStyle = c; ctx.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(G.time * 6) * 3, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBearJelly(c) {
  c = c || '#ffab2e';
  const hl = 'rgba(255,255,255,.55)';
  ctx.fillStyle = ballGrad(0, -4, 30, c);
  ctx.beginPath(); ctx.arc(-13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.fill();
  roundRect(-14, 2, 28, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 24, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(c, -48); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.stroke();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(-6, -13, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4a10';
  ctx.beginPath(); ctx.arc(-6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  glowRing(c);
}

/* ---------- obstacles ---------- */
/* ---- สิ่งกีดขวางหนามตามธีมด่าน (คงการชนเดิม กว้าง ~46 สูง ~46) ---- */
function drawSpikeSkin(epi) {
  if (epi === 'jungle') {
    // กอหนามเถาวัลย์เขียว
    for (let i = 0; i < 3; i++) {
      const bx = i * 16 - 2;
      ctx.fillStyle = i % 2 ? '#3f8a34' : '#57a542';
      ctx.beginPath(); ctx.moveTo(bx, 0);
      ctx.quadraticCurveTo(bx + 4, -30, bx + 8, -48 - (i === 1 ? 8 : 0));
      ctx.quadraticCurveTo(bx + 12, -30, bx + 16, 0); ctx.fill();
      ctx.strokeStyle = '#2e6a2a'; ctx.lineWidth = 1.6; ctx.stroke();
    }
    ctx.fillStyle = '#7bd94a';
    for (const [dx, dy] of [[6, -20], [22, -30], [38, -18]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 5, 3, 0.5, 0, TAU); ctx.fill(); }
  } else if (epi === 'dragon') {
    // ตอหินภูเขาไฟร้อนแดง
    for (let i = 0; i < 3; i++) {
      const bx = i * 16 - 2;
      ctx.fillStyle = i % 2 ? '#5a2a1e' : '#7a3a26';
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i === 1 ? 8 : 0)); ctx.lineTo(bx + 16, 0); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,120,40,' + (0.5 + Math.sin(G.time * 8) * 0.25) + ')';
    for (let i = 0; i < 3; i++) { const bx = i * 16 - 2;
      ctx.beginPath(); ctx.moveTo(bx + 5, -8); ctx.lineTo(bx + 8, -30); ctx.lineTo(bx + 11, -8); ctx.fill(); }
  } else if (epi === 'wizard') {
    // ผลึกเวทม่วงเรืองแสง
    for (let i = 0; i < 3; i++) {
      const bx = i * 16 - 2;
      ctx.fillStyle = i % 2 ? '#7a4ac0' : '#9a6ae0';
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 5, -20); ctx.lineTo(bx + 8, -48 - (i === 1 ? 8 : 0));
      ctx.lineTo(bx + 11, -20); ctx.lineTo(bx + 16, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(220,190,255,.7)';
      ctx.beginPath(); ctx.moveTo(bx + 6, -12); ctx.lineTo(bx + 8, -38); ctx.lineTo(bx + 9, -12); ctx.fill();
    }
  } else if (epi === 'dessert') {
    // แท่งลูกกวาดแท่งหนามชมพู-ขาว
    for (let i = 0; i < 3; i++) {
      const bx = i * 16 - 2;
      ctx.fillStyle = i % 2 ? '#ff7aa8' : '#ffffff';
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i === 1 ? 8 : 0)); ctx.lineTo(bx + 16, 0); ctx.fill();
      ctx.strokeStyle = i % 2 ? '#ffffff' : '#ff7aa8'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let yy = -6; yy > -42; yy -= 10) { ctx.beginPath(); ctx.moveTo(bx + 2, yy); ctx.lineTo(bx + 10, yy - 5); ctx.stroke(); }
    }
  } else {
    // ต้นฉบับ: หนามลูกกวาดชมพู
    for (let i = 0; i < 3; i++) {
      const bx = i * 16 - 2;
      ctx.fillStyle = i % 2 ? '#ff5f7e' : '#ff8fa8';
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i === 1 ? 8 : 0)); ctx.lineTo(bx + 16, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.moveTo(bx + 3, -6); ctx.lineTo(bx + 7, -32); ctx.lineTo(bx + 9, -6); ctx.fill();
    }
  }
}
/* ---- สิ่งกีดขวางก้อน (กระโดดข้าม) ตามธีมด่าน ---- */
function drawRockSkin(epi) {
  const body = (c1, c2, hi) => {
    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(6, -34); ctx.lineTo(22, -50); ctx.lineTo(42, -42);
    ctx.lineTo(56, -18); ctx.lineTo(54, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = c2; ctx.lineWidth = 2.5; ctx.stroke();
    if (hi) { ctx.fillStyle = hi;
      ctx.beginPath(); ctx.moveTo(8, -30); ctx.lineTo(22, -44); ctx.lineTo(36, -38); ctx.lineTo(30, -20); ctx.closePath(); ctx.fill(); }
  };
  if (epi === 'jungle') {
    body('#5a7a34', '#3a5220', '#7ba048');   // ตอไม้/พุ่มไม้
    ctx.fillStyle = '#8a5a35';
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(20, -18); ctx.lineTo(32, -18); ctx.lineTo(34, 0); ctx.fill();
  } else if (epi === 'dragon') {
    body('#5a2e22', '#331610', '#8a4a30');   // หินลาวา
    ctx.fillStyle = 'rgba(255,120,40,' + (0.4 + Math.sin(G.time * 6) * 0.2) + ')';
    for (const [dx, dy] of [[18, -30], [34, -24], [26, -14]])
      { ctx.beginPath(); ctx.arc(dx, dy, 3, 0, TAU); ctx.fill(); }
  } else if (epi === 'wizard') {
    body('#5a4a8a', '#33285e', '#7a6ab0');   // ก้อนหินเวท
    ctx.fillStyle = 'rgba(220,190,255,.7)';
    ctx.beginPath(); ctx.arc(28, -34, 5, 0, TAU); ctx.fill();
  } else if (epi === 'dessert') {
    // โดนัทเคลือบ
    ctx.fillStyle = '#b06a3a';
    ctx.beginPath(); ctx.ellipse(28, -24, 28, 22, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2a8cc';
    ctx.beginPath(); ctx.ellipse(28, -30, 28, 20, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a95637';
    ctx.beginPath(); ctx.arc(28, -22, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7ecbff';
    for (const [dx, dy] of [[14, -38], [30, -44], [42, -34], [20, -26]])
      { ctx.save(); ctx.translate(dx, dy); ctx.rotate(dx); ctx.fillRect(-3, -1.3, 6, 2.6); ctx.restore(); }
  } else {
    body('#6b4226', '#40230f', '#8a5a35');
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(24, -40, 4, 0, TAU); ctx.fill();
  }
}
function drawObstacles() {
  const epi = G.mode === 'normal' ? EP().id : (G.mode === 'tower' ? 'tower' : 'oven');
  // 🏁 เส้นชัยโหมดผจญภัย
  if (G.mode === 'story' && G.goal > 0) {
    const fx = G.goal * 40 - worldX;
    if (fx > -60 && fx < W + 120) {
      ctx.save(); ctx.translate(fx, 0);
      // เสาธง
      ctx.fillStyle = '#e8e0d0';
      ctx.fillRect(-4, 60, 8, GROUND_Y - 60);
      ctx.fillRect(120 - 4, 60, 8, GROUND_Y - 60);
      // คานบน + ธงสามเหลี่ยม
      ctx.fillStyle = '#c8342a';
      ctx.fillRect(-6, 52, 132, 16);
      // ลายตาราง
      for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) {
        ctx.fillStyle = (r + c) % 2 ? '#2e2620' : '#f4f0e6';
        ctx.fillRect(c * 16, 74 + r * 16, 16, 16);
      }
      ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 18px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('🏁 FINISH', 60, 44);
      ctx.restore();
    }
  }
  for (const o of obstacles) {
    const x = o.x - worldX;
    if (x < -140 || x > W + 60) continue;
    ctx.save();
    ctx.translate(x, GROUND_Y);
    if (o.type === 'spike') {
      drawSpikeSkin(epi);
    } else if (o.type === 'rock') {
      drawRockSkin(epi);
    } else if (o.type === 'bar') {
      const y = -62;
      ctx.fillStyle = '#f6e7d0';
      roundRect(0, -H, 14, H + y, 6); ctx.fill();
      roundRect(96, -H, 14, H + y, 6); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -H, 14, H + y); ctx.rect(96, -H, 14, H + y); ctx.clip();
      ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 7;
      for (let yy = -H; yy < y + 20; yy += 20) {
        ctx.beginPath(); ctx.moveTo(-8, yy); ctx.lineTo(24, yy + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(88, yy); ctx.lineTo(120, yy + 20); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = '#b0793f';
      roundRect(-8, y - 26, 126, 26, 8); ctx.fill();
      ctx.fillStyle = '#8a5a28';
      roundRect(-8, y - 26, 126, 10, 5); ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('▼ SLIDE ▼', 55, y - 34);
    }
    ctx.restore();
  }
}

/* ---------- player ---------- */
function drawPlayer() {
  if (P.fallingPit && P.y > H) return;
  const scale = P.giantT > 0 ? 1.6 : 1;
  const blink = P.invT > 0 && Math.floor(G.time * 14) % 2 === 0;
  if (blink) return;

  ctx.save();
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  ctx.translate(P.x + P.w * scale / 2, P.y + ph);

  if (!P.fallingPit) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const shY = GROUND_Y - (P.y + ph);
    ctx.beginPath();
    ctx.ellipse(0, shY + 6, 30 * scale * (1 - clamp(shY/300,0,0.5)), 8 * scale, 0, 0, TAU);
    ctx.fill();
  }

  ctx.scale(scale, scale);
  // squash & stretch (จุดหมุนอยู่ที่เท้า)
  if (Math.abs(P.squash) > 0.01 && !P.sliding)
    ctx.scale(1 + P.squash * 0.45, 1 - P.squash * 0.4);
  // ท่าร่ายสกิล: ยืดตัวสูง + เอนหลังแวบหนึ่ง (แบบเกมจริง)
  if (P.castT > 0 && !P.sliding && !P.dead) {
    const cp = P.castT / 0.42;
    ctx.scale(1 - cp * 0.12, 1 + cp * 0.20);
    ctx.rotate(-cp * 0.13);
  }
  if (P.giantT > 0 && P.giantT < 1.2 && Math.floor(G.time * 10) % 2 === 0)
    ctx.globalAlpha = 0.6;

  // ร่างแปลงจริงแบบเกมต้นฉบับ (ค้างคาว/หมาป่า/ร่างไฟ/เก้าหาง)
  const formId = CHARS[G.charIdx] && CHARS[G.charIdx].id;
  if (G.formT > 0 && FORM_DRAW[formId]) {
    FORM_DRAW[formId](P.anim);
    ctx.restore();
    return;
  }
  if (G.formT > 0 && FORM_UNDER[formId]) FORM_UNDER[formId](P.anim);

  if (P.boostT > 0 || G.bonusT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(G.time * 12) * 0.15;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.ellipse(-6, -P.h / 2, 46, 52, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,60,.65)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = -14 - i * 16, ln = 30 + ((P.anim * 9 + i * 3) % 4) * 10;
      ctx.beginPath(); ctx.moveTo(-32, yy); ctx.lineTo(-32 - ln, yy); ctx.stroke();
    }
  }

  if (G.bonusT > 0 && !P.dead)
    ctx.rotate(clamp(P.vy * 0.0007, -0.32, 0.32));   // เอียงหัวตามทิศบิน

  const run = P.anim;
  // 👻 afterimage เงาซ้อนตอนพุ่งเร็ว (dash/boost/ยักษ์/ร่างแปลง) — เบลอการเคลื่อนไหว
  if (!P.dead && !P.fallingPit && (P.boostT > 0 || G.scoreMulT > 0 || P.giantT > 0 || G.bonusT > 0)) {
    for (let i = 1; i <= 2; i++) {
      ctx.save();
      ctx.globalAlpha = 0.15 * (3 - i);
      ctx.translate(-i * 15, 0);
      if (P.sliding) drawCookieSlide(run);
      else if (!P.onGround) drawCookieJump(P.jumps >= 2);
      else drawCookieRun(run);
      ctx.restore();
    }
  }
  if (P.dead) {
    // ล้มคว่ำหมุนตัวตอนพลังหมด (แบบเกมจริง)
    const t = clamp(G.overT * 1.5, 0, 1);
    ctx.translate(0, -Math.sin(Math.min(t, 1) * Math.PI) * 26);
    ctx.rotate(Math.min(t * 2.4, Math.PI / 2));
    cookieBody(0, 0.8, -0.5, 3.3, 2.3, 0);
  } else {
    if (P.stumbleT > 0)
      ctx.rotate(Math.sin(G.time * 36) * 0.14 * (P.stumbleT / 0.5));
    if (P.sliding) drawCookieSlide(run);
    else if (!P.onGround) drawCookieJump(P.jumps >= 2);
    else drawCookieRun(run);
  }

  if (P.magnetT > 0) {
    ctx.strokeStyle = 'rgba(126,203,255,.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -G.time * 60;
    ctx.beginPath(); ctx.arc(0, -P.h/2, 66, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ============================================================
   ตัวละครแบบภาพวาด 2D — เฉดแสงเงา พื้นผิว เครื่องแต่งกาย
   (จุดกำเนิด = กึ่งกลางเท้า) — ch = ตัวละคร
   ============================================================ */
function ballGrad(x, y, r, c) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.12, x, y, r);
  g.addColorStop(0, shade(c, 40));
  g.addColorStop(0.55, c);
  g.addColorStop(1, shade(c, -26));
  return g;
}

/* ============================================================
   ระบบตกแต่งตัวละคร: ผม/หมวก/หน้า/ลำตัว/ของถือ ใช้ร่วมกันทุกคุกกี้
   ============================================================ */

function cookieBody(bodyTilt, legA, legB, armA, armB, headBob, ch, joints) {
  ch = ch || CH();
  joints = joints || {};
  const kA = joints.kA !== undefined ? joints.kA : 0.14;
  const kB = joints.kB !== undefined ? joints.kB : 0.14;
  const eA = joints.eA !== undefined ? joints.eA : 0.5;
  const eB = joints.eB !== undefined ? joints.eB : 0.5;
  const B = ch.body, ICING = ch.icing;
  const RIM = shade(B, -80);
  const EYE = ch.eye || '#2b8fd6';
  /* สีชุดสำหรับแขน-ขา: ดึงจากชุดที่ใส่ → ใส่เสื้อผ้าจริงทั้งตัวทุกท่า (แบบสไปรต์ทางการ) */
  const ds0 = decosOf(ch) || [];
  const pickC = (...names) => { for (const n of names) { const f = ds0.find(q => q.p === n); if (f) return f.c; } return null; };
  const SLV = pickC('sleeves', 'suit', 'robe', 'armor', 'dress');
  const LEGC = pickC('pants', 'suit', 'robe', 'overalls');
  const SHOEST = ds0.find(q => q.p === 'bootfeet' || q.p === 'sneakfeet' || q.p === 'flamefeet') || null;
  const SHOE = pickC('shoes', 'boots', 'bootfeet', 'sneakfeet', 'flamefeet') || (LEGC ? dk(LEGC, 0.72) : null);
  const GLOVE = pickC('gloves');
  const CUFF = pickC('cuffs') || (SLV ? dk(SLV, 0.76) : null);
  // ความเรียวแขนขา ตั้งจากผลวัดสไปรต์ทางการรายตัว: stub ป้อม / slim เรียว / xslim เรียวพิเศษ

  const main = ctx;
  ctx = charCtx;

     แขน = ปีกป้อมเรียวสั้น · ขา = ตอสั้น · ตัวทรงลูกแพร์ · หัวโตครึ่งตัว
     วาดสองพาส (ขอบ→เนื้อ) ให้หลอมเป็นก้อนเดียว ขอบเส้นเดียวรอบตัว */
  const drawParts = (mode) => {

      ctx.translate(0, 9);
      ctx.rotate(knee * 0.75);
      segP(9, 12.5 * LW);
      const fxq = FRONT ? 0 : 2;
      if (mode === 'fill' && SHOE) ctx.fillStyle = SHOE;
      if (mode === 'fill') AUTOL = true;   // เท้า/รองเท้ามีเส้นขอบของตัวเอง

  ctx.fillStyle = B; // กลบส่วนกลางให้เหลือเป็นแถบโค้งบน
  ctx.beginPath(); ctx.ellipse(-1, -11, 24.5, 13, 0.08, 0, TAU); ctx.fill();

    for (const [sx, sy, a] of [[-17, -19, 0.5], [-2, -25, 0], [13, -18, -0.4], [-9, -13, 0.3], [7, -12, -0.2]])

    /* ปอยผมหวัดขาวหนาแบบต้นฉบับ: ซิกแซกใหญ่มุมบนซ้าย + ปลายพลิ้ว */
    const qf = Math.floor(G.time * 12) / 12;
    const f1 = Math.sin(qf * 9) * 1.4, f2 = Math.sin(qf * 9 + 1.3) * 1.8;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.4;

  }

  if (ch.id === 'ninja') {
    // ผ้าคาดหน้าผากสีน้ำเงินเข้มกลืนหน้ากาก (สไปรต์จริงเปิดแค่ช่องตา)
    ctx.fillStyle = '#1e3270';
    roundRect(-30.5, -12, 61, 11.5, 5.5); ctx.fill();
    ctx.fillStyle = '#28418c';
    roundRect(-30.5, -12, 61, 6.2, 4); ctx.fill();
    ctx.fillStyle = '#1e3270';
    ctx.beginPath();
    ctx.moveTo(-30, -6.5); ctx.lineTo(-49, 2); ctx.lineTo(-45, 9.5); ctx.lineTo(-29, 0.5);
    ctx.closePath(); ctx.fill();
    // ผ้าปิดจมูก-ปาก (เลื่อนตามหน้าตอนหันตรง)
    ctx.fillStyle = '#28418c';
    ctx.beginPath(); ctx.arc(FRONT ? 0.5 : 11.5, 8, 21, Math.PI * 0.06, Math.PI * 0.94); ctx.closePath(); ctx.fill();
  } else if (ch.id === 'angel') {
    ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
  }

  if (FRONT) ctx.translate(-11.5, 0);   // หันหน้าตรง: เลื่อนตา-ปากมากึ่งกลางหัว
  const eyeStyle = ch.deco ? (ch.eyeS || 'round') : (ch.eyeS === 'round' ? 'round' : 'fierce');
  if (eyeStyle === 'fierce') {
  /* --- คิ้วขาวหนาเฉียง + ตาครึ่งวงฟ้า "มุ่งมั่น" (แบบสไปรต์เป๊ะ) --- */
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6.5, -8.5); ctx.lineTo(7.5, -4.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15.5, -4.2); ctx.lineTo(29, -8.2); ctx.stroke();
  // ตา: ครึ่งวงล่างสีฟ้า ขอบตัดตรงบนชนคิ้ว
  const eye = (ex, ey, r, tilt) => {
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(tilt);
    ctx.fillStyle = EYE;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-r * 0.4, r * 0.28, r * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
  };
  eye(1.5, -2.6, 6.2, 0.3);
  eye(21.5, -2.6, 5.8, -0.28);
  } else if (eyeStyle === 'round') {
    /* ตากลมโตแบบคลาสสิก: วงรีตั้ง + ประกายคู่ + ขนตาสำหรับสาว ๆ */
    const lash = LASH_IDS.includes(ch.id);
    /* เรขาคณิตตาตามสไปรต์จริง: ตาห่างกว้าง อยู่ค่อนล่างของหัว
       รูม่านตาดำกินเกือบเต็มดวง + ประกาย 2 เม็ด ไม่มีเปลือกตาหนา */
    for (const [ex, r] of [[-2, 8.4], [25, 7.9]]) {
      ctx.fillStyle = RIM;
      ctx.beginPath(); ctx.ellipse(ex, -1, r + 1.3, r + 2.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = EYE;
      ctx.beginPath(); ctx.ellipse(ex, -1, r, r + 1.1, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#241a10';
      ctx.beginPath(); ctx.ellipse(ex + 0.6, 0, r * 0.78, r * 0.86, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.97)';
      ctx.beginPath(); ctx.arc(ex - r * 0.32, -4.6, r * 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(ex + r * 0.34, 3.2, r * 0.18, 0, TAU); ctx.fill();
      if (lash) {
        ctx.strokeStyle = RIM; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
        const sgn = ex < 10 ? -1 : 1;
        for (const [aa, ll] of [[-1.15, 4.2], [-0.75, 3.6], [-0.35, 3]]) {
          const bx2 = ex + Math.cos(aa) * (r + 1.2) * sgn, by2 = -3 + Math.sin(aa) * (r + 2.4);
          ctx.beginPath(); ctx.moveTo(bx2, by2);
          ctx.lineTo(bx2 + Math.cos(aa - 0.3) * ll * sgn, by2 + Math.sin(aa - 0.3) * ll);
          ctx.stroke();
        }
      }
    }
    // แก้มแดงนุ่มเป็นค่าเริ่มต้นของสายน่ารัก (ถ้าไม่มีแก้มเฉพาะตัวอยู่แล้ว)
    if (lash && !ds0.some(q => q.p === 'blushdot' || q.p === 'heartcheek' || q.p === 'flamecheek')) {
      ctx.fillStyle = 'rgba(255,120,130,.26)';
      ctx.beginPath(); ctx.ellipse(-11, 8.6, 4.6, 3.1, 0.1, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(34, 8.6, 4.4, 3, -0.1, 0, TAU); ctx.fill();
    }
  } else if (eyeStyle === 'sharp') {
    /* ตาเรียวเฉียบ */
    for (const [ex, tilt] of [[-2, 0.18], [25, -0.18]]) {
      ctx.save(); ctx.translate(ex, -3); ctx.rotate(tilt);
      ctx.fillStyle = RIM;
      ctx.beginPath(); ctx.ellipse(0, 0, 7.4, 4.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = EYE;
      ctx.beginPath(); ctx.ellipse(0, 0.4, 6, 3.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a1e14';
      ctx.beginPath(); ctx.arc(1, 0.4, 2, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = RIM; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - 7, -9.5); ctx.lineTo(ex + 6, -7); ctx.stroke();
    }
  } else {
    /* happy: ตาหลับยิ้ม */
    ctx.strokeStyle = RIM; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-2, 0, 6.4, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(25, 0, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  if (ch.id === 'ninja') {
    /* นินจาปิดหน้า — ไม่วาดปาก (ตามสไปรต์จริง) */
  } else if (eyeStyle === 'fierce') {
  /* --- ยิ้มเจ้าเล่ห์แดงหนา + ติ่งมุมปาก + จุดแก้ม --- */
  ctx.strokeStyle = '#d5342b'; ctx.lineWidth = 4.6;
  ctx.beginPath();
  ctx.moveTo(0.5, 10);
  ctx.quadraticCurveTo(11, 15.8, 21.5, 9.2);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-1.2, 8.6, 1.8, Math.PI * 0.35, Math.PI * 1.35); ctx.stroke();
  // ติ่งมุมปากเข้ม + ไฝจุดเล็ก
  ctx.fillStyle = RIM;
  ctx.beginPath(); ctx.ellipse(-8.5, 5.2, 1.5, 2.1, 0.5, 0, TAU); ctx.fill();
  } else {
    /* ยิ้มเรียบง่ายแบบสไปรต์คลาสสิก (เล็กลง อยู่ต่ำลง ตามต้นฉบับ) */
    ctx.strokeStyle = '#d5342b'; ctx.lineWidth = 3.8;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(11.5, 8, 6, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }
  if (ch.id === 'berry') {
    ctx.fillStyle = ch.cheek;
    ctx.beginPath(); ctx.ellipse(-8.5, 8, 5, 3.6, 0.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(27, 8, 4.2, 3.2, -0.1, 0, TAU); ctx.fill();
  }
  // หัวสติกเกอร์รูปจริง (ตัวละครเพื่อน): วาดท้ายสุด คลิปวงกลม ทับหน้า-ผมทั้งหมด
  {
    const ph = PHOTO_IMGS[ch.id];
    if (ph && ph.complete && ph.naturalWidth) {
      const R = 33, cxp = 11.5, cyp = -4;
      ctx.save();
      ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, TAU); ctx.clip();
      // รองพื้นสีแป้งคุกกี้ (ปิดตา-ปากการ์ตูนข้างใต้ + กลืนกับตัว)
      ctx.fillStyle = ch.body || '#d9a05e';
      ctx.fillRect(cxp - R, cyp - R, R * 2, R * 2);
      const g0 = ctx.createRadialGradient(cxp, cyp - R * 0.4, 4, cxp, cyp, R * 1.1);
      g0.addColorStop(0, 'rgba(255,240,215,.5)'); g0.addColorStop(1, 'rgba(120,70,30,.18)');
      ctx.fillStyle = g0;
      ctx.fillRect(cxp - R, cyp - R, R * 2, R * 2);
      // วาดรูปแบบ cover ให้เต็มวงพอดี (รูปผ่านการลบพื้น+ครอปหน้ามาแล้ว)
      const prevSm = ctx.imageSmoothingQuality;
      ctx.imageSmoothingQuality = 'high';
      const asp = ph.naturalWidth / ph.naturalHeight, cover = R * 2.06;
      let ww, hh;
      if (asp >= 1) { hh = cover; ww = cover * asp; } else { ww = cover; hh = cover / asp; }
      ctx.drawImage(ph, cxp - ww / 2, cyp - hh / 2 + 1.5, ww, hh);
      ctx.imageSmoothingQuality = prevSm;
      ctx.restore();
      // ขอบสติกเกอร์ขาว + เส้นขอบโทนคุกกี้
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.arc(cxp, cyp, R - 1, 0, TAU); ctx.stroke();
      ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(122,74,36,.9)';
      ctx.beginPath(); ctx.arc(cxp, cyp, R + 0.9, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();

  /* --- สตรอว์เบอร์รีคู่ใจ (เฉพาะคุกกี้สตรอว์เบอร์รี) --- */
  if (ch.id === 'berry') {
    ctx.save();
    ctx.translate(30, -32);
    ctx.rotate(0.15);
    ctx.fillStyle = '#e8506e';
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.quadraticCurveTo(11, -7, 10, 2);
    ctx.quadraticCurveTo(8, 11, 0, 13);
    ctx.quadraticCurveTo(-8, 11, -10, 2);
    ctx.quadraticCurveTo(-11, -7, 0, -9);
    ctx.fill();
    ctx.fillStyle = '#3f8a4a';
    for (const aa of [-0.7, 0, 0.7]) {
      ctx.save(); ctx.rotate(aa);
      ctx.beginPath(); ctx.ellipse(0, -10, 3, 5, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,244,220,.95)';
    for (const [dx, dy] of [[-4, 0], [4, -1], [0, 6], [-2, -5], [5, 5]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 1.1, 1.7, 0.3, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  /* --- ไม้เท้าลูกกวาด: ลายแดงเฉียงแบบสไปรต์ --- */
  if (ch.id === 'brave') {
    ctx.save();
    const cn = joints.cane;   // ท่ายืน: ถือไม้เท้าด้วยแขนที่เหยียดออก (ตำแหน่งกำหนดเอง)
    let botY = 42;
    if (cn) {
      ctx.translate(cn.x, cn.y);
      ctx.rotate(cn.rot || 0);
      if (cn.flip) ctx.scale(-1, 1);
      botY = cn.len || 42;
    } else {
      // ถือด้วยมือหลัง ปลายไม้ลากไปข้างหลังแบบท่าวิ่งต้นฉบับ
      const cq = Math.floor(((P.anim * 1.15 % TAU) + TAU) % TAU / TAU * 8) / 8 * TAU;
      ctx.translate(-30 + Math.sin(cq - 0.6) * 1.6, -48 + Math.sin(cq - 0.6) * 2.4);
      ctx.rotate(0.35 + Math.sin(cq - 0.6) * 0.07 + (P.onGround ? 0 : -0.12));
      ctx.scale(-1, 1);
    }
    const hookPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.arc(9, -20, 9, Math.PI, Math.PI * 1.98, false);
    };
    // ขอบ
    ctx.lineCap = 'round';
    ctx.strokeStyle = RIM; ctx.lineWidth = 11.2;
    ctx.beginPath(); ctx.moveTo(0, botY); ctx.lineTo(0, -20); ctx.stroke();
    hookPath(); ctx.stroke();
    // เนื้อขาว
    ctx.strokeStyle = '#fdfaf4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, botY); ctx.lineTo(0, -20); ctx.stroke();
    hookPath(); ctx.stroke();
    // ลายแดงเฉียงบนแท่ง (ขาวเป็นพื้น แดงเป็นแถบพาดตามภาพต้นฉบับ)
    ctx.strokeStyle = '#e03028'; ctx.lineWidth = 6; ctx.lineCap = 'butt';
    for (let yy = botY - 6; yy > -18; yy -= 13) {
      ctx.beginPath(); ctx.moveTo(-4.1, yy + 3.4); ctx.lineTo(4.1, yy - 3.4); ctx.stroke();
    }
    // แต้มแดงบนตะขอ
    ctx.lineCap = 'butt'; ctx.lineWidth = 6;
    for (const [a1, a2] of [[1.08, 1.24], [1.44, 1.6], [1.78, 1.92]]) {
      ctx.beginPath(); ctx.arc(9, -20, 9, Math.PI * a1, Math.PI * a2); ctx.stroke();
    }
    // มือกำ (สีเนื้อกลืนแขน)
    ctx.fillStyle = B;
    ctx.beginPath(); ctx.arc(0, 12, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.arc(0, 12, 7, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  runHeldDecos(ch, RIM);

  finishSprite(dk(B, 0.42));
  ctx = main;
  // บีบแนวตั้งเล็กน้อยตอนแปะ (ยึดตำแหน่งเท้าเดิม) — สไปรต์จริงป้อมกว้าง W:H ≈ 0.8
  ctx.drawImage(olOut, -C_OX, -C_OY * SQ, 200, 205 * SQ);
}


function drawCookieRun(t, ch) {
  t *= 1.15;
  /* จังหวะแบบสไปรต์เกมจริง: ล็อกท่าเป็นสเต็ป 8 เฟรมต่อรอบ (~12fps)
     ทำให้ท่า "คม" เป็นเฟรม ๆ ไม่ใช่ tween ลื่น ๆ */
  const STEPS = 8;
  const tq = Math.floor(((t % TAU) + TAU) % TAU / TAU * STEPS) / STEPS * TAU;
  const s = Math.sin(tq), c = Math.cos(tq);
  const sB = Math.sin(tq + Math.PI);
  /* squash & stretch ในวงจรวิ่ง: หดตอนเท้ากระแทกพื้น ยืดตอนถีบตัวลอย */
  const sy = 1 - 0.06 * Math.cos(tq * 2 + 0.5);
  ctx.save();
  ctx.translate(0, -Math.abs(c) * 3.4);          // ตัวเด้งตามก้าว
  ctx.scale(2 - sy, sy);                          // ยืด-หดรักษาปริมาตร (จุดหมุนที่เท้า)
  /* ท่าควบแบบต้นฉบับ: สวิงหน้าแรงกว่าหลัง + เข่าพับสูงตอนตวัดขากลับ */
  const hipA = s < 0 ? s * 1.3 : s * 0.95;
  const hipB = sB < 0 ? sB * 1.3 : sB * 0.95;
  const kneeA = 0.1 + Math.pow(Math.max(0, Math.sin(tq - 0.7)), 1.3) * 1.55;
  const kneeB = 0.1 + Math.pow(Math.max(0, Math.sin(tq + Math.PI - 0.7)), 1.3) * 1.55;
  cookieBody(
    0.26 + Math.sin(tq * 2) * 0.03,               // เอนหน้าแรงแบบภาพวิ่งต้นฉบับ
    hipA, hipB,
    4.15 + s * 0.22,                              // แขนหลังกำไม้เท้าลากตามหลัง
    1.75 - s * 0.85,                              // แขนหน้าสะบัดขึ้นหน้า-บน
    Math.abs(c) * -2.6,
    ch,
    { kA: kneeA, kB: kneeB, eA: 0.95, eB: 0.72 + s * 0.35 }
  );
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap='round';
  for (let i = 0; i < 3; i++) {
    const yy = -30 - i * 18, ln = 14 + ((t * 7 + i * 2) % 3) * 5;
    ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
  }
}
function drawCookieJump(second) {
  if (second) {
    // ตีลังกาม้วนตัว — หมุนทีละสเต็ป 10 เฟรมแบบสไปรต์
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(Math.floor((P.anim * 1.8 % TAU) / (TAU / 10)) * (TAU / 10));
    ctx.translate(0, 40);
    cookieBody(0, 1.15, -0.7, 2.5, 3.2, 0, undefined,
      { kA: 1.5, kB: 1.35, eA: 1.25, eB: 1.2 });
    ctx.restore();
  } else if (P.vy < 0) {
    // พุ่งขึ้น: เข่าหน้ายกพับ ขาหลังเหยียดถีบ แขนสะบัดขึ้น
    cookieBody(0.17, -0.75, 1.05, 1.9, 3.55, 1,
      undefined,
      { kA: 1.35, kB: 0.25, eA: 0.9, eB: 0.35 });
  } else {
    // ร่วงลง: ขาถ่างเตรียมรับพื้น แขนกางทรงตัว
    cookieBody(0.1, 0.55, -0.8, 2.15, 3.35, -1,
      undefined,
      { kA: 0.5, kB: 0.75, eA: 0.45, eB: 0.6 });
  }
}
function drawCookieSlide(t) {
  // สไลด์เท้านำ ตัวเอนราบ แขนหลังกวาดพื้น
  ctx.save();
  ctx.rotate(-1.05);
  ctx.translate(20, 9);
  cookieBody(0, -1.15, -0.7 + Math.sin(t * 2) * 0.08, 2.9, 1.35, 2,
    undefined,
    { kA: 0.35, kB: 0.85, eA: 0.5, eB: 1.15 });
  ctx.restore();
  if (Math.random() < 0.75) puff(P.x + rnd(0, 24), GROUND_Y, 1);
}

/* ---------- particles & floaters ---------- */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.chunk) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.fillRect(-p.r, -p.r * 0.8, p.r * 2, p.r * 1.6);
      ctx.restore();
    } else if (p.smoke) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    } else if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      ctx.fillRect(-p.r, -p.r/3, p.r*2, p.r/1.5);
      ctx.fillRect(-p.r/3, -p.r, p.r/1.5, p.r*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / 1.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `bold ${f.big ? 24 : 17}px Trebuchet MS`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   UI WIDGETS
   ============================================================ */
/* ---- ประกายฉลอง UI (ทำงานทุกหน้า ใช้ตอนซื้อ/อัปเกรดสำเร็จ) ---- */
let uiSparks = [];
function uiBurst(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 240);
    uiSparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                    t: 0, life: rnd(0.4, 0.8), c: Math.random() < 0.3 ? '#fff' : color, r: rnd(2, 4.5) });
  }
}
function drawUiSparks() {
  if (!uiSparks.length) return;
  const dt = 1 / 60;
  for (const s of uiSparks) {
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 420 * dt;
  }
  uiSparks = uiSparks.filter(s => s.t < s.life);
  for (const s of uiSparks) {
    ctx.globalAlpha = 1 - s.t / s.life;
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (1 - s.t / s.life * 0.5), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let UI_SILENT = false;   // วาดปุ่มโดยไม่รับคลิก (ฉากหลังป๊อปอัพ)
function drawBtn(x, y, w, h, label, cb, opt = {}) {
  if (!UI_SILENT) uiButtons.push({ x, y, w, h, cb, disabled: opt.disabled });
  if (opt.invisible) return;   // พื้นที่คลิกล่องหน (การ์ดกริด)
  const base = opt.disabled ? '#928982' : (opt.color || '#ff8b3d');
  const dark = opt.disabled ? '#6e675f' : (opt.dark || '#d96a1e');
  const r = Math.min(h / 2.3, 24);
  // เงาทิ้งนุ่ม
  ctx.fillStyle = 'rgba(35,16,0,.30)';
  roundRect(x + 1, y + 5, w, h, r); ctx.fill();
  // ขอบเข้มรอบนอก (ให้ปุ่มคม-เด้ง)
  ctx.fillStyle = dk(dark, 0.66);
  roundRect(x - 1.5, y - 1.5, w + 3, h + 3, r + 1.5); ctx.fill();
  // เนื้อปุ่ม ไล่เฉด 3 สเตป (เจลลี่/ลูกอม)
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, dk(base, 1.28)); g.addColorStop(0.48, base); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(x, y, w, h, r); ctx.fill();
  // เงาวับบน + เงาในล่าง (คลิปในรูปปุ่ม)
  ctx.save(); roundRect(x, y, w, h, r); ctx.clip();
  const hg = ctx.createLinearGradient(0, y, 0, y + h * 0.55);
  hg.addColorStop(0, 'rgba(255,255,255,.55)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; roundRect(x + 4, y + 3, w - 8, h * 0.46, r * 0.7); ctx.fill();
  const sg = ctx.createLinearGradient(0, y + h * 0.55, 0, y + h);
  sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.20)');
  ctx.fillStyle = sg; ctx.fillRect(x, y + h * 0.5, w, h * 0.5);
  ctx.restore();
  // ริมไลต์บาง + เส้นทองรอบนอก (ลุคหรู)
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.4;
  roundRect(x + 1.2, y + 1.2, w - 2.4, h - 2.4, r - 1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,214,138,.55)'; ctx.lineWidth = 1.2;
  roundRect(x - 1.5, y - 1.5, w + 3, h + 3, r + 1.5); ctx.stroke();
  // ตัวหนังสือ (+ ไอคอนวาดเองหน้าข้อความ ถ้าระบุ)
  ctx.font = `bold ${opt.font || 21}px Trebuchet MS`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let tx = x + w / 2;
  if (opt.icon) {
    const isz = (opt.font || 21) * 1.15;
    const tw2 = ctx.measureText(label).width;
    drawIcon(opt.icon, tx - tw2 / 2 - isz * 0.42, y + h / 2, isz);
    tx += isz * 0.42;
    ctx.font = `bold ${opt.font || 21}px Trebuchet MS`;
  }
  ctx.lineWidth = 4.5; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(70,32,0,.72)';
  ctx.strokeText(label, tx, y + h / 2 + 1);
  ctx.fillStyle = opt.disabled ? '#e6e0d8' : '#fff';
  ctx.fillText(label, tx, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

/* ---- ไอคอนวาดเอง (ไม่พึ่งอิโมจิ — บางเครื่องไม่แสดงอิโมจิใน canvas) ---- */
function drawMiniCoin(x, y, r) {
  ctx.save();
  ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e8a90c'; ctx.font = `bold ${Math.round(r * 1.15)}px Trebuchet MS`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('C', x, y + r * 0.08); ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawMiniGem(x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#5aa8e8';
  ctx.beginPath(); ctx.moveTo(-r, -r * 0.35); ctx.lineTo(-r * 0.5, -r); ctx.lineTo(r * 0.5, -r);
  ctx.lineTo(r, -r * 0.35); ctx.lineTo(0, r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9ed4ff';
  ctx.beginPath(); ctx.moveTo(-r * 0.5, -r); ctx.lineTo(r * 0.5, -r); ctx.lineTo(0, -r * 0.1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-r, -r * 0.35); ctx.lineTo(r, -r * 0.35); ctx.stroke();
  ctx.restore();
}
function drawMiniSparkle(x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#e8c8ff';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.18, -r * 0.18, r, 0);
  ctx.quadraticCurveTo(r * 0.18, r * 0.18, 0, r);
  ctx.quadraticCurveTo(-r * 0.18, r * 0.18, -r, 0);
  ctx.quadraticCurveTo(-r * 0.18, -r * 0.18, 0, -r);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, TAU); ctx.fill();
  ctx.restore();
}
// ไอคอนทั่วไปตามชื่อ — ใช้กับปุ่ม/HUD/แผงต่างๆ (วาดเองทั้งหมด ไม่พึ่งอิโมจิ)
function drawIcon(name, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 24, s / 24);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  switch (name) {
    case 'coin': drawMiniCoin(0, 0, 10); break;
    case 'gem': drawMiniGem(0, 0, 10); break;
    case 'sparkle': drawMiniSparkle(0, 0, 10); break;
    case 'cookie': {   // คุกกี้ชิ้นกลม
      ctx.fillStyle = '#d78e4b'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a5424';
      for (const [cx2, cy2, r2] of [[-4, -3, 1.8], [3, -4, 1.5], [4, 3, 1.8], [-3, 4, 1.5], [0, 0, 1.4]]) {
        ctx.beginPath(); ctx.arc(cx2, cy2, r2, 0, TAU); ctx.fill();
      }
      break;
    }
    case 'chick': {   // ลูกเจี๊ยบ (สัตว์เลี้ยง)
      ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(0, 2, 8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -6, 5.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff9d2e'; ctx.beginPath(); ctx.moveTo(4.5, -6); ctx.lineTo(9, -4.5); ctx.lineTo(4.5, -3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4a3018'; ctx.beginPath(); ctx.arc(1.5, -7, 1.2, 0, TAU); ctx.fill();
      break;
    }
    case 'bag': {   // ถุงช้อปปิง (ร้านค้า)
      ctx.fillStyle = '#5cb8e8'; roundRect(-8, -5, 16, 14, 3); ctx.fill();
      ctx.strokeStyle = '#2e7aa8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -5, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 2, 2.4, 0, TAU); ctx.fill();
      break;
    }
    case 'trophy': {   // ถ้วยรางวัล
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(6, -9); ctx.lineTo(5, 0);
      ctx.quadraticCurveTo(4, 5, 0, 5); ctx.quadraticCurveTo(-4, 5, -5, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-8, -5, 3.4, Math.PI * 0.4, Math.PI * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(8, -5, 3.4, Math.PI * 1.5, Math.PI * 0.6 + Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#e8a90c'; ctx.fillRect(-1.6, 5, 3.2, 3); ctx.fillRect(-5, 8, 10, 2.6);
      break;
    }
    case 'chart': {   // กราฟสถิติ
      ctx.fillStyle = '#8fd8a0'; ctx.fillRect(-9, 0, 4.6, 9);
      ctx.fillStyle = '#7ec8e8'; ctx.fillRect(-2.3, -5, 4.6, 14);
      ctx.fillStyle = '#ffd24a'; ctx.fillRect(4.4, -9, 4.6, 18);
      break;
    }
    case 'map': {   // แผนที่ผจญภัย
      ctx.fillStyle = '#e8d8a8';
      ctx.beginPath(); ctx.moveTo(-9, -7); ctx.lineTo(-3, -9); ctx.lineTo(3, -7); ctx.lineTo(9, -9);
      ctx.lineTo(9, 7); ctx.lineTo(3, 9); ctx.lineTo(-3, 7); ctx.lineTo(-9, 9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c05a3a'; ctx.lineWidth = 1.6; ctx.setLineDash([2.5, 2]);
      ctx.beginPath(); ctx.moveTo(-6, 5); ctx.quadraticCurveTo(0, -2, 6, -5); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#e0453a'; ctx.beginPath(); ctx.arc(6, -5, 2, 0, TAU); ctx.fill();
      break;
    }
    case 'flame': {   // เปลวไฟ (วิ่งปกติ)
      ctx.fillStyle = '#ff9d2e';
      ctx.beginPath(); ctx.moveTo(0, -10);
      ctx.quadraticCurveTo(7, -3, 6, 3); ctx.quadraticCurveTo(5, 9, 0, 10);
      ctx.quadraticCurveTo(-5, 9, -6, 3); ctx.quadraticCurveTo(-7, -3, 0, -10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe066';
      ctx.beginPath(); ctx.moveTo(0, -3); ctx.quadraticCurveTo(3.6, 2, 3, 5.5);
      ctx.quadraticCurveTo(2, 8.5, 0, 9); ctx.quadraticCurveTo(-2, 8.5, -3, 5.5);
      ctx.quadraticCurveTo(-3.6, 2, 0, -3); ctx.closePath(); ctx.fill();
      break;
    }
    case 'play': {   // สามเหลี่ยมเพลย์
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(9, 0); ctx.lineTo(-6, 9); ctx.closePath(); ctx.fill();
      break;
    }
    case 'gift': {   // กล่องของขวัญ
      ctx.fillStyle = '#e0699a'; roundRect(-8, -4, 16, 12, 2.5); ctx.fill();
      ctx.fillStyle = '#ffd24a'; ctx.fillRect(-1.8, -4, 3.6, 12); ctx.fillRect(-9, -1.5, 18, 3);
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-3.5, -7, 3, Math.PI * 0.2, Math.PI * 1.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(3.5, -7, 3, Math.PI * 1.7, Math.PI * 0.8 + TAU); ctx.stroke();
      break;
    }
    case 'flag': {   // ธงโจรสลัด (เกาะเหรียญ)
      ctx.strokeStyle = '#8a6a3e'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(-7, 10); ctx.stroke();
      ctx.fillStyle = '#2e2a26';
      ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(9, -7); ctx.lineTo(-7, -1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-2, -6.4, 1.8, 0, TAU); ctx.fill();
      break;
    }
    case 'ice': {   // ก้อนน้ำแข็ง (หอคอย)
      ctx.fillStyle = 'rgba(160,220,255,.9)'; roundRect(-8, -8, 16, 16, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-4, 5); ctx.lineTo(5, -4); ctx.moveTo(0, 6); ctx.lineTo(6, 0); ctx.stroke();
      break;
    }
    case 'globe': {   // ลูกโลก (ออนไลน์)
      ctx.strokeStyle = '#7ec8e8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 4, 9, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
      break;
    }
    case 'scroll': {   // ม้วนภารกิจ
      ctx.fillStyle = '#f2e4c0'; roundRect(-7, -9, 14, 18, 3); ctx.fill();
      ctx.fillStyle = '#d8c49a'; ctx.fillRect(-9, -9, 18, 3.4); ctx.fillRect(-9, 5.6, 18, 3.4);
      ctx.strokeStyle = '#a08050'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-4, -2.5); ctx.lineTo(4, -2.5); ctx.moveTo(-4, 1.5); ctx.lineTo(4, 1.5); ctx.stroke();
      break;
    }
    case 'egg': {   // ไข่
      ctx.fillStyle = '#fff6e0';
      ctx.beginPath(); ctx.ellipse(0, 1, 7.5, 9.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd0e0';
      ctx.beginPath(); ctx.arc(-2, -2, 2, 0, TAU); ctx.arc(3, 3, 1.6, 0, TAU); ctx.fill();
      break;
    }
    case 'lock': {   // แม่กุญแจ
      ctx.fillStyle = '#c8a44a'; roundRect(-7, -2, 14, 11, 3); ctx.fill();
      ctx.strokeStyle = '#a8843a'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, -3, 4.6, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#6a4a1a'; ctx.beginPath(); ctx.arc(0, 3, 2, 0, TAU); ctx.fill();
      break;
    }
    case 'star': {   // ดาว
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      for (let q = 0; q < 10; q++) {
        const rr = q % 2 ? 4.5 : 10, a = -Math.PI / 2 + q * Math.PI / 5;
        ctx[q ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'heart': { ctx.fillStyle = '#ff5a8a'; heart(0, 0, 10); ctx.fill(); break; }
    case 'jellybean': {   // เยลลี่
      ctx.fillStyle = '#ffce2e'; ctx.rotate(0.5); roundRect(-9, -4.5, 18, 9, 4.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(-6.5, -3, 7, 3, 1.5); ctx.fill();
      break;
    }
    case 'runner': {   // นักวิ่ง (ระยะทาง)
      ctx.strokeStyle = '#ffe9b8'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(2, -7, 3, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(-2, 3); ctx.lineTo(-7, 6); ctx.moveTo(-2, 3); ctx.lineTo(3, 6); ctx.lineTo(2, 10);
      ctx.moveTo(0, -3) ; ctx.lineTo(5, -1); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

// ไอคอนสมบัติ 18 แบบ ตามชนิดผล (fx.k)
function drawTreasureIcon(k, x, y, s) {

      ctx.fillStyle = '#ffce5e';

      break;
    }
    case 'combo': {   // ริบบิ้นโบว์
      ctx.fillStyle = '#ff6b8d';
      ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-14, -8); ctx.quadraticCurveTo(-16, 0, -14, 8); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(14, -8); ctx.quadraticCurveTo(16, 0, 14, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d84a6e'; ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff9db8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(-6, 13); ctx.moveTo(2, 3); ctx.lineTo(6, 13); ctx.stroke();
      break;
    }
    case 'pit': {   // ร่มชูชีพ
      ctx.fillStyle = '#7ec8e8';
      ctx.beginPath(); ctx.arc(0, -4, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd84a';
      ctx.beginPath(); ctx.arc(0, -4, 12, Math.PI + 0.6, Math.PI + 1.4); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c8b89a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-11, -3); ctx.lineTo(-3, 10); ctx.moveTo(11, -3); ctx.lineTo(3, 10); ctx.stroke();
      ctx.fillStyle = '#b07840'; ctx.fillRect(-4, 9, 8, 6);
      break;
    }
    case 'box': {   // กุญแจ
      ctx.strokeStyle = '#e8b23c'; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.arc(-5, -6, 6, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(11, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7, 12); ctx.lineTo(10, 9); ctx.moveTo(3, 8); ctx.lineTo(6, 5); ctx.stroke();
      break;
    }
    case 'gem': {   // เศษคริสตัล
      drawMiniGem(0, 0, 13);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(11, -12); ctx.lineTo(14, -15); ctx.stroke();
      break;
    }
    case 'jelly': {   // ลูกอมเยลลี่
      ctx.fillStyle = '#b06ae0';
      ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-15, -9); ctx.lineTo(-13, 0); ctx.lineTo(-15, 8); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9, -4); ctx.lineTo(15, -9); ctx.lineTo(13, 0); ctx.lineTo(15, 8); ctx.closePath(); ctx.fill();
      const jg = ctx.createLinearGradient(0, -9, 0, 9);
      jg.addColorStop(0, '#e08aff'); jg.addColorStop(1, '#9a4ad0');
      ctx.fillStyle = jg; ctx.beginPath(); ctx.ellipse(0, 0, 10, 9, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-3, -3.5, 3.4, 2.2, -0.5, 0, TAU); ctx.fill();
      break;
    }
    case 'pt': {   // มงกุฎ
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(-12, 8); ctx.lineTo(-13, -7); ctx.lineTo(-6, -1); ctx.lineTo(0, -11);
      ctx.lineTo(6, -1); ctx.lineTo(13, -7); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8a90c'; ctx.fillRect(-12, 8, 24, 4);
      ctx.fillStyle = '#e0453a'; ctx.beginPath(); ctx.arc(0, 2, 2.6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7ec8e8';
      ctx.beginPath(); ctx.arc(-7.5, 4, 1.8, 0, TAU); ctx.arc(7.5, 4, 1.8, 0, TAU); ctx.fill();
      break;
    }
    case 'lift': {   // กรงนก
      ctx.strokeStyle = '#e8c073'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -2, 11, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-11, 10); ctx.moveTo(11, -2); ctx.lineTo(11, 10);
      ctx.moveTo(-5.5, -11); ctx.lineTo(-5.5, 10); ctx.moveTo(0, -13); ctx.lineTo(0, 10); ctx.moveTo(5.5, -11); ctx.lineTo(5.5, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-13, 10); ctx.lineTo(13, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, -16); ctx.stroke();
      ctx.fillStyle = '#7ec8e8'; ctx.beginPath(); ctx.arc(2.8, 4, 2.6, 0, TAU); ctx.fill();
      break;
    }
    case 'letter': {   // กระดิ่ง
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(-10, 7); ctx.quadraticCurveTo(-10, -10, 0, -11);
      ctx.quadraticCurveTo(10, -10, 10, 7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8a90c'; ctx.fillRect(-12, 7, 24, 3.4);
      ctx.fillStyle = '#b8860b'; ctx.beginPath(); ctx.arc(0, 13, 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe9a0'; ctx.fillRect(-2.4, -14, 4.8, 3.4);
      break;
    }
    default: drawMiniCoin(0, 0, 12);
  }
  ctx.restore();
}

function drawPanel(x, y, w, h, r = 18) {
  // เงาทิ้ง
  ctx.fillStyle = 'rgba(24,11,0,.32)';
  roundRect(x + 2, y + 5, w, h, r); ctx.fill();
  // ขอบทองไล่เฉดรอบนอก (ลุคหรู)
  const eg = ctx.createLinearGradient(0, y - 2, 0, y + h + 2);
  eg.addColorStop(0, '#f0d28a'); eg.addColorStop(0.5, '#9a6a2a'); eg.addColorStop(1, '#e2b968');
  ctx.fillStyle = eg;
  roundRect(x - 2, y - 2, w + 4, h + 4, r + 2); ctx.fill();
  // ขอบไม้เข้มชั้นใน
  ctx.fillStyle = '#3a2109';
  roundRect(x, y, w, h, r); ctx.fill();
  // พื้นไล่เฉด (โทนคาราเมลสว่าง)
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(128,78,36,.96)'); g.addColorStop(1, 'rgba(78,44,18,.96)');
  ctx.fillStyle = g;
  roundRect(x + 1.5, y + 1.5, w - 3, h - 3, Math.max(2, r - 1)); ctx.fill();
  // เส้นไฮไลต์ขอบใน (เบเวล)
  ctx.strokeStyle = 'rgba(255,228,178,.5)'; ctx.lineWidth = 1.8;
  roundRect(x + 4, y + 4, w - 8, h - 8, Math.max(2, r - 3)); ctx.stroke();
  // ประกายเส้นบนสุด
  ctx.strokeStyle = 'rgba(255,244,214,.25)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + r, y + 3.5); ctx.lineTo(x + w - r, y + 3.5); ctx.stroke();
  // เพชรทองประดับ 4 มุม (เฉพาะแผงใหญ่ ไม่ให้รก)
  if (w > 220 && h > 90) {
    ctx.fillStyle = '#ffe6a8';
    for (const [dx2, dy2] of [[x + 13, y + 13], [x + w - 13, y + 13], [x + 13, y + h - 13], [x + w - 13, y + h - 13]]) {
      ctx.save(); ctx.translate(dx2, dy2); ctx.rotate(Math.PI / 4);
      ctx.fillRect(-2.6, -2.6, 5.2, 5.2); ctx.restore();
    }
  }
}

function drawTitleText(text, x, y, size, fill1 = '#ffe9a0', fill2 = '#ff8b2e') {
  ctx.textAlign = 'center';
  ctx.font = `bold ${size}px Trebuchet MS`;
  ctx.lineJoin = 'round';
  // เงานุ่มด้านหลัง
  ctx.fillStyle = 'rgba(35,16,0,.3)';
  ctx.fillText(text, x + size * 0.03, y + size * 0.06);
  // ขอบเข้ม 2 ชั้น (นอกหนา + ใน)
  ctx.lineWidth = size * 0.22; ctx.strokeStyle = '#4a2409'; ctx.strokeText(text, x, y);
  ctx.lineWidth = size * 0.12; ctx.strokeStyle = '#7a3f16'; ctx.strokeText(text, x, y);
  // เนื้อไล่เฉด
  const grad = ctx.createLinearGradient(0, y - size * 0.85, 0, y + size * 0.15);
  grad.addColorStop(0, '#fff7d6'); grad.addColorStop(0.5, fill1); grad.addColorStop(1, fill2);
  ctx.fillStyle = grad;
  ctx.fillText(text, x, y);
  // แถบประกายบนตัวอักษร
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 900, y - size, 1800, size * 0.4); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* ---------- HUD ---------- */
function drawHUD() {
  const bx = 24, by = 20, bw = 330, bh = 26;
  ctx.fillStyle = 'rgba(60,30,0,.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 14); ctx.fill();
  const hpFrac = G.hp / G.hpMax;
  const hpC = hpFrac > 0.5 ? '#7bd94a' : hpFrac > 0.25 ? '#ffce2e' : '#ff5f5f';
  ctx.fillStyle = '#3d2410';
  roundRect(bx, by, bw, bh, 11); ctx.fill();
  if (hpFrac > 0.01) {
    ctx.fillStyle = hpC;
    roundRect(bx, by, Math.max(14, bw * hpFrac), bh, 11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(bx + 3, by + 3, Math.max(8, bw * hpFrac - 6), 8, 5); ctx.fill();
  }

  // หน้าคุกกี้ที่หัวแถบพลัง
  ctx.save();
  ctx.translate(bx + 2, by + bh / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().body;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().icing;
  ctx.beginPath(); ctx.arc(0, -3, 18, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(10, -15, 4, -9);
  ctx.quadraticCurveTo(0, -16, -4, -9);
  ctx.quadraticCurveTo(-8, -16, -12, -7);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.ellipse(-4, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a28'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(1, 6, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  if (hpFrac < 0.25 && Math.floor(G.time * 3) % 2 === 0) {
    ctx.fillStyle = '#ff5f5f';
    ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'left';
    ctx.fillText('⚠ พลังใกล้หมด! เก็บยาเพิ่มพลัง!', bx + 10, by + bh + 22);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Trebuchet MS';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.8)';
  const sc = Math.floor(G.score).toLocaleString();
  ctx.strokeText(sc, W - 26, 46);
  ctx.fillStyle = '#fff';
  ctx.fillText(sc, W - 26, 46);
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.strokeStyle = 'rgba(60,30,0,.7)'; ctx.lineWidth = 3;
  // ระยะ · เยลลี่ · เหรียญ (ไอคอนวาดเอง)
  const segs = [[Math.floor(G.dist) + ' m', 'runner'], [G.jellies + '', 'jellybean'], [G.coins + '', 'coin']];
  let sxr = W - 26;
  for (let q = segs.length - 1; q >= 0; q--) {
    const [txt, ic] = segs[q];
    ctx.strokeText(txt, sxr, 72); ctx.fillText(txt, sxr, 72);
    const tw3 = ctx.measureText(txt).width;
    drawIcon(ic, sxr - tw3 - 12, 66, 18);
    sxr -= tw3 + 34;
  }
  // ชั้นหอคอย
  if (G.mode === 'tower') {
    ctx.textAlign = 'right';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,40,70,.8)';
    const ft = 'ชั้น ' + G.floorNow + '  (' + Math.ceil(20 - G.floorT) + ' วิ)';
    ctx.strokeText(ft, W - 26, 118);
    ctx.fillStyle = '#aee4ff';
    ctx.fillText(ft, W - 26, 118);
  }
  // ความคืบหน้าตัวอักษร BONUSTIME
  if (G.bonusT <= 0 && G.mode === 'normal') {
    ctx.font = 'bold 15px Trebuchet MS';
    for (let i = 0; i < 9; i++) {
      const cx2 = W - 26 - (8 - i) * 15;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.7)';
      ctx.strokeText(BT_WORD[i], cx2, 94);
      ctx.fillStyle = i < G.btProgress ? '#ff9dd6' : 'rgba(255,255,255,.28)';
      ctx.fillText(BT_WORD[i], cx2, 94);
    }
  }

  if (G.combo >= 5) {
    ctx.textAlign = 'center';
    const pop = 1 + Math.max(0, 0.4 - G.comboTimer) * 0.6;
    ctx.save();
    ctx.translate(W / 2, 96);
    ctx.scale(pop, pop);
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText(G.combo + ' COMBO!', 0, 0);
    ctx.fillStyle = `hsl(${(G.combo * 14) % 360},90%,65%)`;
    ctx.fillText(G.combo + ' COMBO!', 0, 0);
    ctx.restore();
  }

  let iy = by + bh + (G.hp / G.hpMax < 0.25 ? 38 : 14) + 8;
  ctx.textAlign = 'left'; ctx.font = 'bold 15px Trebuchet MS';
  if (P.giantT > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('● ยักษ์: ' + P.giantT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (P.magnetT > 0) {
    ctx.fillStyle = '#7ecbff';
    ctx.fillText('● แม่เหล็ก: ' + P.magnetT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.bonusT > 0) {
    ctx.fillStyle = '#ffe066';
    ctx.fillText('★ BONUS TIME: ' + G.bonusT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.revives > 0) {
    ctx.fillStyle = '#ffb0c8';
    ctx.fillText('♥ ชุบชีวิต x' + G.revives, bx, iy);
  }

  /* ปุ่มโปร่งแสง Jump / Slide มุมล่างจอ (แบบเกมจริง) */
  const bubbleBtn = (x, label, pressed) => {
    ctx.save();
    ctx.globalAlpha = pressed ? 0.5 : 0.24;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.fill();
    ctx.globalAlpha = pressed ? 0.95 : 0.5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, H - 72, 41, Math.PI * 1.12, Math.PI * 1.42); ctx.stroke();
    ctx.font = 'bold 21px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.55)';
    ctx.strokeText(label, x, H - 64);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, H - 64);
    ctx.restore();
  };
  bubbleBtn(82, 'Jump', !P.onGround);
  bubbleBtn(W - 82, 'Slide', P.sliding);

  // ปุ่มสกิลไม้ตายกลางล่าง (Magic Candy)
  {
    const sx = W / 2, sy = H - 66, r = 40;
    const ready = G.skill >= 100;
    ctx.save();
    ctx.globalAlpha = ready ? 0.95 : 0.55;
    ctx.fillStyle = 'rgba(50,25,5,.6)';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    // วงเกจชาร์จ
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = ready ? '#ffe066' : '#7ee0ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * (G.skill / 100)); ctx.stroke();
    // ไอคอนลูกกวาดสกิล
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    drawTreasureIcon('item', sx, sy, 30);
    ctx.textBaseline = 'alphabetic';
    if (ready) {
      const pul = 1 + Math.sin(G.time * 8) * 0.08;
      ctx.strokeStyle = `rgba(255,224,102,${0.5 + Math.sin(G.time * 8) * 0.3})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(sx, sy, r * pul + 4, 0, TAU); ctx.stroke();
      ctx.font = 'bold 14px Trebuchet MS';
      ctx.fillStyle = '#ffe066';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.8)';
      ctx.strokeText('สกิลพร้อม! (X)', sx, sy + r + 20);
      ctx.fillText('สกิลพร้อม! (X)', sx, sy + r + 20);
    }
    ctx.restore();
  }

  // ปุ่มพักเกมกลางบน
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(60,30,0,.5)';
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff';
  roundRect(W / 2 - 7, 22, 5, 16, 2); ctx.fill();
  roundRect(W / 2 + 2, 22, 5, 16, 2); ctx.fill();
  ctx.restore();

  // จอพักเกม
  if (G.paused) {
    ctx.fillStyle = 'rgba(30,12,2,.66)';
    ctx.fillRect(0, 0, W, H);
    drawTitleText('พักเกม', W / 2, 240, 54);
    ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('แตะที่ไหนก็ได้ หรือกด P เพื่อเล่นต่อ', W / 2, 300);
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('แตะที่ไหนก็ได้ หรือกด P เพื่อเล่นต่อ', W / 2, 300);
  }
}

function drawBanner() {
  if (!G.banner || G.bannerT > 1.6) return;
  const a = G.bannerT < 0.25 ? G.bannerT / 0.25 : G.bannerT > 1.25 ? (1.6 - G.bannerT) / 0.35 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(G.banner.text, W / 2, 200);
  ctx.fillStyle = G.banner.color;
  ctx.fillText(G.banner.text, W / 2, 200);
  ctx.globalAlpha = 1;
}

function drawLogin() {

  ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('เลือกโปรไฟล์เพื่อเข้าเกม', W / 2, 130);

  // ตัวคุกกี้ต้อนรับ
  ctx.save();
  ctx.translate(120, 330);
  ctx.scale(1.1, 1.1);
  drawCookieRun(P.anim);

function drawMenu() {

  // ขนมลอยตกแต่งฉากหลังเมนู
  const decor = [

      ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(-10, -4.5, 10, 4, 2); ctx.fill();

      ctx.fillStyle = '#ff7bac'; heart(0, 0, 13); ctx.fill();

      ctx.fillStyle = '#ffe066';

      for (let k = 0; k < 10; k++) {
        const rr = k % 2 === 0 ? 13 : 5.5;

      ctx.closePath(); ctx.fill();

  // ปุ่มอันดับออนไลน์ + ภารกิจ (ล่างแผงซ้าย)

  /* ============ แผงขวา: โซนเล่น ============ */

    const sx = fx0 + ((s * 71 + 20) % fw), sy = fy0 + ((s * 47 + 12) % (fh - 60));

    ctx.beginPath(); ctx.arc(sx, sy, s % 4 === 0 ? 1.7 : 1, 0, TAU); ctx.fill();

      ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ffe9b8';
      ctx.fillText('วัน ' + (i + 1), x + 35, y + 20);
      ctx.font = '22px Trebuchet MS';
      ctx.globalAlpha = got ? 0.45 : 1;
      if (d.gems) drawMiniGem(x + 35, y + 50, 9); else drawMiniCoin(x + 35, y + 50, 9);
      ctx.globalAlpha = 1;
      ctx.font = 'bold 10.5px Trebuchet MS';
      ctx.fillStyle = got ? '#7bd94a' : '#ffd24a';
      ctx.fillText(got ? '✓ รับแล้ว' : d.t, x + 35, y + 78);
    });
    if (!claimed) {
      drawBtn(W / 2 - 130, 340, 260, 48, '🎁 รับรางวัลวันที่ ' + (day + 1), () => {
        const d = DAILY[day];
        if (d.coins) G.bank += d.coins;
        if (d.gems) G.crystals += d.gems;
        G.dailyLast = todayStr(); G.dailyDay = (G.dailyDay + 1);
        SAVE.set('coins', G.bank); SAVE.set('crystals', G.crystals);
        SAVE.set('dailyLast', G.dailyLast); SAVE.set('dailyDay', G.dailyDay);
        AudioSys.buy();
        floatText(W / 2, 120, '🎁 ได้ ' + d.t + '!', '#ffd24a', true);
        G.dailyShow = false;
      }, { color: '#ffb02e', dark: '#e07b12', font: 17 });
    } else {
      drawBtn(W / 2 - 130, 340, 260, 48, 'วันนี้รับแล้ว — พรุ่งนี้มาใหม่!', () => { G.dailyShow = false; }, { disabled: true, font: 14 });
    }
    drawBtn(W / 2 - 70, 396, 140, 34, 'ปิด', () => { G.dailyShow = false; }, { color: '#a08468', dark: '#7d6448', font: 14 });
  }

}

/* ---------- เตรียมพร้อมก่อนวิ่ง: เลือกบูสต์ใช้ครั้งเดียว ---------- */
function prepTotal() {
  return BOOSTS.reduce((s, b) => s + (G.boostSel[b.id] ? b.cost : 0), 0);
}
function prepGo() {
  const total = prepTotal();
  if (total > G.bank) { AudioSys.deny(); floatText(W / 2, 120, 'เหรียญไม่พอสำหรับบูสต์!', '#ff8888', true); return; }
  if (total > 0) { G.bank -= total; SAVE.set('coins', G.bank); AudioSys.buy(); }
  startGame('normal', Object.assign({}, G.boostSel));
}
function drawPrep() {
  ctx.fillStyle = 'rgba(58,32,10,.44)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('เตรียมพร้อมก่อนวิ่ง', W / 2, 56, 34);
  drawCoinChip(W - 20, 20, G.bank.toLocaleString());

  // ตัวละคร + สัตว์เลี้ยงที่ใช้
  ctx.save();
  ctx.translate(150, 330);
  ctx.scale(1.15, 1.15);
  drawCookieRun(P.anim);
  ctx.restore();
  ctx.save();
  ctx.translate(70, 230 + Math.sin(G.time * 4) * 8);
  drawPet(PT());
  ctx.restore();
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(CH().name + '  Lv.' + (G.charLv[G.charIdx] || 1), 150, 372);
  ctx.font = '13px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
  ctx.fillText(PT().name + '  Lv.' + petLvNow(), 150, 394);

  // ---- คู่วิ่งผลัด (Relay) แบบเกมจริง: ล้มแล้วตัวสำรองวิ่งต่อ ----
  drawPanel(28, 408, 250, 96, 12);
  ctx.font = 'bold 13.5px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7bd94a';
  ctx.fillText('🏃 คู่วิ่งผลัด (RELAY)', 152, 428);
  const relayOK = G.relayIdx >= 0 && G.relayIdx !== G.charIdx && G.owned.includes(G.relayIdx);
  if (relayOK) {
    ctx.drawImage(cookiePortrait(G.relayIdx), 40, 428, 56, 64);
    ctx.font = 'bold 12.5px Trebuchet MS'; ctx.fillStyle = '#fff';
    let rn = CHARS[G.relayIdx].name.replace('คุกกี้', '');
    if (rn.length > 12) rn = rn.slice(0, 11) + '…';
    ctx.fillText(rn, 168, 452);
    ctx.font = '11px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ล้มเมื่อไหร่ รับไม้ต่อทันที', 168, 470);
  } else {
    ctx.font = '12px Trebuchet MS'; ctx.fillStyle = '#c8b8a0';
    ctx.fillText('ไม่ใช้ตัวสำรอง', 152, 460);
  }
  const relayCycle = dir => {
    const owned = CHARS.map((c2, i2) => i2).filter(i2 => G.owned.includes(i2) && i2 !== G.charIdx);
    if (!owned.length) return;
    const opts = [-1, ...owned];
    let at = opts.indexOf(G.relayIdx); if (at < 0) at = 0;
    G.relayIdx = opts[(at + dir + opts.length) % opts.length];
    SAVE.set('relay', G.relayIdx);
    AudioSys.click();
  };
  drawBtn(34, 466, 34, 30, '‹', () => relayCycle(-1), { color: '#a08468', dark: '#7d6448', font: 16 });
  drawBtn(238, 466, 34, 30, '›', () => relayCycle(1), { color: '#a08468', dark: '#7d6448', font: 16 });

  // การ์ดบูสต์ 2x2
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8'; ctx.textAlign = 'center';
  ctx.fillText('บูสต์ใช้ครั้งเดียว (เลือกได้หลายอัน)', 610, 96);
  BOOSTS.forEach((b, i) => {
    const x = 330 + (i % 2) * 290, y = 110 + Math.floor(i / 2) * 122;
    const on = !!G.boostSel[b.id];
    drawPanel(x, y, 276, 108, 14);
    if (on) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
      roundRect(x + 2, y + 2, 272, 104, 12); ctx.stroke();
    }
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.icon, x + 38, y + 42);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px Trebuchet MS';
    ctx.fillStyle = on ? '#ffd24a' : '#fff';
    ctx.fillText(b.name, x + 70, y + 34);
    ctx.font = '12.5px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText(b.desc, x + 70, y + 55);
    drawBtn(x + 16, y + 66, 244, 32, on ? '✓ เลือกแล้ว — 🪙 ' + b.cost.toLocaleString() : '🪙 ' + b.cost.toLocaleString(),
      () => {
        if (!G.boostSel[b.id] && prepTotal() + b.cost > G.bank) { AudioSys.deny(); return; }
        G.boostSel[b.id] = !G.boostSel[b.id];
        AudioSys.click();
      },
      on ? { color: '#7bd94a', dark: '#57a832', font: 14 } : { color: '#a08468', dark: '#7d6448', font: 14 });
  });

  const total = prepTotal();
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = total > G.bank ? '#ff8888' : '#ffe9b8';
  ctx.fillText('รวมค่าบูสต์: 🪙 ' + total.toLocaleString(), 610, 376);

  // ---- เลือกตอน (EPISODE) — ปลดล็อกด้วยสถิติระยะทาง ----
  ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('เลือกตอน (สถิติไกลสุด ' + G.distBest.toLocaleString() + ' m):', 310, 404);
  EPISODES.forEach((ep2, i) => {
    const bx = 310 + i * 118, by2 = 412, bw = 110, bh = 40;
    const un = epUnlocked(i);
    const cur = G.episode === i;
    drawBtn(bx, by2, bw, bh,
      (un ? ep2.icon + ' ' : '🔒 ') + 'EP' + (i + 1),
      () => {
        if (!un) { AudioSys.deny(); floatText(W / 2, 100, 'ต้องวิ่งให้ถึง ' + ep2.unlock.toLocaleString() + ' m ก่อน!', '#ff8888', true); return; }
        G.episode = i; SAVE.set('ep', i); AudioSys.click();
        floatText(W / 2, 100, 'EPISODE ' + (i + 1) + ': ' + ep2.name, '#ffd24a', true);
      },
      cur && un ? { color: '#7bd94a', dark: '#57a832', font: 13 }
        : un ? { color: '#5cb8e8', dark: '#3d92c4', font: 13 }
        : { color: '#8a8178', dark: '#6e675f', font: 13 });
  });
  ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('▶ EP' + (G.episode + 1) + ' ' + EP().name + (G.episode > 0 ? ' (เร็ว+' + EP().spd + ' พลังลดไวขึ้น)' : ''), 310, 472);

  drawBtn(W / 2 + 30, 480, 270, 44, 'GO!!', prepGo, { color: '#ffb02e', dark: '#e07b12', font: 22, icon: 'play' });
  drawBtn(W - 176, 480, 150, 44, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448', font: 15 });
}
