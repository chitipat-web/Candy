    ctx.fillText(u.name, x + 80, y + 27);
    ctx.font = '13px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(u.desc, x + 80, y + 48);
    // เลเวลพิป
    const lv = G.upg[u.id];
    for (let p = 0; p < u.max; p++) {
      ctx.fillStyle = p < lv ? '#ffd24a' : 'rgba(255,255,255,.18)';
      roundRect(x + 340 + p * 26, y + 25, 20, 16, 5); ctx.fill();
    }
    // ปุ่มซื้อ
    if (lv >= u.max) {
      drawBtn(x + w - 165, y + 12, 145, 42, 'MAX ✓', () => {}, { disabled: true });
    } else {
      const cost = upgCost(u, lv);
      const afford = G.bank >= cost;
      drawBtn(x + w - 165, y + 12, 145, 42, '🪙 ' + cost.toLocaleString(), () => tryUpgrade(u),
        afford ? { color: '#ffb02e', dark: '#e07b12', font: 17 } : { color: '#8a8178', dark: '#6e675f', font: 17 });
    }
  });

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- ตารางอันดับ ---------- */
function drawRank() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ตารางอันดับ', W / 2, 56, 36);
  drawCoinChip(W - 20, 20, G.bank.toLocaleString());

  // ซ้าย: เครื่องนี้
  drawPanel(40, 76, 430, 384, 18);
  ctx.font = 'bold 18px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.fillText('📱 เครื่องนี้', 255, 104);
  if (G.board.length === 0) {
    ctx.font = '15px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ยังไม่มีสถิติ', 255, 250);
  } else {
    G.board.forEach((e, i) => {
      const y = 134 + i * 32;
      ctx.font = i < 3 ? 'bold 15px Trebuchet MS' : '14px Trebuchet MS';
      ctx.fillStyle = i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 62, y);
      ctx.fillText(CHARS[e.c] ? CHARS[e.c].name : '-', 105, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 385, y);
      ctx.fillText(e.d + 'm', 450, y);
    });
  }

  // ขวา: ออนไลน์
  drawPanel(490, 76, 430, 384, 18);
  ctx.font = 'bold 18px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7ee0ff';
  ctx.fillText('🌐 ทั่วโลก — ชื่อ: ' + (G.name || 'ยังไม่ตั้ง'), 705, 104);
  if (G.online === null) {
    ctx.font = '15px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('กำลังโหลด...', 705, 250);
  } else if (G.onlineErr || G.online.length === 0) {
    ctx.font = '14px Trebuchet MS'; ctx.fillStyle = 'rgba(255,233,184,.85)';
    if (G.onlineErr) {
      ctx.fillText('โหมดออนไลน์ยังไม่เปิดใช้งาน', 705, 226);
      ctx.fillText('(ต้องเล่นผ่านลิงก์เว็บ และเชื่อม Upstash Redis', 705, 252);
      ctx.fillText('ใน Vercel: Storage → Upstash → Connect)', 705, 274);
    } else {
      ctx.fillText('ยังไม่มีใครส่งคะแนน — เป็นคนแรกเลย!', 705, 250);
    }
  } else {
    G.online.slice(0, 10).forEach((e, i) => {
      const y = 134 + i * 32;
      ctx.font = i < 3 ? 'bold 15px Trebuchet MS' : '14px Trebuchet MS';
      ctx.fillStyle = e.n === G.name ? '#7bd94a' : i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 512, y);
      ctx.fillText(e.n, 555, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 898, y);
    });
  }

  drawBtn(W / 2 - 230, 476, 200, 44, '✏ ตั้งชื่อผู้เล่น', () => {
    const nm = prompt('ตั้งชื่อผู้เล่น (ไม่เกิน 12 ตัวอักษร)', G.name || '');
    if (nm) { G.name = nm.trim().slice(0, 12); SAVE.set('name', G.name); }
  }, { color: '#5cb8e8', dark: '#3d92c4', font: 17 });
  drawBtn(W / 2 + 30, 476, 200, 44, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- Continue ด้วยคริสตัล ---------- */
function drawContinue() {
  ctx.fillStyle = 'rgba(30,12,2,.7)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('เล่นต่อไหม?', W / 2, 150, 52);
  // วงนับถอยหลัง
  const frac = clamp(G.continueT / 6, 0, 1);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(W / 2, 262, 56, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#7ee0ff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(W / 2, 262, 56, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  ctx.font = 'bold 46px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(G.continueT), W / 2, 278);
  ctx.font = 'bold 17px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('มีคริสตัล 💎 ' + G.crystals + ' — ใช้ 3 เม็ดเพื่อวิ่งต่อจากจุดเดิม', W / 2, 348);
  drawBtn(W / 2 - 230, 384, 220, 56, '💎3  เล่นต่อ!', doContinue, { color: '#5cb8e8', dark: '#3d92c4', font: 21 });
  drawBtn(W / 2 + 10, 384, 220, 56, 'พอแค่นี้', () => settleGameOver(), { color: '#a08468', dark: '#7d6448', font: 19 });
}

/* ---------- game over ---------- */
function drawGameOver() {
  const a = clamp(G.overT / 0.6, 0, 1);
  ctx.fillStyle = `rgba(30,12,2,${a * 0.72})`;
  ctx.fillRect(0, 0, W, H);
  if (a < 1) return;

  drawTitleText('พลังคุกกี้หมดแล้ว!', W / 2, 120, 52, '#ffb98a', '#ff7a4a');

  drawPanel(W / 2 - 240, 150, 480, 236, 20);
  const rows = [
    ['คะแนนรวม', Math.floor(G.score).toLocaleString()],
    ['ระยะทาง', Math.floor(G.dist).toLocaleString() + ' m'],
    ['เยลลี่ที่เก็บ', G.jellies.toLocaleString()],
    ['เหรียญที่ได้ (+โบนัส)', '🪙 ' + G.earned.toLocaleString()],
    G.runBoxes > 0
      ? ['กล่องปริศนา x' + G.runBoxes, '🎁 +' + (G.boxCoins || 0).toLocaleString() + '🪙' + (G.boxGems ? ' +' + G.boxGems + '💎' : '')]
      : G.mode === 'tower' ? ['ชั้นสูงสุดรอบนี้', '🧊 ชั้น ' + G.floorNow]
      : ['ด่านที่ไปถึง', 'ด่าน ' + G.stage],
  ];
  ctx.font = 'bold 21px Trebuchet MS';
  rows.forEach(([k, v], i) => {
    const y = 186 + i * 34;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe9b8'; ctx.fillText(k, W / 2 - 20, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(v, W / 2 + 20, y);
  });
  // ผลภารกิจ
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px Trebuchet MS';
  if (G.missionDone) {
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('📜 ภารกิจสำเร็จ! รับ 🪙 ' + G.missionReward.toLocaleString() + ' +1💎', W / 2, 366);
  } else if (MISSIONS[G.missionIdx]) {
    ctx.fillStyle = 'rgba(255,233,184,.75)';
    ctx.fillText('📜 ภารกิจ: ' + MISSIONS[G.missionIdx].desc, W / 2, 366);
  }

  ctx.textAlign = 'center';
  if (G.newBest && Math.floor(G.time * 3) % 2 === 0) {
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('🎉 สถิติใหม่! 🎉', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🎉 สถิติใหม่! 🎉', W / 2, 424);
  } else if (G.rankPos >= 0 && G.rankPos < 3) {
    ctx.font = 'bold 24px Trebuchet MS';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
  } else {
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 424);
  }

  if (G.overT > 0.9) {
    drawBtn(W / 2 - 230, 448, 220, 54, '▶ เล่นอีกครั้ง', () => startGame(G.mode), { color: '#ffb02e', dark: '#e07b12' });
    drawBtn(W / 2 + 10, 448, 220, 54, '🏠 เมนูหลัก', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
  }
}

/* ---------- shape helpers ---------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s, y - s * 0.5, x, y + s * 0.35);
  ctx.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(G.paused && G.state === 'play' ? 0 : dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
