<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cookie Run Classic — คุกกี้รัน คลาสสิค</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<meta name="theme-color" content="#6e2117">
<meta property="og:title" content="Cookie Run Classic — คุกกี้รัน คลาสสิค">
<meta property="og:description" content="เกมวิ่งคุกกี้สุดคลาสสิค: หนีเตาอบ เก็บเยลลี่ เลือกตัวละคร อัปเกรด แข่งอันดับ — เล่นฟรีบนมือถือและคอม">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%;
    background:#2a1a0e;
    overflow:hidden;
    font-family:'Trebuchet MS','Tahoma',sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,#4a2c14 0%,#1d1006 100%);
  }
  canvas {
    display:block;
    image-rendering:auto;
    box-shadow:0 0 60px rgba(0,0,0,.6);
    border-radius:6px;
  }
</style>

<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
'use strict';
/* ============================================================
   COOKIE RUN CLASSIC  —  คุกกี้รัน คลาสสิค
   วิ่ง กระโดด สไลด์ เก็บเยลลี่ ก่อนพลังคุกกี้จะหมด!
   + เลือกตัวละคร / ร้านค้าอัปเกรด / ตารางอันดับ
   ============================================================ */

const W = 960, H = 540;
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');

/* offscreen canvas สำหรับเรนเดอร์ตัวละครแบบ unified silhouette
   (วาดรวมเป็นก้อนเดียว → ไล่แสงทั้งตัวพาสเดียว → ภาพเนียนไร้รอยต่อ) */
const charCanvas = document.createElement('canvas');
const CSS = 2;                       // ซูเปอร์แซมเปิล 2x ให้ขอบคม
const C_OX = 100, C_OY = 160;        // จุดกำเนิด (กึ่งกลางเท้า) ในพิกัด offscreen
const HS = 1.12;                     // สเกลหัว (ผลวัดสไปรต์จริง: หัว ≈58% ของความสูง)
const SQ = 0.9;                      // บีบแนวตั้งรวม → สัดส่วนป้อมแบบสไปรต์จริง
charCanvas.width = 200 * CSS;
charCanvas.height = 205 * CSS;
const charCtx = charCanvas.getContext('2d');
// แคนวาสประกอบร่างขั้นสุดท้าย: ตีเส้นขอบรอบทุกชิ้น + เงาเซลเชด
const olTmp = document.createElement('canvas');
olTmp.width = charCanvas.width; olTmp.height = charCanvas.height;
const olTmpCtx = olTmp.getContext('2d');
const olOut = document.createElement('canvas');
olOut.width = charCanvas.width; olOut.height = charCanvas.height;
const olOutCtx = olOut.getContext('2d');
const olRim = document.createElement('canvas');
olRim.width = charCanvas.width; olRim.height = charCanvas.height;
const olRimCtx = olRim.getContext('2d');
/* แคชสไปรต์สัตว์เลี้ยงตัวตามในเกม */
const petCC = document.createElement('canvas');
petCC.width = charCanvas.width; petCC.height = charCanvas.height;
const petCCtx = petCC.getContext('2d');
let petCCid = null, petCCt = -1;
function finishSprite(olc) {
  // 1) เงาดำรูปเดียวกับตัวละคร — สีขอบดึงจากสีตัวคุกกี้ (hue เดียวกัน เข้มกว่า)
  olTmpCtx.setTransform(1, 0, 0, 1, 0, 0);
  olTmpCtx.clearRect(0, 0, olTmp.width, olTmp.height);
  olTmpCtx.drawImage(charCanvas, 0, 0);
  olTmpCtx.globalCompositeOperation = 'source-in';
  olTmpCtx.fillStyle = olc || '#4a2c12';
  olTmpCtx.fillRect(0, 0, olTmp.width, olTmp.height);
  olTmpCtx.globalCompositeOperation = 'source-over';
  // 2) ปั๊มเส้นขอบ 8 ทิศรอบตัว แล้ววางตัวจริงทับ
  olOutCtx.setTransform(1, 0, 0, 1, 0, 0);
  olOutCtx.clearRect(0, 0, olOut.width, olOut.height);
  const d = 3.4;
  for (const [dx, dy] of [[d,0],[-d,0],[0,d],[0,-d],[d*0.7,d*0.7],[-d*0.7,d*0.7],[d*0.7,-d*0.7],[-d*0.7,-d*0.7]])
    olOutCtx.drawImage(olTmp, dx, dy);
  olOutCtx.drawImage(charCanvas, 0, 0);
  // 3) เซลเชด: เงาอุ่นด้านล่าง + แสงนวลด้านบน (คลิปตามรูปร่าง)
  olOutCtx.globalCompositeOperation = 'source-atop';
  const g = olOutCtx.createLinearGradient(0, 0, 0, olOut.height);
  g.addColorStop(0, 'rgba(255,255,255,.10)');
  g.addColorStop(0.35, 'rgba(255,255,255,0)');
  g.addColorStop(0.62, 'rgba(120,60,20,0)');
  g.addColorStop(1, 'rgba(120,60,20,.16)');
  olOutCtx.fillStyle = g;
  olOutCtx.fillRect(0, 0, olOut.width, olOut.height);
  olOutCtx.globalCompositeOperation = 'source-over';
  // 4) ริมไลต์: เส้นแสงบาง ๆ ตามขอบด้านบน (ด้านรับแสง) แบบสไปรต์ทางการ
  olRimCtx.setTransform(1, 0, 0, 1, 0, 0);
  olRimCtx.globalCompositeOperation = 'source-over';
  olRimCtx.clearRect(0, 0, olRim.width, olRim.height);
  olRimCtx.drawImage(charCanvas, 0, 0);
  olRimCtx.globalCompositeOperation = 'destination-out';
  olRimCtx.drawImage(charCanvas, 0, 4.5);
  olRimCtx.globalCompositeOperation = 'source-in';
  olRimCtx.fillStyle = '#fff6dc';
  olRimCtx.fillRect(0, 0, olRim.width, olRim.height);
  olOutCtx.globalAlpha = 0.3;
  olOutCtx.drawImage(olRim, 0, 1.5);
  olOutCtx.globalAlpha = 1;
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
/* แหล่งสุ่มสลับได้: ระหว่างสร้างด่านใช้ seed คงที่ → คอร์สเหมือนเดิมทุกรอบ (ฝึกจำทางได้) */
let rngSrc = Math.random;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let courseRng = Math.random;
const rnd  = (a, b) => a + rngSrc() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function hexLerp(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
  const bl = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${bl})`;
}
/* ปรับสีสว่างขึ้น/มืดลง (รับได้ทั้ง #hex และ rgb(...)) */
function shade(col, amt) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  r = clamp(r + amt, 0, 255); g = clamp(g + amt, 0, 255); b = clamp(b + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
/* ผลศึกษาสไปรต์ทางการ 92 ภาพ: เส้นขอบแต่ละชิ้นเป็น "สี hue เดียวกับพื้นแต่เข้มกว่า"
   (ความสว่างขอบ ≈ 0.73 เท่าของสีพื้น) → dk คูณช่องสีตรง ๆ เพื่อคงเฉดสีเดิม */
function dk(col, f) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    if (!m) return col;
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  return `rgb(${(r * f) | 0},${(g * f) | 0},${(b * f) | 0})`;
}
/* โหมดตีเส้นอัตโนมัติ: ระหว่างวาดเครื่องแต่งกาย ทุก fill() ตีขอบสีเดียวกันที่เข้มขึ้นให้เอง
   (ยกเว้นรายละเอียดจิ๋วบนหน้า ที่เกมจริงไม่ตีขอบ) */
let AUTOL = false;
const NO_OL = new Set(['freckles', 'stubble', 'blushdot', 'tear', 'fangs', 'facepaint', 'patch']);
/* โหมดยืนหันหน้าตรงแบบภาพทางการ: แขน-ขาสมมาตร + หน้าอยู่กึ่งกลางหัว
   (ท่าวิ่งในเกมยังเป็นมุมข้างเหมือนเดิม) */
let FRONT = false;
const FACE_P = new Set(['glasses', 'patch', 'freckles', 'blushdot', 'fangs', 'tear', 'stubble', 'facepaint', 'beard']);
const _protoFill = CanvasRenderingContext2D.prototype.fill;
CanvasRenderingContext2D.prototype.fill = function (...a) {
  _protoFill.apply(this, a);
  if (!AUTOL) return;
  const fs = this.fillStyle;
  if (typeof fs !== 'string' || fs.startsWith('rgba')) return;  // ข้ามไล่เฉด/สีโปร่งแสง
  const p2 = a[0] instanceof Path2D ? a[0] : null;
  this.save();
  // 1) เส้นขอบสี hue เดียวกันเข้มกว่า (กฎจากผลวัดสไปรต์จริง)
  this.strokeStyle = dk(fs, 0.68);
  this.lineWidth = 2.2;
  this.lineJoin = 'round'; this.lineCap = 'round';
  p2 ? this.stroke(p2) : this.stroke();
  // 2) เซลเชดรายชิ้น: แถบไฮไลต์ขอบบน + เงาขอบล่าง ตามรูปทรงของชิ้นนั้น
  //    ใช้เกรเดียนต์แนวดิ่งทั้งสไปรต์ แปลงพิกัดกลับด้วย inverse transform
  try {
    p2 ? this.clip(p2) : this.clip();
    const m = this.getTransform().invertSelf();
    const Hc = this.canvas.height;
    const g = this.createLinearGradient(m.e, m.f, m.c * Hc + m.e, m.d * Hc + m.f);
    g.addColorStop(0, 'rgba(255,255,255,.34)');
    g.addColorStop(0.36, 'rgba(255,255,255,.05)');
    g.addColorStop(0.52, 'rgba(70,35,10,0)');
    g.addColorStop(1, 'rgba(70,35,10,.30)');
    this.strokeStyle = g;
    this.lineWidth = 6.5;
    p2 ? this.stroke(p2) : this.stroke();
  } catch (e) {}
  this.restore();
};

/* ---------- persistent save ---------- */
/* ---------- โปรไฟล์ผู้เล่น: ล็อกอินก่อนเข้าเกม แยกเซฟต่อโปรไฟล์ ----------
   โปรไฟล์แรก (id '') ใช้คีย์ cr_ เดิม → เซฟเก่าไม่หาย */
function rawGet(k, d) {
  try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
  catch (e) { return d; }
}
function rawSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let PROFILES = rawGet('cr_profiles', null);
if (!PROFILES) {
  // ครั้งแรก: ถ้ามีเซฟเก่า สร้างโปรไฟล์ให้จากชื่อเดิม
  const legacyName = rawGet('cr_name', null);
  PROFILES = rawGet('cr_coins', null) !== null || legacyName
    ? [{ id: '', name: legacyName || 'ผู้เล่น 1' }] : [];
  rawSet('cr_profiles', PROFILES);
}
let ACTIVE = rawGet('cr_active', PROFILES.length ? PROFILES[0].id : null);
if (ACTIVE !== null && !PROFILES.some(pf => pf.id === ACTIVE)) ACTIVE = PROFILES.length ? PROFILES[0].id : null;
const profPrefix = () => 'cr_' + (ACTIVE ? ACTIVE + '_' : '');
const SAVE = {
  get(k, d) { return ACTIVE === null ? d : rawGet(profPrefix() + k, d); },
  set(k, v) { if (ACTIVE !== null) rawSet(profPrefix() + k, v); }
};
function loginProfile(id) {
  if (id === ACTIVE) { setState('menu'); AudioSys.click(); return; }
  rawSet('cr_active', id);
  location.reload();   // โหลดเซฟของโปรไฟล์นั้นใหม่ทั้งหมด
}
/* ---------- บัญชีคลาวด์: ล็อกอินอีเมล (Gmail) + PIN ซิงก์เซฟข้ามเครื่อง ---------- */
const cloudSession = () => rawGet('cr_cloud', null);
function cloudApi(body) {
  return fetch('/api/account', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(r => r.json());
}
function collectSaveData() {
  const pre = profPrefix();
  const out = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(pre)) continue;
    if (['cr_profiles', 'cr_active', 'cr_cloud'].includes(k)) continue;
    if (pre === 'cr_' && /^cr_p[0-9a-z]+_/.test(k)) continue;   // legacy: ข้ามคีย์ของโปรไฟล์อื่น
    out[k.slice(pre.length)] = rawGet(k, null);
  }
  return out;
}
let cloudBusy = false;
function cloudSave(silent) {
  const cs = cloudSession();
  if (!cs || ACTIVE === null || cloudBusy) return;
  const pf = PROFILES.find(q => q.id === ACTIVE);
  if (!pf || pf.email !== cs.email) return;   // ซิงก์เฉพาะโปรไฟล์ที่ผูกอีเมลนี้
  cloudBusy = true;
  cloudApi({ action: 'save', email: cs.email, pin: cs.pin, data: collectSaveData() })
    .then(r => {
      cloudBusy = false;
      if (!silent) floatText(W / 2, 110, r.ok ? '☁️ ซิงก์เซฟขึ้นคลาวด์แล้ว!' : '☁️ ซิงก์ไม่สำเร็จ', r.ok ? '#7ec8ff' : '#ff8888', true);
    })
    .catch(() => { cloudBusy = false; });
}
function cloudLogin() {
  const prev = cloudSession() || {};
  const email = prompt('อีเมล (Gmail) ของคุณ:', prev.email || '');
  if (!email || !email.includes('@')) return;
  const pin = prompt('PIN ของบัญชี (ตัวเลข 4 หลักขึ้นไป — ครั้งแรก = ตั้งใหม่):', '');
  if (!pin || pin.trim().length < 4) { alert('PIN ต้องยาวอย่างน้อย 4 ตัว'); return; }
  const em = email.trim().toLowerCase();
  cloudApi({ action: 'login', email: em, pin: pin.trim() }).then(r => {
    if (!r.ok) {
      alert(r.reason === 'wrong-pin' ? 'PIN ไม่ถูกต้อง!' :
            r.reason === 'bad-email' ? 'รูปแบบอีเมลไม่ถูกต้อง' :
            'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
      return;
    }
    rawSet('cr_cloud', { email: em, pin: pin.trim() });
    let pf = PROFILES.find(q => q.email === em);
    if (!pf) {
      if (PROFILES.length >= 4) { alert('โปรไฟล์เต็ม (สูงสุด 4)'); return; }
      pf = { id: 'p' + Date.now().toString(36), name: em.split('@')[0].slice(0, 12), email: em };
      PROFILES.push(pf);
      rawSet('cr_profiles', PROFILES);
      rawSet('cr_' + pf.id + '_name', pf.name);
    }
    if (r.data && Object.keys(r.data).length) {
      // มีเซฟบนคลาวด์ → ดึงมาทับเซฟของโปรไฟล์นี้
      const pre = 'cr_' + (pf.id ? pf.id + '_' : '');
      Object.keys(r.data).forEach(k => rawSet(pre + k, r.data[k]));
    }
    rawSet('cr_active', pf.id);
    location.reload();
  }).catch(() => alert('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'));
}

/* ---------- แอดมิน: อีเมลนี้ล็อกอินแล้วปลดล็อกทุกอย่าง ---------- */
const ADMIN_EMAILS = ['chitipat.kao@gmail.com'];
PROFILES.forEach(pf => { if (pf.email && ADMIN_EMAILS.includes(pf.email)) pf.admin = true; });
function isAdminProfile() {
  const pf = PROFILES.find(q => q.id === ACTIVE);
  return !!(pf && (pf.admin || ADMIN_EMAILS.includes(pf.email || '')));
}
function adminGrant() {
  if (!isAdminProfile() || SAVE.get('adminGrant', false)) return;
  G.owned = CHARS.map((_, i) => i);
  G.petsOwned = PETS.map((_, i) => i);
  G.trOwned = TREASURES.map((_, i) => i);
  G.charLv = CHARS.map(() => 8);
  G.petLv = PETS.map(() => 8);
  G.bank = Math.max(G.bank, 9999999);
  G.crystals = Math.max(G.crystals, 999);
  G.distBest = Math.max(G.distBest, 9999);
  SAVE.set('owned', G.owned); SAVE.set('petsOwned', G.petsOwned);
  SAVE.set('trOwned', G.trOwned); SAVE.set('charLv', G.charLv); SAVE.set('petLv', G.petLv);
  SAVE.set('coins', G.bank); SAVE.set('crystals', G.crystals); SAVE.set('distBest', G.distBest);
  SAVE.set('adminGrant', true);
  banner('👑 ADMIN MODE: ปลดล็อกทุกอย่างแล้ว!', '#ffd24a');
  AudioSys.power && AudioSys.power();
}

function createProfile() {
  if (PROFILES.length >= 4) { floatText(W / 2, 120, 'สร้างได้สูงสุด 4 โปรไฟล์', '#ff8888', true); return; }
  const nm = prompt('ตั้งชื่อโปรไฟล์ใหม่ (ไม่เกิน 12 ตัวอักษร)', '');
  if (!nm || !nm.trim()) return;
  const id = 'p' + Date.now().toString(36);
  PROFILES.push({ id, name: nm.trim().slice(0, 12) });
  rawSet('cr_profiles', PROFILES);
  rawSet('cr_' + id + '_name', nm.trim().slice(0, 12));
  loginProfile(id);
}

/* ============================================================
   ตัวละคร — ความสามารถต่างกันแบบเกมจริง
   ============================================================ */
/* ============================================================
   คุกกี้ทั้งหมดของ Cookie Run Classic (เกรด C/B/A/S/SS/L)
   4 ตัวแรกคงตำแหน่งเดิมเพื่อความเข้ากันได้กับเซฟเก่า
   ============================================================ */
const GRADES = { C:'#9aa7b0', B:'#5cb85c', A:'#4a9fe0', S:'#b06ae0', SS:'#e8b03a', L:'#e0563a', E:'#3ac0a0' };

/* ============================================================
   EPISODE — 5 แผนที่ ปลดล็อกด้วยสถิติระยะทาง แต่ละตอนมีธีม/คอร์ส/ความยากต่างกัน
   ============================================================ */
/* ลีกจัดอันดับตามสถิติคะแนนสูงสุด + เหรียญตราความสำเร็จสะสม */
/* วัตถุดิบอบขนม: ดรอประหว่างวิ่ง เก็บครบชุดแล้ว "อบ" รับรางวัลในครัวคุกกี้ */
const INGRS = [

      G.medals.push(i);

      SAVE.set('medals', G.medals); SAVE.set('crystals', G.crystals);
      floatText(W / 2, 130 + G.medals.length * 8, m.icon + ' เหรียญตรา: ' + m.name + '! +2💎', '#ffd24a', true);
      AudioSys.buy();

  });
}

function abDesc(o) {
  const d = [];
  if (o.jumps > 2) d.push('กระโดดกลางอากาศ ' + o.jumps + ' ชั้น');
  if (o.hpBonus) d.push('พลังชีวิต +' + o.hpBonus);
  if (o.revives > 1) d.push('ชุบชีวิต ' + o.revives + ' ครั้ง');
  if (o.boostBonus) d.push('Rocket Start +' + o.boostBonus + ' วิ');
  if (o.comboT > 1.2) d.push('คอมโบค้างนานขึ้น');
  if (o.pitGuard < 1) d.push('ตกหลุมเจ็บลดครึ่ง');
  if (o.ptMul) d.push('แต้มทุกชนิด +' + Math.round((o.ptMul - 1) * 100) + '%');
  if (o.jellyMul) d.push('แต้มเยลลี่ +' + Math.round((o.jellyMul - 1) * 100) + '%');
  if (o.coinMul) d.push('เหรียญ +' + Math.round((o.coinMul - 1) * 100) + '%');
  if (o.drainMul) d.push('พลังลดช้าลง ' + Math.round((1 - o.drainMul) * 100) + '%');
  if (o.btPlus) d.push('BONUS TIME +' + o.btPlus + ' วิ');
  if (o.itemMul) d.push('ไอเทมอยู่นาน +' + Math.round((o.itemMul - 1) * 100) + '%');
  if (o.skillFast) d.push('สกิลชาร์จเร็ว +' + Math.round((o.skillFast - 1) * 100) + '%');
  if (o.magnet) d.push('ดูดเยลลี่ใกล้ตัวตลอดเวลา');
  if (!d.length) d.push('สมดุลทุกด้าน');
  return d.slice(0, 2);
}
function CK(id, name, grade, cost, col, deco, ex) {
  const o = Object.assign({
    id, name, grade, cost,
    body: col[0], icing: col[1] || '#fff8f0', button: col[2] || '#e0453a',
    cheek: 'rgba(242,120,145,.5)', eye: col[3] || '#4a76c9',
    jumps: 2, hpBonus: 0, revives: 1, boostBonus: 0, comboT: 1.2, pitGuard: 1,
    deco: deco || [], eyeS: 'round', sk: 'strike', mate: null,
  }, ex || {});
  o.desc = o.desc || abDesc(o);
  return o;
}

function petDesc(fx) {
  const v = fx.v;
  switch (fx.k) {
    case 'magnet': return ['ดูดเยลลี่รอบตัว', 'รัศมี +' + v];
    case 'coin': return ['เหรียญที่เก็บ +' + v, 'ต่อเหรียญ'];
    case 'regen': return ['ฟื้นพลัง +' + v, 'ต่อวินาที'];
    case 'jelly': return ['เสกเยลลี่พิเศษ', 'ทุก ' + v + ' วิ'];
    case 'pts': return ['โบนัสแต้ม', 'ทุก ' + v + ' วิ'];
    case 'skill': return ['ชาร์จเกจสกิล', '+' + v + '/วิ'];
    case 'destroy': return ['ทำลายสิ่งกีดขวาง', 'ทุก ' + v + ' วิ'];
    case 'coinrain': return ['โปรยเหรียญ', 'ทุก ' + v + ' วิ'];
    case 'bt': return ['BONUS TIME', 'นานขึ้น +' + v + ' วิ'];
    case 'score': return ['แต้มทุกชนิด', '+' + Math.round((v - 1) * 100) + '%'];
    case 'combo': return ['คอมโบค้างนาน', '+' + v + ' วิ'];
    case 'hp': return ['พลังชีวิตสูงสุด', '+' + v];
    case 'boost': return ['Rocket Start', '+' + v + ' วิ'];
    case 'drain': return ['พลังลดช้าลง', Math.round((1 - v) * 100) + '%'];
    case 'bear': return ['แต้มหมีเยลลี่', '+' + Math.round((v - 1) * 100) + '%'];
  }
  return ['ผู้ช่วยนักวิ่ง'];
}
function PE(id, name, grade, cost, shape, col, fx, ex) {
  return { id, name, grade, cost, shape, c1: col[0], c2: col[1] || '#ffffff', c3: col[2] || '#4a2410',
    fx: fx || { k: 'pts', v: 8 }, ex: ex || 0, desc: petDesc(fx || { k: 'pts', v: 8 }) };
}

/* ============================================================
   AUDIO — WebAudio chiptune
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, musicGain: null, muted: false,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.32;
      this.musicGain.connect(this.master);
    } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.25) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  jelly(combo) { this.beep(660 + Math.min(combo, 24) * 30, 0.09, 'square', 0.13, 200); },
  bear()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.14,'square',0.2),i*70)); },
  potion() { [392,523,659].forEach((f,i)=>setTimeout(()=>this.beep(f,0.12,'triangle',0.25),i*60)); },
  power()  { [262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'sawtooth',0.15),i*50)); },

  musicTimer: null, step: 0,
  melody: [
    523,0,659,0, 784,0,659,523, 587,0,659,587, 523,0,392,0,
    523,0,659,0, 784,0,880,784, 659,587,523,587, 659,0,523,0,
    440,0,523,0, 659,0,523,440, 494,0,587,494, 392,0,330,0,
    440,0,523,659, 784,0,659,523, 587,659,587,494, 523,0,0,0
  ],
  bass: [131,0,196,0, 165,0,196,0, 147,0,196,0, 131,0,196,0,
         131,0,196,0, 165,0,196,0, 147,0,175,0, 196,0,196,0],
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.step = 0;
    const tick = () => {
      if (this.muted) { this.step++; return; }
      const t = this.ctx.currentTime;
      const m = this.melody[this.step % this.melody.length];
      const b = this.bass[this.step % this.bass.length];
      if (m) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = m;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.15);
      }
      if (b) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = b;
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.18);
      }
      this.step++;
    };
    this.musicTimer = setInterval(tick, 130);
  },
  stopMusic() { clearInterval(this.musicTimer); this.musicTimer = null; }
};

/* วางเยลลี่ตามวิถีโค้งกระโดดจริง (จำลองฟิสิกส์เดียวกับผู้เล่น)
   → วิ่งตามเยลลี่ = ผ่านเสมอ (ลายเซ็นเกมเพลย์ของต้นฉบับ) */
function jumpArcJellies(x0, type) {
  const v = G.speed;
  const step = 1 / 120;
  let y = GROUND_Y - 36, vy = JUMP_V, x = x0, lastX = x0 - 999;
  for (let t = 0; t < 2; t += step) {
    vy += effGrav(vy) * step;
    y += vy * step;
    x += v * step;
    if (vy > 0 && y >= GROUND_Y - 36) break;
    if (x - lastX >= 47) { J(x, y, type || 'bar'); lastX = x; }
  }
  return x - x0;   // ระยะโดดจริง ณ ความเร็วปัจจุบัน
}
const spdK = () => G.speed / G.baseSpeed;   // ตัวคูณระยะตามความเร็ว

function rowJellies(x, n, y = GROUND_Y - 36, type = 'bar') {
  for (let i = 0; i < n; i++) J(x + i * 46, y, type);
  return n * 46;
}
function arcJellies(x, n, peak = 150) {
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const y = GROUND_Y - 36 - Math.sin(t * Math.PI) * peak;
    J(x + i * 52, y, 'bar');
  }
  return n * 52;
}

  else if (roll < 0.118)  w = spawnItem(x, 'star');
  else if (roll < 0.142)  w = spawnItem(x, 'blast');
  else if (roll < 0.175)  w = spawnItem(x, 'box');
  else {
    const hard = Math.min(G.stage, 6);

      .concat(hard >= 2 ? [3,5,8,10] : [0])
      .concat(hard >= 3 ? [7,8,11] : []);

    // วัตถุดิบอบขนม (ดรอปหายาก)
    if (G.mode === 'normal' && rnd(0, 1) < 0.055) {
      jellyList.push({ x: x + rnd(80, Math.max(120, w - 60)), y: GROUND_Y - rnd(90, 190),
                       type: 'ingr', kind: rndi(0, 4), t: rnd(0, TAU), dead: false });
    }
    if (G.btProgress < 9 && rnd(0, 1) < 0.24 * (1 + trV('letter') * 0.6)) {
      const lj = { x: x + rnd(60, Math.max(80, w - 60)), y: GROUND_Y - rnd(120, 205),
                   type: 'letter', ch: BT_WORD[G.btProgress], t: rnd(0, TAU), dead: false };
      jellyList.push(lj);
    }
  }
  spawnX = x + w + rnd(50, 130) * spdK();
}

}

const keys = {};
let slideHeld = false;
function doSlide(on) { slideHeld = on; }

function doJump() {
  if (G.state === 'play' && CFX().k === 'squad') {
    G.cfxCount = (G.cfxCount || 0) + 1;
    if (G.cfxCount >= CFX().n) {
      G.cfxCount = 0;
      let nd = 0;
      for (let i = obstacles.length - 1; i >= 0 && nd < 3; i--) {
        const ox = obstacles[i].x - worldX;
        if (ox > P.x + 30 && ox < W + 40) {
          sparkle(ox, GROUND_Y - 26, 16, '#ff8ab0');
          obstacles.splice(i, 1); nd++;
        }
      }
      G.coins += 5; G.score += Math.round(250 * lvMul()) * nd;
      banner('📣 ทีมเชียร์บุก! ทำลาย ' + nd + ' + 5🪙', '#ff8ab0');
      AudioSys.power();
    }
  }
  if (G.state !== 'play') return;
  if (P.dead || P.fallingPit || G.bonusT > 0) return;
  if (P.sliding) {
    P.sliding = false;
    P.y -= (P.h - P.h * 0.52) * (P.giantT > 0 ? 1.6 : 1);
  }
  if (P.onGround) {
    P.vy = JUMP_V * (P.giantT > 0 ? 0.94 : 1);
    P.onGround = false; P.jumps = 1;
    P.squash = -0.28;
    AudioSys.jump();
    puff(P.x, P.y + P.h, 6);
  } else if (P.jumps >= 1 && P.jumps < CH().jumps) {
    P.vy = JUMP2_V;
    P.jumps++;
    // สกิลนับจำนวนโดด 2 ชั้น (จิ้งจอกเก้าหาง: ครบแล้วแปลงร่าง)
    if (CFX().trig === 'djump') {
      G.cfxCount = (G.cfxCount || 0) + 1;
      if (G.cfxCount >= CFX().n) {
        G.cfxCount = 0;
        G.formT = CFX().dur;
        G.shake = 6; AudioSys.power();
        banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#ffd24a');
      }
    }
    if (CFX().k === 'jumpPts') {
      const jp = Math.round(CFX().v * lvMul());
      G.score += jp;
      floatText(P.x + 30, P.y - 16, '+' + jp + ' ✨', '#aee4ff');
    }
    AudioSys.jump2();
    puff(P.x, P.y + P.h, 8, '#fff');
  }
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  AudioSys.init(); AudioSys.resume();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (G.state === 'menu') { G.boostSel = {}; setState('prep'); }
    else if (G.state === 'prep') prepGo();
    else if (G.state === 'over') { if (G.overT > 1) startGame(G.mode); }
    else if (['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
    else doJump();
  }
  if (e.code === 'Escape' && ['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'play') togglePause();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); doSlide(true); }
  if (e.code === 'KeyM') { AudioSys.muted = !AudioSys.muted; }
  if (e.code === 'KeyX' && G.state === 'play') useSkill();
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') doSlide(false);
  keys[e.code] = false;
});

/* ---------- UI buttons ---------- */
let uiButtons = [];
function uiClick(x, y) {
  // ไล่จากปุ่มที่วาดหลังสุดก่อน (ป๊อปอัป/เลเยอร์บนต้องชนะปุ่มข้างใต้)
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      AudioSys.click();
      b.cb();
      return true;
    }
  }
  return false;
}
function canvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX - r.left) / r.width * W, (clientY - r.top) / r.height * H];
}
function pointerDown(x, y, id) {
  if (G.state === 'play') {
    if (G.paused) { togglePause(); return; }
    if (Math.hypot(x - W / 2, y - 30) < 26) { togglePause(); return; }   // ปุ่มพักกลางบน
    if (Math.hypot(x - W / 2, y - (H - 66)) < 44) { useSkill(); return; } // ปุ่มสกิลกลางล่าง
    if (x < W / 2) { if (id !== undefined) touches[id] = 'L'; else mouseFly = true; doJump(); }
    else { if (id !== undefined) touches[id] = 'R'; doSlide(true); }
    return;
  }
  if (uiClick(x, y)) return;
  if (G.state === 'over' && G.overT > 1.2) startGame(G.mode);
}

const touches = {};
let mouseFly = false;   // เมาส์กดค้างฝั่งซ้าย (ใช้บังคับบินขึ้นช่วงโบนัส)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  AudioSys.init(); AudioSys.resume();
  for (const t of e.changedTouches) {
    const [x, y] = canvasXY(t.clientX, t.clientY);
    pointerDown(x, y, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (touches[t.identifier] === 'R') doSlide(false);
    delete touches[t.identifier];
  }
});
canvas.addEventListener('mousedown', e => {
  AudioSys.init(); AudioSys.resume();
  const [x, y] = canvasXY(e.clientX, e.clientY);
  pointerDown(x, y);
});
canvas.addEventListener('mouseup', () => { doSlide(false); mouseFly = false; });

/* ============================================================

   ============================================================ */
function startGame(mode, boosts) {
  G.mode = mode || 'normal';
  G.runBoost = boosts || {};
  G.continueUsed = false;
  G.floorNow = 1; G.floorT = 0;
  // คอร์สตายตัวต่อโหมด — เล่นซ้ำเจอด่านเดิม ฝึกให้เก่งขึ้นได้แบบเกมจริง
  if (G.mode === 'normal' && !epUnlocked(G.episode)) G.episode = 0;
  courseRng = mulberry32(G.mode === 'coins' ? 777001 : G.mode === 'tower' ? 555002 : EP().seed);
  setState('play');
  G.time = G.time; G.dist = 0; G.score = 0; G.coins = 0; G.jellies = 0;
  G.combo = 0; G.comboTimer = 0;
  G.hpMax = 100 + CH().hpBonus + G.upg.hp * 12 + (G.runBoost.energy ? 40 : 0)
          + (PFX().k === 'hp' ? Math.round(PFX().v * petFxMul()) : 0) + trV('hp');
  G.combi = PT().id === CH().mate;   // คู่ซี้คุกกี้-สัตว์เลี้ยง = แต้ม +15%
  G.formT = 0; G.cfxT = 0;
  G.obSmashLeft = CFX().k === 'obSmash' ? CFX().v : 0;
  G.relayUsed = false; G.mainCharIdx = -1;
  G.cfxCount = 0; G.noHitT = 0; G.songIdx = 0;
  G.petFxT = 0;
  G.hp = G.hpMax;
  G.stage = 1; G.stageTimer = 0;
  G.hpDrain = 3.2 + (G.mode === 'normal' ? EP().drain : 0);
  G.speed = G.baseSpeed + (G.mode === 'normal' ? EP().spd : 0); G.newBest = false; G.rankPos = -1;
  P.y = GROUND_Y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
  P.sliding = false; P.invT = 0; P.giantT = 0; P.magnetT = 0;
  P.boostT = (2.4 + CH().boostBonus + (PFX().k === 'boost' ? PFX().v : 0) + trV('boost') + G.upg.boost * 0.6) * (G.runBoost.fast ? 2 : 1);
  G.bonusT = 0; G.revives = CH().revives + trV('revive') + (PFX().k === 'revive' ? 1 : 0);
  G.liftLeft = (PFX().k === 'lift' ? Math.round(PFX().v * petFxMul()) : 0) + trV('lift');
  G.skill = 0; G.scoreMulT = 0;
  P.dead = false; P.fallingPit = false; slideHeld = false; G.paused = false;
  G.runBears = 0; G.runStars = 0; G.maxCombo = 0; G.missionDone = false;
  G.btProgress = 0; G.runBoxes = 0;
  jellyList = []; obstacles = []; pits = []; particles = []; floaters = []; platforms = [];
  Pet.x = 60; Pet.y = 280;
  worldX = 0; spawnX = W + 100;
  skyPrev = 0; skyCur = 0; skyT = 1;
  ovenAmt = (G.mode === 'normal' && G.episode > 0) ? 0 : 1;   // ตอนแรกเท่านั้นที่เริ่มในเตาอบ
  if (G.mode === 'coins') banner('🏴‍☠️ เกาะโจรสลัด: กวาดเหรียญให้มากที่สุด!', '#ffd24a');
  else if (G.mode === 'tower') { banner('🧊 หอคอยน้ำแข็ง — ชั้นที่ 1!', '#8fd3ff'); skyPrev = 3; skyCur = 3; }
  else banner('EPISODE ' + (G.episode + 1) + ': ' + EP().name + ' GO!!', '#ffdd44');
  AudioSys.startMusic();
}

function gameOver() {
  if (G.state !== 'play') return true;
  if (G.revives > 0) {
    G.revives--;
    if (CFX().trig === 'revive') {
      G.formT = CFX().dur;
      banner((CFX().tag || '🔥') + ' คืนชีพพร้อมพลัง! อมตะ ' + CFX().dur + ' วิ!', '#ff9d2e');
    }
    if (CFX().k === 'reviveHp') G.hp = Math.min(G.hpMax, G.hp + CFX().v);
    G.hp = G.hpMax * 0.6;
    P.invT = 3;
    G.flash = 0;
    banner('✨ ชุบชีวิต! REVIVE! ✨', '#ffd24a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 26, '#ffd24a');
    return false;
  }
  // RELAY: คุกกี้ตัวสำรองวิ่งต่อจากจุดที่ล้ม (แบบเกมจริง)
  if (G.relayIdx >= 0 && !G.relayUsed && G.relayIdx !== G.charIdx && G.owned.includes(G.relayIdx)) {
    G.relayUsed = true;
    G.mainCharIdx = G.charIdx;
    G.charIdx = G.relayIdx;
    // รีเซ็ตสถานะความสามารถของตัวใหม่
    G.formT = 0; G.cfxT = 0;
    G.obSmashLeft = CFX().k === 'obSmash' ? CFX().v : 0;
    G.combi = PT().id === CH().mate;
    G.hpMax = 100 + CH().hpBonus + G.upg.hp * 12 + (G.runBoost.energy ? 40 : 0)
            + (PFX().k === 'hp' ? Math.round(PFX().v * petFxMul()) : 0) + trV('hp');
    G.hp = G.hpMax;
    P.invT = 3; P.dead = false; P.fallingPit = false;
    P.y = Math.min(P.y, GROUND_Y - P.h - 120); P.vy = 0;
    G.flash = 0; G.shake = 8;
    banner('🏃 RELAY!! ' + CH().name + ' รับไม้ต่อ!', '#7bd94a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 30, '#7bd94a');
    return false;
  }
  // เสนอ Continue ด้วยคริสตัล (ครั้งเดียวต่อรอบ แบบเกมจริง)
  if (!G.continueUsed && G.crystals >= 3) {
    G.state = 'continue';
    G.continueT = 6;
    P.dead = true;
    AudioSys.stopMusic();
    return true;
  }
  settleGameOver();
  return true;
}

function doContinue() {
  G.crystals -= 3; SAVE.set('crystals', G.crystals);
  G.continueUsed = true;
  G.state = 'play';
  P.dead = false; P.fallingPit = false;
  G.hp = G.hpMax * 0.6;
  P.y = Math.min(P.y, GROUND_Y - P.h - 120); P.vy = 0;
  P.invT = 3;
  banner('💎 CONTINUE! ลุยต่อ!', '#7ee0ff');
  AudioSys.power();
  AudioSys.startMusic();
}

function settleGameOver() {
  if (G.mainCharIdx >= 0) { G.charIdx = G.mainCharIdx; G.mainCharIdx = -1; }   // คืนตัวหลักหลังจบรอบ
  if (G.dist > G.distBest) { G.distBest = Math.floor(G.dist); SAVE.set('distBest', G.distBest); }
  const st = G.stats;
  st.runs++; st.dist += Math.floor(G.dist); st.bears += G.runBears;
  st.jellies += G.jellies; st.coins += G.earned || 0; st.bt += G.runStars;
  st.maxCombo = Math.max(st.maxCombo, G.maxCombo);
  SAVE.set('stats', st);
  // เลื่อนลีก: รับรางวัลคริสตัลครั้งเดียวต่อขั้น (นับคะแนนรอบนี้ด้วย)
  const bestNow = Math.max(G.best, G.score);
  let lt = 0; LEAGUES.forEach((l, i) => { if (bestNow >= l.min) lt = i; });
  if (lt > G.leagueClaim) {
    const gain = (lt - G.leagueClaim) * 3;
    G.crystals += gain; G.leagueClaim = lt;
    SAVE.set('crystals', G.crystals); SAVE.set('leagueClaim', lt);
    banner(LEAGUES[lt].icon + ' เลื่อนขั้นลีก ' + LEAGUES[lt].name + '! +' + gain + '💎', '#ffd24a');
  }
  checkMedals();
  cloudSave(true);   // ซิงก์เซฟขึ้นคลาวด์อัตโนมัติ (ถ้าล็อกอินอีเมลอยู่)
  setState('over'); G.overT = 0;
  P.dead = true;
  puff(P.x + 28, P.y + P.h - 6, 16, '#a97b45');
  sparkle(P.x + 28, P.y + 30, 8, '#ffce2e');
  AudioSys.stopMusic();
  AudioSys.over();
  G.score = Math.floor(G.score);
  if (G.score > G.best) { G.best = G.score; G.newBest = true; SAVE.set('best', G.best); }
  // เปิดกล่องปริศนา: เหรียญ + โอกาสได้คริสตัล 20%
  G.boxCoins = 0; G.boxGems = 0;
  for (let i = 0; i < G.runBoxes; i++) {
    G.boxCoins += Math.round(rndi(60, 250) * (CFX().k === 'boxLuck' ? CFX().v : 1) * (1 + trV('box')));
    if (Math.random() < 0.2 * (1 + trV('gem'))) G.boxGems++;
  }
  if (G.boxGems > 0) { G.crystals += G.boxGems; SAVE.set('crystals', G.crystals); }
  G.earned = Math.floor((G.coins + Math.floor(G.score / 400) + G.boxCoins) * (1 + trV('coin')) * (G.runBoost.coin ? 2 : 1) * (CH().coinMul || 1));
  G.bank += G.earned;
  SAVE.set('coins', G.bank);
  const entry = { s: G.score, d: Math.floor(G.dist), c: G.charIdx, t: Date.now() };
  G.board.push(entry);
  G.board.sort((a, b) => b.s - a.s);
  G.board = G.board.slice(0, 10);
  G.rankPos = G.board.indexOf(entry);
  SAVE.set('board', G.board);
  submitOnline();
  // เช็คภารกิจ (+1 คริสตัลด้วย)
  const m = MISSIONS[G.missionIdx];
  if (m && m.check({ dist: G.dist, jellies: G.jellies, score: G.score, combo: G.maxCombo,
                     bears: G.runBears, stars: G.runStars, stage: G.stage })) {
    G.missionDone = true;
    G.missionReward = m.reward;
    G.bank += m.reward;
    G.crystals += 1; SAVE.set('crystals', G.crystals);
    G.missionIdx++;
    SAVE.set('coins', G.bank);
    SAVE.set('mission', G.missionIdx);
  }
  return true;
}
function banner(text, color) { G.banner = { text, color }; G.bannerT = 0; }
function togglePause() {
  G.paused = !G.paused;
  if (G.paused) AudioSys.stopMusic();
  else { AudioSys.startMusic(); AudioSys.click(); }
}

/* ---------- shop / select actions ---------- */
function trySelectChar(i) {
  const c = CHARS[i];
  if (G.owned.includes(i)) {
    G.charIdx = i; SAVE.set('char', i);
    floatText(W / 2, 100, 'เลือก ' + c.name + ' แล้ว!', '#7bd94a', true);
  } else if (G.bank >= c.cost) {
    G.bank -= c.cost;
    G.owned.push(i);
    G.charIdx = i;
    SAVE.set('coins', G.bank); SAVE.set('owned', G.owned); SAVE.set('char', i);
    AudioSys.buy();
    floatText(W / 2, 100, '🎉 ปลดล็อก ' + c.name + '!', '#ffd24a', true);
  } else {
    AudioSys.deny();
    floatText(W / 2, 100, 'เหรียญไม่พอ! ขาดอีก ' + (c.cost - G.bank).toLocaleString() + ' 🪙', '#ff8888', true);
  }
}
/* ---------- สกิลไม้ตายประจำตัวละคร (Magic Candy) ---------- */
function useSkill() {
  if (G.state !== 'play' || G.paused || P.dead || G.skill < 100) return;
  G.skill = 0;
  AudioSys.power();
  G.shake = 6;
  const sk = CH().sk || 'strike';
  if (sk === 'strike') {
    P.boostT = Math.max(P.boostT, 3.6);
    banner('⚔ ' + CH().name + ' STRIKE!!', '#ffd24a');
  } else if (sk === 'heal') {
    G.hp = Math.min(G.hpMax, G.hp + 35);
    P.invT = Math.max(P.invT, 3);
    banner('💚 ฮีล + โล่กันชน!', '#ff9db8');
    sparkle(P.x + 28, P.y + 30, 22, '#7bff9b');
  } else if (sk === 'dash') {
    G.scoreMulT = 6;
    P.magnetT = Math.max(P.magnetT, 6);
    banner('💨 SPEED DASH! แต้ม x2', '#b9c6ff');
  } else if (sk === 'gold') {
    // เปลี่ยนเยลลี่ทั้งจอเป็นเหรียญ
    let n = 0;
    for (const j of jellyList) {
      const jx = j.x - worldX;
      if (!j.dead && jx > -40 && jx < W + 40 && ['bar', 'pink', 'coin'].includes(j.type)) {
        j.dead = true; G.coins += 2; G.score += 60; n++;
        if (n % 3 === 0) sparkle(jx, j.y, 4, '#ffd700');
      }
    }
    jellyList = jellyList.filter(j => !j.dead);
    banner('💰 MIDAS TOUCH! +' + n * 2 + ' เหรียญ', '#ffd24a');
  } else if (sk === 'blast') {
    // ระเบิดเวทเคลียร์สิ่งกีดขวางทั้งจอ
    let n = 0;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ox = obstacles[i].x - worldX;
      if (ox > -40 && ox < W + 60) {
        sparkle(ox, GROUND_Y - 28, 16, '#c9a2ff');
        obstacles.splice(i, 1); n++;
      }
    }
    G.score += 300 * n;
    P.invT = Math.max(P.invT, 2);
    banner('🔮 MAGIC BLAST! ล้าง ' + n + ' สิ่งกีดขวาง', '#c9a2ff');
  } else {
    // bless: เก็บเยลลี่ทั้งจอทันที
    let n = 0;
    for (const j of jellyList) {
      const jx = j.x - worldX;
      if (!j.dead && jx > -40 && jx < W + 40 && !['potion','giant','magnet','star','blast','box','letter','ingr'].includes(j.type)) {
        j.dead = true; collectJelly(j, jx); n++;
      }
    }
    jellyList = jellyList.filter(j => !j.dead);
    banner('✨ BLESSING! +' + n + ' เยลลี่', '#fff3b0');
    sparkle(P.x + 28, P.y + 30, 30, '#ffe066');
  }
}

/* ---------- สมบัติ: ซื้อ / สวม-ถอด (สูงสุด 2 ชิ้น) ---------- */
function tryTreasure(i) {
  const t = TREASURES[i];
  if (!G.trOwned.includes(i)) {
    if (G.bank >= t.cost) {
      G.bank -= t.cost;
      G.trOwned.push(i);
      if (G.trEquip.length < 3) G.trEquip.push(i);
      SAVE.set('coins', G.bank); SAVE.set('trOwned', G.trOwned); SAVE.set('trEquip', G.trEquip);
      AudioSys.buy();
      floatText(W / 2, 100, '🎉 ได้ ' + t.name + '!', '#ffd24a', true);
    } else {
      AudioSys.deny();
      floatText(W / 2, 100, 'เหรียญไม่พอ!', '#ff8888', true);
    }
    return;
  }
  if (G.trEquip.includes(i)) {
    G.trEquip = G.trEquip.filter(x => x !== i);
    floatText(W / 2, 100, 'ถอด ' + t.name, '#ffe9b8', true);
  } else if (G.trEquip.length < 3) {
    G.trEquip.push(i);
    AudioSys.click();
    floatText(W / 2, 100, 'สวม ' + t.name + '!', '#7bd94a', true);
  } else {
    AudioSys.deny();
    floatText(W / 2, 100, 'สวมได้สูงสุด 3 ชิ้น — ถอดชิ้นเก่าก่อน', '#ff8888', true);
  }
  SAVE.set('trEquip', G.trEquip);
}

/* ---------- อันดับออนไลน์ ---------- */
function ensureName() {
  if (!G.name) {
    G.name = 'Cookie' + rndi(100, 999);
    SAVE.set('name', G.name);
  }
  return G.name;
}
function submitOnline() {
  try {
    fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ n: ensureName(), s: G.score, c: G.charIdx }),
    }).catch(() => {});
  } catch (e) {}
}
function fetchOnline() {
  G.online = null; G.onlineErr = false;
  try {
    fetch('/api/scores')
      .then(r => r.json())
      .then(d => {
        if (d.ok && d.top) G.online = d.top;
        else { G.online = []; G.onlineErr = true; }
      })
      .catch(() => { G.online = []; G.onlineErr = true; });
  } catch (e) { G.online = []; G.onlineErr = true; }
}

/* ฟักไข่สุ่มสัตว์เลี้ยง: ตัวซ้ำ = เลเวลอัป (แบบเกมจริง) */
function hatchEgg(premium) {
  if (premium) {
    if (G.crystals < 5) { AudioSys.deny(); floatText(W / 2, 100, 'คริสตัลไม่พอ (ต้องใช้ 5💎)', '#ff8888', true); return; }
    G.crystals -= 5; SAVE.set('crystals', G.crystals);
  } else {
    if (G.bank < 800) { AudioSys.deny(); floatText(W / 2, 100, 'เหรียญไม่พอ (ต้องใช้ 800🪙)', '#ff8888', true); return; }
    G.bank -= 800; SAVE.set('coins', G.bank);
  }
  let pick;
  const allIdx = PETS.map((q, i2) => i2);
  if (premium) {
    // ไข่ทอง: การันตีตัวใหม่ (ถ้ามี) เน้นเกรดสูง
    const pool = allIdx.filter(i2 => !G.petsOwned.includes(i2));
    if (pool.length) {
      const hi = pool.filter(i2 => 'SLE'.includes(PETS[i2].grade));
      const src = hi.length && Math.random() < 0.75 ? hi : pool;
      pick = src[rndi(0, src.length - 1)];
    } else pick = allIdx[rndi(0, allIdx.length - 1)];
  } else {
    // ไข่ธรรมดา: สุ่มตามเกรด C30/B26/A18/S23/L2/E1
    const r = Math.random() * 100;
    const g = r < 30 ? 'C' : r < 56 ? 'B' : r < 74 ? 'A' : r < 97 ? 'S' : r < 99 ? 'L' : 'E';
    const gp = allIdx.filter(i2 => PETS[i2].grade === g);
    pick = gp[rndi(0, gp.length - 1)];
  }
  AudioSys.buy();
  if (!G.petsOwned.includes(pick)) {
    G.petsOwned.push(pick);
    G.petIdx = pick;
    SAVE.set('petsOwned', G.petsOwned); SAVE.set('pet', pick);
    floatText(W / 2, 100, '🥚 ฟักได้ตัวใหม่: ' + PETS[pick].name + '!', '#ffd24a', true);
  } else if ((G.petLv[pick] || 1) < 8) {
    G.petLv[pick] = (G.petLv[pick] || 1) + 1;
    SAVE.set('petLv', G.petLv);
    floatText(W / 2, 100, '🥚 ได้ ' + PETS[pick].name + ' ซ้ำ → Lv.' + G.petLv[pick] + '!', '#7bd94a', true);
  } else {
    const refund = premium ? 1000 : 300;
    G.bank += refund; SAVE.set('coins', G.bank);
    floatText(W / 2, 100, PETS[pick].name + ' เลเวลเต็มแล้ว → คืน ' + refund + '🪙', '#ffe9b8', true);
  }
}

function trySelectPet(i) {
  const p = PETS[i];
  if (G.petsOwned.includes(i)) {
    G.petIdx = i; SAVE.set('pet', i);
    floatText(W / 2, 100, 'เลือก ' + p.name + ' แล้ว!', '#7bd94a', true);
  } else if (G.bank >= p.cost) {
    G.bank -= p.cost;
    G.petsOwned.push(i);
    G.petIdx = i;
    SAVE.set('coins', G.bank); SAVE.set('petsOwned', G.petsOwned); SAVE.set('pet', i);
    AudioSys.buy();
    floatText(W / 2, 100, '🎉 ปลดล็อก ' + p.name + '!', '#ffd24a', true);
  } else {
    AudioSys.deny();
    floatText(W / 2, 100, 'เหรียญไม่พอ! ขาดอีก ' + (p.cost - G.bank).toLocaleString() + ' 🪙', '#ff8888', true);
  }
}
function tryUpgrade(u) {
  const lv = G.upg[u.id];
  if (lv >= u.max) return;
  const cost = upgCost(u, lv);
  if (G.bank >= cost) {
    G.bank -= cost;
    G.upg[u.id]++;
    SAVE.set('coins', G.bank); SAVE.set('upg', G.upg);
    AudioSys.buy();
    floatText(W / 2, 100, u.icon + ' ' + u.name + ' → เลเวล ' + G.upg[u.id] + '!', '#ffd24a', true);
  } else {
    AudioSys.deny();
    floatText(W / 2, 100, 'เหรียญไม่พอ!', '#ff8888', true);
  }
}

/* ---------- particles ---------- */
function puff(x, y, n, c = '#e8d5b5') {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: rnd(-80, 80), vy: rnd(-140, -20), life: rnd(0.3, 0.6), t: 0, c, r: rnd(3, 7) });
}
function sparkle(x, y, n, c) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 240);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rnd(0.35, 0.7), t: 0, c, r: rnd(2, 5), star: true });
  }
}
function floatText(x, y, text, c = '#fff', big = false) {
  floaters.push({ x, y, text, c, t: 0, big });
}

/* ============================================================
   UPDATE
   ============================================================ */
const isInvincible = () => P.invT > 0 || P.giantT > 0 || P.boostT > 0 || G.bonusT > 0 || G.formT > 0;
const canSmash = () => P.giantT > 0 || P.boostT > 0 || G.formT > 0;

function hurt(amount) {
  if (isInvincible() || P.dead) return;
  G.noHitT = 0;   // รีเซ็ตสตรีคไม่โดนชน (มินต์ช็อกโก)
  const cf = CFX();
  if (cf.k === 'obSmash' && (G.obSmashLeft || 0) > 0) {
    // พริกแดง: ชนแล้วทุบสิ่งกีดขวางแตกแทนการเจ็บ (จำกัดครั้ง)
    G.obSmashLeft--;
    G.shake = 8;
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 18, '#ff9d2e');
    floatText(P.x, P.y - 20, '💢 ทุบแตก! (เหลือ ' + G.obSmashLeft + ')', '#ff9d2e', true);
    P.invT = Math.max(P.invT, 0.8);
    return;
  }
  if (cf.k === 'hitGuard') amount *= cf.v;   // เจ้าหญิง/กล้ามโต/แฟรี่: ลดดาเมจชน
  G.hp -= amount;
  G.combo = 0;
  P.invT = 2.0;
  P.stumbleT = 0.5;
  G.shake = 12; G.flash = 0.5;
  AudioSys.crash();
  sparkle(P.x + P.w / 2, P.y + P.h / 2, 14, '#ff6b6b');
  if (G.hp <= 0) { G.hp = 0; gameOver(); }
}

function update(dt) {
  G.time += dt;
  if (G.bannerT < 99) G.bannerT += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  G.fade = Math.max(0, G.fade - dt * 2.6);
  if (skyT < 1) skyT = Math.min(1, skyT + dt / 1.8);

  for (const c of clouds) {
    c.x -= (c.v + (G.state === 'play' ? G.speed * 0.04 : 4)) * dt;
    if (c.x < -160) { c.x = W + rnd(20, 120); c.y = rnd(30, 170); }
  }
  for (const b of bokeh) {
    b.x -= (b.v + (G.state === 'play' ? G.speed * 0.06 : 3)) * dt;
    b.y += Math.sin(G.time * 0.7 + b.tw) * 6 * dt;
    b.y -= 30 * ovenAmt * dt;                     // ในเตา: ประกายไฟลอยขึ้น
    if (b.y < 10) b.y = 430;
    if (b.x < -40) { b.x = W + rnd(10, 60); b.y = rnd(30, 430); }
  }
  // ฉากเตาอบค่อย ๆ เปลี่ยนเป็นโลกภายนอกเมื่อถึงด่าน 3
  const ovTarget = (G.state === 'play' || G.state === 'over') && G.stage < 3 && G.mode !== 'tower' && !(G.mode === 'normal' && G.episode > 0) ? 1 : 0;
  ovenAmt += (ovTarget - ovenAmt) * Math.min(1, 1.3 * dt);
  if (ovTarget === 1 && ovenAmt > 0.99) ovenAmt = 1;
  P.squash += (0 - P.squash) * Math.min(1, 10 * dt);
  P.stumbleT = Math.max(0, P.stumbleT - dt);
  for (const t of trail) {
    t.t += dt;
    t.x -= (G.state === 'play' ? G.speed * 1.1 : 60) * dt;
  }
  trail = trail.filter(t => t.t < 0.45);

  if (G.state !== 'play') {
    if (G.state === 'over') G.overT += dt;
    if (G.state === 'continue') {
      G.continueT -= dt;
      if (G.continueT <= 0) settleGameOver();
    }
    updateParticles(dt);
    P.anim += dt * 8;
    Pet.wing += dt * 14;
    return;
  }

  /* --- ความเร็ว & ด่าน --- */
  G.stageTimer += dt;
  if (G.stageTimer >= G.stageLen && G.speed < G.maxSpeed) {
    G.stageTimer = 0; G.stage++;
    G.speed = Math.min(G.maxSpeed, G.speed + 62);
    G.hpDrain += 0.35;
    skyPrev = skyCur;
    skyCur = G.mode === 'tower' ? 3 : G.stage < 3 ? 0 : (G.stage - 3) % SKIES.length;
    skyT = 0;
    if (G.mode !== 'tower' && G.stage === 3) banner('🎉 หนีออกจากเตาอบสำเร็จ! 🎉', '#ffd24a');
    else banner('SPEED UP!  ⚡ ด่าน ' + G.stage, '#7ee0ff');
    AudioSys.speedup();
  }

  /* --- HP ลดตามเวลา --- */
  /* ---- ความสามารถพิเศษประจำคุกกี้ (ตามเกมต้นฉบับ) ---- */
  const cf = CFX();
  G.noHitT = (G.noHitT || 0) + dt;
  if (cf.k === 'slamLand' && slideHeld && !P.onGround && G.bonusT <= 0 && !P.fallingPit)
    P.vy = Math.max(P.vy, 1500);   // กบฏ: กดสไลด์กลางอากาศ = ดิ่งลงพื้นทันที
  G.formT = Math.max(0, (G.formT || 0) - dt);
  if (['spawnSp', 'destroyIv', 'coinIv', 'transform', 'songs', 'streak'].includes(cf.k) && cf.trig === undefined) {
    G.cfxT = (G.cfxT || 0) + dt;
    let iv = cf.iv * (1 - ((G.charLv[G.charIdx] || 1) - 1) * 0.04);
    if (cf.k === 'transform' && cf.low) iv *= 0.45 + 0.55 * (G.hp / G.hpMax);   // แปลงถี่ขึ้นเมื่อพลังต่ำ (มนุษย์หมาป่า)
    if (G.cfxT >= iv) {
      G.cfxT = 0;
      if (cf.k === 'spawnSp') {
        // สร้างเยลลี่พิเศษข้างหน้าให้เก็บ (สกิลสายเสกเยลลี่)
        if (cf.lt && G.btProgress < 9)
          jellyList.push({ x: worldX + P.x + 360, y: GROUND_Y - 120,
                           type: 'letter', ch: 'BONUSTIME'[G.btProgress], t: 0, dead: false });
        for (let q = 0; q < (cf.n || 3); q++)
          jellyList.push({ x: worldX + P.x + 380 + q * 44, y: GROUND_Y - 70 - Math.sin(q * 0.9) * 34, type: 'pink', t: 0, dead: false });
        sparkle(P.x + 60, P.y + 20, 10, '#ff9db8');
        floatText(P.x + 40, P.y - 24, '✨ ' + (cf.tag || 'เยลลี่พิเศษ') + '!', '#ff9db8');
      } else if (cf.k === 'destroyIv') {
        const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 20; });
        if (o) {
          obstacles.splice(obstacles.indexOf(o), 1);
          const ox = o.x - worldX;
          const pts2 = Math.round(300 * lvMul());
          G.score += pts2;
          sparkle(ox, GROUND_Y - 26, 20, '#ffd24a');
          floatText(ox, GROUND_Y - 66, (cf.tag || '💥') + ' +' + pts2, '#ffd24a', true);
          if (cf.jelly) for (let q = 0; q < 2; q++)
            jellyList.push({ x: o.x + q * 40, y: GROUND_Y - 60, type: 'pink', t: 0, dead: false });
          if (cf.coins) { G.coins += cf.coins; floatText(ox, GROUND_Y - 90, '🪙 +' + cf.coins, '#ffd24a'); }
        }
      } else if (cf.k === 'coinIv') {
        G.coins += cf.n;
        AudioSys.jelly(10);
        sparkle(P.x + 50, P.y, 12, '#ffd700');
        floatText(P.x + 40, P.y - 24, (cf.tag || '🪙') + ' +' + cf.n, '#ffd24a', true);
      } else if (cf.k === 'songs') {
        // แคโรล: วนเพลง 3 แบบ ชีวิต/เปลี่ยนสิ่งกีดขวางเป็นเยลลี่/เหรียญ
        G.songIdx = ((G.songIdx || 0) + 1) % 3;
        if (G.songIdx === 0) {
          G.hp = Math.min(G.hpMax, G.hp + 12);
          banner('🎵 เพลงแห่งชีวิต +HP', '#7bff9b');
        } else if (G.songIdx === 1) {
          const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 20; });
          if (o) {
            obstacles.splice(obstacles.indexOf(o), 1);
            for (let q = 0; q < 2; q++)
              jellyList.push({ x: o.x + q * 40, y: GROUND_Y - 60, type: 'pink', t: 0, dead: false });
            sparkle(o.x - worldX, GROUND_Y - 26, 14, '#8fd8c8');
          }
          banner('🎵 เพลงแห่งการเปลี่ยนแปลง', '#8fd8c8');
        } else {
          G.coins += 4;
          banner('🎵 เพลงแห่งความอุดม +4🪙', '#ffd24a');
        }
        AudioSys.jelly(14);
      } else if (cf.k === 'streak') {
        // มินต์ช็อกโก: ไม่ชนต่อเนื่อง = สีไวโอลินเสกเหรียญ (ชนแล้วสตรีคขาด)
        if (G.noHitT > 6) {
          G.coins += 3;
          G.score += Math.round(100 * lvMul());
          sparkle(P.x + 40, P.y + 10, 8, '#8fd8c8');
          floatText(P.x + 30, P.y - 20, '🎻 สตรีค +3🪙', '#8fd8c8');
        }
      } else {
        G.formT = cf.dur;
        G.shake = 6; AudioSys.power();
        banner((cf.tag || '✨ แปลงร่าง!') + ' อมตะ ' + cf.dur + ' วิ!', '#ffd24a');
      }
    }
  }

  /* ---- เอฟเฟกต์สัตว์เลี้ยง (ทุกชนิด สเกลตามเลเวล) ---- */
  const pf = PFX();
  if (pf.k === 'regen') G.hp = Math.min(G.hpMax, G.hp + pf.v * petFxMul() * dt);
  if (pf.k === 'skill') G.skill = Math.min(100, G.skill + pf.v * petFxMul() * dt);
  if (['jelly', 'pts', 'destroy', 'coinrain', 'give', 'bearify', 'scout', 'p2c', 'c2p'].includes(pf.k)) {
    G.petFxT = (G.petFxT || 0) + dt;
    const iv = Math.max(3, pf.v * (1 - (petLvNow() - 1) * 0.05));
    if (G.petFxT >= iv) {
      G.petFxT = 0;
      if (pf.k === 'jelly') {
        const pts2 = Math.round(180 * lvMul());
        G.score += pts2; sparkle(Pet.x, Pet.y, 10, '#ff9db8');
        floatText(Pet.x, Pet.y - 20, '🍬 +' + pts2, '#ff9db8');
      } else if (pf.k === 'pts') {
        const pts2 = Math.round(120 * lvMul());
        G.score += pts2; floatText(Pet.x, Pet.y - 20, '+' + pts2, '#ffe066');
      } else if (pf.k === 'coinrain') {
        const n = 3 + Math.floor(petLvNow() / 3);
        G.coins += n; floatText(Pet.x, Pet.y - 20, '🪙 +' + n, '#ffd24a');
        AudioSys.jelly(8);
      } else if (pf.k === 'give') {
        // แจกไอเทม/อักษร/ดาว/หมี ตามสกิลจริงของสัตว์เลี้ยง
        const it = pf.it === 'rand' ? ['potion', 'giant', 'magnet'][rndi(0, 2)] : pf.it;
        const jj = { x: worldX + P.x + 430, y: GROUND_Y - 96, type: it, t: 0, dead: false };
        if (it === 'letter') {
          if (G.btProgress < 9) jj.ch = 'BONUSTIME'[G.btProgress]; else jj.type = 'pink';
        }
        jellyList.push(jj);
        sparkle(Pet.x + 14, Pet.y, 8, '#ffe066');
        floatText(Pet.x, Pet.y - 20, '🎁 ' + PT().name + '!', '#ffe066');
      } else if (pf.k === 'scout') {
        // วินดี้: บินนำหน้าไปเก็บเยลลี่ให้ (สกิลจริง)
        let ns = 0;
        for (const j2 of jellyList) {
          const jx2 = j2.x - worldX;
          if (!j2.dead && jx2 > P.x + 80 && jx2 < P.x + 400 && ns < 8 &&
              ['bar', 'pink', 'coin'].includes(j2.type)) {
            j2.dead = true; collectJelly(j2, jx2); ns++;
          }
        }
        jellyList = jellyList.filter(j2 => !j2.dead);
        if (ns) { sparkle(P.x + 220, GROUND_Y - 90, 12, '#8fd8c8'); floatText(P.x + 200, GROUND_Y - 130, '🌬 ' + PT().name + ' เก็บให้ ' + ns + '!', '#8fd8c8'); }
      } else if (pf.k === 'p2c') {
        // ตาชั่งเหรียญ: แปลงแต้มเป็นเหรียญ (สกิลจริง)
        if (G.score >= 200) {
          G.score -= 200; G.coins += 3;
          floatText(Pet.x, Pet.y - 20, '⚖ -200 แต้ม → +3🪙', '#ffd24a');
        }
      } else if (pf.k === 'c2p') {
        // ตาชั่งเยลลี่: แปลงเหรียญเป็นแต้ม (สกิลจริง)
        if (G.coins >= 2) {
          G.coins -= 2;
          const cp = Math.round(300 * lvMul());
          G.score += cp;
          floatText(Pet.x, Pet.y - 20, '⚖ -2🪙 → +' + cp + ' แต้ม', '#aee4ff');
        }
      } else if (pf.k === 'bearify') {
        // เปลี่ยนเยลลี่ธรรมดาข้างหน้าเป็นหมีเยลลี่ (Bear Jelly Party)
        let nb = 0;
        for (const j2 of jellyList) {
          const jx2 = j2.x - worldX;
          if (!j2.dead && j2.type === 'bar' && jx2 > P.x + 60 && jx2 < W && nb < 4) {
            j2.type = 'bear'; j2.v = undefined; nb++;
          }
        }
        if (nb) { sparkle(Pet.x + 14, Pet.y, 10, '#ffb347'); floatText(Pet.x, Pet.y - 20, '🐻 BEAR PARTY x' + nb, '#ffb347', true); }
      } else {
        const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 30; });
        if (o) {
          obstacles.splice(obstacles.indexOf(o), 1);
          const ox = o.x - worldX;
          if (pf.c) { G.coins += pf.c; floatText(ox, GROUND_Y - 86, '🪙 +' + pf.c, '#ffd24a'); }
          sparkle(ox, GROUND_Y - 26, 20, '#ff9d2e');
          floatText(ox, GROUND_Y - 60, '💥 เพื่อนซี้เคลียร์ทาง!', '#ff9d2e', true);
        }
      }
    }
  }
  if (G.bonusT <= 0) G.hp -= G.hpDrain * (1 - trV('drain')) * (CH().drainMul || 1) * (PFX().k === 'drain' ? 1 - (1 - PFX().v) * petFxMul() : 1) * dt;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }

  const spdMul = (P.giantT > 0 ? 1.12 : 1) * (P.boostT > 0 ? 2.1 : 1) * (G.bonusT > 0 ? 1.35 : 1) * (G.formT > 0 ? 1.12 : 1) * (1 + (CFX().k === 'spdPlus' ? CFX().v : 0)) * (1 + (PFX().k === 'spd' ? PFX().v : 0));
  const move = G.speed * dt * spdMul;
  worldX += move;
  G.dist += move / 40;
  G.score += move * 0.02;

  while (spawnX < worldX + W + 700) {
    rngSrc = courseRng;      // สร้างด่านด้วย seed คงที่
    spawnPattern();
    rngSrc = Math.random;
  }

  /* --- หอคอยน้ำแข็ง: ผ่านชั้นทุก 20 วิ --- */
  if (G.mode === 'tower') {
    G.floorT += dt;
    if (G.floorT >= 20) {
      G.floorT = 0;
      G.floorNow++;
      G.coins += 40;
      G.speed = Math.min(G.maxSpeed, G.speed + 22);
      if (G.floorNow % 5 === 0) {
        G.crystals++; SAVE.set('crystals', G.crystals);
        banner('🧊 ชั้น ' + G.floorNow + '! รางวัล +40🪙 +1💎', '#8fd3ff');
      } else banner('🧊 ผ่านชั้น ' + (G.floorNow - 1) + '! ขึ้นชั้น ' + G.floorNow, '#8fd3ff');
      if (G.floorNow > G.towerBest) { G.towerBest = G.floorNow; SAVE.set('towerBest', G.towerBest); }
      AudioSys.speedup();
    }
  }

  /* --- timers --- */
  P.invT = Math.max(0, P.invT - dt);
  P.giantT = Math.max(0, P.giantT - dt);
  P.magnetT = Math.max(0, P.magnetT - dt);
  P.boostT = Math.max(0, P.boostT - dt);
  G.scoreMulT = Math.max(0, G.scoreMulT - dt);
  if (G.bonusT > 0) {
    G.bonusT -= dt;
    // หมีเยลลี่ยักษ์รอปิดท้ายโบนัสไทม์ (แบบเกมจริง)
    if (G.bonusT <= 1.1 && !bonusBearSpawned) {
      bonusBearSpawned = true;
      const wx = worldX + W + 60;
      J(wx, bonusPathY(wx), 'bear');
    }
    if (G.bonusT <= 0) { G.bonusT = 0; bonusLetterQueue = []; P.invT = Math.max(P.invT, 1.5); }
  }
  G.comboTimer -= dt;
  if (G.comboTimer <= 0) G.combo = 0;
  P.anim += dt * (8 + G.speed / 90);

  // ฝุ่นแป้งฟุ้งใต้เท้าตอนวิ่ง
  if (P.onGround && !P.sliding && Math.random() < 0.25)
    puff(P.x + rnd(0, 18), GROUND_Y - 3, 1, '#c59a63');
  // ประกายทองระยิบพลิ้วตามหลัง (แบบเกมจริง)
  if (Math.random() < 0.35)
    particles.push({ x: P.x - 4, y: P.y + rnd(12, 66), vx: rnd(-60, -20), vy: rnd(-40, 15),
                     life: rnd(0.3, 0.55), t: 0, c: Math.random() < 0.7 ? '#ffd76a' : '#fff0c0',
                     r: rnd(1.8, 3.4), star: true });

  // สายรุ้งตามหลังช่วงพลังพิเศษ
  if (P.boostT > 0 || G.bonusT > 0 || P.giantT > 0) {
    const scale0 = P.giantT > 0 ? 1.6 : 1;
    const ph0 = (P.sliding ? P.h * 0.52 : P.h) * scale0;
    trail.push({ x: P.x + 6, y: P.y + ph0 * 0.5, hue: (G.time * 240) % 360, t: 0 });
  }

  /* --- สัตว์เลี้ยง --- */
  Pet.wing += dt * 14;
  const petTX = P.x - 62, petTY = P.y - 34 + Math.sin(G.time * 4) * 10;
  Pet.x += (petTX - Pet.x) * 6 * dt;
  Pet.y += (petTY - Pet.y) * 6 * dt;
  for (const j of jellyList) {
    if (j.dead) continue;
    const jx = j.x - worldX;
    if (jx < -40 || jx > 300) continue;
    if (['potion','giant','magnet','star','bear','blast','box','letter'].includes(j.type)) continue;
    const petR = 36 + (PFX().k === 'magnet' ? PFX().v * petFxMul() : 0);   // สัตว์เลี้ยงสายแม่เหล็ก
    if (Math.hypot(jx - Pet.x, j.y - Pet.y) < petR) { j.dead = true; collectJelly(j, jx); }
  }

  /* --- ฟิสิกส์ผู้เล่น --- */
  const scale = P.giantT > 0 ? 1.6 : 1;

  if (P.onGround && !P.fallingPit && G.bonusT <= 0) {
    const dh = (P.h - P.h * 0.52) * scale;
    if (slideHeld && !P.sliding) {
      P.sliding = true;
      P.y += dh;
      AudioSys.slide();
    } else if (!slideHeld && P.sliding) {
      P.sliding = false;
      P.y -= dh;
    }
  }

  const pw = P.w * scale;
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  const footX = P.x + pw * 0.5;

  if (G.bonusT > 0) {
    /* บินบังคับเอง: ค้างโดด = ขึ้น, ค้างสไลด์ = ดิ่ง, ปล่อย = ร่อนลงช้า ๆ */
    P.fallingPit = false; P.sliding = false;
    const flyUp = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] ||
                  Object.values(touches).includes('L') || mouseFly;
    P.vy += (flyUp ? -2700 : slideHeld ? 2700 : 1150) * dt;
    P.vy = clamp(P.vy, -450, 450);
    P.y += P.vy * dt;
    const yMin = 76, yMax = GROUND_Y - ph - 4;
    if (P.y < yMin) { P.y = yMin; P.vy = Math.max(P.vy, 0); }
    if (P.y > yMax) { P.y = yMax; P.vy = Math.min(P.vy, 0); }
    P.onGround = false; P.jumps = 1;
    if (Math.random() < 0.6) sparkle(P.x - 10, P.y + ph / 2, 1, '#ffd24a');
  } else {
    const prevFoot = P.y + ph;
    P.vy += effGrav(P.vy) * dt;
    if (slideHeld && !P.onGround)
      P.vy += GRAV * 1.4 * dt;               // ดิ่งลงเร็ว (fast fall)
    P.y += P.vy * dt;

    let overPit = false;
    for (const p of pits) {
      const px = p.x - worldX;
      if (footX > px + 14 && footX < px + p.w - 14) overPit = true;
    }

    if (!P.fallingPit) {
      let landed = false;
      if (P.vy >= 0) {
        for (const pl of platforms) {
          const px = pl.x - worldX;
          if (footX > px && footX < px + pl.w &&
              prevFoot <= pl.y + 10 && P.y + ph >= pl.y) {
            P.y = pl.y - ph;
            if (!P.onGround) { puff(footX, pl.y, 4); P.squash = 0.32; }
            P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
            break;
          }
        }
      }
      if (!landed && P.y + ph >= GROUND_Y) {
        if (overPit && !canSmash()) {
          P.fallingPit = true;
          AudioSys.fall();
        } else {
          P.y = GROUND_Y - ph;
          if (!P.onGround) { puff(P.x + pw / 2, GROUND_Y, 4); P.squash = 0.32; }
          P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
        }
      }
      if (!landed) P.onGround = false;
    } else {
      if (P.y > H + 60) hurtFromPit();
    }
  }

  /* --- เก็บเยลลี่ --- */
  const cx = P.x + pw / 2, cy = P.y + ph / 2;
  for (const j of jellyList) {
    if (j.dead) continue;
    let jx = j.x - worldX;
    if (jx < -80) { j.dead = true; continue; }
    if (jx > W + 80) break;
    if ((P.magnetT > 0 || P.boostT > 0 || G.bonusT > 0 || trV('magnet') > 0 || CH().magnet) && !['potion','giant','magnet','star','blast','box','letter','ingr'].includes(j.type)) {
      const dx = cx - jx, dy = cy - j.y;
      const d = Math.hypot(dx, dy);
      // ช่วงโบนัสดูดรัศมีสั้นลง จะได้เห็นตัวอักษร BONUS ชัด ๆ ก่อนบินทะลุ
      const attractR = G.bonusT > 0 ? 135 : (P.magnetT > 0 || P.boostT > 0) ? 260 : 95;
      if (d < attractR) { j.x += dx / d * 620 * dt; j.y += dy / d * 620 * dt; jx = j.x - worldX; }
    }
    const r = JSIZE[j.type] / 2 + (P.giantT > 0 ? 30 : 14);
    if (Math.abs(jx - cx) < r + pw / 2 - 8 && Math.abs(j.y - cy) < r + ph / 2 - 4) {
      j.dead = true;
      collectJelly(j, jx);
    }
  }
  jellyList = jellyList.filter(j => !j.dead);

  /* --- ชนสิ่งกีดขวาง --- */
  for (const o of obstacles) {
    if (o.dead) continue;
    const ox = o.x - worldX;
    if (ox < -120) { o.dead = true; continue; }
    if (ox > W + 60) break;
    if (G.bonusT > 0) continue;
    let hit = false;
    if (o.type === 'bar') {
      const barBottom = GROUND_Y - 62;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + 110 && P.y < barBottom) hit = true;
    } else {
      const ow = o.type === 'spike' ? 46 : 56, oh = o.type === 'spike' ? 46 : 52;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + ow && P.y + ph > GROUND_Y - oh + 6) hit = true;
    }
    if (hit) {
      if (canSmash()) {
        o.dead = true;
        sparkle(ox + 20, GROUND_Y - 40, 16, '#ffd24a');
        G.score += 100; floatText(ox, GROUND_Y - 90, 'SMASH! +100', '#ffd24a', true);
        AudioSys.noise(0.15, 0.3);
      } else {
        hurt(14 + G.stage);
      }
    }
  }
  obstacles = obstacles.filter(o => !o.dead);
  pits = pits.filter(p => p.x - worldX > -400);
  platforms = platforms.filter(p => p.x + p.w - worldX > -200);

  updateParticles(dt);
}

function hurtFromPit() {
  G.noHitT = 0;
  if (PFX().k === 'lift' && (G.liftLeft || 0) > 0) {
    // สัตว์เลี้ยงช่วยดึงขึ้นจากหลุม (สกิลจริง เช่น ผีน้อย/สะพานน้ำแข็ง)
    G.liftLeft--;
    P.vy = -900; P.fallingPit = false; P.invT = Math.max(P.invT, 1.2);
    sparkle(P.x + 20, P.y + 40, 16, '#aee4ff');
    floatText(P.x, P.y - 20, '🕊 ' + PT().name + ' ช่วยไว้! (เหลือ ' + G.liftLeft + ')', '#aee4ff', true);
    AudioSys.potion();
    return;
  }
  G.hp -= (20 + G.stage * 2) * CH().pitGuard * (1 - trV('pit'));
  G.combo = 0;
  G.shake = 14; G.flash = 0.6;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }
  P.fallingPit = false;
  P.y = GROUND_Y - P.h - 200; P.vy = 100;
  P.invT = 2.5;
  floatText(P.x, 220, 'อุ๊ปส์! ตกหลุม!', '#ff8888', true);
}

function collectJelly(j, jx) {
  const mult = P.giantT > 0 ? 2 : 1;
  switch (j.type) {
    case 'bar': case 'coin': case 'pink': case 'bear': {
      G.combo++; G.comboTimer = CH().comboT + (PFX().k === 'combo' ? PFX().v * petFxMul() : 0) + trV('combo');
      if (CFX().trig === 'jelly') {
        G.cfxCount = (G.cfxCount || 0) + 1;
        if (G.cfxCount >= CFX().n) {
          G.cfxCount = 0;
          G.formT = CFX().dur;
          G.shake = 6; AudioSys.power();
          banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#ffd24a');
        }
      }
      const comboBonus = Math.min(G.combo, 50);
      let base = JSCORE[j.type];
      if (j.type === 'bear') base = j.v === 'b' ? 5000 : j.v === 'p' ? 2500 : 1000;   // หมี 3 ระดับ
      let pts = (base + comboBonus) * mult;
      pts *= 1 + G.upg.jelly * 0.06;                         // เยลลี่พลัส
      pts *= lvMul();                                        // เลเวลคุกกี้
      pts *= (CH().ptMul || 1) * (1 + trV('pt')) * (G.combi ? 1.15 : 1);   // ความสามารถคุกกี้ + สมบัติ + Combi
      if (j.type !== 'coin' && j.type !== 'bear') pts *= (CH().jellyMul || 1) * (1 + trV('jelly'));
      if (PFX().k === 'score') pts *= 1 + (PFX().v - 1) * petFxMul();
      if (G.bonusT > 0 && PFX().k === 'btgrow') pts *= 1 + PFX().v * petFxMul();   // ปุยเมฆโตใน Bonus Time
      if (j.type === 'bear' && PFX().k === 'bear') pts *= 1 + (PFX().v - 1) * petFxMul();
      if (j.type === 'bear') pts *= 1 + trV('bear');        // จี้หมีทองคำ
      if (G.scoreMulT > 0) pts *= 2;                         // สกิลนินจา
      pts = Math.round(pts);
      G.score += pts; G.jellies++;
      G.skill = Math.min(100, G.skill + 1.7 * (1 + trV('skill')) * (CH().skillFast || 1));   // ชาร์จเกจสกิล
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (j.type === 'coin')
        G.coins += PFX().k === 'coin' ? 1 + Math.round(PFX().v * petFxMul()) : 1;
      if (j.type === 'bear') {
        G.runBears++;
        AudioSys.bear();
        const bc = j.v === 'p' ? '#ff8fc0' : '#ffb347';
        sparkle(jx, j.y, j.v === 'b' ? 34 : 24, bc);
        floatText(jx, j.y - 30, '+' + pts + (j.v === 'b' ? ' BIG BEAR!!' : j.v === 'p' ? ' PINK BEAR!' : ' BEAR JELLY!'), bc, true);
        G.hp = Math.min(G.hpMax, G.hp + (j.v === 'b' ? 20 : 10));
      } else {
        AudioSys.jelly(G.combo);
        sparkle(jx, j.y, 5, j.type === 'coin' ? '#ffd700' : j.type === 'pink' ? '#ff7bac' : '#ffe066');
        if (j.type !== 'bar' || G.combo % 10 === 0)
          floatText(jx, j.y - 24, '+' + pts, '#fff');
      }
      if (G.combo > 0 && G.combo % 25 === 0)
        banner('สุดยอด! ' + G.combo + ' COMBO!', `hsl(${(G.combo * 14) % 360},90%,65%)`);
      break;
    }
    case 'potion':
      G.hp = Math.min(G.hpMax, G.hp + 30 * (1 + (CFX().k === 'potionPlus' ? CFX().v : 0)));
      if (CFX().trig === 'potion') {
        G.formT = CFX().dur;
        banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#7ecbff');
      }
      AudioSys.potion();
      sparkle(jx, j.y, 16, '#7bff9b');
      floatText(jx, j.y - 30, '+HP พลังคืนมา!', '#7bff9b', true);
      break;
    case 'giant':
      P.giantT = 6 * itemMul() * (CH().itemMul || 1) * (1 + trV('item'));
      AudioSys.power();
      sparkle(jx, j.y, 20, '#ffd24a');
      banner('ยักษ์โหมด! GIANT MODE!', '#ffd24a');
      break;
    case 'magnet':
      P.magnetT = 8 * itemMul() * (CH().itemMul || 1) * (1 + trV('item'));
      AudioSys.power();
      sparkle(jx, j.y, 20, '#7ecbff');
      banner('แม่เหล็กเยลลี่!', '#7ecbff');
      break;
    case 'star': {
      // Star Jelly: แตกเป็นคอนเฟตตีให้เก็บกวาด (แบบเกมจริง)
      AudioSys.bear();
      sparkle(jx, j.y, 26, '#ffe066');
      banner('⭐ STAR JELLY! เก็บคอนเฟตตี!', '#ffe066');
      for (let i = 0; i < 16; i++)
        jellyList.push({ x: worldX + jx + rnd(70, 480), y: rnd(130, GROUND_Y - 60),
                         type: 'confetti', t: rnd(0, TAU), dead: false });
      break;
    }
    case 'ingr': {
      G.ingr[j.kind] = (G.ingr[j.kind] || 0) + 1;
      SAVE.set('ingr', G.ingr);
      G.score += 200;
      AudioSys.potion();
      sparkle(jx, j.y, 12, INGRS[j.kind].c);
      floatText(jx, j.y - 26, INGRS[j.kind].icon + ' ' + INGRS[j.kind].name + '!', '#ffe9b8', true);
      break;
    }
    case 'letter': {
      G.btProgress++;
      G.score += 300;
      AudioSys.jelly(20 + G.btProgress);
      sparkle(jx, j.y, 10, '#ff9dd6');
      floatText(jx, j.y - 26, j.ch + ' !', '#ff9dd6', true);
      if (G.btProgress >= 9) {
        G.btProgress = 0;
        startBonusTime();
      }
      break;
    }
    case 'blast':
      P.boostT = Math.max(P.boostT, 2.4 + (CFX().k === 'blastPlus' ? CFX().v : 0));
      AudioSys.power();
      sparkle(jx, j.y, 18, '#ff9d2e');
      banner('🚀 BLAST!!', '#ff9d2e');
      break;
    case 'box':
      G.runBoxes++;
      AudioSys.potion();
      sparkle(jx, j.y, 14, '#e8b23c');
      floatText(jx, j.y - 28, '📦 MYSTERY BOX!', '#e8b23c', true);
      break;
  }
}

/* เข้าสู่ BONUS TIME (จากการเก็บอักษร BONUSTIME ครบ) */
function startBonusTime() {
  G.runStars++;
  bonusLetterQueue = ['B','O','N','U','S'];
  bonusBearSpawned = false;
  G.bonusT = 6.5 + G.upg.bonus * 0.7 + (CH().btPlus || 0) + trV('bt') + (PFX().k === 'bt' ? PFX().v * petFxMul() : 0);
  P.vy = -120;
  AudioSys.bear();
  banner('🎉 BONUSTIME ครบ! ค้างปุ่มบิน ขึ้น/ลง 🎉', '#ffe066');
}

function updateParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.x -= (G.state === 'play' ? G.speed * 0.5 : 0) * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= 45 * dt; f.x -= (G.state==='play'?G.speed*0.3:0)*dt; }
  floaters = floaters.filter(f => f.t < 1.4);
}

/* ============================================================
   DRAW
   ============================================================ */
function draw() {
  uiButtons = [];
  if (window.__poseTest) { drawPoseSheet(); return; }
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);

  drawSky();
  drawBackHills();
  drawOvenWall();
  drawBokeh();
  drawGroundAndPits();
  drawOven();
  drawPlatforms();
  drawTrail();
  drawJellies();
  drawObstacles();
  if (G.state === 'play' || G.state === 'over' || G.state === 'continue') drawPlayer();
  if (G.state === 'play') drawPet();
  drawParticles();

  ctx.restore();

  if (G.bonusT > 0) {
    const a = Math.min(1, G.bonusT / 0.5) * 0.16;
    const g = ctx.createRadialGradient(W/2, H/2, 150, W/2, H/2, 620);
    g.addColorStop(0, 'rgba(255,220,90,0)');
    g.addColorStop(1, `rgba(255,190,40,${a + 0.08})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // vignette นุ่ม ๆ
  const vg = ctx.createRadialGradient(W/2, H/2, 280, W/2, H/2, 640);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,15,0,.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (G.state === 'play') drawHUD();
  if (G.state === 'menu') drawMenu();
  if (G.state === 'prep') drawPrep();
  if (G.state === 'login') drawLogin();
  if (G.state === 'select') drawSelect();
  if (G.state === 'pets') drawPets();
  if (G.state === 'treasure') drawTreasure();
  if (G.state === 'shop') drawShop();
  if (G.state === 'rank') drawRank();
  if (G.state === 'over') drawGameOver();
  if (G.state === 'continue') drawContinue();
  drawFloaters();
  drawBanner();

  if (G.fade > 0) {
    ctx.fillStyle = `rgba(42,26,14,${G.fade * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- ambient effects ---------- */
function drawBokeh() {
  for (const b of bokeh) {
    if (ovenAmt > 0.4) {
      // ประกายไฟ/ถ่านลอยในเตาอบ
      const a = (0.25 + Math.abs(Math.sin(G.time * 2.2 + b.tw)) * 0.45) * ovenAmt;
      const r = b.r * 0.28 + 1.2;
      ctx.fillStyle = `rgba(255,150,50,${a * 0.5})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,220,120,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    } else {
      const a = 0.08 + Math.abs(Math.sin(G.time * 0.8 + b.tw)) * 0.08;
      ctx.fillStyle = `hsla(${b.hue},85%,80%,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = `hsla(${b.hue},85%,92%,${a * 0.8})`;
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.45, 0, TAU); ctx.fill();
    }
  }
}

/* ---------- ผนังอิฐในเตาอบ (ฉากด่าน 1-2 แบบเกมจริง) ---------- */
function drawOvenWall() {
  if (ovenAmt < 0.01) return;
  ctx.save();
  ctx.globalAlpha = ovenAmt;
  // ฐานผนัง
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3f0f0a');
  g.addColorStop(0.5, '#6e2117');
  g.addColorStop(1, '#521510');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 8);
  // อิฐก้อนใหญ่ (parallax ช้า)
  const bw = 172, bh = 70;
  const scroll = worldX * 0.35;
  for (let row = 0; row < 7; row++) {
    const y = row * bh - 22;
    if (y > GROUND_Y) break;
    const shift = (row % 2) * (bw / 2);
    const off = -((scroll + shift) % bw);
    for (let x = off - bw; x < W + bw; x += bw) {
      const wx = Math.round((x + scroll + shift) / bw) * 13 + row * 7;
      const v = ((wx % 7) + 7) % 7 / 7;
      ctx.fillStyle = `rgb(${118 + v * 26},${40 + v * 13},${28 + v * 9})`;
      roundRect(x + 4, y + 4, bw - 8, Math.min(bh - 8, GROUND_Y + 4 - y), 9); ctx.fill();
      ctx.fillStyle = 'rgba(255,160,110,.09)';
      roundRect(x + 9, y + 8, bw - 18, 11, 5); ctx.fill();
      ctx.fillStyle = 'rgba(30,6,3,.25)';
      roundRect(x + 9, y + bh - 18, bw - 18, 8, 4); ctx.fill();
    }
  }
  // แสงไฟจากด้านล่างสาดขึ้นผนัง (วูบวาบ)
  const fg = ctx.createLinearGradient(0, GROUND_Y - 170, 0, GROUND_Y + 8);
  fg.addColorStop(0, 'rgba(255,120,40,0)');
  fg.addColorStop(1, `rgba(255,130,40,${0.16 + Math.sin(G.time * 7) * 0.05})`);
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND_Y - 170, W, 178);
  // มืดด้านบน
  const dg = ctx.createLinearGradient(0, 0, 0, 90);
  dg.addColorStop(0, 'rgba(15,3,1,.5)'); dg.addColorStop(1, 'rgba(15,3,1,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W, 90);
  ctx.restore();
}
function drawTrail() {
  for (const t of trail) {
    const k = 1 - t.t / 0.45;
    ctx.fillStyle = `hsla(${t.hue},95%,65%,${k * 0.4})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 4 + 13 * k, 0, TAU); ctx.fill();
  }
}

/* ---------- โหมดส่องตัวละครระยะใกล้ (ใช้ปรับดีไซน์) ---------- */
function drawPoseSheet() {
  ctx.fillStyle = '#efe0c8';

  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  // แถวบน: วงจรวิ่ง 8 เฟรมสไปรต์
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.translate(68 + i * 118, 252);
    ctx.scale(1.32, 1.32);
    drawCookieRun((i + 0.01) * TAU / 8 / 1.15);
    ctx.restore();
    ctx.fillText('F' + (i + 1), 68 + i * 118, 278);
  }
  // แถวล่าง: โดดขึ้น / ร่วงลง / สไลด์ / ยืน
  const oldVy = P.vy;
  const lower = [
    ['โดดขึ้น', () => { P.vy = -500; drawCookieJump(false); }],
    ['ร่วงลง', () => { P.vy = 500; drawCookieJump(false); }],
    ['ตีลังกา', () => drawCookieJump(true)],
    ['สไลด์', () => drawCookieSlide(0.5)],
    ['ยืน', () => cookieBody(0, 0.12, -0.12, 1.6, 4.2, 0, undefined, { cane: { x: -27, y: -54, rot: -0.06, flip: true, len: 56 } })],
  ];
  lower.forEach(([label, fn], i) => {
    ctx.save();
    ctx.translate(105 + i * 190, 492);
    ctx.scale(1.55, 1.55);
    fn();
    ctx.restore();
    ctx.fillText(label, 105 + i * 190, 516);
  });

}

/* ---------- background ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, skyBlend('top'));
  g.addColorStop(0.45, skyBlend('mid'));
  g.addColorStop(1, skyBlend('bot'));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (G.mode === 'normal' && EP().tint && ovenAmt < 0.5) {
    ctx.fillStyle = EP().tint;
    ctx.fillRect(0, 0, W, H);
  }

  const night = skyBlend('night');

  // ดาวตอนกลางคืน
  if (night > 0.03) {
    for (const s of stars) {
      ctx.globalAlpha = night * (0.4 + Math.abs(Math.sin(G.time * 1.6 + s.tw)) * 0.6);
      ctx.fillStyle = '#fff8e0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // พระอาทิตย์คุกกี้ / พระจันทร์เสี้ยว
  ctx.save();
  ctx.translate(790, 95);
  if (night < 0.5) {
    ctx.globalAlpha = 1 - night;
    // แฉกแสงหมุนช้า ๆ
    ctx.save();
    ctx.rotate(G.time * 0.06);
    ctx.fillStyle = 'rgba(255,240,190,.10)';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-26, -150); ctx.lineTo(26, -150);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // แสงฟุ้งรอบดวง
    ctx.fillStyle = 'rgba(255,235,180,.25)';
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('sun');
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,160,90,.55)';
    for (const [dx, dy] of [[-12,-8],[10,-14],[14,8],[-6,12],[2,-2]])
      { ctx.beginPath(); ctx.arc(dx, dy, 3.4, 0, TAU); ctx.fill(); }
  } else {
    ctx.globalAlpha = night;
    ctx.fillStyle = 'rgba(244,240,224,.18)';
    ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f4f0e0';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('top');
    ctx.beginPath(); ctx.arc(16, -8, 34, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // เมฆวิปครีมสองชั้น (เงาล่าง + เนื้อบน)
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    const puffs = [[0,0,26],[24,-8,20],[48,0,24],[24,8,22],[70,4,16]];
    ctx.fillStyle = night > 0.5 ? 'rgba(120,120,170,.45)' : 'rgba(255,190,150,.5)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy + 6, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = night > 0.5 ? 'rgba(185,185,225,.6)' : 'rgba(255,250,240,.95)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawBackHills() {
  // ปราสาทขนมหวานไกลสุด (parallax ช้าสุด)
  const off0 = -(worldX * 0.08) % 800;
  ctx.fillStyle = skyBlend('far');
  for (let x = off0 - 800; x < W + 800; x += 800) {
    drawCastle(x + 180, 402);
    drawCastle(x + 560, 402);
  }
  // เนินขนม (ไล่เฉดจากยอดสว่างลงมา)
  const off1 = -(worldX * 0.18) % 500;
  const hillCol = skyBlend('hill');
  const hg = ctx.createLinearGradient(0, 250, 0, 460);
  hg.addColorStop(0, shade(hillCol, 26));
  hg.addColorStop(1, shade(hillCol, -8));
  ctx.fillStyle = hg;
  for (let x = off1 - 500; x < W + 500; x += 500) {
    ctx.beginPath();
    ctx.moveTo(x, 400);
    ctx.quadraticCurveTo(x + 125, 250, x + 250, 400);
    ctx.quadraticCurveTo(x + 375, 290, x + 500, 400);
    ctx.lineTo(x + 500, 460); ctx.lineTo(x, 460);
    ctx.fill();
  }
  // ของประดับริมทางตามตอน
  const off2 = -(worldX * 0.45) % 640;
  const epi = G.mode === 'normal' ? EP().id : 'oven';
  for (let x = off2 - 640; x < W + 640; x += 320) {
    const alt = ((x / 320 | 0) % 2) === 0;
    if (epi === 'jungle') drawJungleTree(x + 60, 442, alt);
    else if (epi === 'dragon') drawRockSpike(x + 60, 442, alt);
    else if (epi === 'wizard') drawWizTower(x + 60, 442, alt);
    else drawLollipop(x + 60, 442, 1, alt);
  }
}
/* ต้นไม้ป่าดึกดำบรรพ์ */

function drawCastle(x, baseY) {
  // เงาปราสาทไอศกรีม (ใช้ fillStyle ที่ตั้งไว้แล้ว)
  ctx.beginPath();
  ctx.rect(x - 40, baseY - 70, 80, 70);          // ตัวปราสาท
  ctx.rect(x - 62, baseY - 46, 22, 46);          // หอซ้าย

  ctx.moveTo(x - 62, baseY - 46); ctx.lineTo(x - 51, baseY - 74); ctx.lineTo(x - 40, baseY - 46);
  ctx.moveTo(x + 40, baseY - 46); ctx.lineTo(x + 51, baseY - 74); ctx.lineTo(x + 62, baseY - 46);
  ctx.moveTo(x - 40, baseY - 70); ctx.lineTo(x, baseY - 108); ctx.lineTo(x + 40, baseY - 70);
