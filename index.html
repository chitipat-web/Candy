const rnd  = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function hexLerp(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
  const bl = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${bl})`;
}
/* ปรับสีสว่างขึ้น/มืดลง (รับได้ทั้ง #hex และ rgb(...)) */
function shade(col, amt) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  r = clamp(r + amt, 0, 255); g = clamp(g + amt, 0, 255); b = clamp(b + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

/* ============================================================

const AudioSys = {
  ctx: null, master: null, musicGain: null, muted: false,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.32;
      this.musicGain.connect(this.master);
    } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.25) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  jelly(combo) { this.beep(660 + Math.min(combo, 24) * 30, 0.09, 'square', 0.13, 200); },
  bear()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.14,'square',0.2),i*70)); },
  potion() { [392,523,659].forEach((f,i)=>setTimeout(()=>this.beep(f,0.12,'triangle',0.25),i*60)); },
  power()  { [262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'sawtooth',0.15),i*50)); },
  jump()   { this.beep(300, 0.15, 'sine', 0.2, 250); },
  jump2()  { this.beep(400, 0.15, 'sine', 0.2, 300); },
  slide()  { this.noise(0.12, 0.1); },
  crash()  { this.noise(0.25, 0.35); this.beep(120, 0.3, 'sawtooth', 0.25, -60); },
  fall()   { this.beep(500, 0.5, 'sine', 0.2, -420); },
  speedup(){ [660,660,880].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'square',0.2),i*90)); },
  over()   { [523,494,440,392,330,262].forEach((f,i)=>setTimeout(()=>this.beep(f,0.22,'triangle',0.2),i*160)); },
  click()  { this.beep(760, 0.06, 'square', 0.15, 120); },
  buy()    { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'triangle',0.22),i*55)); },
  deny()   { this.beep(180, 0.18, 'sawtooth', 0.18, -60); },

  musicTimer: null, step: 0,
  melody: [
    523,0,659,0, 784,0,659,523, 587,0,659,587, 523,0,392,0,
    523,0,659,0, 784,0,880,784, 659,587,523,587, 659,0,523,0,
    440,0,523,0, 659,0,523,440, 494,0,587,494, 392,0,330,0,
    440,0,523,659, 784,0,659,523, 587,659,587,494, 523,0,0,0
  ],
  bass: [131,0,196,0, 165,0,196,0, 147,0,196,0, 131,0,196,0,
         131,0,196,0, 165,0,196,0, 147,0,175,0, 196,0,196,0],
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.step = 0;
    const tick = () => {
      if (this.muted) { this.step++; return; }
      const t = this.ctx.currentTime;
      const m = this.melody[this.step % this.melody.length];
      const b = this.bass[this.step % this.bass.length];
      if (m) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = m;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.15);
      }
      if (b) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = b;
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.18);
      }
      this.step++;
    };
    this.musicTimer = setInterval(tick, 130);
  },
  stopMusic() { clearInterval(this.musicTimer); this.musicTimer = null; }
};

function rowJellies(x, n, y = GROUND_Y - 36, type = 'bar') {
  for (let i = 0; i < n; i++) J(x + i * 46, y, type);
  return n * 46;
}
function arcJellies(x, n, peak = 150) {
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const y = GROUND_Y - 36 - Math.sin(t * Math.PI) * peak;
    J(x + i * 52, y, 'bar');
  }
  return n * 52;
}

    for (let i = 0; i < 5; i++) J(x + 100 + i * 55, y - 34, 'bar');

    J(x + 60 + 330 + 130 + 300 - 40, y - 60 - 62, 'bear');
    pits.push({ x: x + 60 + 330 + 10, w: 110 });
    return 60 + 330 + 130 + 300 + 200;
  },
];

const bonusPathY = wx => 250 + Math.sin(wx * 0.004) * 105;

/* ตัวอักษรเยลลี่ "BONUS" — ซิกเนเจอร์ของเกมจริง */
const LETTERS = {
  B: ['1110','1001','1110','1001','1110'],
  O: ['0110','1001','1001','1001','0110'],
  N: ['1001','1101','1011','1001','1001'],
  U: ['1001','1001','1001','1001','0110'],
  S: ['0111','1000','0110','0001','1110'],
};
let bonusLetterQueue = [];
let bonusBearSpawned = false;

function spawnBonusPattern() {
  // ช่วงแรกของโบนัส: สะกดคำว่า BONUS ด้วยเยลลี่
  if (bonusLetterQueue.length) {
    const map = LETTERS[bonusLetterQueue.shift()];
    const x = spawnX;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 4; c++)
        if (map[r][c] === '1') J(x + c * 27, 176 + r * 27, 'bar');
    spawnX = x + 4 * 27 + 46;
    return;
  }
  const x = spawnX;
  for (let i = 0; i < 12; i++) {
    const wx = x + i * 50;
    const y = bonusPathY(wx);
    J(wx, y, 'bar');
    J(wx, y - 46, i % 3 === 0 ? 'coin' : 'bar');
    J(wx, y + 46, i % 4 === 0 ? 'pink' : 'bar');
  }
  spawnX = x + 12 * 50;
}

function spawnPattern() {
  if (G.bonusT > 0) { spawnBonusPattern(); return; }
  const x = spawnX;
  let w;
  const roll = Math.random();
  if (roll < 0.045)       w = spawnItem(x, 'potion');
  else if (roll < 0.075)  w = spawnItem(x, 'giant');
  else if (roll < 0.105)  w = spawnItem(x, 'magnet');
  else if (roll < 0.135)  w = spawnItem(x, 'star');
  else {
    const hard = Math.min(G.stage, 6);
    const pool = [0,1,1,2,2,3,4,5,6,7,9,10,10,11]
      .concat(hard >= 2 ? [3,5,8,10] : [0])
      .concat(hard >= 3 ? [7,8,11] : []);
    w = PATTERNS[pool[rndi(0, pool.length - 1)]](x);
  }
  spawnX = x + w + rnd(40, 130);
}
function spawnItem(x, type) {
  rowJellies(x, 4);
  J(x + 4 * 46 + 20, GROUND_Y - 46, type);
  return 4 * 46 + 180;
}

/* ============================================================
   INPUT
   ============================================================ */
const keys = {};
let slideHeld = false;
function doSlide(on) { slideHeld = on; }

function doJump() {
  if (G.state !== 'play') return;
  if (P.dead || P.fallingPit || G.bonusT > 0) return;
  if (P.sliding) {
    P.sliding = false;
    P.y -= (P.h - P.h * 0.52) * (P.giantT > 0 ? 1.6 : 1);
  }
  if (P.onGround) {
    P.vy = JUMP_V * (P.giantT > 0 ? 0.94 : 1);
    P.onGround = false; P.jumps = 1;
    P.squash = -0.28;
    AudioSys.jump();
    puff(P.x, P.y + P.h, 6);
  } else if (P.jumps >= 1 && P.jumps < CH().jumps) {
    P.vy = JUMP2_V;
    P.jumps++;
    AudioSys.jump2();
    puff(P.x, P.y + P.h, 8, '#fff');
  }
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  AudioSys.init(); AudioSys.resume();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (G.state === 'menu') startGame();
    else if (G.state === 'over') { if (G.overT > 1) startGame(); }
    else if (['select','shop','rank','pets'].includes(G.state)) setState('menu');
    else doJump();
  }
  if (e.code === 'Escape' && ['select','shop','rank','pets'].includes(G.state)) setState('menu');
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); doSlide(true); }
  if (e.code === 'KeyM') { AudioSys.muted = !AudioSys.muted; }
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') doSlide(false);
  keys[e.code] = false;
});

/* ---------- UI buttons ---------- */
let uiButtons = [];
function uiClick(x, y) {
  for (const b of uiButtons) {
    if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      AudioSys.click();
      b.cb();
      return true;
    }
  }
  return false;
}
function canvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX - r.left) / r.width * W, (clientY - r.top) / r.height * H];
}
function pointerDown(x, y, id) {
  if (G.state === 'play') {
    if (x < W / 2) { if (id !== undefined) touches[id] = 'L'; doJump(); }
    else { if (id !== undefined) touches[id] = 'R'; doSlide(true); }
    return;
  }
  if (uiClick(x, y)) return;
  if (G.state === 'over' && G.overT > 1.2) startGame();
}

const touches = {};
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  AudioSys.init(); AudioSys.resume();
  for (const t of e.changedTouches) {
    const [x, y] = canvasXY(t.clientX, t.clientY);
    pointerDown(x, y, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (touches[t.identifier] === 'R') doSlide(false);
    delete touches[t.identifier];
  }
});
canvas.addEventListener('mousedown', e => {
  AudioSys.init(); AudioSys.resume();
  const [x, y] = canvasXY(e.clientX, e.clientY);
  pointerDown(x, y);
});
canvas.addEventListener('mouseup', () => doSlide(false));

   GAME FLOW
   ============================================================ */
function startGame() {
  setState('play');
  G.time = G.time; G.dist = 0; G.score = 0; G.coins = 0; G.jellies = 0;
  G.combo = 0; G.comboTimer = 0;
  G.hpMax = 100 + CH().hpBonus + G.upg.hp * 12;
  G.hp = G.hpMax;
  G.stage = 1; G.stageTimer = 0;
  G.hpDrain = 3.2;
  G.speed = G.baseSpeed; G.newBest = false; G.rankPos = -1;
  P.y = GROUND_Y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
  P.sliding = false; P.invT = 0; P.giantT = 0; P.magnetT = 0;
  P.boostT = 2.4 + CH().boostBonus + G.upg.boost * 0.6;
  G.bonusT = 0; G.revives = CH().revives;
  P.dead = false; P.fallingPit = false; slideHeld = false;
  G.runBears = 0; G.runStars = 0; G.maxCombo = 0; G.missionDone = false;
  jellyList = []; obstacles = []; pits = []; particles = []; floaters = []; platforms = [];
  Pet.x = 60; Pet.y = 280;
  worldX = 0; spawnX = W + 100;
  skyPrev = 0; skyCur = 0; skyT = 1;
  banner('EPISODE 1: หนีจากเตาอบ! GO!!', '#ffdd44');
  AudioSys.startMusic();
}

function gameOver() {
  if (G.state === 'over') return true;
  if (G.revives > 0) {
    G.revives--;
    G.hp = G.hpMax * 0.6;
    P.invT = 3;
    G.flash = 0;
    banner('✨ ชุบชีวิต! REVIVE! ✨', '#ffd24a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 26, '#ffd24a');
    return false;
  }
  setState('over'); G.overT = 0;
  P.dead = true;
  puff(P.x + 28, P.y + P.h - 6, 16, '#a97b45');   // เศษคุกกี้กระจาย
  sparkle(P.x + 28, P.y + 30, 8, '#ffce2e');
  AudioSys.stopMusic();
  AudioSys.over();
  G.score = Math.floor(G.score);
  if (G.score > G.best) { G.best = G.score; G.newBest = true; SAVE.set('best', G.best); }
  // เหรียญที่ได้ = เหรียญในด่าน + โบนัสจากคะแนน
  G.earned = G.coins + Math.floor(G.score / 400);
  G.bank += G.earned;
  SAVE.set('coins', G.bank);
  // บันทึกอันดับ
  const entry = { s: G.score, d: Math.floor(G.dist), c: G.charIdx, t: Date.now() };
  G.board.push(entry);
  G.board.sort((a, b) => b.s - a.s);
  G.board = G.board.slice(0, 10);
  G.rankPos = G.board.indexOf(entry);
  SAVE.set('board', G.board);
  // เช็คภารกิจ
  const m = MISSIONS[G.missionIdx];
  if (m && m.check({ dist: G.dist, jellies: G.jellies, score: G.score, combo: G.maxCombo,
                     bears: G.runBears, stars: G.runStars, stage: G.stage })) {
    G.missionDone = true;
    G.missionReward = m.reward;
    G.bank += m.reward;
    G.missionIdx++;
    SAVE.set('coins', G.bank);
    SAVE.set('mission', G.missionIdx);
  }
  return true;
}
function banner(text, color) { G.banner = { text, color }; G.bannerT = 0; }

/* ---------- shop / select actions ---------- */
function trySelectChar(i) {
  const c = CHARS[i];
  if (G.owned.includes(i)) {
    G.charIdx = i; SAVE.set('char', i);

}
function trySelectPet(i) {
  const p = PETS[i];
  if (G.petsOwned.includes(i)) {
    G.petIdx = i; SAVE.set('pet', i);
    floatText(W / 2, 100, 'เลือก ' + p.name + ' แล้ว!', '#7bd94a', true);
  } else if (G.bank >= p.cost) {

    G.petsOwned.push(i);

    SAVE.set('coins', G.bank); SAVE.set('petsOwned', G.petsOwned); SAVE.set('pet', i);
    AudioSys.buy();
    floatText(W / 2, 100, '🎉 ปลดล็อก ' + p.name + '!', '#ffd24a', true);
  } else {
    AudioSys.deny();

function tryUpgrade(u) {
  const lv = G.upg[u.id];
  if (lv >= u.max) return;

    floatText(W / 2, 100, 'เหรียญไม่พอ!', '#ff8888', true);

/* ---------- particles ---------- */
function puff(x, y, n, c = '#e8d5b5') {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: rnd(-80, 80), vy: rnd(-140, -20), life: rnd(0.3, 0.6), t: 0, c, r: rnd(3, 7) });
}
function sparkle(x, y, n, c) {

    const a = rnd(0, TAU), sp = rnd(60, 240);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: rnd(0.35, 0.7), t: 0, c, r: rnd(2, 5), star: true });
  }
}
function floatText(x, y, text, c = '#fff', big = false) {

}

/* ============================================================
   UPDATE
   ============================================================ */
const isInvincible = () => P.invT > 0 || P.giantT > 0 || P.boostT > 0 || G.bonusT > 0;
const canSmash = () => P.giantT > 0 || P.boostT > 0;

function hurt(amount) {
  if (isInvincible() || P.dead) return;
  G.hp -= amount;
  G.combo = 0;
  P.invT = 2.0;
  P.stumbleT = 0.5;
  G.shake = 12; G.flash = 0.5;
  AudioSys.crash();
  sparkle(P.x + P.w / 2, P.y + P.h / 2, 14, '#ff6b6b');
  if (G.hp <= 0) { G.hp = 0; gameOver(); }
}

function update(dt) {
  G.time += dt;
  if (G.bannerT < 99) G.bannerT += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  G.fade = Math.max(0, G.fade - dt * 2.6);
  if (skyT < 1) skyT = Math.min(1, skyT + dt / 1.8);

  for (const c of clouds) {
    c.x -= (c.v + (G.state === 'play' ? G.speed * 0.04 : 4)) * dt;
    if (c.x < -160) { c.x = W + rnd(20, 120); c.y = rnd(30, 170); }
  }
  for (const b of bokeh) {
    b.x -= (b.v + (G.state === 'play' ? G.speed * 0.06 : 3)) * dt;
    b.y += Math.sin(G.time * 0.7 + b.tw) * 6 * dt;
    if (b.x < -40) { b.x = W + rnd(10, 60); b.y = rnd(30, 430); }
  }
  P.squash += (0 - P.squash) * Math.min(1, 10 * dt);
  P.stumbleT = Math.max(0, P.stumbleT - dt);
  for (const t of trail) {
    t.t += dt;
    t.x -= (G.state === 'play' ? G.speed * 1.1 : 60) * dt;
  }
  trail = trail.filter(t => t.t < 0.45);

  if (G.state !== 'play') {
    if (G.state === 'over') G.overT += dt;
    updateParticles(dt);
    P.anim += dt * 8;
    Pet.wing += dt * 14;
    return;
  }

  /* --- ความเร็ว & ด่าน --- */
  G.stageTimer += dt;
  if (G.stageTimer >= G.stageLen && G.speed < G.maxSpeed) {
    G.stageTimer = 0; G.stage++;
    G.speed = Math.min(G.maxSpeed, G.speed + 62);
    G.hpDrain += 0.35;
    skyPrev = skyCur; skyCur = (G.stage - 1) % SKIES.length; skyT = 0;
    banner('SPEED UP!  ⚡ ด่าน ' + G.stage, '#7ee0ff');
    AudioSys.speedup();
  }

  /* --- HP ลดตามเวลา --- */
  if (PT().id === 'cloud') G.hp = Math.min(G.hpMax, G.hp + 1.0 * dt);   // ปุยเมฆฟื้นพลัง
  if (G.bonusT <= 0) G.hp -= G.hpDrain * dt;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }

  const spdMul = (P.giantT > 0 ? 1.12 : 1) * (P.boostT > 0 ? 2.1 : 1) * (G.bonusT > 0 ? 1.35 : 1);
  const move = G.speed * dt * spdMul;
  worldX += move;
  G.dist += move / 40;
  G.score += move * 0.02;

  while (spawnX < worldX + W + 700) spawnPattern();

  /* --- timers --- */
  P.invT = Math.max(0, P.invT - dt);
  P.giantT = Math.max(0, P.giantT - dt);
  P.magnetT = Math.max(0, P.magnetT - dt);
  P.boostT = Math.max(0, P.boostT - dt);
  if (G.bonusT > 0) {
    G.bonusT -= dt;
    // หมีเยลลี่ยักษ์รอปิดท้ายโบนัสไทม์ (แบบเกมจริง)
    if (G.bonusT <= 1.1 && !bonusBearSpawned) {
      bonusBearSpawned = true;
      const wx = worldX + W + 60;
      J(wx, bonusPathY(wx), 'bear');
    }
    if (G.bonusT <= 0) { G.bonusT = 0; bonusLetterQueue = []; P.invT = Math.max(P.invT, 1.5); }
  }
  G.comboTimer -= dt;
  if (G.comboTimer <= 0) G.combo = 0;
  P.anim += dt * (8 + G.speed / 90);

  // ฝุ่นแป้งฟุ้งใต้เท้าตอนวิ่ง
  if (P.onGround && !P.sliding && Math.random() < 0.25)
    puff(P.x + rnd(0, 18), GROUND_Y - 3, 1, '#c59a63');

  // สายรุ้งตามหลังช่วงพลังพิเศษ
  if (P.boostT > 0 || G.bonusT > 0 || P.giantT > 0) {
    const scale0 = P.giantT > 0 ? 1.6 : 1;
    const ph0 = (P.sliding ? P.h * 0.52 : P.h) * scale0;
    trail.push({ x: P.x + 6, y: P.y + ph0 * 0.5, hue: (G.time * 240) % 360, t: 0 });
  }

  /* --- สัตว์เลี้ยง --- */
  Pet.wing += dt * 14;
  const petTX = P.x - 62, petTY = P.y - 34 + Math.sin(G.time * 4) * 10;
  Pet.x += (petTX - Pet.x) * 6 * dt;
  Pet.y += (petTY - Pet.y) * 6 * dt;
  for (const j of jellyList) {
    if (j.dead) continue;
    const jx = j.x - worldX;
    if (jx < -40 || jx > 300) continue;
    if (['potion','giant','magnet','star','bear'].includes(j.type)) continue;
    if (Math.hypot(jx - Pet.x, j.y - Pet.y) < 36) { j.dead = true; collectJelly(j, jx); }
  }

  /* --- ฟิสิกส์ผู้เล่น --- */
  const scale = P.giantT > 0 ? 1.6 : 1;

  if (P.onGround && !P.fallingPit && G.bonusT <= 0) {
    const dh = (P.h - P.h * 0.52) * scale;
    if (slideHeld && !P.sliding) {
      P.sliding = true;
      P.y += dh;
      AudioSys.slide();
    } else if (!slideHeld && P.sliding) {
      P.sliding = false;
      P.y -= dh;
    }
  }

  const pw = P.w * scale;
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  const footX = P.x + pw * 0.5;

  if (G.bonusT > 0) {
    P.fallingPit = false; P.sliding = false;
    const targetY = bonusPathY(worldX + footX) - ph / 2;
    P.y += (targetY - P.y) * Math.min(1, 8 * dt);
    P.vy = 0; P.onGround = false; P.jumps = 1;
    if (Math.random() < 0.6) sparkle(P.x - 10, P.y + ph / 2, 1, '#ffd24a');
  } else {
    const prevFoot = P.y + ph;
    P.vy += GRAV * dt;
    if (slideHeld && !P.onGround)
      P.vy += GRAV * 1.4 * dt;
    P.y += P.vy * dt;

    let overPit = false;
    for (const p of pits) {
      const px = p.x - worldX;
      if (footX > px + 14 && footX < px + p.w - 14) overPit = true;
    }

    if (!P.fallingPit) {
      let landed = false;
      if (P.vy >= 0) {
        for (const pl of platforms) {
          const px = pl.x - worldX;
          if (footX > px && footX < px + pl.w &&
              prevFoot <= pl.y + 10 && P.y + ph >= pl.y) {
            P.y = pl.y - ph;
            if (!P.onGround) { puff(footX, pl.y, 4); P.squash = 0.32; }
            P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
            break;
          }
        }
      }
      if (!landed && P.y + ph >= GROUND_Y) {
        if (overPit && !canSmash()) {
          P.fallingPit = true;
          AudioSys.fall();
        } else {
          P.y = GROUND_Y - ph;
          if (!P.onGround) { puff(P.x + pw / 2, GROUND_Y, 4); P.squash = 0.32; }
          P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
        }
      }
      if (!landed) P.onGround = false;
    } else {
      if (P.y > H + 60) hurtFromPit();
    }
  }

  /* --- เก็บเยลลี่ --- */
  const cx = P.x + pw / 2, cy = P.y + ph / 2;
  for (const j of jellyList) {
    if (j.dead) continue;
    let jx = j.x - worldX;
    if (jx < -80) { j.dead = true; continue; }
    if (jx > W + 80) break;
    if ((P.magnetT > 0 || P.boostT > 0 || G.bonusT > 0) && !['potion','giant','magnet','star'].includes(j.type)) {
      const dx = cx - jx, dy = cy - j.y;
      const d = Math.hypot(dx, dy);
      // ช่วงโบนัสดูดรัศมีสั้นลง จะได้เห็นตัวอักษร BONUS ชัด ๆ ก่อนบินทะลุ
      const attractR = G.bonusT > 0 ? 135 : 260;
      if (d < attractR) { j.x += dx / d * 620 * dt; j.y += dy / d * 620 * dt; jx = j.x - worldX; }
    }
    const r = JSIZE[j.type] / 2 + (P.giantT > 0 ? 30 : 14);
    if (Math.abs(jx - cx) < r + pw / 2 - 8 && Math.abs(j.y - cy) < r + ph / 2 - 4) {
      j.dead = true;
      collectJelly(j, jx);
    }
  }
  jellyList = jellyList.filter(j => !j.dead);

  /* --- ชนสิ่งกีดขวาง --- */
  for (const o of obstacles) {
    if (o.dead) continue;
    const ox = o.x - worldX;
    if (ox < -120) { o.dead = true; continue; }
    if (ox > W + 60) break;
    if (G.bonusT > 0) continue;
    let hit = false;
    if (o.type === 'bar') {
      const barBottom = GROUND_Y - 62;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + 110 && P.y < barBottom) hit = true;
    } else {
      const ow = o.type === 'spike' ? 46 : 56, oh = o.type === 'spike' ? 46 : 52;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + ow && P.y + ph > GROUND_Y - oh + 6) hit = true;
    }
    if (hit) {
      if (canSmash()) {
        o.dead = true;
        sparkle(ox + 20, GROUND_Y - 40, 16, '#ffd24a');
        G.score += 100; floatText(ox, GROUND_Y - 90, 'SMASH! +100', '#ffd24a', true);
        AudioSys.noise(0.15, 0.3);
      } else {
        hurt(14 + G.stage);
      }
    }
  }
  obstacles = obstacles.filter(o => !o.dead);
  pits = pits.filter(p => p.x - worldX > -400);
  platforms = platforms.filter(p => p.x + p.w - worldX > -200);

  updateParticles(dt);
}

function hurtFromPit() {
  G.hp -= (20 + G.stage * 2) * CH().pitGuard;
  G.combo = 0;
  G.shake = 14; G.flash = 0.6;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }
  P.fallingPit = false;
  P.y = GROUND_Y - P.h - 200; P.vy = 100;
  P.invT = 2.5;
  floatText(P.x, 220, 'อุ๊ปส์! ตกหลุม!', '#ff8888', true);
}

function collectJelly(j, jx) {
  const mult = P.giantT > 0 ? 2 : 1;
  switch (j.type) {
    case 'bar': case 'coin': case 'pink': case 'bear': {
      G.combo++; G.comboTimer = CH().comboT;
      const comboBonus = Math.min(G.combo, 50);
      const pts = (JSCORE[j.type] + comboBonus) * mult;
      G.score += pts; G.jellies++;
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (j.type === 'coin') G.coins += PT().id === 'chick' ? 2 : 1;   // ลูกเจี๊ยบ x2
      if (j.type === 'bear') {
        G.runBears++;
        AudioSys.bear();
        sparkle(jx, j.y, 24, '#ffb347');
        floatText(jx, j.y - 30, '+' + pts + ' BEAR JELLY!', '#ffb347', true);
        G.hp = Math.min(G.hpMax, G.hp + 10);
      } else {
        AudioSys.jelly(G.combo);
        sparkle(jx, j.y, 5, j.type === 'coin' ? '#ffd700' : j.type === 'pink' ? '#ff7bac' : '#ffe066');
        if (j.type !== 'bar' || G.combo % 10 === 0)
          floatText(jx, j.y - 24, '+' + pts, '#fff');
      }
      if (G.combo > 0 && G.combo % 25 === 0)
        banner('สุดยอด! ' + G.combo + ' COMBO!', `hsl(${(G.combo * 14) % 360},90%,65%)`);
      break;
    }
    case 'potion':
      G.hp = Math.min(G.hpMax, G.hp + 30);
      AudioSys.potion();
      sparkle(jx, j.y, 16, '#7bff9b');
      floatText(jx, j.y - 30, '+HP พลังคืนมา!', '#7bff9b', true);
      break;
    case 'giant':
      P.giantT = 6 * itemMul();
      AudioSys.power();
      sparkle(jx, j.y, 20, '#ffd24a');
      banner('ยักษ์โหมด! GIANT MODE!', '#ffd24a');
      break;
    case 'magnet':
      P.magnetT = 8 * itemMul();
      AudioSys.power();
      sparkle(jx, j.y, 20, '#7ecbff');
      banner('แม่เหล็กเยลลี่!', '#7ecbff');
      break;
    case 'star':
      G.runStars++;
      bonusLetterQueue = ['B','O','N','U','S'];
      bonusBearSpawned = false;
      G.bonusT = 6.5 + G.upg.bonus * 0.7;
      AudioSys.bear();
      sparkle(jx, j.y, 28, '#ffe066');
      banner('⭐ BONUS TIME!! ⭐', '#ffe066');
      break;
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.x -= (G.state === 'play' ? G.speed * 0.5 : 0) * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= 45 * dt; f.x -= (G.state==='play'?G.speed*0.3:0)*dt; }
  floaters = floaters.filter(f => f.t < 1.4);
}

/* ============================================================
   DRAW
   ============================================================ */
function draw() {
  uiButtons = [];
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);

  drawSky();
  drawBackHills();
  drawBokeh();
  drawGroundAndPits();
  drawOven();
  drawPlatforms();
  drawTrail();
  drawJellies();
  drawObstacles();
  if (G.state === 'play' || G.state === 'over') drawPlayer();
  if (G.state === 'play') drawPet();
  drawParticles();

  ctx.restore();

  if (G.bonusT > 0) {
    const a = Math.min(1, G.bonusT / 0.5) * 0.16;
    const g = ctx.createRadialGradient(W/2, H/2, 150, W/2, H/2, 620);
    g.addColorStop(0, 'rgba(255,220,90,0)');
    g.addColorStop(1, `rgba(255,190,40,${a + 0.08})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // vignette นุ่ม ๆ
  const vg = ctx.createRadialGradient(W/2, H/2, 280, W/2, H/2, 640);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,15,0,.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (G.state === 'play') drawHUD();
  if (G.state === 'menu') drawMenu();
  if (G.state === 'select') drawSelect();
  if (G.state === 'pets') drawPets();
  if (G.state === 'shop') drawShop();
  if (G.state === 'rank') drawRank();
  if (G.state === 'over') drawGameOver();
  drawFloaters();
  drawBanner();

  if (G.fade > 0) {
    ctx.fillStyle = `rgba(42,26,14,${G.fade * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- ambient effects ---------- */
function drawBokeh() {
  for (const b of bokeh) {
    const a = 0.08 + Math.abs(Math.sin(G.time * 0.8 + b.tw)) * 0.08;
    ctx.fillStyle = `hsla(${b.hue},85%,80%,${a})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = `hsla(${b.hue},85%,92%,${a * 0.8})`;
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.45, 0, TAU); ctx.fill();
  }
}
function drawTrail() {
  for (const t of trail) {
    const k = 1 - t.t / 0.45;
    ctx.fillStyle = `hsla(${t.hue},95%,65%,${k * 0.4})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 4 + 13 * k, 0, TAU); ctx.fill();
  }
}

/* ---------- background ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, skyBlend('top'));
  g.addColorStop(0.45, skyBlend('mid'));
  g.addColorStop(1, skyBlend('bot'));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const night = skyBlend('night');

  // ดาวตอนกลางคืน
  if (night > 0.03) {
    for (const s of stars) {
      ctx.globalAlpha = night * (0.4 + Math.abs(Math.sin(G.time * 1.6 + s.tw)) * 0.6);
      ctx.fillStyle = '#fff8e0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // พระอาทิตย์คุกกี้ / พระจันทร์เสี้ยว
  ctx.save();
  ctx.translate(790, 95);
  if (night < 0.5) {
    ctx.globalAlpha = 1 - night;
    // แฉกแสงหมุนช้า ๆ
    ctx.save();
    ctx.rotate(G.time * 0.06);
    ctx.fillStyle = 'rgba(255,240,190,.10)';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-26, -150); ctx.lineTo(26, -150);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // แสงฟุ้งรอบดวง
    ctx.fillStyle = 'rgba(255,235,180,.25)';
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('sun');
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,160,90,.55)';
    for (const [dx, dy] of [[-12,-8],[10,-14],[14,8],[-6,12],[2,-2]])
      { ctx.beginPath(); ctx.arc(dx, dy, 3.4, 0, TAU); ctx.fill(); }
  } else {
    ctx.globalAlpha = night;
    ctx.fillStyle = 'rgba(244,240,224,.18)';
    ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f4f0e0';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('top');
    ctx.beginPath(); ctx.arc(16, -8, 34, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // เมฆวิปครีมสองชั้น (เงาล่าง + เนื้อบน)
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    const puffs = [[0,0,26],[24,-8,20],[48,0,24],[24,8,22],[70,4,16]];
    ctx.fillStyle = night > 0.5 ? 'rgba(120,120,170,.45)' : 'rgba(255,190,150,.5)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy + 6, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = night > 0.5 ? 'rgba(185,185,225,.6)' : 'rgba(255,250,240,.95)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawBackHills() {
  // ปราสาทขนมหวานไกลสุด (parallax ช้าสุด)
  const off0 = -(worldX * 0.08) % 800;
  ctx.fillStyle = skyBlend('far');
  for (let x = off0 - 800; x < W + 800; x += 800) {
    drawCastle(x + 180, 402);
    drawCastle(x + 560, 402);
  }
  // เนินขนม (ไล่เฉดจากยอดสว่างลงมา)
  const off1 = -(worldX * 0.18) % 500;
  const hillCol = skyBlend('hill');
  const hg = ctx.createLinearGradient(0, 250, 0, 460);
  hg.addColorStop(0, shade(hillCol, 26));
  hg.addColorStop(1, shade(hillCol, -8));
  ctx.fillStyle = hg;
  for (let x = off1 - 500; x < W + 500; x += 500) {
    ctx.beginPath();
    ctx.moveTo(x, 400);
    ctx.quadraticCurveTo(x + 125, 250, x + 250, 400);
    ctx.quadraticCurveTo(x + 375, 290, x + 500, 400);
    ctx.lineTo(x + 500, 460); ctx.lineTo(x, 460);
    ctx.fill();
  }
  // ต้นอมยิ้ม
  const off2 = -(worldX * 0.45) % 640;
  for (let x = off2 - 640; x < W + 640; x += 320) {
    drawLollipop(x + 60, 442, 1, ((x / 320 | 0) % 2) === 0);
  }
}
function drawCastle(x, baseY) {
  // เงาปราสาทไอศกรีม (ใช้ fillStyle ที่ตั้งไว้แล้ว)
  ctx.beginPath();
  ctx.rect(x - 40, baseY - 70, 80, 70);          // ตัวปราสาท
  ctx.rect(x - 62, baseY - 46, 22, 46);          // หอซ้าย
  ctx.rect(x + 40, baseY - 46, 22, 46);          // หอขวา
  ctx.moveTo(x - 62, baseY - 46); ctx.lineTo(x - 51, baseY - 74); ctx.lineTo(x - 40, baseY - 46);
  ctx.moveTo(x + 40, baseY - 46); ctx.lineTo(x + 51, baseY - 74); ctx.lineTo(x + 62, baseY - 46);
  ctx.moveTo(x - 40, baseY - 70); ctx.lineTo(x, baseY - 108); ctx.lineTo(x + 40, baseY - 70);
  ctx.fill();
}
function drawLollipop(x, groundY, s, alt) {
  ctx.save();
  ctx.translate(x, groundY); ctx.scale(s, s);
  ctx.fillStyle = '#f7e6c9';
  ctx.fillRect(-5, -120, 10, 120);
  const r = 34;
  ctx.beginPath(); ctx.arc(0, -140, r, 0, TAU);
  ctx.fillStyle = alt ? '#ff6b8d' : '#7ecbff'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 6;
  ctx.beginPath();
  for (let a = 0; a < TAU * 2.4; a += 0.15) {
    const rr = a / (TAU * 2.4) * (r - 6);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr - 140;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function drawGroundAndPits() {
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, '#c98d4e');
  g.addColorStop(0.15, '#a96f37');
  g.addColorStop(1, '#7a4a20');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // ขอบไอซิ่ง + ครีมหยด
  ctx.fillStyle = '#f2d8a7';
  const off = -(worldX % 64);
  for (let x = off - 64; x < W + 64; x += 64) {
    ctx.beginPath();
    ctx.arc(x + 32, GROUND_Y + 3, 10, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillRect(0, GROUND_Y, W, 6);
  const offD = -(worldX % 192);
  for (let x = offD - 192; x < W + 192; x += 192) {
    ctx.beginPath();
    ctx.moveTo(x + 20, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 26, GROUND_Y + 22, x + 20, GROUND_Y + 24);
    ctx.quadraticCurveTo(x + 14, GROUND_Y + 22, x + 20, GROUND_Y + 5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 120, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 127, GROUND_Y + 17, x + 120, GROUND_Y + 19);
    ctx.quadraticCurveTo(x + 113, GROUND_Y + 17, x + 120, GROUND_Y + 5);
    ctx.fill();
  }
  // เม็ดน้ำตาลหลากสีโรยบนไอซิ่ง
  const offS = -(worldX % 96);
  const sprCols = ['#ff6b8d', '#7ecbff', '#7bd94a', '#ffd24a', '#c592ff'];
  for (let x = offS - 96, i = 0; x < W + 96; x += 32, i++) {
    const wx = Math.round((x + worldX) / 32);
    ctx.save();
    ctx.translate(x + 16, GROUND_Y + 1 + (wx % 3));
    ctx.rotate((wx * 1.7) % TAU);
    ctx.fillStyle = sprCols[((wx % 5) + 5) % 5];
    roundRect(-4, -1.6, 8, 3.2, 1.6); ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = 'rgba(90,50,20,.55)';
  const off2 = -(worldX % 160);
  for (let x = off2 - 160; x < W + 160; x += 160) {
    ctx.beginPath(); ctx.arc(x + 40, GROUND_Y + 42, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 110, GROUND_Y + 70, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 75, GROUND_Y + 95, 6, 0, TAU); ctx.fill();
  }

  for (const p of pits) {
    const px = p.x - worldX;
    if (px > W || px + p.w < 0) continue;
    ctx.fillStyle = '#1d1006';
    ctx.fillRect(px, GROUND_Y, p.w, H - GROUND_Y);
    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 60);
    gg.addColorStop(0, 'rgba(0,0,0,.65)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(px, GROUND_Y, p.w, 60);
    ctx.fillStyle = '#8a5a28';
    ctx.fillRect(px - 4, GROUND_Y, 6, 18);
    ctx.fillRect(px + p.w - 2, GROUND_Y, 6, 18);
  }
}

/* ---------- เตาอบตอนเริ่มเกม: คุกกี้หนีออกมาจากตรงนี้! ---------- */
function drawOven() {
  if (G.state !== 'play' && G.state !== 'over') return;

  if (sx < -360) return;
  ctx.save();
  ctx.translate(sx, GROUND_Y);
  // ตัวเตา
  ctx.fillStyle = '#4a2c16';
  roundRect(0, -292, 296, 292, 26); ctx.fill();
  ctx.fillStyle = '#5f3a1e';
  roundRect(10, -282, 276, 272, 20); ctx.fill();
  // ปล่องควัน
  ctx.fillStyle = '#4a2c16';
  roundRect(210, -344, 46, 60, 8); ctx.fill();
  // ควันลอย
  for (let i = 0; i < 3; i++) {
    const t = (G.time * 0.5 + i * 0.33) % 1;

    ctx.arc(233 + Math.sin(t * 5) * 10, -350 - t * 70, 10 + t * 14, 0, TAU);

  }

  gg.addColorStop(0.55, '#7a2f0a');

  // บานประตูเหวี่ยงเปิด
  ctx.fillStyle = '#3a2210';
  roundRect(-44, -200, 40, 186, 10); ctx.fill();
  ctx.fillStyle = '#57351c';
  roundRect(-38, -192, 28, 170, 8); ctx.fill();
  ctx.fillStyle = '#c9a15f';
  ctx.beginPath(); ctx.arc(-24, -108, 6, 0, TAU); ctx.fill();  // ลูกบิด

  ctx.fillStyle = '#33200f';
  roundRect(18, -6, 34, 14, 5); ctx.fill();
  roundRect(244, -6, 34, 14, 5); ctx.fill();
  ctx.restore();
}

function drawPlatforms() {
  for (const pl of platforms) {
    const x = pl.x - worldX;
    if (x + pl.w < -40 || x > W + 40) continue;
    ctx.fillStyle = '#b0793f';
    roundRect(x, pl.y, pl.w, 30, 10); ctx.fill();
    ctx.fillStyle = '#8a5a28';
    roundRect(x, pl.y + 18, pl.w, 12, 6); ctx.fill();
    ctx.fillStyle = '#f2d8a7';
    roundRect(x + 3, pl.y, pl.w - 6, 8, 4); ctx.fill();
    ctx.fillStyle = 'rgba(90,50,20,.4)';
    for (let dx = 22; dx < pl.w - 12; dx += 44) {
      ctx.beginPath(); ctx.arc(x + dx, pl.y + 17, 3.5, 0, TAU); ctx.fill();
    }
  }
}

function drawPet(pet) {
  const p = pet || PT();
  ctx.save();
  if (!pet) ctx.translate(Pet.x, Pet.y);
  const flap = Math.sin(Pet.wing) * 0.7;
  if (p.id === 'maca') {
    ctx.fillStyle = '#ffe9b8';
    ctx.save(); ctx.rotate(-0.5 - flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-10, -6, 12, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ff9db8';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 4.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7ba0';
    ctx.beginPath(); ctx.arc(0, -5, 12, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(5, -4, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -4, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffb84a';
    ctx.beginPath(); ctx.moveTo(14, -1); ctx.lineTo(20, 1); ctx.lineTo(14, 3); ctx.fill();
    ctx.fillStyle = '#ffd9e4';
    ctx.save(); ctx.rotate(0.3 + flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-8, 4, 10, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (p.id === 'chick') {
    // ลูกเจี๊ยบทอฟฟี่
    ctx.fillStyle = '#ffe98a';
    ctx.save(); ctx.rotate(-0.4 - flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-11, -4, 11, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#ffd84a';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffce2e';
    ctx.beginPath(); ctx.arc(0, 5, 12, 0, Math.PI); ctx.fill();
    // หงอนทอฟฟี่
    ctx.fillStyle = '#e0453a';
    ctx.beginPath(); ctx.arc(0, -14, 4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-5, -12, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(5, -3, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -3, 2.1, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff9d2e';
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(21, 2); ctx.lineTo(14, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,.5)';
    ctx.beginPath(); ctx.arc(2, 4, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.save(); ctx.rotate(0.3 + flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-8, 5, 9, 5, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    // ปุยเมฆน้ำตาล
    const bob = Math.sin(Pet.wing * 0.5) * 2;
    ctx.translate(0, bob);
    ctx.fillStyle = '#f6efe4';
    for (const [dx, dy, r] of [[-10,2,9],[0,-4,12],[11,2,9],[0,5,10]])
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(200,150,190,.35)';
    ctx.beginPath(); ctx.ellipse(0, 9, 13, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a2410';
    ctx.beginPath(); ctx.arc(-1, -2, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -2, 2.1, 0, TAU); ctx.fill();

    ctx.fillStyle = 'rgba(255,150,150,.5)';
    ctx.beginPath(); ctx.arc(-6, 2, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 2, 2.2, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ---------- jellies & items ---------- */
function drawJellies() {
  for (const j of jellyList) {
    const x = j.x - worldX;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(G.time * 4 + j.t) * 4;
    const y = j.y + bob;
    ctx.save();
    ctx.translate(x, y);
    switch (j.type) {
      case 'bar': {
        // แสงเรืองนุ่ม ๆ ด้านหลัง
        ctx.fillStyle = 'rgba(255,220,90,.16)';
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        const w = 26, h = 13;
        ctx.fillStyle = '#e8a90c';
        roundRect(-w/2, -h/2, w, h, 6); ctx.fill();
        ctx.fillStyle = '#ffce2e';
        roundRect(-w/2, -h/2, w, h - 3.5, 6); ctx.fill();
        ctx.fillStyle = '#ffe883';
        roundRect(-w/2 + 1.5, -h/2 + 1.5, w - 3, 4.5, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        roundRect(-w/2+3, -h/2+2, w-16, 3.4, 2); ctx.fill();
        break;
      }
      case 'pink': {
        ctx.fillStyle = 'rgba(255,123,172,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0568c';
        heart(0, 1.8, 15); ctx.fill();
        ctx.fillStyle = '#ff7bac';
        heart(0, 0, 15); ctx.fill();
        ctx.fillStyle = '#ffa8ca';
        heart(-1, -2, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(-5, -6, 3.2, 0, TAU); ctx.fill();
        break;
      }
      case 'coin': {
        ctx.fillStyle = 'rgba(255,216,74,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
        ctx.fillStyle = '#b8830a';
        ctx.beginPath(); ctx.arc(0, 1.6, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffd84a';
        ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.ellipse(-3.4, -4.2, 4.2, 2.4, -0.6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('C', 0, 1);
        break;
      }
      case 'bear': drawBearJelly(); break;
      case 'potion': {
        ctx.fillStyle = '#e94f4f';
        ctx.beginPath(); ctx.arc(0, 3, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f9f4ea';
        ctx.fillRect(-5, -16, 10, 8);
        ctx.fillStyle = '#c9c2b4';
        ctx.fillRect(-6, -18, 12, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, 0, 12, 5); ctx.fillRect(-2.5, -3.5, 5, 12);
        glowRing('#7bff9b');
        break;
      }
      case 'giant': {
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff9d2e';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G', 0, 1);
        glowRing('#ffd24a');
        break;
      }
      case 'magnet': {
        ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, -2, 10, Math.PI, 0, false); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(10, 8); ctx.stroke();
        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-10, 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(10, 12); ctx.stroke();
        glowRing('#7ecbff');
        break;
      }
      case 'star': {
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.25);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? 16 : 7;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.beginPath(); ctx.arc(-3, -4, 3, 0, TAU); ctx.fill();
        glowRing('#ffe066');
        break;
      }
    }
    ctx.restore();
  }
}
function glowRing(c) {
  ctx.strokeStyle = c; ctx.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(G.time * 6) * 3, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBearJelly() {
  const c = '#ffab2e', hl = 'rgba(255,255,255,.55)';
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(-13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.fill();
  roundRect(-14, 2, 28, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 24, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(-6, -13, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4a10';
  ctx.beginPath(); ctx.arc(-6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  glowRing('#ffab2e');
}

/* ---------- obstacles ---------- */
function drawObstacles() {
  for (const o of obstacles) {
    const x = o.x - worldX;
    if (x < -140 || x > W + 60) continue;
    ctx.save();
    ctx.translate(x, GROUND_Y);
    if (o.type === 'spike') {
      for (let i = 0; i < 3; i++) {
        const bx = i * 16 - 2;
        ctx.fillStyle = i % 2 ? '#ff5f7e' : '#ff8fa8';
        ctx.beginPath();
        ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i===1?8:0)); ctx.lineTo(bx + 16, 0);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.moveTo(bx + 3, -6); ctx.lineTo(bx + 7, -32); ctx.lineTo(bx + 9, -6);
        ctx.fill();
      }
    } else if (o.type === 'rock') {
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(6, -34); ctx.lineTo(22, -50) ; ctx.lineTo(42, -42);
      ctx.lineTo(56, -18); ctx.lineTo(54, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#40230f'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#8a5a35';
      ctx.beginPath();
      ctx.moveTo(8, -30); ctx.lineTo(22, -44); ctx.lineTo(36, -38); ctx.lineTo(30, -20);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(24, -40, 4, 0, TAU); ctx.fill();
    } else if (o.type === 'bar') {
      const y = -62;
      ctx.fillStyle = '#f6e7d0';
      roundRect(0, -H, 14, H + y, 6); ctx.fill();
      roundRect(96, -H, 14, H + y, 6); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -H, 14, H + y); ctx.rect(96, -H, 14, H + y); ctx.clip();
      ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 7;
      for (let yy = -H; yy < y + 20; yy += 20) {
        ctx.beginPath(); ctx.moveTo(-8, yy); ctx.lineTo(24, yy + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(88, yy); ctx.lineTo(120, yy + 20); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = '#b0793f';
      roundRect(-8, y - 26, 126, 26, 8); ctx.fill();
      ctx.fillStyle = '#8a5a28';
      roundRect(-8, y - 26, 126, 10, 5); ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('▼ SLIDE ▼', 55, y - 34);
    }
    ctx.restore();
  }
}

/* ---------- player ---------- */
function drawPlayer() {
  if (P.fallingPit && P.y > H) return;
  const scale = P.giantT > 0 ? 1.6 : 1;
  const blink = P.invT > 0 && Math.floor(G.time * 14) % 2 === 0;
  if (blink) return;

  ctx.save();
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  ctx.translate(P.x + P.w * scale / 2, P.y + ph);

  if (!P.fallingPit) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const shY = GROUND_Y - (P.y + ph);
    ctx.beginPath();
    ctx.ellipse(0, shY + 6, 30 * scale * (1 - clamp(shY/300,0,0.5)), 8 * scale, 0, 0, TAU);
    ctx.fill();
  }

  ctx.scale(scale, scale);
  // squash & stretch (จุดหมุนอยู่ที่เท้า)
  if (Math.abs(P.squash) > 0.01 && !P.sliding)
    ctx.scale(1 + P.squash * 0.45, 1 - P.squash * 0.4);
  if (P.giantT > 0 && P.giantT < 1.2 && Math.floor(G.time * 10) % 2 === 0)
    ctx.globalAlpha = 0.6;

  if (P.boostT > 0 || G.bonusT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(G.time * 12) * 0.15;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.ellipse(-6, -P.h / 2, 46, 52, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,60,.65)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = -14 - i * 16, ln = 30 + ((P.anim * 9 + i * 3) % 4) * 10;
      ctx.beginPath(); ctx.moveTo(-32, yy); ctx.lineTo(-32 - ln, yy); ctx.stroke();
    }
  }

  const run = P.anim;
  if (P.dead) {
    // ล้มคว่ำหมุนตัวตอนพลังหมด (แบบเกมจริง)
    const t = clamp(G.overT * 1.5, 0, 1);
    ctx.translate(0, -Math.sin(Math.min(t, 1) * Math.PI) * 26);
    ctx.rotate(Math.min(t * 2.4, Math.PI / 2));
    cookieBody(0, 0.8, -0.5, 3.3, 2.3, 0);
  } else {
    if (P.stumbleT > 0)
      ctx.rotate(Math.sin(G.time * 36) * 0.14 * (P.stumbleT / 0.5));
    if (P.sliding) drawCookieSlide(run);
    else if (!P.onGround) drawCookieJump(P.jumps >= 2);
    else drawCookieRun(run);
  }

  if (P.magnetT > 0) {
    ctx.strokeStyle = 'rgba(126,203,255,.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -G.time * 60;
    ctx.beginPath(); ctx.arc(0, -P.h/2, 66, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* วาดตัวคุกกี้ (จุดกำเนิด = กึ่งกลางเท้า) — ch = ตัวละคร */
function cookieBody(bodyTilt, legA, legB, armA, armB, headBob, ch) {
  ch = ch || CH();
  const B = ch.body, ICING = ch.icing, DARK = '#8a5a28';
  const OUTL = shade(B, -52);   // เส้นขอบการ์ตูน
  ctx.save();
  ctx.rotate(bodyTilt);

  // ปีกเทวดา (วาดก่อนตัว)
  if (ch.id === 'angel') {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const f = Math.sin(P.anim * 2) * 0.2;
    ctx.save(); ctx.rotate(-0.4 + f);
    ctx.beginPath(); ctx.ellipse(-20, -52, 16, 8, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-26, -46, 12, 6, -0.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  const leg = (ang, len) => {
    ctx.save();
    ctx.translate(0, -26);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUTL; ctx.lineWidth = 16.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
    ctx.strokeStyle = B; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
    ctx.fillStyle = ICING;
    ctx.beginPath(); ctx.ellipse(2, len + 2, 9, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUTL; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(2, len + 2, 9, 6, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  };
  leg(legA, 26); leg(legB, 26);

  ctx.fillStyle = B;
  roundRect(-17, -58, 34, 38, 14); ctx.fill();
  ctx.strokeStyle = OUTL; ctx.lineWidth = 2.6;
  roundRect(-17, -58, 34, 38, 14); ctx.stroke();
  // ไฮไลต์นุ่มบนตัว
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  roundRect(-13, -56, 26, 12, 8); ctx.fill();
  ctx.strokeStyle = ICING; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-13, -34);
  ctx.lineTo(-7, -40); ctx.lineTo(-1, -34); ctx.lineTo(5, -40); ctx.lineTo(11, -34);
  ctx.stroke();
  ctx.fillStyle = ch.button;
  ctx.beginPath(); ctx.arc(0, -48, 4.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.arc(-1.5, -49.5, 1.6, 0, TAU); ctx.fill();

  // เมล็ดสตรอว์เบอร์รีบนตัว
  if (ch.id === 'berry') {
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    for (const [dx, dy] of [[-9,-30],[8,-28],[-4,-24],[10,-38],[-11,-42]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 1.6, 2.4, 0.4, 0, TAU); ctx.fill(); }
  }

  const arm = (ang) => {
    ctx.save();
    ctx.translate(0, -52);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUTL; ctx.lineWidth = 14.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
    ctx.strokeStyle = B; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
    ctx.fillStyle = ICING;
    ctx.beginPath(); ctx.arc(0, 24, 6, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUTL; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 24, 6, 0, TAU); ctx.stroke();
    ctx.restore();
  };
  arm(armA); arm(armB);

  // หัว (โตแบบคาแรกเตอร์เกมจริง)
  ctx.save();
  ctx.translate(0, -80 + headBob);
  ctx.fillStyle = B;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = OUTL; ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  // ไฮไลต์แก้มขวาบน
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath(); ctx.arc(10, -10, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = ICING;
  ctx.beginPath();
  ctx.arc(0, -4, 27, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(16, -22, 7, -13);
  ctx.quadraticCurveTo(2, -25, -5, -13);
  ctx.quadraticCurveTo(-11, -25, -18, -11);
  ctx.closePath(); ctx.fill();

  // เครื่องประดับหัวตามตัวละคร
  if (ch.id === 'berry') {
    ctx.fillStyle = '#5cb85c';
    for (const a of [-0.5, 0, 0.5]) {
      ctx.save(); ctx.translate(0, -23); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0, -6, 5, 10, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  } else if (ch.id === 'ninja') {
    ctx.fillStyle = '#e0453a';
    roundRect(-27, -11, 54, 10, 5); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-25, -5); ctx.lineTo(-44, 4); ctx.lineTo(-40, 10); ctx.lineTo(-25, 2);
    ctx.fill();
  } else if (ch.id === 'angel') {
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, -35, 17, 5.5, 0, 0, TAU); ctx.stroke();
  }

  // ตาโตรีแบบเกมจริง + ประกายตา 2 จุด
  ctx.fillStyle = ch.id === 'ninja' ? '#2a3040' : '#3a2410';
  ctx.beginPath(); ctx.ellipse(4, -1, 4.3, 5.8, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(17, -1, 4.3, 5.8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5.4, -3.2, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(18.4, -3.2, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.8, 0.6, 0.9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(15.8, 0.6, 0.9, 0, TAU); ctx.fill();
  // ปากยิ้มกว้างอ้าปาก + ลิ้น (ซิกเนเจอร์คุกกี้รัน)
  ctx.fillStyle = '#5f2c14';
  ctx.beginPath();
  ctx.arc(11, 6, 8, 0.04 * Math.PI, 0.96 * Math.PI);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(11, 6, 8, 0.04 * Math.PI, 0.96 * Math.PI);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#ff8f86';
  ctx.beginPath(); ctx.ellipse(11, 13.4, 6.2, 4, 0, 0, TAU); ctx.fill();
  ctx.restore();
  // แก้มชมพู
  ctx.fillStyle = ch.cheek;
  ctx.beginPath(); ctx.arc(-6, 7, 4.4, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(24, 7, 4, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawCookieRun(t, ch) {
  const c = Math.sin(t), s = Math.sin(t + Math.PI);
  cookieBody(0.10, c * 0.9, s * 0.9, 2.6 + s * 0.7, 2.6 + c * 0.7, Math.abs(Math.cos(t)) * -2, ch);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap='round';
  for (let i = 0; i < 3; i++) {
    const yy = -30 - i * 18, ln = 14 + ((t * 7 + i * 2) % 3) * 5;
    ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
  }
}
function drawCookieJump(second) {
  if (second) {
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(P.anim * 1.8 % TAU);
    ctx.translate(0, 40);
    cookieBody(0, 0.9, -0.9, 2.2, 3.4, 0);
    ctx.restore();
  } else {
    cookieBody(0.14, P.vy < 0 ? 1.1 : 0.4, P.vy < 0 ? -0.6 : -1.1, 2.0, 3.6, 0);
  }
}
function drawCookieSlide(t) {
  ctx.save();
  ctx.rotate(-Math.PI / 2 + 0.28);
  ctx.translate(16, 6);
  cookieBody(0, 0.5 + Math.sin(t*2)*0.1, -0.3, 2.8, 3.2, 0);
  ctx.restore();
  if (Math.random() < 0.5) puff(P.x + 10, GROUND_Y, 1);
}

/* ---------- particles & floaters ---------- */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      ctx.fillRect(-p.r, -p.r/3, p.r*2, p.r/1.5);
      ctx.fillRect(-p.r/3, -p.r, p.r/1.5, p.r*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / 1.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `bold ${f.big ? 24 : 17}px Trebuchet MS`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   UI WIDGETS
   ============================================================ */
function drawBtn(x, y, w, h, label, cb, opt = {}) {
  uiButtons.push({ x, y, w, h, cb, disabled: opt.disabled });
  const base = opt.disabled ? '#8a8178' : (opt.color || '#ff8b3d');
  const dark = opt.disabled ? '#6e675f' : (opt.dark || '#d96a1e');
  // เงา
  ctx.fillStyle = 'rgba(60,25,0,.4)';
  roundRect(x, y + 4, w, h, h / 2.4); ctx.fill();
  // ปุ่ม
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, base); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(x, y, w, h, h / 2.4); ctx.fill();
  // ไฮไลต์บน
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(x + 6, y + 4, w - 12, h * 0.32, h * 0.16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, h / 2.4); ctx.stroke();
  // ตัวหนังสือ
  ctx.font = `bold ${opt.font || 21}px Trebuchet MS`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(80,35,0,.7)';
  ctx.strokeText(label, x + w / 2, y + h / 2 + 1);
  ctx.fillStyle = opt.disabled ? '#d5cfc8' : '#fff';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function drawPanel(x, y, w, h, r = 18) {
  ctx.fillStyle = 'rgba(58,30,8,.82)';
  roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,160,.4)';
  ctx.lineWidth = 2.5;
  roundRect(x + 3, y + 3, w - 6, h - 6, r - 3); ctx.stroke();
}

function drawCoinChip(x, y, text) {
  const w = ctx.measureText(text).width;
  ctx.save();
  ctx.font = 'bold 19px Trebuchet MS';
  const tw = ctx.measureText(text).width + 52;
  drawPanel(x - tw, y, tw, 34, 17);
  ctx.fillStyle = '#e8a90c';
  ctx.beginPath(); ctx.arc(x - tw + 20, y + 17, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath(); ctx.arc(x - tw + 20, y + 17, 8.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b8860b';
  ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('C', x - tw + 20, y + 18);
  ctx.font = 'bold 19px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8'; ctx.textAlign = 'left';
  ctx.fillText(text, x - tw + 38, y + 18);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawTitleText(text, x, y, size, fill1 = '#ffe9a0', fill2 = '#ff8b2e') {
  ctx.textAlign = 'center';
  ctx.font = `bold ${size}px Trebuchet MS`;
  ctx.lineWidth = size * 0.19;
  ctx.strokeStyle = '#5a2e10';
  ctx.strokeText(text, x, y);
  const grad = ctx.createLinearGradient(0, y - size * 0.8, 0, y + size * 0.15);
  grad.addColorStop(0, fill1); grad.addColorStop(1, fill2);
  ctx.fillStyle = grad;
  ctx.fillText(text, x, y);
}

/* ---------- HUD ---------- */
function drawHUD() {
  const bx = 24, by = 20, bw = 330, bh = 26;
  ctx.fillStyle = 'rgba(60,30,0,.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 14); ctx.fill();
  const hpFrac = G.hp / G.hpMax;
  const hpC = hpFrac > 0.5 ? '#7bd94a' : hpFrac > 0.25 ? '#ffce2e' : '#ff5f5f';
  ctx.fillStyle = '#3d2410';
  roundRect(bx, by, bw, bh, 11); ctx.fill();
  if (hpFrac > 0.01) {
    ctx.fillStyle = hpC;
    roundRect(bx, by, Math.max(14, bw * hpFrac), bh, 11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(bx + 3, by + 3, Math.max(8, bw * hpFrac - 6), 8, 5); ctx.fill();
  }

  // หน้าคุกกี้ที่หัวแถบพลัง
  ctx.save();
  ctx.translate(bx + 2, by + bh / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().body;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().icing;
  ctx.beginPath(); ctx.arc(0, -3, 18, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(10, -15, 4, -9);
  ctx.quadraticCurveTo(0, -16, -4, -9);
  ctx.quadraticCurveTo(-8, -16, -12, -7);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.ellipse(-4, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a28'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(1, 6, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  if (hpFrac < 0.25 && Math.floor(G.time * 3) % 2 === 0) {
    ctx.fillStyle = '#ff5f5f';
    ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'left';
    ctx.fillText('⚠ พลังใกล้หมด! เก็บยาเพิ่มพลัง!', bx + 10, by + bh + 22);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Trebuchet MS';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.8)';
  const sc = Math.floor(G.score).toLocaleString();
  ctx.strokeText(sc, W - 26, 46);
  ctx.fillStyle = '#fff';
  ctx.fillText(sc, W - 26, 46);
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.strokeStyle = 'rgba(60,30,0,.7)'; ctx.lineWidth = 3;
  const meta = `🏃 ${Math.floor(G.dist)} m    🍬 ${G.jellies}    🪙 ${G.coins}`;
  ctx.strokeText(meta, W - 26, 72);
  ctx.fillText(meta, W - 26, 72);

  if (G.combo >= 5) {
    ctx.textAlign = 'center';
    const pop = 1 + Math.max(0, 0.4 - G.comboTimer) * 0.6;
    ctx.save();
    ctx.translate(W / 2, 96);
    ctx.scale(pop, pop);
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText(G.combo + ' COMBO!', 0, 0);
    ctx.fillStyle = `hsl(${(G.combo * 14) % 360},90%,65%)`;
    ctx.fillText(G.combo + ' COMBO!', 0, 0);
    ctx.restore();
  }

  let iy = by + bh + (G.hp / G.hpMax < 0.25 ? 38 : 14) + 8;
  ctx.textAlign = 'left'; ctx.font = 'bold 15px Trebuchet MS';
  if (P.giantT > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🍭 ยักษ์: ' + P.giantT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (P.magnetT > 0) {
    ctx.fillStyle = '#7ecbff';
    ctx.fillText('🧲 แม่เหล็ก: ' + P.magnetT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.bonusT > 0) {
    ctx.fillStyle = '#ffe066';
    ctx.fillText('⭐ BONUS TIME: ' + G.bonusT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.revives > 0) {
    ctx.fillStyle = '#ffb0c8';
    ctx.fillText('💖 ชุบชีวิต x' + G.revives, bx, iy);
  }
}

function drawBanner() {
  if (!G.banner || G.bannerT > 1.6) return;
  const a = G.bannerT < 0.25 ? G.bannerT / 0.25 : G.bannerT > 1.25 ? (1.6 - G.bannerT) / 0.35 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(G.banner.text, W / 2, 200);
  ctx.fillStyle = G.banner.color;
  ctx.fillText(G.banner.text, W / 2, 200);
  ctx.globalAlpha = 1;
}

/* ============================================================
   SCREENS
   ============================================================ */
function drawMenu() {
  ctx.fillStyle = 'rgba(40,20,5,.45)';
  ctx.fillRect(0, 0, W, H);

  // ขนมลอยตกแต่งฉากหลังเมนู
  const decor = [
    [70, 150, 0, 2.2], [880, 210, 1, 1.8], [905, 120, 2, 1.5],
    [60, 260, 2, 1.6], [850, 330, 0, 1.7],
  ];
  decor.forEach(([dx, dy, kind, sc], i) => {
    ctx.save();
    ctx.translate(dx, dy + Math.sin(G.time * 1.4 + i * 1.7) * 8);
    ctx.rotate(Math.sin(G.time * 0.9 + i) * 0.25);
    ctx.scale(sc, sc);
    ctx.globalAlpha = 0.5;
    if (kind === 0) {           // เยลลี่แท่ง
      ctx.rotate(0.5);
      ctx.fillStyle = '#ffce2e'; roundRect(-13, -6.5, 26, 13, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(-10, -4.5, 10, 4, 2); ctx.fill();
    } else if (kind === 1) {    // หัวใจ
      ctx.fillStyle = '#ff7bac'; heart(0, 0, 13); ctx.fill();
    } else {                    // ดาว
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = k % 2 === 0 ? 13 : 5.5;
        const a = -Math.PI / 2 + k * Math.PI / 5;
        k === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });

  // โลโก้ + แสงวิ่งผ่าน
  ctx.save();
  ctx.translate(W / 2, 118);
  ctx.rotate(Math.sin(G.time * 1.2) * 0.02);
  ctx.scale(1 + Math.sin(G.time * 2.4) * 0.012, 1 + Math.sin(G.time * 2.4) * 0.012);
  drawTitleText('COOKIE RUN', 0, 0, 72);
  const sw = ((G.time * 0.45) % 2) - 0.5;      // -0.5..1.5 รอบละ ~4.4 วิ
  if (sw >= -0.2 && sw <= 1.2) {
    ctx.save();
    ctx.beginPath();
    const bandX = -330 + sw * 660;
    ctx.moveTo(bandX - 30, -70); ctx.lineTo(bandX + 30, -70);
    ctx.lineTo(bandX - 10, 20);  ctx.lineTo(bandX - 70, 20);
    ctx.closePath(); ctx.clip();
    ctx.font = 'bold 72px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText('COOKIE RUN', 0, 0);
    ctx.restore();
  }
  ctx.font = 'bold 28px Trebuchet MS';
  ctx.lineWidth = 7; ctx.strokeStyle = '#5a2e10';
  ctx.strokeText('~ คลาสสิค ~', 0, 42);
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('~ คลาสสิค ~', 0, 42);
  ctx.restore();

  // เหรียญสะสม + สถิติ
  drawCoinChip(W - 20, 16, G.bank.toLocaleString());
  if (G.best > 0) {
    ctx.font = 'bold 19px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 188);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 188);
  }

  // ตัวละครที่เลือก วิ่งโชว์
  ctx.save();
  ctx.translate(215, 420 + Math.abs(Math.sin(G.time * 3)) * -18);
  ctx.scale(1.25, 1.25);
  drawCookieRun(P.anim);
  ctx.restore();
  ctx.save();
  ctx.translate(130, 320 + Math.sin(G.time * 4) * 10);
  ctx.scale(1.3, 1.3);
  drawPet(PT());
  ctx.restore();
  ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(CH().name, 215, 465);
  ctx.fillStyle = '#fff';
  ctx.fillText(CH().name, 215, 465);

  // ปุ่มหลัก
  drawBtn(W / 2 - 10, 240, 310, 64, '▶  เริ่มวิ่ง!', () => startGame(), { color: '#ffb02e', dark: '#e07b12', font: 27 });
  drawBtn(W / 2 - 10, 322, 150, 50, '🍪 ตัวละคร', () => setState('select'), { color: '#f0699a', dark: '#c94d7d', font: 17 });
  drawBtn(W / 2 + 150, 322, 150, 50, '🐥 สัตว์เลี้ยง', () => setState('pets'), { color: '#7bd94a', dark: '#57a832', font: 17 });
  drawBtn(W / 2 - 10, 386, 150, 50, '🛍 ร้านค้า', () => setState('shop'), { color: '#5cb8e8', dark: '#3d92c4', font: 17 });
  drawBtn(W / 2 + 150, 386, 150, 50, '🏆 อันดับ', () => setState('rank'), { color: '#9d7ee0', dark: '#7a5cc0', font: 17 });

  // ป้ายภารกิจปัจจุบัน
  const m = MISSIONS[G.missionIdx];
  ctx.textAlign = 'left';
  if (m) {
    drawPanel(24, 20, 356, 66, 14);
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('📜 ภารกิจที่ ' + (G.missionIdx + 1) + '/' + MISSIONS.length, 42, 45);
    ctx.font = '15px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(m.desc + '  →  🪙 ' + m.reward, 42, 70);
  } else {
    drawPanel(24, 20, 356, 44, 14);
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('🎖 เคลียร์ภารกิจครบทุกด่านแล้ว สุดยอด!', 42, 48);
  }

  ctx.font = 'bold 14px Trebuchet MS';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,233,184,.85)';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.7)';
  const help = 'SPACE/แตะซ้าย = โดด 2 ครั้ง = ตีลังกา  ·  ↓/กดขวาค้าง = สไลด์  ·  M = เสียง';
  ctx.strokeText(help, W / 2, 526);
  ctx.fillText(help, W / 2, 526);
}

  ctx.fillRect(0, 0, W, H);

  CHARS.forEach((c, i) => {
    const x = x0 + i * (cw + gap), y = 96, h = 356;

    const owned = G.owned.includes(i);
    drawPanel(x, y, cw, h);
    if (selected) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
      roundRect(x + 2, y + 2, cw - 4, h - 4, 16); ctx.stroke();
    }

    // ตัวคุกกี้
    ctx.save();
    ctx.translate(x + cw / 2, y + 158);

    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.fillStyle = selected ? '#ffd24a' : '#fff';
    ctx.fillText(c.name, x + cw / 2, y + 196);

    ctx.fillText(c.desc[0], x + cw / 2, y + 222);
    ctx.fillText(c.desc[1], x + cw / 2, y + 242);

    if (selected) {
      drawBtn(x + 24, y + h - 76, cw - 48, 46, '✓ ใช้อยู่', () => {}, { disabled: true });

      drawBtn(x + 24, y + h - 76, cw - 48, 46, 'เลือก', () => trySelectChar(i), { color: '#7bd94a', dark: '#57a832' });

      const afford = G.bank >= c.cost;

    // เลเวลพิป
    const lv = G.upg[u.id];
    for (let p = 0; p < u.max; p++) {
      ctx.fillStyle = p < lv ? '#ffd24a' : 'rgba(255,255,255,.18)';
      roundRect(x + 350 + p * 26, y + 28, 20, 16, 5); ctx.fill();
    }
    // ปุ่มซื้อ
    if (lv >= u.max) {
      drawBtn(x + w - 170, y + 15, 150, 44, 'MAX ✓', () => {}, { disabled: true });
    } else {
      const cost = upgCost(u, lv);
      const afford = G.bank >= cost;
      drawBtn(x + w - 170, y + 15, 150, 44, '🪙 ' + cost.toLocaleString(), () => tryUpgrade(u),
        afford ? { color: '#ffb02e', dark: '#e07b12', font: 18 } : { color: '#8a8178', dark: '#6e675f', font: 18 });
    }
  });

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- ตารางอันดับ ---------- */
function drawRank() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ตารางอันดับ Top 10', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  drawPanel(130, 88, W - 260, 372, 20);

  if (G.board.length === 0) {
    ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ยังไม่มีสถิติ — ไปวิ่งกันเลย! 🏃', W / 2, 280);
  } else {
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = 'rgba(255,233,184,.7)';
    ctx.textAlign = 'left';  ctx.fillText('อันดับ', 165, 120);
    ctx.fillText('ตัวละคร', 245, 120);
    ctx.textAlign = 'right'; ctx.fillText('คะแนน', 590, 120);
    ctx.fillText('ระยะทาง', 700, 120);
    ctx.fillText('วันที่', 800, 120);
    G.board.forEach((e, i) => {
      const y = 152 + i * 30;
      const hl = i === G.rankPos && G.state === 'rank' ? false : false;
      ctx.font = i < 3 ? 'bold 18px Trebuchet MS' : '16px Trebuchet MS';
      ctx.fillStyle = i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 165, y);
      ctx.fillText(CHARS[e.c] ? CHARS[e.c].name : '-', 245, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 590, y);
      ctx.fillText(e.d.toLocaleString() + ' m', 700, y);
      const d = new Date(e.t);
      ctx.fillText(d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543).toString().slice(-2), 800, y);
    });
  }

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- game over ---------- */
function drawGameOver() {
  const a = clamp(G.overT / 0.6, 0, 1);
  ctx.fillStyle = `rgba(30,12,2,${a * 0.72})`;
  ctx.fillRect(0, 0, W, H);
  if (a < 1) return;

  drawTitleText('พลังคุกกี้หมดแล้ว!', W / 2, 120, 52, '#ffb98a', '#ff7a4a');

  drawPanel(W / 2 - 240, 150, 480, 236, 20);
  const rows = [
    ['คะแนนรวม', Math.floor(G.score).toLocaleString()],
    ['ระยะทาง', Math.floor(G.dist).toLocaleString() + ' m'],
    ['เยลลี่ที่เก็บ', G.jellies.toLocaleString()],
    ['เหรียญที่ได้ (+โบนัส)', '🪙 ' + G.earned.toLocaleString()],
    ['ด่านที่ไปถึง', 'ด่าน ' + G.stage],
  ];
  ctx.font = 'bold 21px Trebuchet MS';
  rows.forEach(([k, v], i) => {
    const y = 186 + i * 34;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe9b8'; ctx.fillText(k, W / 2 - 20, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(v, W / 2 + 20, y);
  });
  // ผลภารกิจ
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px Trebuchet MS';
  if (G.missionDone) {
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('📜 ภารกิจสำเร็จ! รับโบนัส 🪙 ' + G.missionReward.toLocaleString(), W / 2, 366);
  } else if (MISSIONS[G.missionIdx]) {
    ctx.fillStyle = 'rgba(255,233,184,.75)';
    ctx.fillText('📜 ภารกิจ: ' + MISSIONS[G.missionIdx].desc, W / 2, 366);
  }

  ctx.textAlign = 'center';
  if (G.newBest && Math.floor(G.time * 3) % 2 === 0) {
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('🎉 สถิติใหม่! 🎉', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🎉 สถิติใหม่! 🎉', W / 2, 424);
  } else if (G.rankPos >= 0 && G.rankPos < 3) {
    ctx.font = 'bold 24px Trebuchet MS';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
  } else {
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 424);
  }

  if (G.overT > 0.9) {
    drawBtn(W / 2 - 230, 448, 220, 54, '▶ เล่นอีกครั้ง', () => startGame(), { color: '#ffb02e', dark: '#e07b12' });
    drawBtn(W / 2 + 10, 448, 220, 54, '🏠 เมนูหลัก', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
  }
}

/* ---------- shape helpers ---------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s, y - s * 0.5, x, y + s * 0.35);
  ctx.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
