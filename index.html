/* ============================================================
   UPDATE
   ============================================================ */
const isInvincible = () => P.invT > 0 || P.giantT > 0 || P.boostT > 0 || G.bonusT > 0 || G.formT > 0;
const canSmash = () => P.giantT > 0 || P.boostT > 0 || G.formT > 0;

function hurt(amount) {
  if (isInvincible() || P.dead) return;
  G.noHitT = 0;   // รีเซ็ตสตรีคไม่โดนชน (มินต์ช็อกโก)
  const cf = CFX();
  if (cf.k === 'obSmash' && (G.obSmashLeft || 0) > 0) {
    // พริกแดง: ชนแล้วทุบสิ่งกีดขวางแตกแทนการเจ็บ (จำกัดครั้ง)
    G.obSmashLeft--;
    G.shake = 8;
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 18, '#ff9d2e');
    floatText(P.x, P.y - 20, '💢 ทุบแตก! (เหลือ ' + G.obSmashLeft + ')', '#ff9d2e', true);
    P.invT = Math.max(P.invT, 0.8);
    return;
  }
  if (cf.k === 'hitGuard') {
    amount *= cf.v;   // เจ้าหญิง/กล้ามโต/แฟรี่: ลดดาเมจชน
    spawnActor('shield', { c: '#7ec8ff' });
  }
  amount *= (1 - petTPv('crash'));   // สมบัติสัตว์เลี้ยง: ลดดาเมจตอนชน
  G.hp -= amount;
  G.runHit = (G.runHit || 0) + 1;
  G.combo = 0;
  P.invT = 2.0;
  P.stumbleT = 0.5;
  G.shake = 20; G.flash = 0.6; FX.stopT = 0.28; FX.flashC = '#ff4040'; FX.flashT = 0.4;
  AudioSys.crash();
  sparkle(P.x + P.w / 2, P.y + P.h / 2, 14, '#ff6b6b');
  if (G.hp <= 0) { G.hp = 0; gameOver(); }
}

function update(dt) {
  if (FX.stopT > 0) { FX.stopT -= dt; dt *= 0.18; }   // สโลว์โมชันแวบตอนสกิลออก
  G.time += dt;
  if (G.bannerT < 99) G.bannerT += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt * 1.5);
  G.fade = Math.max(0, G.fade - dt * 2.6);
  if (skyT < 1) skyT = Math.min(1, skyT + dt / 1.8);

  for (const c of clouds) {
    c.x -= (c.v + (G.state === 'play' ? G.speed * 0.04 : 4)) * dt;
    if (c.x < -160) { c.x = W + rnd(20, 120); c.y = rnd(30, 170); }
  }
  for (const b of bokeh) {
    b.x -= (b.v + (G.state === 'play' ? G.speed * 0.06 : 3)) * dt;
    b.y += Math.sin(G.time * 0.7 + b.tw) * 6 * dt;
    b.y -= 30 * ovenAmt * dt;                     // ในเตา: ประกายไฟลอยขึ้น
    if (b.y < 10) b.y = 430;
    if (b.x < -40) { b.x = W + rnd(10, 60); b.y = rnd(30, 430); }
  }
  // ฉากเตาอบค่อย ๆ เปลี่ยนเป็นโลกภายนอกเมื่อถึงด่าน 3
  const ovTarget = (G.state === 'play' || G.state === 'over') && G.stage < 3 && G.mode !== 'tower' && !(G.mode === 'normal' && G.episode > 0) ? 1 : 0;
  ovenAmt += (ovTarget - ovenAmt) * Math.min(1, 1.3 * dt);
  if (ovTarget === 1 && ovenAmt > 0.99) ovenAmt = 1;
  P.squash += (0 - P.squash) * Math.min(1, 10 * dt);
  P.castT = Math.max(0, P.castT - dt);
  P.stumbleT = Math.max(0, P.stumbleT - dt);
  for (const t of trail) {
    t.t += dt;
    t.x -= (G.state === 'play' ? G.speed * 1.1 : 60) * dt;
  }
  trail = trail.filter(t => t.t < 0.45);

  if (G.state !== 'play') {
    if (G.state === 'over') G.overT += dt;
    if (G.state === 'clear') { G.clearT = (G.clearT || 0) + dt; updateFX(dt); }
    if (G.state === 'continue') {
      G.continueT -= dt;
      if (G.continueT <= 0) settleGameOver();
    }
    updateParticles(dt);
    P.anim += dt * 8;
    Pet.wing += dt * 14;
    return;
  }

  /* --- ความเร็ว & ด่าน --- */
  G.stageTimer += dt;
  if (G.stageTimer >= G.stageLen && G.speed < G.maxSpeed) {
    G.stageTimer = 0; G.stage++;
    G.speed = Math.min(G.maxSpeed, G.speed + 62);
    G.hpDrain += 0.35;
    skyPrev = skyCur;
    skyCur = G.mode === 'tower' ? 3 : G.stage < 3 ? 0 : (G.stage - 3) % SKIES.length;
    skyT = 0;
    if (G.mode !== 'tower' && G.stage === 3) banner('🎉 หนีออกจากเตาอบสำเร็จ! 🎉', '#ffd24a');
    else banner('SPEED UP!  ⚡ ด่าน ' + G.stage, '#7ee0ff');
    AudioSys.speedup();
  }

  /* --- HP ลดตามเวลา --- */
  /* ---- ความสามารถพิเศษประจำคุกกี้ (ตามเกมต้นฉบับ) ---- */
  const cf = CFX();
  G.noHitT = (G.noHitT || 0) + dt;
  if (cf.k === 'slamLand' && slideHeld && !P.onGround && G.bonusT <= 0 && !P.fallingPit) {
    P.vy = Math.max(P.vy, 1500);   // กบฏ: กดสไลด์กลางอากาศ = ดิ่งลงพื้นทันที
    P.slamMark = true;
  }
  if (P.slamMark && P.onGround) {
    P.slamMark = false;
    spawnActor('slam', { c: '#c8a06a' });
    G.shake = Math.max(G.shake || 0, 10);
  }
  G.formT = Math.max(0, (G.formT || 0) - dt);
  updateFX(dt);
  updateActors(dt);
  if (['spawnSp', 'destroyIv', 'coinIv', 'transform', 'songs', 'streak'].includes(cf.k) && cf.trig === undefined) {
    G.cfxT = (G.cfxT || 0) + dt;
    let iv = cf.iv * (1 - ((G.charLv[G.charIdx] || 1) - 1) * 0.04);
    if (cf.k === 'transform' && cf.low) iv *= 0.45 + 0.55 * (G.hp / G.hpMax);   // แปลงถี่ขึ้นเมื่อพลังต่ำ (มนุษย์หมาป่า)
    if (G.cfxT >= iv) {
      G.cfxT = 0;
      if (cf.k === 'spawnSp') {
        // สร้างเยลลี่พิเศษข้างหน้าให้เก็บ (สกิลสายเสกเยลลี่)
        if (cf.lt && G.btProgress < 9)
          jellyList.push({ x: worldX + P.x + 360, y: GROUND_Y - 120,
                           type: 'letter', ch: 'BONUSTIME'[G.btProgress], t: 0, dead: false });
        for (let q = 0; q < (cf.n || 3); q++)
          jellyList.push({ x: worldX + P.x + 380 + q * 44, y: GROUND_Y - 70 - Math.sin(q * 0.9) * 34, type: 'pink', t: 0, dead: false });
        sparkle(P.x + 60, P.y + 20, 10, '#ff9db8');
        floatText(P.x + 40, P.y - 24, '✨ ' + (cf.tag || 'เยลลี่พิเศษ') + '!', '#ff9db8');
        skillFX(CHARS[G.charIdx].id, '#ff9db8');
        skillCut(cf.tag, '#ff9db8');
        const spA = SPAWN_ACT[CHARS[G.charIdx].id];
        if (spA) spA();
      } else if (cf.k === 'destroyIv') {
        skillFX(CHARS[G.charIdx].id, '#ffd24a');   // เอฟเฟกต์ลายเซ็นออกทุกครั้งที่สกิลทำงาน
        skillCut(cf.tag, '#ffd24a');
        if (Boss.active) bossDamage(6);
        const oT = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 20; });
        const actF = ACTOR_MAP[CHARS[G.charIdx].id];
        if (actF) actF(oT ? oT.x - worldX : W * 0.72);
        const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 20; });
        if (o) {
          obstacles.splice(obstacles.indexOf(o), 1);
          const ox = o.x - worldX;
          const pts2 = Math.round(300 * lvMul());
          G.score += pts2;
          sparkle(ox, GROUND_Y - 26, 20, '#ffd24a');
          floatText(ox, GROUND_Y - 66, (cf.tag || '💥') + ' +' + pts2, '#ffd24a', true);
          FX.rings.push({ t: 0, c: '#ffd24a', x: ox, y: GROUND_Y - 40 });
          if (cf.jelly) for (let q = 0; q < 2; q++)
            jellyList.push({ x: o.x + q * 40, y: GROUND_Y - 60, type: 'pink', t: 0, dead: false });
          if (cf.coins) { G.coins += cf.coins; floatText(ox, GROUND_Y - 90, '🪙 +' + cf.coins, '#ffd24a'); }
        }
      } else if (cf.k === 'coinIv') {
        G.coins += cf.n;
        spawnActor('coins', { x0: P.x + 28, y0: P.y + 10 });
        skillBurst('#ffd24a');
        skillCut(cf.tag, '#ffd24a');
        AudioSys.jelly(10);
        sparkle(P.x + 50, P.y, 12, '#ffd700');
        floatText(P.x + 40, P.y - 24, (cf.tag || '🪙') + ' +' + cf.n, '#ffd24a', true);
      } else if (cf.k === 'songs') {
        // แคโรล: วนเพลง 3 แบบ ชีวิต/เปลี่ยนสิ่งกีดขวางเป็นเยลลี่/เหรียญ
        G.songIdx = ((G.songIdx || 0) + 1) % 3;
        if (G.songIdx === 0) {
          G.hp = Math.min(G.hpMax, G.hp + 12);
          banner('🎵 เพลงแห่งชีวิต +HP', '#7bff9b');
        } else if (G.songIdx === 1) {
          const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 20; });
          if (o) {
            obstacles.splice(obstacles.indexOf(o), 1);
            for (let q = 0; q < 2; q++)
              jellyList.push({ x: o.x + q * 40, y: GROUND_Y - 60, type: 'pink', t: 0, dead: false });
            sparkle(o.x - worldX, GROUND_Y - 26, 14, '#8fd8c8');
          }
          banner('🎵 เพลงแห่งการเปลี่ยนแปลง', '#8fd8c8');
        } else {
          G.coins += 4;
          banner('🎵 เพลงแห่งความอุดม +4🪙', '#ffd24a');
        }
        AudioSys.jelly(14);
        spawnActor('drift', { shape: 'note', c: ['#7bff9b', '#8fd8c8', '#ffd24a'][G.songIdx], n: 5, x0: P.x + 20, y0: P.y });
      } else if (cf.k === 'streak') {
        // มินต์ช็อกโก: ไม่ชนต่อเนื่อง = สีไวโอลินเสกเหรียญ (ชนแล้วสตรีคขาด)
        if (G.noHitT > 6) {
          G.coins += 3;
          G.score += Math.round(100 * lvMul());
          sparkle(P.x + 40, P.y + 10, 8, '#8fd8c8');
          floatText(P.x + 30, P.y - 20, '🎻 สตรีค +3🪙', '#8fd8c8');
          spawnActor('drift', { shape: 'note', c: '#8fd8c8', n: 3, x0: P.x + 20, y0: P.y });
        }
      } else {
        G.formT = cf.dur;
        skillBurst('#ffd76e', true);
        skillCut(cf.tag || '✨ แปลงร่าง!', '#ffd76e');
        G.shake = 6; AudioSys.power();
        banner((cf.tag || '✨ แปลงร่าง!') + ' อมตะ ' + cf.dur + ' วิ!', '#ffd24a');
      }
    }
  }

  /* ---- เอฟเฟกต์สัตว์เลี้ยง (ทุกชนิด สเกลตามเลเวล) ---- */
  const pf = PFX();
  if (pf.k === 'regen') G.hp = Math.min(G.hpMax, G.hp + pf.v * petFxMul() * dt);
  if (pf.k === 'skill') G.skill = Math.min(100, G.skill + pf.v * petFxMul() * dt);
  if (['jelly', 'pts', 'destroy', 'coinrain', 'give', 'bearify', 'scout', 'p2c', 'c2p'].includes(pf.k)) {
    G.petFxT = (G.petFxT || 0) + dt;
    const iv = Math.max(3, pf.v * (1 - (petLvNow() - 1) * 0.05));
    if (G.petFxT >= iv) {
      G.petFxT = 0;
      if (pf.k === 'jelly') {
        const pts2 = Math.round(180 * lvMul());
        G.score += pts2; sparkle(Pet.x, Pet.y, 10, '#ff9db8');
        floatText(Pet.x, Pet.y - 20, '🍬 +' + pts2, '#ff9db8');
      } else if (pf.k === 'pts') {
        const pts2 = Math.round(120 * lvMul());
        G.score += pts2; floatText(Pet.x, Pet.y - 20, '+' + pts2, '#ffe066');
      } else if (pf.k === 'coinrain') {
        const n = 3 + Math.floor(petLvNow() / 3);
        G.coins += n; floatText(Pet.x, Pet.y - 20, '🪙 +' + n, '#ffd24a');
        AudioSys.jelly(8);
      } else if (pf.k === 'give') {
        // แจกไอเทม/อักษร/ดาว/หมี ตามสกิลจริงของสัตว์เลี้ยง
        const it = pf.it === 'rand' ? ['potion', 'giant', 'magnet'][rndi(0, 2)] : pf.it;
        const jj = { x: worldX + P.x + 430, y: GROUND_Y - 96, type: it, t: 0, dead: false };
        if (it === 'letter') {
          if (G.btProgress < 9) jj.ch = 'BONUSTIME'[G.btProgress]; else jj.type = 'pink';
        }
        jellyList.push(jj);
        sparkle(Pet.x + 14, Pet.y, 8, '#ffe066');
        floatText(Pet.x, Pet.y - 20, '🎁 ' + PT().name + '!', '#ffe066');
      } else if (pf.k === 'scout') {
        // วินดี้: บินนำหน้าไปเก็บเยลลี่ให้ (สกิลจริง)
        let ns = 0;
        for (const j2 of jellyList) {
          const jx2 = j2.x - worldX;
          if (!j2.dead && jx2 > P.x + 80 && jx2 < P.x + 400 && ns < 8 &&
              ['bar', 'pink', 'coin'].includes(j2.type)) {
            j2.dead = true; collectJelly(j2, jx2); ns++;
          }
        }
        jellyList = jellyList.filter(j2 => !j2.dead);
        if (ns) { sparkle(P.x + 220, GROUND_Y - 90, 12, '#8fd8c8'); floatText(P.x + 200, GROUND_Y - 130, '🌬 ' + PT().name + ' เก็บให้ ' + ns + '!', '#8fd8c8'); }
      } else if (pf.k === 'p2c') {
        // ตาชั่งเหรียญ: แปลงแต้มเป็นเหรียญ (สกิลจริง)
        if (G.score >= 200) {
          G.score -= 200; G.coins += 3;
          floatText(Pet.x, Pet.y - 20, '⚖ -200 แต้ม → +3🪙', '#ffd24a');
        }
      } else if (pf.k === 'c2p') {
        // ตาชั่งเยลลี่: แปลงเหรียญเป็นแต้ม (สกิลจริง)
        if (G.coins >= 2) {
          G.coins -= 2;
          const cp = Math.round(300 * lvMul());
          G.score += cp;
          floatText(Pet.x, Pet.y - 20, '⚖ -2🪙 → +' + cp + ' แต้ม', '#aee4ff');
        }
      } else if (pf.k === 'bearify') {
        // เปลี่ยนเยลลี่ธรรมดาข้างหน้าเป็นหมีเยลลี่ (Bear Jelly Party)
        let nb = 0;
        for (const j2 of jellyList) {
          const jx2 = j2.x - worldX;
          if (!j2.dead && j2.type === 'bar' && jx2 > P.x + 60 && jx2 < W && nb < 4) {
            j2.type = 'bear'; j2.v = undefined; nb++;
          }
        }
        if (nb) { sparkle(Pet.x + 14, Pet.y, 10, '#ffb347'); floatText(Pet.x, Pet.y - 20, '🐻 BEAR PARTY x' + nb, '#ffb347', true); }
      } else {
        const o = obstacles.find(o2 => { const ox = o2.x - worldX; return ox > P.x + 40 && ox < W - 30; });
        if (o) {
          obstacles.splice(obstacles.indexOf(o), 1);
          const ox = o.x - worldX;
          if (pf.c) { G.coins += pf.c; floatText(ox, GROUND_Y - 86, '🪙 +' + pf.c, '#ffd24a'); }
          sparkle(ox, GROUND_Y - 26, 20, '#ff9d2e');
          debris(ox, GROUND_Y - 26, 16, '#8a5a2e'); dust(ox, GROUND_Y - 4, 7);
          floatText(ox, GROUND_Y - 60, '💥 เพื่อนซี้เคลียร์ทาง!', '#ff9d2e', true);
        }
      }
    }
  }
  // ✨ ผงเวทมนตร์โปรยระหว่างวิ่ง (แบบเกมจริง) — โผล่เป็นระยะ เก็บไว้อัปสกิลคุกกี้
  if (G.bonusT <= 0) {
    G.powderT += dt;
    if (G.powderT >= 22) {
      G.powderT = 0;
      jellyList.push({ x: worldX + W + 60, y: GROUND_Y - rnd(70, 150), type: 'powder', t: rnd(0, TAU), dead: false });
    }
  }
  if (G.bonusT <= 0) G.hp -= G.hpDrain * (1 - trV('drain') - combiV('drain')) * (CH().drainMul || 1) * (PFX().k === 'drain' ? 1 - (1 - PFX().v) * petFxMul() : 1) * dt;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }

  const spdMul = (P.giantT > 0 ? 1.12 : 1) * (P.boostT > 0 ? 2.1 : 1) * (G.bonusT > 0 ? 1.35 : 1) * (G.formT > 0 ? 1.12 : 1) * (1 + (CFX().k === 'spdPlus' ? CFX().v : 0)) * (1 + (PFX().k === 'spd' ? PFX().v : 0));
  const move = G.speed * dt * spdMul;
  worldX += move;
  G.dist += move / 40;
  G.score += move * 0.02;
  if (G.mode === 'story') {
    if (!Boss.active && !G.cleared && G.dist >= G.goal * 0.75) bossStart();
    if (Boss.active) bossUpdate(dt);
    if (!G.cleared && G.dist >= G.goal) { levelClear(); return; }
  }

  while (spawnX < worldX + W + 700) {
    rngSrc = courseRng;      // สร้างด่านด้วย seed คงที่
    spawnPattern();
    rngSrc = Math.random;
  }

  /* --- หอคอยน้ำแข็ง: ผ่านชั้นทุก 20 วิ --- */
  if (G.mode === 'tower') {
    G.floorT += dt;
    if (G.floorT >= 20) {
      G.floorT = 0;
      G.floorNow++;
      G.coins += 40;
      G.speed = Math.min(G.maxSpeed, G.speed + 22);
      if (G.floorNow % 5 === 0) {
        G.crystals++; SAVE.set('crystals', G.crystals);
        banner('🧊 ชั้น ' + G.floorNow + '! รางวัล +40🪙 +1💎', '#8fd3ff');
      } else banner('🧊 ผ่านชั้น ' + (G.floorNow - 1) + '! ขึ้นชั้น ' + G.floorNow, '#8fd3ff');
      if (G.floorNow > G.towerBest) { G.towerBest = G.floorNow; SAVE.set('towerBest', G.towerBest); }
      AudioSys.speedup();
    }
  }

  /* --- timers --- */
  P.invT = Math.max(0, P.invT - dt);
  P.giantT = Math.max(0, P.giantT - dt);
  P.magnetT = Math.max(0, P.magnetT - dt);
  P.boostT = Math.max(0, P.boostT - dt);
  G.scoreMulT = Math.max(0, G.scoreMulT - dt);
  if (G.bonusT > 0) {
    G.bonusT -= dt;
    // หมีเยลลี่ยักษ์รอปิดท้ายโบนัสไทม์ (แบบเกมจริง)
    if (G.bonusT <= 1.1 && !bonusBearSpawned) {
      bonusBearSpawned = true;
      const wx = worldX + W + 60;
      J(wx, bonusPathY(wx), 'bear');
    }
    if (G.bonusT <= 0) { G.bonusT = 0; bonusLetterQueue = []; P.invT = Math.max(P.invT, 1.5); }
  }
  G.comboTimer -= dt;
  if (G.comboTimer <= 0) G.combo = 0;
  P.anim += dt * (8 + G.speed / 90);

  // ฝุ่นแป้งฟุ้งใต้เท้าตอนวิ่ง
  if (P.onGround && !P.sliding && Math.random() < 0.25)
    puff(P.x + rnd(0, 18), GROUND_Y - 3, 1, '#c59a63');
  // ประกายทองระยิบพลิ้วตามหลัง (แบบเกมจริง)
  if (Math.random() < 0.35)
    particles.push({ x: P.x - 4, y: P.y + rnd(12, 66), vx: rnd(-60, -20), vy: rnd(-40, 15),
                     life: rnd(0.3, 0.55), t: 0, c: Math.random() < 0.7 ? '#ffd76a' : '#fff0c0',
                     r: rnd(1.8, 3.4), star: true });

  // สายรุ้งตามหลังช่วงพลังพิเศษ
  if (P.boostT > 0 || G.bonusT > 0 || P.giantT > 0) {
    const scale0 = P.giantT > 0 ? 1.6 : 1;
    const ph0 = (P.sliding ? P.h * 0.52 : P.h) * scale0;
    trail.push({ x: P.x + 6, y: P.y + ph0 * 0.5, hue: (G.time * 240) % 360, t: 0 });
  }

  /* --- สัตว์เลี้ยง --- */
  Pet.wing += dt * 14;
  const petTX = P.x - 62, petTY = P.y - 34 + Math.sin(G.time * 4) * 10;
  Pet.x += (petTX - Pet.x) * 6 * dt;
  Pet.y += (petTY - Pet.y) * 6 * dt;
  for (const j of jellyList) {
    if (j.dead) continue;
    const jx = j.x - worldX;
    if (jx < -40 || jx > 300) continue;
    if (['potion','giant','magnet','star','bear','blast','box','letter'].includes(j.type)) continue;
    const petR = 36 + (PFX().k === 'magnet' ? PFX().v * petFxMul() : 0);   // สัตว์เลี้ยงสายแม่เหล็ก
    if (Math.hypot(jx - Pet.x, j.y - Pet.y) < petR) { j.dead = true; collectJelly(j, jx); }
  }

  /* --- ฟิสิกส์ผู้เล่น --- */
  const scale = P.giantT > 0 ? 1.6 : 1;

  if (P.onGround && !P.fallingPit && G.bonusT <= 0) {
    const dh = (P.h - P.h * 0.52) * scale;
    if (slideHeld && !P.sliding) {
      P.sliding = true;
      P.y += dh;
      AudioSys.slide();
    } else if (!slideHeld && P.sliding) {
      P.sliding = false;
      P.y -= dh;
    }
  }

  const pw = P.w * scale;
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  const footX = P.x + pw * 0.5;

  if (G.bonusT > 0) {
    /* บินบังคับเอง: ค้างโดด = ขึ้น, ค้างสไลด์ = ดิ่ง, ปล่อย = ร่อนลงช้า ๆ */
    P.fallingPit = false; P.sliding = false;
    const flyUp = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] ||
                  Object.values(touches).includes('L') || mouseFly;
    P.vy += (flyUp ? -2700 : slideHeld ? 2700 : 1150) * dt;
    P.vy = clamp(P.vy, -450, 450);
    P.y += P.vy * dt;
    const yMin = 76, yMax = GROUND_Y - ph - 4;
    if (P.y < yMin) { P.y = yMin; P.vy = Math.max(P.vy, 0); }
    if (P.y > yMax) { P.y = yMax; P.vy = Math.min(P.vy, 0); }
    P.onGround = false; P.jumps = 1;
    if (Math.random() < 0.6) sparkle(P.x - 10, P.y + ph / 2, 1, '#ffd24a');
  } else {
    const prevFoot = P.y + ph;
    P.vy += effGrav(P.vy) * dt;
    if (slideHeld && !P.onGround)
      P.vy += GRAV * 1.4 * dt;               // ดิ่งลงเร็ว (fast fall)
    P.y += P.vy * dt;

    let overPit = false;
    for (const p of pits) {
      const px = p.x - worldX;
      if (footX > px + 14 && footX < px + p.w - 14) overPit = true;
    }

    if (!P.fallingPit) {
      let landed = false;
      if (P.vy >= 0) {
        for (const pl of platforms) {
          const px = pl.x - worldX;
          if (footX > px && footX < px + pl.w &&
              prevFoot <= pl.y + 10 && P.y + ph >= pl.y) {
            P.y = pl.y - ph;
            if (!P.onGround) { puff(footX, pl.y, 4); dust(footX, pl.y, 6); P.squash = 0.32; G.shake = Math.max(G.shake||0, 4); }
            P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
            break;
          }
        }
      }
      if (!landed && P.y + ph >= GROUND_Y) {
        if (overPit && !canSmash()) {
          P.fallingPit = true;
          AudioSys.fall();
        } else {
          P.y = GROUND_Y - ph;
          if (!P.onGround) { puff(P.x + pw / 2, GROUND_Y, 4); dust(P.x + pw / 2, GROUND_Y, P.giantT > 0 ? 12 : 6); P.squash = 0.32; G.shake = Math.max(G.shake||0, P.giantT > 0 ? 12 : 4); }
          P.vy = 0; P.onGround = true; P.jumps = 0; landed = true;
        }
      }
      if (!landed) P.onGround = false;
    } else {
      if (P.y > H + 60) hurtFromPit();
    }
  }

  /* --- เก็บเยลลี่ --- */
  const cx = P.x + pw / 2, cy = P.y + ph / 2;
  for (const j of jellyList) {
    if (j.dead) continue;
    let jx = j.x - worldX;
    if (jx < -80) { j.dead = true; continue; }
    if (jx > W + 80) break;
    if ((P.magnetT > 0 || P.boostT > 0 || G.bonusT > 0 || trV('magnet') > 0 || CH().magnet) && !['potion','giant','magnet','star','blast','box','letter','ingr','btjelly'].includes(j.type)) {
      const dx = cx - jx, dy = cy - j.y;
      const d = Math.hypot(dx, dy);
      // ช่วงโบนัสดูดรัศมีสั้นลง จะได้เห็นตัวอักษร BONUS ชัด ๆ ก่อนบินทะลุ
      const attractR = G.bonusT > 0 ? 135 : (P.magnetT > 0 || P.boostT > 0) ? 260 : 95;
      if (d < attractR) { j.x += dx / d * 620 * dt; j.y += dy / d * 620 * dt; jx = j.x - worldX; }
    }
    const r = JSIZE[j.type] / 2 + (P.giantT > 0 ? 30 : 14);
    if (Math.abs(jx - cx) < r + pw / 2 - 8 && Math.abs(j.y - cy) < r + ph / 2 - 4) {
      j.dead = true;
      collectJelly(j, jx);
    }
  }
  jellyList = jellyList.filter(j => !j.dead);

  /* --- ชนสิ่งกีดขวาง --- */
  for (const o of obstacles) {
    if (o.dead) continue;
    const ox = o.x - worldX;
    if (ox < -120) { o.dead = true; continue; }
    if (ox > W + 60) break;
    if (G.bonusT > 0) continue;
    let hit = false;
    if (o.type === 'bar') {
      const barBottom = GROUND_Y - 62;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + 110 && P.y < barBottom) hit = true;
    } else {
      const ow = o.type === 'spike' ? 46 : 56, oh = o.type === 'spike' ? 46 : 52;
      if (cx + pw / 2 - 12 > ox && cx - pw / 2 + 12 < ox + ow && P.y + ph > GROUND_Y - oh + 6) hit = true;
    }
    if (hit) {
      if (canSmash()) {
        o.dead = true;
        sparkle(ox + 20, GROUND_Y - 40, 16, '#ffd24a');
        G.score += 100; floatText(ox, GROUND_Y - 90, 'SMASH! +100', '#ffd24a', true);
        AudioSys.noise(0.15, 0.3);
      } else {
        hurt(14 + G.stage);
      }
    }
  }
  obstacles = obstacles.filter(o => !o.dead);
  pits = pits.filter(p => p.x - worldX > -400);
  platforms = platforms.filter(p => p.x + p.w - worldX > -200);

  updateParticles(dt);
}

function hurtFromPit() {
  G.noHitT = 0;
  if (PFX().k === 'lift' && (G.liftLeft || 0) > 0) {
    // สัตว์เลี้ยงช่วยดึงขึ้นจากหลุม (สกิลจริง เช่น ผีน้อย/สะพานน้ำแข็ง)
    G.liftLeft--;
    P.vy = -900; P.fallingPit = false; P.invT = Math.max(P.invT, 1.2);
    sparkle(P.x + 20, P.y + 40, 16, '#aee4ff');
    floatText(P.x, P.y - 20, '🕊 ' + PT().name + ' ช่วยไว้! (เหลือ ' + G.liftLeft + ')', '#aee4ff', true);
    AudioSys.potion();
    return;
  }
  G.hp -= (20 + G.stage * 2) * CH().pitGuard * (1 - trV('pit'));
  G.combo = 0;
  G.shake = 14; G.flash = 0.6;
  if (G.hp <= 0) {
    G.hp = 0;
    if (gameOver()) return;
  }
  P.fallingPit = false;
  P.y = GROUND_Y - P.h - 200; P.vy = 100;
  P.invT = 2.5;
  floatText(P.x, 220, 'อุ๊ปส์! ตกหลุม!', '#ff8888', true);
}

function collectJelly(j, jx) {
  const mult = P.giantT > 0 ? 2 : 1;
  switch (j.type) {
    case 'bar': case 'coin': case 'pink': case 'bear': {
      G.combo++; G.comboTimer = CH().comboT + (PFX().k === 'combo' ? PFX().v * petFxMul() : 0) + trV('combo');
      if (G.combo > 0 && G.combo % 10 === 0) {
        FX.rings.push({ t: 0, c: '#ffd24a', x: P.x + 28, y: P.y + P.h / 2 }, { t: -0.1, c: '#fff6c8', x: P.x + 28, y: P.y + P.h / 2 });
        sparkle(P.x + 28, P.y + 20, 30, '#ffd24a'); sparkle(P.x + 28, P.y + 20, 16, '#fff6c8');
        FX.flashT = 0.22; FX.flashC = '#ffe98e'; G.shake = Math.max(G.shake||0, 8);
        floatText(P.x + 28, P.y - 40, '🔥 ' + G.combo + ' COMBO!', '#ffd24a', true);
      }
      if (CFX().trig === 'jelly') {
        G.cfxCount = (G.cfxCount || 0) + 1;
        if (G.cfxCount >= CFX().n) {
          G.cfxCount = 0;
          G.formT = CFX().dur; skillBurst('#ffd76e', true); skillCut(CFX().tag || '✨ แปลงร่าง!', '#ffd76e');
          G.shake = 6; AudioSys.power();
          banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#ffd24a');
        }
      }
      const comboBonus = Math.min(G.combo, 50);
      let base = JSCORE[j.type];
      if (j.type === 'bear') base = j.v === 'b' ? 5000 : j.v === 'p' ? 2500 : 1000;   // หมี 3 ระดับ
      if (j.type === 'coin') base = j.cv === 'b' ? 100 : j.cv === 'g' ? 40 : 20;      // เหรียญ เงิน/ทอง/ทองใหญ่
      let pts = (base + comboBonus) * mult;
      pts *= 1 + G.upg.jelly * 0.06;                         // เยลลี่พลัส
      pts *= lvMul();                                        // เลเวลคุกกี้
      pts *= (CH().ptMul || 1) * (1 + trV('pt')) * (G.combi ? 1.15 + combiV('pts') : 1);   // ความสามารถคุกกี้ + สมบัติ + Combi (โบนัสเฉพาะคู่)
      if (j.type !== 'coin' && j.type !== 'bear') pts *= (CH().jellyMul || 1) * (1 + trV('jelly'));
      if (PFX().k === 'score') pts *= 1 + (PFX().v - 1) * petFxMul();
      if (G.bonusT > 0 && PFX().k === 'btgrow') pts *= 1 + PFX().v * petFxMul();   // ปุยเมฆโตใน Bonus Time
      if (j.type === 'bear' && PFX().k === 'bear') pts *= 1 + (PFX().v - 1) * petFxMul();
      if (j.type === 'bear') pts *= 1 + trV('bear');        // จี้หมีทองคำ
      if (G.scoreMulT > 0) pts *= 2;                         // สกิลนินจา
      if (j.type !== 'coin') pts += petTPv('jpts');          // สมบัติสัตว์เลี้ยง: +แต้มโบนัสต่อเยลลี่
      pts = Math.round(pts);
      G.score += pts; G.jellies++;
      G.skill = Math.min(100, G.skill + 1.7 * (1 + trV('skill') + combiV('skill')) * (CH().skillFast || 1));   // ชาร์จเกจสกิล + Combi
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (j.type === 'coin') {
        const cAmt = j.cv === 'b' ? 12 : j.cv === 'g' ? 3 : 1;   // อัตราส่วนตามเกมจริง (เงิน:ทอง:ทองใหญ่)
        G.coins += cAmt + (PFX().k === 'coin' ? Math.round(PFX().v * petFxMul()) : 0);
        if (j.cv === 'b') { sparkle(jx, j.y, 16, '#ffd84a'); floatText(jx, j.y - 26, '+' + cAmt + ' เหรียญใหญ่!', '#ffd84a', true); }
      }
      if (j.type === 'bear') {
        G.runBears++;
        AudioSys.bear();
        const bc = j.v === 'p' ? '#ff8fc0' : '#ffb347';
        sparkle(jx, j.y, j.v === 'b' ? 34 : 24, bc);
        floatText(jx, j.y - 30, '+' + pts + (j.v === 'b' ? ' BIG BEAR!!' : j.v === 'p' ? ' PINK BEAR!' : ' BEAR JELLY!'), bc, true);
        G.hp = Math.min(G.hpMax, G.hp + (j.v === 'b' ? 20 : 10));
      } else {
        AudioSys.jelly(G.combo);
        sparkle(jx, j.y, 5, j.type === 'coin' ? '#ffd700' : j.type === 'pink' ? '#ff7bac' : '#ffe066');
        if (j.type !== 'bar' || G.combo % 10 === 0)
          floatText(jx, j.y - 24, '+' + pts, '#fff');
      }
      if (G.combo > 0 && G.combo % 25 === 0)
        banner('สุดยอด! ' + G.combo + ' COMBO!', `hsl(${(G.combo * 14) % 360},90%,65%)`);
      break;
    }
    case 'potion':
      G.hp = Math.min(G.hpMax, G.hp + 30 * (1 + (CFX().k === 'potionPlus' ? CFX().v : 0)));
      if (CFX().k === 'potionPlus') spawnActor('heal', { c: '#7bff9b' });
      if (CFX().trig === 'potion') {
        G.formT = CFX().dur; skillBurst('#ffd76e', true); skillCut(CFX().tag || '✨ แปลงร่าง!', '#ffd76e');
        banner((CFX().tag || '✨') + ' อมตะ ' + CFX().dur + ' วิ!', '#7ecbff');
      }
      AudioSys.potion();
      sparkle(jx, j.y, 16, '#7bff9b');
      floatText(jx, j.y - 30, '+HP พลังคืนมา!', '#7bff9b', true);
      break;
    case 'giant':
      P.giantT = 6 * itemMul() * (CH().itemMul || 1) * (1 + trV('item') + petTPv('dur'));
      AudioSys.power();
      sparkle(jx, j.y, 20, '#ffd24a');
      banner('ยักษ์โหมด! GIANT MODE!', '#ffd24a');
      break;
    case 'magnet':
      P.magnetT = 8 * itemMul() * (CH().itemMul || 1) * (1 + trV('item') + petTPv('dur'));
      AudioSys.power();
      sparkle(jx, j.y, 20, '#7ecbff');
      banner('แม่เหล็กเยลลี่!', '#7ecbff');
      break;
    case 'powder': {
      // ✨ ผงเวทมนตร์ — สะสมไว้อัปสกิลคุกกี้
      const amt = 2 + Math.floor(G.stage / 2);
      G.runPowder += amt;
      AudioSys.potion();
      sparkle(jx, j.y, 20, '#c79aff');
      floatText(jx, j.y - 28, '✨ +' + amt + ' ผงเวทมนตร์!', '#c79aff', true);
      break;
    }
    case 'btjelly': {
      // เยลลี่โบนัสไทม์: เข้า BONUS TIME ทันที (แบบเกมจริง)
      G.score += 500;
      sparkle(jx, j.y, 24, '#ff9dd6');
      if (G.bonusT <= 0) { startBonusTime(); banner('BONUS TIME JELLY!!', '#ffd24a'); }
      else { G.bonusT += 2; floatText(jx, j.y - 26, '+2 วิ โบนัส!', '#ffd24a', true); }
      break;
    }
    case 'star': {
      // Star Jelly: แตกเป็นคอนเฟตตีให้เก็บกวาด (แบบเกมจริง)
      AudioSys.bear();
      sparkle(jx, j.y, 26, '#ffe066');
      banner('⭐ STAR JELLY! เก็บคอนเฟตตี!', '#ffe066');
      for (let i = 0; i < 16; i++)
        jellyList.push({ x: worldX + jx + rnd(70, 480), y: rnd(130, GROUND_Y - 60),
                         type: 'confetti', t: rnd(0, TAU), dead: false });
      break;
    }
    case 'ingr': {
      G.ingr[j.kind] = (G.ingr[j.kind] || 0) + 1;
      SAVE.set('ingr', G.ingr);
      G.score += 200;
      AudioSys.potion();
      sparkle(jx, j.y, 12, INGRS[j.kind].c);
      floatText(jx, j.y - 26, INGRS[j.kind].icon + ' ' + INGRS[j.kind].name + '!', '#ffe9b8', true);
      break;
    }
    case 'letter': {
      G.btProgress++;
      G.score += 300;
      AudioSys.jelly(20 + G.btProgress);
      sparkle(jx, j.y, 10, '#ff9dd6');
      floatText(jx, j.y - 26, j.ch + ' !', '#ff9dd6', true);
      if (G.btProgress >= 9) {
        G.btProgress = 0;
        startBonusTime();
      }
      break;
    }
    case 'blast':
      P.boostT = Math.max(P.boostT, 2.4 + (CFX().k === 'blastPlus' ? CFX().v : 0));
      AudioSys.power();
      sparkle(jx, j.y, 18, '#ff9d2e');
      banner('🚀 BLAST!!', '#ff9d2e');
      break;
    case 'box':
      G.runBoxes++;
      AudioSys.potion();
      sparkle(jx, j.y, 14, '#e8b23c');
      floatText(jx, j.y - 28, '📦 MYSTERY BOX!', '#e8b23c', true);
      break;
  }
}

/* เข้าสู่ BONUS TIME (จากการเก็บอักษร BONUSTIME ครบ) */
function startBonusTime() {
  G.runStars++;
  bonusLetterQueue = ['B','O','N','U','S'];
  bonusBearSpawned = false;
  G.bonusT = 6.5 + G.upg.bonus * 0.7 + (CH().btPlus || 0) + trV('bt') + combiV('bt') + (PFX().k === 'bt' ? PFX().v * petFxMul() : 0);
  FX.flashT = 0.5; FX.flashC = '#ffe98e'; FX.raysT = 0.8; FX.raysC = '#ffd24a'; FX.linesT = 0.6;
  FX.zoomT = 0.5; G.shake = Math.max(G.shake||0, 12);
  for (let q = 0; q < 4; q++) FX.rings.push({ t: -q * 0.08, c: q % 2 ? '#ffd24a' : '#ffffff', x: P.x + 28, y: P.y + P.h / 2 });
  sparkle(P.x + 28, P.y + 20, 40, '#ffd24a');
  P.vy = -120;
  AudioSys.bear();
  banner('🎉 BONUSTIME ครบ! ค้างปุ่มบิน ขึ้น/ลง 🎉', '#ffe066');
}

function updateParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.smoke ? 0 : p.chunk ? 900 : 500) * dt;
    if (p.chunk) {
      p.rot += p.vr * dt;
      if (p.y > GROUND_Y - 4 && p.bounce > 0 && p.vy > 0) { p.vy *= -0.42; p.vx *= 0.6; p.bounce--; }
    }
    if (p.smoke) { p.r += 26 * dt; p.vx *= 0.92; }
    p.x -= (G.state === 'play' ? G.speed * 0.5 : 0) * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const f of floaters) { f.t += dt; f.y -= 45 * dt; f.x -= (G.state==='play'?G.speed*0.3:0)*dt; }
  floaters = floaters.filter(f => f.t < 1.4);
}

/* ============================================================
   DRAW
   ============================================================ */
function draw() {
  uiButtons = [];
  if (window.__poseTest) { drawPoseSheet(); return; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // สเกลฐานตามความละเอียดจอ → ทุกอย่างคมชัด
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);
  if (FX.zoomT > 0 && G.state === 'play') {
    const z = 1 + FX.zoomT * 0.075;
    ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  }

  drawSky();
  drawBackHills();
  drawOvenWall();
  drawBokeh();
  drawGroundAndPits();
  drawOven();
  drawPlatforms();
  drawTrail();
  drawJellies();
  drawObstacles();
  if (G.state === 'play' && G.formT > 0) {
    // ✨ ออร่าแปลงร่าง + ภาพติดตาไล่หลัง (ใช้สไปรต์เฟรมก่อนหน้า)
    const pu = 0.7 + Math.sin(G.time * 9) * 0.3;
    const ag = ctx.createRadialGradient(P.x + 28, P.y + P.h / 2, 10, P.x + 28, P.y + P.h / 2, 95);
    ag.addColorStop(0, 'rgba(255,230,120,.34)');
    ag.addColorStop(1, 'rgba(255,200,60,0)');
    ctx.fillStyle = ag; ctx.globalAlpha = pu;
    ctx.beginPath(); ctx.ellipse(P.x + 28, P.y + P.h / 2, 100, 90, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    for (const [gd, ga] of [[-52, 0.10], [-28, 0.22]]) {
      ctx.globalAlpha = ga;
      ctx.drawImage(olOut, P.x + 28 - C_OX + gd, P.y + P.h - C_OY * SQ, 200, 205 * SQ);
    }
    ctx.globalAlpha = 1;
  }
  if ((G.state === 'play' || G.state === 'clear') && Boss.active) drawBoss();
  if (G.state === 'play' || G.state === 'over' || G.state === 'continue' || G.state === 'clear') drawPlayer();
  if (G.state === 'play') drawPet();
  drawParticles();
  if (G.state === 'play') { drawFX(); drawActors(); }

  ctx.restore();

  if (G.bonusT > 0) {
    const a = Math.min(1, G.bonusT / 0.5) * 0.16;
    const g = ctx.createRadialGradient(W/2, H/2, 150, W/2, H/2, 620);
    g.addColorStop(0, 'rgba(255,220,90,0)');
    g.addColorStop(1, `rgba(255,190,40,${a + 0.08})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // vignette นุ่ม ๆ
  const vg = ctx.createRadialGradient(W/2, H/2, 280, W/2, H/2, 640);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,15,0,.22)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,60,60,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (FX.flashT > 0) {
    // แฟลชเปิดสกิลเต็มจอ (สีตามสกิล)
    ctx.fillStyle = FX.flashC;
    ctx.globalAlpha = Math.min(1, FX.flashT * 2.2) * 0.3;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (FX.cutT > 0 && G.state === 'play') {
    // 🎬 คัตอินชื่อสกิล + หน้าตัวละคร พาดกลางจอแบบเกมจริง
    const k = 1 - FX.cutT / 0.95;
    const fadeIn = Math.min(1, k / 0.14);
    const fadeOut = k > 0.82 ? 1 - (k - 0.82) / 0.18 : 1;
    const al = fadeIn * fadeOut;
    ctx.save();
    ctx.globalAlpha = al * 0.4;
    ctx.fillStyle = '#140a04';
    ctx.fillRect(0, 0, W, H);            // หรี่ฉากให้คัตอินเด่น
    ctx.globalAlpha = al;
    ctx.translate(0, 168);
    ctx.rotate(-0.045);
    const grd = ctx.createLinearGradient(0, 0, W, 0);
    grd.addColorStop(0, 'rgba(24,12,6,0)');
    grd.addColorStop(0.16, 'rgba(24,12,6,.9)');
    grd.addColorStop(0.84, 'rgba(24,12,6,.9)');
    grd.addColorStop(1, 'rgba(24,12,6,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(-40, -50, W + 80, 100);
    ctx.fillStyle = FX.cutC;
    ctx.fillRect(-40, -55, W + 80, 5);
    ctx.fillRect(-40, 50, W + 80, 5);
    try {
      const pc = cookiePortrait(FX.cutIdx);
      ctx.drawImage(pc, lerp(-200, 120, fadeIn) - 55, -62, 112, 129);
    } catch (e) {}
    const tx2 = lerp(W + 240, W / 2 + 70, fadeIn);
    ctx.font = 'bold 42px Trebuchet MS'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = 9; ctx.strokeStyle = '#2e1608';
    ctx.strokeText(FX.cutText, tx2, 16);
    ctx.fillStyle = FX.cutC;
    ctx.fillText(FX.cutText, tx2, 16);
    ctx.restore();
  }

  if (G.state === 'play') drawHUD();
  if (G.state === 'menu') drawMenu();
  if (G.state === 'login') drawLogin();
  if (POPUP_STATES.includes(G.state)) {
    // 🪟 หน้าเมนูย่อยเด้งเป็นป๊อปอัพ: โฮมมีชีวิตอยู่ข้างหลัง + เด้งเข้า + แตะพื้นมืดเพื่อปิด
    UI_SILENT = true;
    try { drawMenu(); } catch (e) {}
    UI_SILENT = false;
    G.popT = Math.min(1, (G.popT == null ? 1 : G.popT) + 0.09);
    const pk = popupScale();
    ctx.fillStyle = `rgba(18,9,3,${0.52 * G.popT})`;
    ctx.fillRect(0, 0, W, H);
    drawBtn(-240, -240, W + 480, H + 480, '', () => setState('menu'), { invisible: true });   // แตะรอบนอก = ปิด
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(pk, pk); ctx.translate(-W / 2, -H / 2);
    // แผ่นป๊อปอัพ: พื้นคาราเมลทึบ + มุมโค้ง + ขอบทอง
    ctx.save();
    roundRect(-4, -4, W + 8, H + 8, 24); ctx.clip();
    const pg = ctx.createLinearGradient(0, 0, 0, H);
    pg.addColorStop(0, '#8a5527'); pg.addColorStop(1, '#4e2c12');
    ctx.fillStyle = pg; ctx.fillRect(-4, -4, W + 8, H + 8);
    if (G.state === 'advmap') drawAdvMap();
    if (G.state === 'prep') drawPrep();
    if (G.state === 'select') drawSelect();
    if (G.state === 'pets') drawPets();
    if (G.state === 'treasure') drawTreasure();
    if (G.state === 'shop') drawShop();
    if (G.state === 'rank') drawRank();
    ctx.restore();
    const eg2 = ctx.createLinearGradient(0, -4, 0, H + 4);
    eg2.addColorStop(0, '#f0d28a'); eg2.addColorStop(0.5, '#9a6a2a'); eg2.addColorStop(1, '#e2b968');
    ctx.strokeStyle = eg2; ctx.lineWidth = 5;
    roundRect(-4, -4, W + 8, H + 8, 24); ctx.stroke();
    ctx.restore();
  }
  if (G.state === 'over') drawGameOver();
  if (G.state === 'clear') drawLevelClear();
  if (G.state === 'continue') drawContinue();
  drawFloaters();
  drawUiSparks();   // ประกายฉลองซื้อ/อัปเกรด (ทุกหน้า)
  drawBanner();

  if (G.fade > 0) {
    ctx.fillStyle = `rgba(42,26,14,${G.fade * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- ambient effects ---------- */
function drawBokeh() {
  for (const b of bokeh) {
    if (ovenAmt > 0.4) {
      // ประกายไฟ/ถ่านลอยในเตาอบ
      const a = (0.25 + Math.abs(Math.sin(G.time * 2.2 + b.tw)) * 0.45) * ovenAmt;
      const r = b.r * 0.28 + 1.2;
      ctx.fillStyle = `rgba(255,150,50,${a * 0.5})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,220,120,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    } else {
      const a = 0.08 + Math.abs(Math.sin(G.time * 0.8 + b.tw)) * 0.08;
      ctx.fillStyle = `hsla(${b.hue},85%,80%,${a})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.fillStyle = `hsla(${b.hue},85%,92%,${a * 0.8})`;
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.45, 0, TAU); ctx.fill();
    }
  }
}

/* ---------- ผนังอิฐในเตาอบ (ฉากด่าน 1-2 แบบเกมจริง) ---------- */
function drawOvenWall() {
  if (ovenAmt < 0.01) return;
  ctx.save();
  ctx.globalAlpha = ovenAmt;
  // ฐานผนัง
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3f0f0a');
  g.addColorStop(0.5, '#6e2117');
  g.addColorStop(1, '#521510');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 8);
  // อิฐก้อนใหญ่ (parallax ช้า)
  const bw = 172, bh = 70;
  const scroll = worldX * 0.35;
  for (let row = 0; row < 7; row++) {
    const y = row * bh - 22;
    if (y > GROUND_Y) break;
    const shift = (row % 2) * (bw / 2);
    const off = -((scroll + shift) % bw);
    for (let x = off - bw; x < W + bw; x += bw) {
      const wx = Math.round((x + scroll + shift) / bw) * 13 + row * 7;
      const v = ((wx % 7) + 7) % 7 / 7;
      ctx.fillStyle = `rgb(${118 + v * 26},${40 + v * 13},${28 + v * 9})`;
      roundRect(x + 4, y + 4, bw - 8, Math.min(bh - 8, GROUND_Y + 4 - y), 9); ctx.fill();
      ctx.fillStyle = 'rgba(255,160,110,.09)';
      roundRect(x + 9, y + 8, bw - 18, 11, 5); ctx.fill();
      ctx.fillStyle = 'rgba(30,6,3,.25)';
      roundRect(x + 9, y + bh - 18, bw - 18, 8, 4); ctx.fill();
    }
  }
  // แสงไฟจากด้านล่างสาดขึ้นผนัง (วูบวาบ)
  const fg = ctx.createLinearGradient(0, GROUND_Y - 170, 0, GROUND_Y + 8);
  fg.addColorStop(0, 'rgba(255,120,40,0)');
  fg.addColorStop(1, `rgba(255,130,40,${0.16 + Math.sin(G.time * 7) * 0.05})`);
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND_Y - 170, W, 178);
  // มืดด้านบน
  const dg = ctx.createLinearGradient(0, 0, 0, 90);
  dg.addColorStop(0, 'rgba(15,3,1,.5)'); dg.addColorStop(1, 'rgba(15,3,1,0)');
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W, 90);
  ctx.restore();
}
function drawTrail() {
  for (const t of trail) {
    const k = 1 - t.t / 0.45;
    ctx.fillStyle = `hsla(${t.hue},95%,65%,${k * 0.4})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 4 + 13 * k, 0, TAU); ctx.fill();
  }
}

/* ---------- background ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, skyBlend('top'));
  g.addColorStop(0.45, skyBlend('mid'));
  g.addColorStop(1, skyBlend('bot'));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (G.mode === 'normal' && EP().tint && ovenAmt < 0.5) {
    ctx.fillStyle = EP().tint;
    ctx.fillRect(0, 0, W, H);
  }

  const night = skyBlend('night');

  // ดาวตอนกลางคืน
  if (night > 0.03) {
    for (const s of stars) {
      ctx.globalAlpha = night * (0.4 + Math.abs(Math.sin(G.time * 1.6 + s.tw)) * 0.6);
      ctx.fillStyle = '#fff8e0';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // พระอาทิตย์คุกกี้ / พระจันทร์เสี้ยว
  ctx.save();
  ctx.translate(790, 95);
  if (night < 0.5) {
    ctx.globalAlpha = 1 - night;
    // แฉกแสงหมุนช้า ๆ
    ctx.save();
    ctx.rotate(G.time * 0.06);
    ctx.fillStyle = 'rgba(255,240,190,.10)';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-26, -150); ctx.lineTo(26, -150);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // แสงฟุ้งรอบดวง
    ctx.fillStyle = 'rgba(255,235,180,.25)';
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('sun');
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,160,90,.55)';
    for (const [dx, dy] of [[-12,-8],[10,-14],[14,8],[-6,12],[2,-2]])
      { ctx.beginPath(); ctx.arc(dx, dy, 3.4, 0, TAU); ctx.fill(); }
  } else {
    ctx.globalAlpha = night;
    ctx.fillStyle = 'rgba(244,240,224,.18)';
    ctx.beginPath(); ctx.arc(0, 0, 56, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f4f0e0';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = skyBlend('top');
    ctx.beginPath(); ctx.arc(16, -8, 34, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // เมฆวิปครีมสองชั้น (เงาล่าง + เนื้อบน)
  for (const c of clouds) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    const puffs = [[0,0,26],[24,-8,20],[48,0,24],[24,8,22],[70,4,16]];
    ctx.fillStyle = night > 0.5 ? 'rgba(120,120,170,.45)' : 'rgba(255,190,150,.5)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy + 6, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = night > 0.5 ? 'rgba(185,185,225,.6)' : 'rgba(255,250,240,.95)';
    for (const [dx, dy, r] of puffs)
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
}

function drawBackHills() {
  // ปราสาทขนมหวานไกลสุด (parallax ช้าสุด)
  const off0 = -(worldX * 0.08) % 800;
  ctx.fillStyle = skyBlend('far');
  for (let x = off0 - 800; x < W + 800; x += 800) {
    drawCastle(x + 180, 402);
    drawCastle(x + 560, 402);
  }
  // เนินขนม (ไล่เฉดจากยอดสว่างลงมา)
  const off1 = -(worldX * 0.18) % 500;
  const hillCol = skyBlend('hill');
  const hg = ctx.createLinearGradient(0, 250, 0, 460);
  hg.addColorStop(0, shade(hillCol, 26));
  hg.addColorStop(1, shade(hillCol, -8));
  ctx.fillStyle = hg;
  for (let x = off1 - 500; x < W + 500; x += 500) {
    ctx.beginPath();
    ctx.moveTo(x, 400);
    ctx.quadraticCurveTo(x + 125, 250, x + 250, 400);
    ctx.quadraticCurveTo(x + 375, 290, x + 500, 400);
    ctx.lineTo(x + 500, 460); ctx.lineTo(x, 460);
    ctx.fill();
  }
  // ของประดับริมทางตามตอน
  const off2 = -(worldX * 0.45) % 640;
  const epi = G.mode === 'normal' ? EP().id : 'oven';
  for (let x = off2 - 640; x < W + 640; x += 320) {
    const alt = ((x / 320 | 0) % 2) === 0;

    else if (epi === 'dragon') drawRockSpike(x + 60, 442, alt);
    else if (epi === 'wizard') drawWizTower(x + 60, 442, alt);
    else if (epi === 'dessert') drawCupcakeProp(x + 60, 442, alt);
    else drawLollipop(x + 60, 442, 1, alt);
  }
}

function drawCastle(x, baseY) {

function drawLollipop(x, groundY, s, alt) {

function drawGroundAndPits() {
  const gc = G.mode === 'normal' ? EP().ground : ['#c98d4e', '#a96f37', '#7a4a20'];
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, gc[0]);
  g.addColorStop(0.15, gc[1]);
  g.addColorStop(1, gc[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // ขอบไอซิ่ง + ครีมหยด (ซ่อนตอนอยู่ในเตาอบ)
  if (ovenAmt < 0.95) {
  ctx.fillStyle = '#f2d8a7';
  const off = -(worldX % 64);
  for (let x = off - 64; x < W + 64; x += 64) {
    ctx.beginPath();
    ctx.arc(x + 32, GROUND_Y + 3, 10, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillRect(0, GROUND_Y, W, 6);
  const offD = -(worldX % 192);
  for (let x = offD - 192; x < W + 192; x += 192) {
    ctx.beginPath();
    ctx.moveTo(x + 20, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 26, GROUND_Y + 22, x + 20, GROUND_Y + 24);
    ctx.quadraticCurveTo(x + 14, GROUND_Y + 22, x + 20, GROUND_Y + 5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 120, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 127, GROUND_Y + 17, x + 120, GROUND_Y + 19);
    ctx.quadraticCurveTo(x + 113, GROUND_Y + 17, x + 120, GROUND_Y + 5);
    ctx.fill();
  }
  // เม็ดน้ำตาลหลากสีโรยบนไอซิ่ง
  const offS = -(worldX % 96);
  const sprCols = ['#ff6b8d', '#7ecbff', '#7bd94a', '#ffd24a', '#c592ff'];
  for (let x = offS - 96, i = 0; x < W + 96; x += 32, i++) {
    const wx = Math.round((x + worldX) / 32);
    ctx.save();
    ctx.translate(x + 16, GROUND_Y + 1 + (wx % 3));
    ctx.rotate((wx * 1.7) % TAU);
    ctx.fillStyle = sprCols[((wx % 5) + 5) % 5];
    roundRect(-4, -1.6, 8, 3.2, 1.6); ctx.fill();
    ctx.restore();
  }
  }  // จบส่วนไอซิ่ง/เม็ดน้ำตาล

  ctx.fillStyle = 'rgba(90,50,20,.55)';
  const off2 = -(worldX % 160);
  for (let x = off2 - 160; x < W + 160; x += 160) {
    ctx.beginPath(); ctx.arc(x + 40, GROUND_Y + 42, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 110, GROUND_Y + 70, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 75, GROUND_Y + 95, 6, 0, TAU); ctx.fill();
  }

  /* --- ในเตาอบ: พื้นตะแกรงเหล็ก + ไฟลุกข้างล่าง (แบบเกมจริง) --- */
  if (ovenAmt > 0.01) {
    ctx.save();
    ctx.globalAlpha = ovenAmt;
    // แสงไฟใต้ตะแกรง
    const fgr = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    fgr.addColorStop(0, '#2a0a04');
    fgr.addColorStop(0.4, '#77220a');
    fgr.addColorStop(1, '#e8641e');
    ctx.fillStyle = fgr;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // เปลวไฟลุกวูบวาบ
    for (let x = -20; x < W + 40; x += 46) {
      const ph = Math.sin(G.time * 9 + x * 0.7) * 0.5 + 0.5;
      const fh = 30 + ph * 34;
      const fx = x + Math.sin(G.time * 5 + x) * 5;
      ctx.fillStyle = 'rgba(255,110,25,.8)';
      ctx.beginPath();
      ctx.moveTo(fx - 17, H);
      ctx.quadraticCurveTo(fx - 15, H - fh * 0.6, fx, H - fh - 20);
      ctx.quadraticCurveTo(fx + 15, H - fh * 0.6, fx + 17, H);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,210,74,.85)';
      ctx.beginPath();
      ctx.moveTo(fx - 8, H);
      ctx.quadraticCurveTo(fx - 7, H - fh * 0.4, fx, H - fh * 0.72 - 10);
      ctx.quadraticCurveTo(fx + 7, H - fh * 0.4, fx + 8, H);
      ctx.fill();
    }
    // รางตะแกรงบน
    ctx.fillStyle = '#3a3a46';
    ctx.fillRect(0, GROUND_Y, W, 13);
    ctx.fillStyle = '#5c5c6c';
    ctx.fillRect(0, GROUND_Y, W, 4.5);
    ctx.fillStyle = '#1e1e26';
    ctx.fillRect(0, GROUND_Y + 13, W, 3);
    // ซี่ตะแกรงแนวตั้ง (มองเห็นไฟลอดช่อง)
    const goff = -(worldX % 76);
    for (let x = goff - 76; x < W + 76; x += 76) {
      ctx.fillStyle = '#31313c';
      ctx.fillRect(x, GROUND_Y + 14, 22, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fillRect(x + 2.5, GROUND_Y + 14, 4.5, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(x + 17, GROUND_Y + 14, 5, H - GROUND_Y - 14);
    }
    ctx.restore();
  }

  for (const p of pits) {
    const px = p.x - worldX;
    if (px > W || px + p.w < 0) continue;
    ctx.fillStyle = '#1d1006';
    ctx.fillRect(px, GROUND_Y, p.w, H - GROUND_Y);
    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 60);
    gg.addColorStop(0, 'rgba(0,0,0,.65)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(px, GROUND_Y, p.w, 60);
    ctx.fillStyle = '#8a5a28';
    ctx.fillRect(px - 4, GROUND_Y, 6, 18);
    ctx.fillRect(px + p.w - 2, GROUND_Y, 6, 18);
  }
}

/* ---------- เตาอบตอนเริ่มเกม: คุกกี้หนีออกมาจากตรงนี้! ---------- */
function drawOven() {

  roundRect(210, -344, 46, 60, 8); ctx.fill();
  // ควันลอย
  for (let i = 0; i < 3; i++) {

  gg.addColorStop(0, '#2a1206');
  gg.addColorStop(0.55, '#7a2f0a');
  gg.addColorStop(1, '#e8792a');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.moveTo(48, -20);
  ctx.lineTo(48, -170);
  ctx.arc(148, -170, 100, Math.PI, 0);
  ctx.lineTo(248, -20);
  ctx.closePath(); ctx.fill();
  // แสงไฟลุกวูบวาบ
  ctx.fillStyle = `rgba(255,170,60,${0.25 + Math.sin(G.time * 9) * 0.12})`;
  ctx.beginPath(); ctx.ellipse(148, -60, 80, 36, 0, 0, TAU); ctx.fill();
  // บานประตูเหวี่ยงเปิด
  ctx.fillStyle = '#3a2210';
  roundRect(-44, -200, 40, 186, 10); ctx.fill();
  ctx.fillStyle = '#57351c';
  roundRect(-38, -192, 28, 170, 8); ctx.fill();
  ctx.fillStyle = '#c9a15f';
  ctx.beginPath(); ctx.arc(-24, -108, 6, 0, TAU); ctx.fill();  // ลูกบิด
  // ขาเตา
  ctx.fillStyle = '#33200f';
  roundRect(18, -6, 34, 14, 5); ctx.fill();
  roundRect(244, -6, 34, 14, 5); ctx.fill();
  ctx.restore();
}

function drawPlatforms() {
  for (const pl of platforms) {
    const x = pl.x - worldX;

function drawPet(pet) {
  const p = pet || PT();
  /* เรนเดอร์ผ่านไปป์ไลน์สไปรต์เดียวกับคุกกี้:
     เซลเชด+ขอบรายชิ้น (AUTOL) → ขอบรอบตัวสีตามตัว → ไล่แสง → ริมไลต์
     ตัวตามในเกมใช้แคช (วาดใหม่ทุก ~0.09 วิ) กันเฟรมตก */
  const useCache = !pet;
  const nowS = performance.now() / 1000;
  const fresh = !useCache || petCCid !== p.id || nowS - petCCt > 0.09;
  const mainCtx = ctx;
  if (fresh) {
  ctx = charCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, charCanvas.width, charCanvas.height);
  ctx.setTransform(CSS, 0, 0, CSS, C_OX * CSS, 100 * CSS);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  AUTOL = true;
  ctx.save();
  const flap = Math.sin(Pet.wing) * 0.7;
  const C1 = p.c1 || '#ffd24a', C2 = p.c2 || '#ffffff', C3 = p.c3 || '#4a2410', ex = p.ex || 0;
  const line = (w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; };
  /* ปีกบินด้านหลัง */
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.save(); ctx.rotate(-0.45 - flap * 0.5);
  ctx.beginPath(); ctx.ellipse(-11, -5, 11, 5.5, 0, 0, TAU); ctx.fill();
  ctx.restore();
  let face = true, fy = -2, fx2 = 3;
  const S = p.shape;
  if (S === 'drop') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(0, -18);
    ctx.quadraticCurveTo(13, -6, 13, 3); ctx.arc(0, 3, 13, 0, Math.PI);
    ctx.quadraticCurveTo(-13, -6, 0, -18); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(-5, 0, 3.4, 0, TAU); ctx.fill();
    if (ex === 10) { /* คิงดรอป: มงกุฎ */
      ctx.fillStyle = C2;
      ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-8, -21); ctx.lineTo(-3, -15);
      ctx.lineTo(0, -23); ctx.lineTo(3, -15); ctx.lineTo(8, -21); ctx.lineTo(8, -12);
      ctx.closePath(); ctx.fill();
    }
    if (ex === 11) { /* ถั่วแฝด: ตัวจิ๋วเกาะข้าง */
      ctx.fillStyle = C2;
      ctx.beginPath(); ctx.arc(14, 8, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = C3;
      ctx.beginPath(); ctx.arc(13, 7, 1.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(17, 7, 1.4, 0, TAU); ctx.fill();
    }
    fy = 2;
  } else if (S === 'ball' || S === 'bead' || S === 'brain' || S === 'garlic' || S === 'pumpkin' || S === 'yarn') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    if (S === 'brain') { line(2.4, C2);
      for (const [x1,y1,x2,y2] of [[-9,-6,-2,-9],[-2,-9,5,-5],[-8,3,0,0],[0,0,8,4]])
        { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2, (y1+y2)/2-3, x2,y2); ctx.stroke(); } }
    if (S === 'yarn') { line(2, C2);
      for (const r of [11, 7]) { ctx.beginPath(); ctx.arc(0, 0, r, 0.4, 2.6); ctx.stroke(); } }
    if (S === 'garlic') { line(2, C2);
      ctx.beginPath(); ctx.moveTo(0, -14); ctx.quadraticCurveTo(2, -19, -1, -21); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-4, -13); ctx.lineTo(-4, 6); ctx.moveTo(4, -13); ctx.lineTo(4, 6); ctx.stroke(); }
    if (S === 'pumpkin') { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.ellipse(0, -15, 3, 4, 0.3, 0, TAU); ctx.fill();
      line(1.6, 'rgba(0,0,0,.25)');
      ctx.beginPath(); ctx.moveTo(-5, -13); ctx.quadraticCurveTo(-6, 0, -5, 12); ctx.moveTo(5, -13); ctx.quadraticCurveTo(6, 0, 5, 12); ctx.stroke(); }
    if (S === 'bead') { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.arc(-4, -5, 2.6, 0, TAU); ctx.fill(); face = false; }
    if (S === 'ball' && ex === 1) { ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (const [x, y] of [[-7, -8], [6, -3], [-2, 7], [9, -9]])
        { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill(); } }
  } else if (S === 'bubble') {
    for (const [dx, r] of [[-6, 10], [8, 8]]) {
      ctx.fillStyle = C1; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(dx, 0, r, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; line(1.8, C2);
      ctx.beginPath(); ctx.arc(dx, 0, r, 0, TAU); ctx.stroke();
    }
    fx2 = -6;
  } else if (S === 'cloud') {
    ctx.fillStyle = C1;
    for (const [dx, dy, r] of [[-10, 2, 9], [0, -4, 12], [11, 2, 9], [0, 5, 10]])
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
    ctx.fillStyle = C2; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(0, 9, 13, 4, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (S === 'sock') {
    ctx.fillStyle = C1;
    roundRect(-6, -16, 13, 18, 5); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, 6, 9, Math.PI * 0.4, Math.PI * 1.6); ctx.fill();
    roundRect(-9, 0, 16, 12, 6); ctx.fill();
    ctx.fillStyle = C2;
    roundRect(-7, -17, 15, 6, 3); ctx.fill();
    fy = 4; fx2 = 0;
  } else if (S === 'hand') {
    ctx.fillStyle = C1;
    roundRect(-9, -6, 18, 18, 7); ctx.fill();
    for (let i = 0; i < 4; i++) { roundRect(-9 + i * 4.6, -14, 4, 12, 2); ctx.fill(); }
    roundRect(-14, -4, 7, 10, 3.5); ctx.fill();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.arc(0, 2, 5, 0, TAU); ctx.fill();
    face = false;
  } else if (S === 'dumbbell') {
    line(5, C2);
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.stroke();
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(-12, 0, 8.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 0, 8.5, 0, TAU); ctx.fill();
    ctx.fillStyle = C3;
    for (const dx of [-12, 12]) {
      ctx.beginPath(); ctx.arc(dx - 2, -2, 1.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(dx + 2, -2, 1.5, 0, TAU); ctx.fill();
    }
    face = false;
  } else if (S === 'cup' || S === 'mortar') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(12, -8);
    ctx.quadraticCurveTo(11, 12, 0, 12); ctx.quadraticCurveTo(-11, 12, -12, -8);
    ctx.closePath(); ctx.fill();
    if (S === 'cup') { line(2.6, C1);
      ctx.beginPath(); ctx.arc(14, 0, 5, -1.2, 1.2); ctx.stroke(); }
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.ellipse(0, -8, 12, 3.6, 0, 0, TAU); ctx.fill();
    if (S === 'mortar') { line(3, C2);
      ctx.beginPath(); ctx.moveTo(6, -14); ctx.lineTo(14, -22); ctx.stroke(); }
    fy = 2; fx2 = 0;
  } else if (S === 'teapot') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.ellipse(0, 2, 13, 10, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, -2); ctx.lineTo(19, -8); ctx.lineTo(15, 2); ctx.closePath(); ctx.fill();
    line(2.6, C1);
    ctx.beginPath(); ctx.arc(-14, 0, 5, 0.8, 4.2); ctx.stroke();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.ellipse(0, -8, 6, 2.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -11, 2.2, 0, TAU); ctx.fill();
    fy = 3; fx2 = 0;
  } else if (S === 'note') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.ellipse(-4, 8, 7, 5.5, -0.3, 0, TAU); ctx.fill();

    ctx.beginPath(); ctx.moveTo(2, 7); ctx.lineTo(2, -14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2, -14); ctx.quadraticCurveTo(10, -12, 11, -5); ctx.stroke();
    fx2 = -6; fy = 6;
  } else if (S === 'hat') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(-13, 4); ctx.quadraticCurveTo(-2, -22, 12, -8);
    ctx.quadraticCurveTo(15, 0, 13, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C2;
    roundRect(-16, 3, 32, 7, 3.5); ctx.fill();
    ctx.fillStyle = p.c3 === '#4a2410' ? C2 : p.c3;
    ctx.beginPath(); ctx.arc(12, -9, 4, 0, TAU); ctx.fill();
    fy = -1; fx2 = -2;
  } else if (S === 'critter') {
    /* สัตว์ตัวกลม: หูตามชนิด ex 1แมว 2กระต่าย 3ยูนิคอร์น 4หมา 5แฮมสเตอร์ 6หนู 7แพนด้า 8แมวน้ำ 9สิงโต */
    if (ex === 9) { ctx.fillStyle = C3;
      for (let i = 0; i < 10; i++) { const a = i * TAU / 10;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 13, Math.sin(a) * 13, 5, 0, TAU); ctx.fill(); } }
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
    if (ex === 1 || ex === 6) { ctx.fillStyle = C1;
      ctx.beginPath(); ctx.moveTo(-11, -7); ctx.lineTo(-13, -17); ctx.lineTo(-4, -12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(12, -17); ctx.lineTo(10, -7); ctx.closePath(); ctx.fill(); }
    if (ex === 2) { ctx.fillStyle = C1;
      ctx.beginPath(); ctx.ellipse(-6, -17, 3.6, 9, -0.12, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, -17, 3.6, 9, 0.12, 0, TAU); ctx.fill(); }
    if (ex === 3) { ctx.fillStyle = '#f2e060';
      ctx.beginPath(); ctx.moveTo(-3, -11); ctx.lineTo(0, -22); ctx.lineTo(3, -11); ctx.closePath(); ctx.fill(); }
    if (ex === 4) { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.ellipse(-10, -8, 4.5, 7, -0.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, -8, 4.5, 7, 0.5, 0, TAU); ctx.fill(); }
    if (ex === 5) { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.arc(-8, -10, 4.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -10, 4.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,140,150,.5)';
      ctx.beginPath(); ctx.arc(-7, 4, 3.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(9, 4, 3.4, 0, TAU); ctx.fill(); }
    if (ex === 7) { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.arc(-9, -10, 4.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(9, -10, 4.6, 0, TAU); ctx.fill();
      ctx.fillStyle = C3; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.ellipse(-4, -2, 3.4, 4.2, 0.3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, -2, 3.4, 4.2, -0.3, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1; }
    if (ex === 8) { ctx.fillStyle = C1;
      ctx.beginPath(); ctx.ellipse(-13, 8, 6, 3.6, 0.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(13, 8, 6, 3.6, -0.6, 0, TAU); ctx.fill(); }
  } else if (S === 'flower') {
    ctx.fillStyle = C1;
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 8.6, Math.sin(a) * 8.6, 6.4, 4, a, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    fx2 = 0; fy = 0;
  } else if (S === 'star') {
    ctx.fillStyle = C1;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7 : 15;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    fx2 = 0; fy = 1;
  } else if (S === 'snowflake') {
    line(3, C1);
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 8 + Math.cos(a + 1.2) * 4, Math.sin(a) * 8 + Math.sin(a + 1.2) * 4);
      ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8);
      ctx.lineTo(Math.cos(a) * 8 + Math.cos(a - 1.2) * 4, Math.sin(a) * 8 + Math.sin(a - 1.2) * 4);

    }

    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, TAU); ctx.fill();

      ctx.fillStyle = C2;

      ctx.fillStyle = p.c3 !== '#4a2410' ? p.c3 : '#e0453a';
      for (const [x, y] of [[-5, -5], [5, 5], [5, -5], [-5, 5]])

    } else {
      ctx.fillStyle = 'rgba(255,255,255,.3)';

    ctx.save(); ctx.rotate(-0.5);
    ctx.fillStyle = C1;

      ctx.fillStyle = C2;

      line(2.6, C2);

      ctx.beginPath(); ctx.arc(1, -25, 2.6, 0, TAU); ctx.fill();

  } else if (S === 'ghost') {

    ctx.beginPath(); ctx.arc(0, -3, 12, Math.PI, 0);
    ctx.lineTo(12, 8);
    for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(9 - i * 6, 13 - (i % 2) * 4, 6 - i * 6, 8 + (i % 2) * 3);
    ctx.closePath(); ctx.fill();
    if (ex === 1) { ctx.fillStyle = C2;
      ctx.beginPath(); ctx.moveTo(-1, 2); ctx.lineTo(-7, -1); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(1, 2); ctx.lineTo(7, -1); ctx.lineTo(7, 5); ctx.closePath(); ctx.fill(); }
    fy = -4;
  } else if (S === 'candle') {
    ctx.fillStyle = C1;

    ctx.fillStyle = C2;

  if (!pet) ctx.translate(Pet.x, Pet.y);
