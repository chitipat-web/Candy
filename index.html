        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G', 0, 1);
        itemBubble('#ffd24a');
        break;
      }
      case 'magnet': {
        ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, -2, 10, Math.PI, 0, false); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(10, 8); ctx.stroke();
        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-10, 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(10, 12); ctx.stroke();
        itemBubble('#7ecbff');
        break;
      }
      case 'star': {
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.25);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? 16 : 7;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.beginPath(); ctx.arc(-3, -4, 3, 0, TAU); ctx.fill();
        itemBubble('#ffe066');
        break;
      }
    }
    ctx.restore();
  }
}
/* ฟองแก้วครอบไอเทม (แบบเกมจริง) */
function itemBubble(c) {
  const bobA = Math.sin(G.time * 5) * 0.06;
  ctx.fillStyle = 'rgba(215,238,255,.14)';
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI * (1.12 + bobA), Math.PI * (1.42 + bobA)); ctx.stroke();
  ctx.strokeStyle = c; ctx.globalAlpha = 0.35 + Math.sin(G.time * 6) * 0.2;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function glowRing(c) {
  ctx.strokeStyle = c; ctx.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(G.time * 6) * 3, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBearJelly() {
  const c = '#ffab2e', hl = 'rgba(255,255,255,.55)';
  ctx.fillStyle = ballGrad(0, -4, 30, c);
  ctx.beginPath(); ctx.arc(-13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.fill();
  roundRect(-14, 2, 28, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 24, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(c, -48); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.stroke();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(-6, -13, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4a10';
  ctx.beginPath(); ctx.arc(-6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  glowRing('#ffab2e');
}

/* ---------- obstacles ---------- */
function drawObstacles() {
  for (const o of obstacles) {
    const x = o.x - worldX;
    if (x < -140 || x > W + 60) continue;
    ctx.save();
    ctx.translate(x, GROUND_Y);
    if (o.type === 'spike') {
      for (let i = 0; i < 3; i++) {
        const bx = i * 16 - 2;
        ctx.fillStyle = i % 2 ? '#ff5f7e' : '#ff8fa8';
        ctx.beginPath();
        ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i===1?8:0)); ctx.lineTo(bx + 16, 0);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.moveTo(bx + 3, -6); ctx.lineTo(bx + 7, -32); ctx.lineTo(bx + 9, -6);
        ctx.fill();
      }
    } else if (o.type === 'rock') {
      if (spritesReady) { ctx.drawImage(IMGS.gumdropG, 0, -54, 56, 54); ctx.restore(); continue; }
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(6, -34); ctx.lineTo(22, -50) ; ctx.lineTo(42, -42);
      ctx.lineTo(56, -18); ctx.lineTo(54, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#40230f'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#8a5a35';
      ctx.beginPath();
      ctx.moveTo(8, -30); ctx.lineTo(22, -44); ctx.lineTo(36, -38); ctx.lineTo(30, -20);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(24, -40, 4, 0, TAU); ctx.fill();
    } else if (o.type === 'bar') {
      const y = -62;
      ctx.fillStyle = '#f6e7d0';
      roundRect(0, -H, 14, H + y, 6); ctx.fill();
      roundRect(96, -H, 14, H + y, 6); ctx.fill();
      ctx.save();
      ctx.beginPath(); ctx.rect(0, -H, 14, H + y); ctx.rect(96, -H, 14, H + y); ctx.clip();
      ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 7;
      for (let yy = -H; yy < y + 20; yy += 20) {
        ctx.beginPath(); ctx.moveTo(-8, yy); ctx.lineTo(24, yy + 20); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(88, yy); ctx.lineTo(120, yy + 20); ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = '#b0793f';
      roundRect(-8, y - 26, 126, 26, 8); ctx.fill();
      ctx.fillStyle = '#8a5a28';
      roundRect(-8, y - 26, 126, 10, 5); ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('▼ SLIDE ▼', 55, y - 34);
    }
    ctx.restore();
  }
}

/* ---------- player ---------- */
function drawPlayer() {
  if (P.fallingPit && P.y > H) return;
  const scale = P.giantT > 0 ? 1.6 : 1;
  const blink = P.invT > 0 && Math.floor(G.time * 14) % 2 === 0;
  if (blink) return;

  ctx.save();
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  ctx.translate(P.x + P.w * scale / 2, P.y + ph);

  if (!P.fallingPit) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const shY = GROUND_Y - (P.y + ph);
    ctx.beginPath();
    ctx.ellipse(0, shY + 6, 30 * scale * (1 - clamp(shY/300,0,0.5)), 8 * scale, 0, 0, TAU);
    ctx.fill();
  }

  ctx.scale(scale, scale);
  // squash & stretch (จุดหมุนอยู่ที่เท้า)
  if (Math.abs(P.squash) > 0.01 && !P.sliding)
    ctx.scale(1 + P.squash * 0.45, 1 - P.squash * 0.4);
  if (P.giantT > 0 && P.giantT < 1.2 && Math.floor(G.time * 10) % 2 === 0)
    ctx.globalAlpha = 0.6;

  if (P.boostT > 0 || G.bonusT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(G.time * 12) * 0.15;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.ellipse(-6, -P.h / 2, 46, 52, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,60,.65)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = -14 - i * 16, ln = 30 + ((P.anim * 9 + i * 3) % 4) * 10;
      ctx.beginPath(); ctx.moveTo(-32, yy); ctx.lineTo(-32 - ln, yy); ctx.stroke();
    }
  }

  const run = P.anim;
  if (P.dead) {
    // ล้มคว่ำหมุนตัวตอนพลังหมด (แบบเกมจริง)
    const t = clamp(G.overT * 1.5, 0, 1);
    ctx.translate(0, -Math.sin(Math.min(t, 1) * Math.PI) * 26);
    ctx.rotate(Math.min(t * 2.4, Math.PI / 2));
    if (spritesReady) drawCharSprite('jump', CH());
    else cookieBody(0, 0.8, -0.5, 3.3, 2.3, 0);
  } else {
    if (P.stumbleT > 0)
      ctx.rotate(Math.sin(G.time * 36) * 0.14 * (P.stumbleT / 0.5));
    if (spritesReady) {
      if (P.sliding) drawCharSprite('duck', CH());
      else if (!P.onGround) {
        if (P.jumps >= 2) {
          ctx.save();
          ctx.translate(0, -40);
          ctx.rotate(P.anim * 1.8 % TAU);
          ctx.translate(0, 40);
          drawCharSprite('jump', CH());
          ctx.restore();
        } else drawCharSprite('jump', CH());
      } else {
        drawCharSprite(Math.floor(P.anim * 2.2) % 2 ? 'walk1' : 'walk2', CH());
        // เส้นสปีดด้านหลัง
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const yy = -30 - i * 18, ln = 14 + ((run * 7 + i * 2) % 3) * 5;
          ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
        }
      }
    } else {
      if (P.sliding) drawCookieSlide(run);
      else if (!P.onGround) drawCookieJump(P.jumps >= 2);
      else drawCookieRun(run);
    }
  }

  if (P.magnetT > 0) {
    ctx.strokeStyle = 'rgba(126,203,255,.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -G.time * 60;
    ctx.beginPath(); ctx.arc(0, -P.h/2, 66, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ============================================================
   ตัวละครแบบภาพวาด 2D — เฉดแสงเงา พื้นผิว เครื่องแต่งกาย
   (จุดกำเนิด = กึ่งกลางเท้า) — ch = ตัวละคร
   ============================================================ */
function ballGrad(x, y, r, c) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.12, x, y, r);
  g.addColorStop(0, shade(c, 40));
  g.addColorStop(0.55, c);
  g.addColorStop(1, shade(c, -26));
  return g;
}

function cookieBody(bodyTilt, legA, legB, armA, armB, headBob, ch) {
  ch = ch || CH();
  const B = ch.body, ICING = ch.icing;
  const OUTL = shade(B, -58);
  ctx.save();
  ctx.rotate(bodyTilt);
  ctx.lineJoin = 'round';

  /* --- ของประดับด้านหลังตัว --- */
  if (ch.id === 'angel') {
    // ปีกขนนกฟู 3 ชั้น กระพือเบา ๆ
    const f = Math.sin(P.anim * 2.2) * 0.16;
    ctx.save();
    ctx.translate(-14, -56);
    ctx.rotate(-0.35 + f);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 0 ? '#ffffff' : i === 1 ? '#f2ecff' : '#e4dcf8';
      ctx.beginPath();
      ctx.ellipse(-12 - i * 7, 2 + i * 5.5, 17 - i * 3, 7.5 - i * 1.2, -0.55 - i * 0.16, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(190,180,220,.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(-12, 2, 17, 7.5, -0.55, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (ch.id === 'ninja') {
    // ผ้าพันคอแดงปลายสะบัดตามลม
    const w1 = Math.sin(P.anim * 2.4) * 5, w2 = Math.sin(P.anim * 2.4 + 1.2) * 7;
    ctx.fillStyle = '#c4372e';
    ctx.beginPath();
    ctx.moveTo(-10, -62);
    ctx.quadraticCurveTo(-30, -60 + w1, -48, -52 + w2);
    ctx.quadraticCurveTo(-50, -46 + w2, -44, -44 + w2);
    ctx.quadraticCurveTo(-28, -50 + w1, -8, -54);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e0453a';
    ctx.beginPath();
    ctx.moveTo(-10, -60);
    ctx.quadraticCurveTo(-26, -66 - w1, -42, -64 - w2);
    ctx.quadraticCurveTo(-46, -60 - w2, -40, -56 - w2);
    ctx.quadraticCurveTo(-26, -58 - w1, -8, -54);
    ctx.closePath(); ctx.fill();
  }

  /* --- ขา + รองเท้าบูทไอซิ่ง --- */
  const leg = (ang) => {
    ctx.save();
    ctx.translate(0, -26);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUTL; ctx.lineWidth = 17;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 24); ctx.stroke();
    ctx.strokeStyle = B; ctx.lineWidth = 13.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 24); ctx.stroke();
    ctx.strokeStyle = shade(B, 24); ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(-2.5, 3); ctx.lineTo(-2.5, 14); ctx.stroke();
    // บูท
    ctx.fillStyle = ballGrad(2, 28, 10, ICING);
    ctx.beginPath(); ctx.ellipse(2, 28, 10.5, 7.2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUTL; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(2, 28, 10.5, 7.2, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.ellipse(-0.5, 25.4, 4.6, 2.4, -0.2, 0, TAU); ctx.fill();
    // ขอบไอซิ่งข้อเท้า
    ctx.strokeStyle = ICING; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(-6.5, 18.5); ctx.quadraticCurveTo(0, 23, 6.5, 18.5); ctx.stroke();
    ctx.restore();
  };
  leg(legA); leg(legB);

  /* --- ลำตัว --- */
  const bg = ctx.createLinearGradient(-17, -58, 12, -18);
  bg.addColorStop(0, shade(B, 26));
  bg.addColorStop(0.5, B);
  bg.addColorStop(1, shade(B, -16));
  ctx.fillStyle = bg;
  roundRect(-17, -58, 34, 38, 14); ctx.fill();
  ctx.strokeStyle = OUTL; ctx.lineWidth = 3;
  roundRect(-17, -58, 34, 38, 14); ctx.stroke();
  // เกล็ดพื้นผิวคุกกี้
  ctx.fillStyle = 'rgba(70,40,15,.22)';
  for (const [dx, dy, r] of [[-9, -27, 1.7], [7, -25, 1.4], [-2, -50, 1.5], [11, -44, 1.3]])
    { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }
  // ไอซิ่งซิกแซกชายตัว
  ctx.strokeStyle = shade(ICING, -22); ctx.lineWidth = 5.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-13, -33);
  ctx.lineTo(-7, -39); ctx.lineTo(-1, -33); ctx.lineTo(5, -39); ctx.lineTo(11, -33);
  ctx.stroke();
  ctx.strokeStyle = ICING; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-13, -34);
  ctx.lineTo(-7, -40); ctx.lineTo(-1, -34); ctx.lineTo(5, -40); ctx.lineTo(11, -34);
  ctx.stroke();
  // กระดุมเยลลี่วาว
  ctx.fillStyle = ballGrad(0, -48, 5, ch.button);
  ctx.beginPath(); ctx.arc(0, -48, 5, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(ch.button, -55); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -48, 5, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(-1.6, -49.8, 1.7, 0, TAU); ctx.fill();
  // เมล็ดสตรอว์เบอร์รีบนตัว
  if (ch.id === 'berry') {
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    for (const [dx, dy] of [[-9, -30], [8, -28], [-4, -24], [10, -38], [-11, -42]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 1.6, 2.4, 0.4, 0, TAU); ctx.fill(); }
  }
  // ช็อกโกแลตชิปของคุกกี้กล้าหาญ
  if (ch.id === 'brave') {
    ctx.fillStyle = 'rgba(90,50,20,.5)';
    for (const [dx, dy] of [[-10, -36], [9, -31]])
      { ctx.beginPath(); ctx.arc(dx, dy, 2.1, 0, TAU); ctx.fill(); }
  }

  /* --- แขน + มือนวม --- */
  const arm = (ang) => {
    ctx.save();
    ctx.translate(0, -52);
    ctx.rotate(ang);
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUTL; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 21); ctx.stroke();
    ctx.strokeStyle = B; ctx.lineWidth = 11.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 21); ctx.stroke();
    ctx.strokeStyle = shade(B, 24); ctx.lineWidth = 3.6;
    ctx.beginPath(); ctx.moveTo(-2.2, 3); ctx.lineTo(-2.2, 12); ctx.stroke();
    // มือนวมไอซิ่ง (มีนิ้วโป้ง)
    ctx.fillStyle = ballGrad(0, 24, 7, ICING);
    ctx.beginPath(); ctx.arc(0, 24, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(5.4, 20.5, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = OUTL; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 24, 7, 0, TAU); ctx.stroke();
    // ขอบไอซิ่งข้อมือ
    ctx.strokeStyle = ICING; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-5.5, 15); ctx.quadraticCurveTo(0, 18.5, 5.5, 15); ctx.stroke();
    ctx.restore();
  };
  arm(armA); arm(armB);

  /* --- หัว --- */
  ctx.save();
  ctx.translate(0, -80 + headBob);
  ctx.fillStyle = ballGrad(0, 0, 27, B);
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = OUTL; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  // เกล็ดคุกกี้บนหน้า
  ctx.fillStyle = 'rgba(70,40,15,.16)';
  ctx.beginPath(); ctx.arc(-16, 10, 1.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(24, -4, 1.4, 0, TAU); ctx.fill();

  if (ch.id === 'berry') {
    // หมวกสตรอว์เบอร์รีเต็มใบ
    ctx.fillStyle = ballGrad(0, -10, 27, '#e8506e');
    ctx.beginPath();
    ctx.arc(0, -4, 27.6, Math.PI * 1.02, Math.PI * 1.98);
    ctx.quadraticCurveTo(19, -1, 10, -8);
    ctx.quadraticCurveTo(5, 0, -1, -8);
    ctx.quadraticCurveTo(-7, 0, -14, -8);
    ctx.quadraticCurveTo(-21, -1, -27.2, -8.2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade('#e8506e', -55); ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,244,220,.95)';
    for (const [sx, sy, a] of [[-15, -17, 0.5], [-2, -23, 0], [12, -16, -0.4], [-8, -12, 0.3], [6, -11, -0.2]])
      { ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, 0, 1.7, 2.7, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    // ใบ + ขั้ว
    ctx.fillStyle = '#4ca64c';
    for (const a of [-0.6, 0, 0.6]) {
      ctx.save(); ctx.translate(0, -28); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0, -5, 4.4, 8.5, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.strokeStyle = '#3a7a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(2, -38); ctx.stroke();
  } else {
    // ผมไอซิ่งวาว + เงาใต้ขอบ
    ctx.fillStyle = ICING;
    ctx.beginPath();
    ctx.arc(0, -4, 27, Math.PI * 1.05, Math.PI * 1.95);
    ctx.quadraticCurveTo(16, -22, 7, -13);
    ctx.quadraticCurveTo(2, -25, -5, -13);
    ctx.quadraticCurveTo(-11, -25, -18, -11);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,160,185,.4)'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-18, -11);
    ctx.quadraticCurveTo(-11, -25, -5, -13);
    ctx.quadraticCurveTo(2, -25, 7, -13);
    ctx.quadraticCurveTo(16, -22, 24, -14);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(-8, -20, 5.5, 2.6, 0.5, 0, TAU); ctx.fill();
    // ลอนไอซิ่งม้วนบนหัวแบบ GingerBrave
    if (ch.id === 'brave' || ch.id === 'angel') {
      ctx.lineCap = 'round';
      ctx.strokeStyle = shade(ICING, -14); ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(1, -28.5, 7.5, Math.PI * 0.65, Math.PI * 2.35); ctx.stroke();
      ctx.strokeStyle = ICING; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(1, -29, 7.5, Math.PI * 0.65, Math.PI * 2.3); ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(2.5, -29, 3.2, Math.PI * 0.9, Math.PI * 2.6); ctx.stroke();
    }
  }

  if (ch.id === 'ninja') {
    // แถบคาดหัว + ปมผูก
    ctx.fillStyle = '#c4372e';
    roundRect(-27, -11, 54, 11, 5); ctx.fill();
    ctx.fillStyle = '#e0453a';
    roundRect(-27, -11, 54, 6, 4); ctx.fill();
    ctx.fillStyle = '#c4372e';
    ctx.beginPath(); ctx.arc(-26, -5, 4.5, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-27, -6); ctx.lineTo(-45, 2); ctx.lineTo(-41, 9); ctx.lineTo(-26, 0);
    ctx.closePath(); ctx.fill();
  } else if (ch.id === 'angel') {
    // วงแหวนเรืองแสง
    ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.ellipse(0, -35, 17, 5.5, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.ellipse(0, -35, 17, 5.5, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, -36.4, 15, 4.2, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }

  // คิ้วตื่นเต้น
  ctx.strokeStyle = ch.id === 'ninja' ? '#2a3040' : '#3a2410';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(4, -6.5, 5.5, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
  ctx.beginPath(); ctx.arc(17, -6.5, 5.5, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
  // ตาโตรี + ประกาย 2 จุด
  ctx.fillStyle = ch.id === 'ninja' ? '#2a3040' : '#3a2410';
  ctx.beginPath(); ctx.ellipse(4, -1, 4.3, 5.8, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(17, -1, 4.3, 5.8, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(5.4, -3.2, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(18.4, -3.2, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.8, 0.6, 0.9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(15.8, 0.6, 0.9, 0, TAU); ctx.fill();
  // ปากยิ้มกว้าง + ลิ้น
  ctx.fillStyle = '#5f2c14';
  ctx.beginPath();
  ctx.arc(11, 6, 8, 0.04 * Math.PI, 0.96 * Math.PI);
  ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(11, 6, 8, 0.04 * Math.PI, 0.96 * Math.PI);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#ff8f86';
  ctx.beginPath(); ctx.ellipse(11, 13.4, 6.2, 4, 0, 0, TAU); ctx.fill();
  ctx.restore();
  // แก้มชมพูฟุ้ง
  ctx.fillStyle = ch.cheek;
  ctx.beginPath(); ctx.arc(-6, 7, 5.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(24, 7, 4.6, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-7.5, 5.6, 1.7, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(22.6, 5.6, 1.5, 0, TAU); ctx.fill();
  // ไฮไลต์หัวโค้งบน
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 2, 21, Math.PI * 1.22, Math.PI * 1.45); ctx.stroke();
  ctx.restore();

  // ไม้เท้าลูกกวาดคู่ใจ GingerBrave (มือหน้าถือวิ่ง)
  if (ch.id === 'brave') {
    ctx.save();
    ctx.translate(15, -46 + Math.sin(P.anim) * 1.6);
    ctx.rotate(0.5 + Math.sin(P.anim) * 0.06);
    ctx.lineCap = 'round';
    // เงาขอบแท่ง
    ctx.strokeStyle = '#b8a88e'; ctx.lineWidth = 10.5;
    ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, -18); ctx.arc(-7.5, -18, 7.5, 0, -Math.PI, true); ctx.stroke();
    // แท่งครีม
    ctx.strokeStyle = '#f8f2e6'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, -18); ctx.arc(-7.5, -18, 7.5, 0, -Math.PI, true); ctx.stroke();
    // ลายแดงพันเกลียวช่วงแท่งตรง
    ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
    for (let s = 0; s < 4; s++) {
      const yy = 20 - s * 11;
      ctx.beginPath(); ctx.moveTo(-3.4, yy); ctx.lineTo(3.4, yy - 5); ctx.stroke();
    }
    // ลายแดงบนตะขอ
    for (const [a1, a2] of [[-0.15, 0.35], [Math.PI * 0.45, Math.PI * 0.45 + 0.5]]) {
      ctx.beginPath(); ctx.arc(-7.5, -18, 7.5, -a1, -a2, true); ctx.stroke();
    }
    // แสงวาวบนแท่ง
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-2.6, 24); ctx.lineTo(-2.6, -16); ctx.stroke();
    // มือนวมกำไม้เท้า
    ctx.fillStyle = ballGrad(0, 8, 7.5, ICING);
    ctx.beginPath(); ctx.arc(0, 8, 7.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = shade(B, -58); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 8, 7.5, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}


function drawCookieRun(t, ch) {
  const c = Math.sin(t), s = Math.sin(t + Math.PI);
  cookieBody(0.10, c * 0.9, s * 0.9, 2.6 + s * 0.7, 2.6 + c * 0.7, Math.abs(Math.cos(t)) * -2, ch);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap='round';
  for (let i = 0; i < 3; i++) {
    const yy = -30 - i * 18, ln = 14 + ((t * 7 + i * 2) % 3) * 5;
    ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
  }
}
function drawCookieJump(second) {
  if (second) {
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(P.anim * 1.8 % TAU);
    ctx.translate(0, 40);
    cookieBody(0, 0.9, -0.9, 2.2, 3.4, 0);
    ctx.restore();
  } else {
    cookieBody(0.14, P.vy < 0 ? 1.1 : 0.4, P.vy < 0 ? -0.6 : -1.1, 2.0, 3.6, 0);
  }
}
function drawCookieSlide(t) {
  ctx.save();
  ctx.rotate(-Math.PI / 2 + 0.28);
  ctx.translate(16, 6);
  cookieBody(0, 0.5 + Math.sin(t*2)*0.1, -0.3, 2.8, 3.2, 0);
  ctx.restore();
  if (Math.random() < 0.5) puff(P.x + 10, GROUND_Y, 1);
}

/* ---------- particles & floaters ---------- */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      ctx.fillRect(-p.r, -p.r/3, p.r*2, p.r/1.5);
      ctx.fillRect(-p.r/3, -p.r, p.r/1.5, p.r*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / 1.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `bold ${f.big ? 24 : 17}px Trebuchet MS`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   UI WIDGETS
   ============================================================ */
function drawBtn(x, y, w, h, label, cb, opt = {}) {
  uiButtons.push({ x, y, w, h, cb, disabled: opt.disabled });
  const base = opt.disabled ? '#8a8178' : (opt.color || '#ff8b3d');
  const dark = opt.disabled ? '#6e675f' : (opt.dark || '#d96a1e');
  // เงา
  ctx.fillStyle = 'rgba(60,25,0,.4)';
  roundRect(x, y + 4, w, h, h / 2.4); ctx.fill();
  // ปุ่ม
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, base); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(x, y, w, h, h / 2.4); ctx.fill();
  // ไฮไลต์บน
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(x + 6, y + 4, w - 12, h * 0.32, h * 0.16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, h / 2.4); ctx.stroke();
  // ตัวหนังสือ
  ctx.font = `bold ${opt.font || 21}px Trebuchet MS`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(80,35,0,.7)';
  ctx.strokeText(label, x + w / 2, y + h / 2 + 1);
  ctx.fillStyle = opt.disabled ? '#d5cfc8' : '#fff';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function drawPanel(x, y, w, h, r = 18) {
  ctx.fillStyle = 'rgba(58,30,8,.82)';
  roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,160,.4)';
  ctx.lineWidth = 2.5;
  roundRect(x + 3, y + 3, w - 6, h - 6, r - 3); ctx.stroke();
}

function drawCoinChip(x, y, text) {
  const w = ctx.measureText(text).width;
  ctx.save();
  ctx.font = 'bold 19px Trebuchet MS';
  const tw = ctx.measureText(text).width + 52;
  drawPanel(x - tw, y, tw, 34, 17);
  ctx.fillStyle = '#e8a90c';
  ctx.beginPath(); ctx.arc(x - tw + 20, y + 17, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath(); ctx.arc(x - tw + 20, y + 17, 8.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b8860b';
  ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('C', x - tw + 20, y + 18);
  ctx.font = 'bold 19px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8'; ctx.textAlign = 'left';
  ctx.fillText(text, x - tw + 38, y + 18);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawTitleText(text, x, y, size, fill1 = '#ffe9a0', fill2 = '#ff8b2e') {
  ctx.textAlign = 'center';
  ctx.font = `bold ${size}px Trebuchet MS`;
  ctx.lineWidth = size * 0.19;
  ctx.strokeStyle = '#5a2e10';
  ctx.strokeText(text, x, y);
  const grad = ctx.createLinearGradient(0, y - size * 0.8, 0, y + size * 0.15);
  grad.addColorStop(0, fill1); grad.addColorStop(1, fill2);
  ctx.fillStyle = grad;
  ctx.fillText(text, x, y);
}

/* ---------- HUD ---------- */
function drawHUD() {
  const bx = 24, by = 20, bw = 330, bh = 26;
  ctx.fillStyle = 'rgba(60,30,0,.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 14); ctx.fill();
  const hpFrac = G.hp / G.hpMax;
  const hpC = hpFrac > 0.5 ? '#7bd94a' : hpFrac > 0.25 ? '#ffce2e' : '#ff5f5f';
  ctx.fillStyle = '#3d2410';
  roundRect(bx, by, bw, bh, 11); ctx.fill();
  if (hpFrac > 0.01) {
    ctx.fillStyle = hpC;
    roundRect(bx, by, Math.max(14, bw * hpFrac), bh, 11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(bx + 3, by + 3, Math.max(8, bw * hpFrac - 6), 8, 5); ctx.fill();
  }

  // รูปหน้าตัวละครที่หัวแถบพลัง
  ctx.save();
  ctx.translate(bx + 2, by + bh / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ffe2b8';
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  if (spritesReady) {
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.clip();
    const im = IMGS[(CH().spr || 'player') + '_stand'];
    ctx.drawImage(im, -19, -15, 42, 58);
  }
  ctx.restore();

  if (hpFrac < 0.25 && Math.floor(G.time * 3) % 2 === 0) {
    ctx.fillStyle = '#ff5f5f';
    ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'left';
    ctx.fillText('⚠ พลังใกล้หมด! เก็บยาเพิ่มพลัง!', bx + 10, by + bh + 22);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Trebuchet MS';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.8)';
  const sc = Math.floor(G.score).toLocaleString();
  ctx.strokeText(sc, W - 26, 46);
  ctx.fillStyle = '#fff';
  ctx.fillText(sc, W - 26, 46);
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.strokeStyle = 'rgba(60,30,0,.7)'; ctx.lineWidth = 3;
  const meta = `🏃 ${Math.floor(G.dist)} m    🍬 ${G.jellies}    🪙 ${G.coins}`;
  ctx.strokeText(meta, W - 26, 72);
  ctx.fillText(meta, W - 26, 72);

  if (G.combo >= 5) {
    ctx.textAlign = 'center';
    const pop = 1 + Math.max(0, 0.4 - G.comboTimer) * 0.6;
    ctx.save();
    ctx.translate(W / 2, 96);
    ctx.scale(pop, pop);
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText(G.combo + ' COMBO!', 0, 0);
    ctx.fillStyle = `hsl(${(G.combo * 14) % 360},90%,65%)`;
    ctx.fillText(G.combo + ' COMBO!', 0, 0);
    ctx.restore();
  }

  let iy = by + bh + (G.hp / G.hpMax < 0.25 ? 38 : 14) + 8;
  ctx.textAlign = 'left'; ctx.font = 'bold 15px Trebuchet MS';
  if (P.giantT > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🍭 ยักษ์: ' + P.giantT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (P.magnetT > 0) {
    ctx.fillStyle = '#7ecbff';
    ctx.fillText('🧲 แม่เหล็ก: ' + P.magnetT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.bonusT > 0) {
    ctx.fillStyle = '#ffe066';
    ctx.fillText('⭐ BONUS TIME: ' + G.bonusT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.revives > 0) {
    ctx.fillStyle = '#ffb0c8';
    ctx.fillText('💖 ชุบชีวิต x' + G.revives, bx, iy);
  }

  /* ปุ่มโปร่งแสง Jump / Slide มุมล่างจอ (แบบเกมจริง) */
  const bubbleBtn = (x, label, pressed) => {
    ctx.save();
    ctx.globalAlpha = pressed ? 0.5 : 0.24;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.fill();
    ctx.globalAlpha = pressed ? 0.95 : 0.5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, H - 72, 41, Math.PI * 1.12, Math.PI * 1.42); ctx.stroke();
    ctx.font = 'bold 21px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.55)';
    ctx.strokeText(label, x, H - 64);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, H - 64);
    ctx.restore();
  };
  bubbleBtn(82, 'Jump', !P.onGround);
  bubbleBtn(W - 82, 'Slide', P.sliding);
}

function drawBanner() {
  if (!G.banner || G.bannerT > 1.6) return;
  const a = G.bannerT < 0.25 ? G.bannerT / 0.25 : G.bannerT > 1.25 ? (1.6 - G.bannerT) / 0.35 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(G.banner.text, W / 2, 200);
  ctx.fillStyle = G.banner.color;
  ctx.fillText(G.banner.text, W / 2, 200);
  ctx.globalAlpha = 1;
}

/* ============================================================
   SCREENS
   ============================================================ */
function drawMenu() {
  ctx.fillStyle = 'rgba(40,20,5,.45)';
  ctx.fillRect(0, 0, W, H);

  // ขนมลอยตกแต่งฉากหลังเมนู
  const decor = [
    [70, 150, 0, 2.2], [880, 210, 1, 1.8], [905, 120, 2, 1.5],
    [60, 260, 2, 1.6], [850, 330, 0, 1.7],
  ];
  decor.forEach(([dx, dy, kind, sc], i) => {
    ctx.save();
    ctx.translate(dx, dy + Math.sin(G.time * 1.4 + i * 1.7) * 8);
    ctx.rotate(Math.sin(G.time * 0.9 + i) * 0.25);
    ctx.scale(sc, sc);
    ctx.globalAlpha = 0.5;
    if (kind === 0) {           // เยลลี่แท่ง
      ctx.rotate(0.5);
      ctx.fillStyle = '#ffce2e'; roundRect(-13, -6.5, 26, 13, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; roundRect(-10, -4.5, 10, 4, 2); ctx.fill();
    } else if (kind === 1) {    // หัวใจ
      ctx.fillStyle = '#ff7bac'; heart(0, 0, 13); ctx.fill();
    } else {                    // ดาว
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const rr = k % 2 === 0 ? 13 : 5.5;
        const a = -Math.PI / 2 + k * Math.PI / 5;
        k === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  });

  // โลโก้ + แสงวิ่งผ่าน
  ctx.save();
  ctx.translate(W / 2, 118);
  ctx.rotate(Math.sin(G.time * 1.2) * 0.02);
  ctx.scale(1 + Math.sin(G.time * 2.4) * 0.012, 1 + Math.sin(G.time * 2.4) * 0.012);
  drawTitleText('COOKIE RUN', 0, 0, 72);
  const sw = ((G.time * 0.45) % 2) - 0.5;      // -0.5..1.5 รอบละ ~4.4 วิ
  if (sw >= -0.2 && sw <= 1.2) {
    ctx.save();
    ctx.beginPath();
    const bandX = -330 + sw * 660;
    ctx.moveTo(bandX - 30, -70); ctx.lineTo(bandX + 30, -70);
    ctx.lineTo(bandX - 10, 20);  ctx.lineTo(bandX - 70, 20);
    ctx.closePath(); ctx.clip();
    ctx.font = 'bold 72px Trebuchet MS';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText('COOKIE RUN', 0, 0);
    ctx.restore();
  }
  ctx.font = 'bold 28px Trebuchet MS';
  ctx.lineWidth = 7; ctx.strokeStyle = '#5a2e10';
  ctx.strokeText('~ คลาสสิค ~', 0, 42);
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('~ คลาสสิค ~', 0, 42);
  ctx.restore();

  // เหรียญสะสม + สถิติ
  drawCoinChip(W - 20, 16, G.bank.toLocaleString());
  if (G.best > 0) {
    ctx.font = 'bold 19px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 188);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 188);
  }

  // ตัวละครที่เลือก วิ่งโชว์
  ctx.save();
  ctx.translate(215, 420 + Math.abs(Math.sin(G.time * 3)) * -18);
  ctx.scale(1.25, 1.25);
  if (spritesReady) drawCharSprite(Math.floor(G.time * 8) % 2 ? 'walk1' : 'walk2', CH());
  else drawCookieRun(P.anim);
  ctx.restore();
  ctx.save();
  ctx.translate(130, 320 + Math.sin(G.time * 4) * 10);
  ctx.scale(1.3, 1.3);
  drawPet(PT());
  ctx.restore();
  ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(CH().name, 215, 465);
  ctx.fillStyle = '#fff';
  ctx.fillText(CH().name, 215, 465);

  // ปุ่มหลัก
  drawBtn(W / 2 - 10, 240, 310, 64, '▶  เริ่มวิ่ง!', () => startGame(), { color: '#ffb02e', dark: '#e07b12', font: 27 });
  drawBtn(W / 2 - 10, 322, 150, 50, '🍪 ตัวละคร', () => setState('select'), { color: '#f0699a', dark: '#c94d7d', font: 17 });
  drawBtn(W / 2 + 150, 322, 150, 50, '🐥 สัตว์เลี้ยง', () => setState('pets'), { color: '#7bd94a', dark: '#57a832', font: 17 });
  drawBtn(W / 2 - 10, 386, 150, 50, '🛍 ร้านค้า', () => setState('shop'), { color: '#5cb8e8', dark: '#3d92c4', font: 17 });
  drawBtn(W / 2 + 150, 386, 150, 50, '🏆 อันดับ', () => setState('rank'), { color: '#9d7ee0', dark: '#7a5cc0', font: 17 });

  // ป้ายภารกิจปัจจุบัน
  const m = MISSIONS[G.missionIdx];
  ctx.textAlign = 'left';
  if (m) {
    drawPanel(24, 20, 356, 66, 14);
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('📜 ภารกิจที่ ' + (G.missionIdx + 1) + '/' + MISSIONS.length, 42, 45);
    ctx.font = '15px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(m.desc + '  →  🪙 ' + m.reward, 42, 70);
  } else {
    drawPanel(24, 20, 356, 44, 14);
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('🎖 เคลียร์ภารกิจครบทุกด่านแล้ว สุดยอด!', 42, 48);
  }

  ctx.font = 'bold 14px Trebuchet MS';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,233,184,.85)';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.7)';
  const help = 'SPACE/แตะซ้าย = โดด 2 ครั้ง = ตีลังกา  ·  ↓/กดขวาค้าง = สไลด์  ·  M = เสียง  ·  Art: Kenney.nl (CC0)';
  ctx.strokeText(help, W / 2, 526);
  ctx.fillText(help, W / 2, 526);
}

/* ---------- เลือกตัวละคร ---------- */
function drawSelect() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('เลือกตัวละคร', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  const cw = 215, gap = 14;
  const x0 = (W - (cw * 4 + gap * 3)) / 2;
  CHARS.forEach((c, i) => {
    const x = x0 + i * (cw + gap), y = 96, h = 356;
    const selected = i === G.charIdx;
    const owned = G.owned.includes(i);
    drawPanel(x, y, cw, h);
    if (selected) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
      roundRect(x + 2, y + 2, cw - 4, h - 4, 16); ctx.stroke();
    }

    // ตัวคุกกี้
    ctx.save();
    ctx.translate(x + cw / 2, y + 168 + (selected ? Math.sin(G.time * 5) * 3 : 0));
    ctx.scale(1.05, 1.05);
    if (spritesReady) drawCharSprite(selected && Math.floor(G.time * 6) % 2 ? 'walk1' : 'stand', c);
    else cookieBody(0, 0.5, -0.5, 2.6, 3.6, 0, c);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.fillStyle = selected ? '#ffd24a' : '#fff';
    ctx.fillText(c.name, x + cw / 2, y + 196);
    ctx.font = '14px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(c.desc[0], x + cw / 2, y + 222);
    ctx.fillText(c.desc[1], x + cw / 2, y + 242);

    if (selected) {
      drawBtn(x + 24, y + h - 76, cw - 48, 46, '✓ ใช้อยู่', () => {}, { disabled: true });
    } else if (owned) {
      drawBtn(x + 24, y + h - 76, cw - 48, 46, 'เลือก', () => trySelectChar(i), { color: '#7bd94a', dark: '#57a832' });
    } else {
      const afford = G.bank >= c.cost;
      drawBtn(x + 24, y + h - 76, cw - 48, 46, '🪙 ' + c.cost.toLocaleString(), () => trySelectChar(i),
        afford ? { color: '#ffb02e', dark: '#e07b12' } : { color: '#8a8178', dark: '#6e675f' });
    }
  });

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- เลือกสัตว์เลี้ยง ---------- */
function drawPets() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('เลือกสัตว์เลี้ยง', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  const cw = 240, gap = 20;
  const x0 = (W - (cw * 3 + gap * 2)) / 2;
  PETS.forEach((p, i) => {
    const x = x0 + i * (cw + gap), y = 96, h = 356;
    const selected = i === G.petIdx;
    const owned = G.petsOwned.includes(i);
    drawPanel(x, y, cw, h);
    if (selected) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
      roundRect(x + 2, y + 2, cw - 4, h - 4, 16); ctx.stroke();
    }

    ctx.save();
    ctx.translate(x + cw / 2, y + 120 + (selected ? Math.sin(G.time * 4) * 6 : 0));
    ctx.scale(2.1, 2.1);
    drawPet(p);
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.fillStyle = selected ? '#ffd24a' : '#fff';
    ctx.fillText(p.name, x + cw / 2, y + 196);
    ctx.font = '14px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(p.desc[0], x + cw / 2, y + 222);
    ctx.fillText(p.desc[1], x + cw / 2, y + 242);

    if (selected) {
      drawBtn(x + 30, y + h - 76, cw - 60, 46, '✓ ใช้อยู่', () => {}, { disabled: true });
    } else if (owned) {
      drawBtn(x + 30, y + h - 76, cw - 60, 46, 'เลือก', () => trySelectPet(i), { color: '#7bd94a', dark: '#57a832' });
    } else {
      const afford = G.bank >= p.cost;
      drawBtn(x + 30, y + h - 76, cw - 60, 46, '🪙 ' + p.cost.toLocaleString(), () => trySelectPet(i),
        afford ? { color: '#ffb02e', dark: '#e07b12' } : { color: '#8a8178', dark: '#6e675f' });
    }
  });

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- ร้านค้า ---------- */
function drawShop() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ร้านค้าอัปเกรด', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  UPGS.forEach((u, i) => {
    const x = 110, y = 96 + i * 86, w = W - 220, h = 74;
    drawPanel(x, y, w, h, 16);
    // ไอคอน
    ctx.font = '34px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(u.icon, x + 44, y + h / 2 + 2);
    ctx.textBaseline = 'alphabetic';
    // ชื่อ + คำอธิบาย
    ctx.textAlign = 'left';
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#fff';
    ctx.fillText(u.name, x + 84, y + 30);
    ctx.font = '14px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(u.desc, x + 84, y + 54);
    // เลเวลพิป
    const lv = G.upg[u.id];
    for (let p = 0; p < u.max; p++) {
      ctx.fillStyle = p < lv ? '#ffd24a' : 'rgba(255,255,255,.18)';
      roundRect(x + 350 + p * 26, y + 28, 20, 16, 5); ctx.fill();
    }
    // ปุ่มซื้อ
    if (lv >= u.max) {
      drawBtn(x + w - 170, y + 15, 150, 44, 'MAX ✓', () => {}, { disabled: true });
    } else {
      const cost = upgCost(u, lv);
      const afford = G.bank >= cost;
      drawBtn(x + w - 170, y + 15, 150, 44, '🪙 ' + cost.toLocaleString(), () => tryUpgrade(u),
        afford ? { color: '#ffb02e', dark: '#e07b12', font: 18 } : { color: '#8a8178', dark: '#6e675f', font: 18 });
    }
  });

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- ตารางอันดับ ---------- */
function drawRank() {
  ctx.fillStyle = 'rgba(40,20,5,.62)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ตารางอันดับ Top 10', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  drawPanel(130, 88, W - 260, 372, 20);

  if (G.board.length === 0) {
    ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ยังไม่มีสถิติ — ไปวิ่งกันเลย! 🏃', W / 2, 280);
  } else {
    ctx.font = 'bold 15px Trebuchet MS';
    ctx.fillStyle = 'rgba(255,233,184,.7)';
    ctx.textAlign = 'left';  ctx.fillText('อันดับ', 165, 120);
    ctx.fillText('ตัวละคร', 245, 120);
    ctx.textAlign = 'right'; ctx.fillText('คะแนน', 590, 120);
    ctx.fillText('ระยะทาง', 700, 120);
    ctx.fillText('วันที่', 800, 120);
    G.board.forEach((e, i) => {
      const y = 152 + i * 30;
      const hl = i === G.rankPos && G.state === 'rank' ? false : false;
      ctx.font = i < 3 ? 'bold 18px Trebuchet MS' : '16px Trebuchet MS';
      ctx.fillStyle = i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 165, y);
      ctx.fillText(CHARS[e.c] ? CHARS[e.c].name : '-', 245, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 590, y);
      ctx.fillText(e.d.toLocaleString() + ' m', 700, y);
      const d = new Date(e.t);
      ctx.fillText(d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543).toString().slice(-2), 800, y);
    });
  }

  drawBtn(W / 2 - 90, 476, 180, 46, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- game over ---------- */
function drawGameOver() {
  const a = clamp(G.overT / 0.6, 0, 1);
  ctx.fillStyle = `rgba(30,12,2,${a * 0.72})`;
  ctx.fillRect(0, 0, W, H);
  if (a < 1) return;

  drawTitleText('พลังคุกกี้หมดแล้ว!', W / 2, 120, 52, '#ffb98a', '#ff7a4a');

  drawPanel(W / 2 - 240, 150, 480, 236, 20);
  const rows = [
    ['คะแนนรวม', Math.floor(G.score).toLocaleString()],
    ['ระยะทาง', Math.floor(G.dist).toLocaleString() + ' m'],
    ['เยลลี่ที่เก็บ', G.jellies.toLocaleString()],
    ['เหรียญที่ได้ (+โบนัส)', '🪙 ' + G.earned.toLocaleString()],
    ['ด่านที่ไปถึง', 'ด่าน ' + G.stage],
  ];
  ctx.font = 'bold 21px Trebuchet MS';
  rows.forEach(([k, v], i) => {
    const y = 186 + i * 34;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe9b8'; ctx.fillText(k, W / 2 - 20, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(v, W / 2 + 20, y);
  });
  // ผลภารกิจ
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px Trebuchet MS';
  if (G.missionDone) {
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('📜 ภารกิจสำเร็จ! รับโบนัส 🪙 ' + G.missionReward.toLocaleString(), W / 2, 366);
  } else if (MISSIONS[G.missionIdx]) {
    ctx.fillStyle = 'rgba(255,233,184,.75)';
    ctx.fillText('📜 ภารกิจ: ' + MISSIONS[G.missionIdx].desc, W / 2, 366);
  }

  ctx.textAlign = 'center';
  if (G.newBest && Math.floor(G.time * 3) % 2 === 0) {
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('🎉 สถิติใหม่! 🎉', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🎉 สถิติใหม่! 🎉', W / 2, 424);
  } else if (G.rankPos >= 0 && G.rankPos < 3) {
    ctx.font = 'bold 24px Trebuchet MS';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
  } else {
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 424);
  }

  if (G.overT > 0.9) {
    drawBtn(W / 2 - 230, 448, 220, 54, '▶ เล่นอีกครั้ง', () => startGame(), { color: '#ffb02e', dark: '#e07b12' });
    drawBtn(W / 2 + 10, 448, 220, 54, '🏠 เมนูหลัก', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
  }
}

/* ---------- shape helpers ---------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s, y - s * 0.5, x, y + s * 0.35);
  ctx.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
