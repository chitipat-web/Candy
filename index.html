let rngSrc = Math.random;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let courseRng = Math.random;
const rnd  = (a, b) => a + rngSrc() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function hexLerp(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t));
  const g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t));
  const bl = Math.round(lerp(pa & 255, pb & 255, t));
  return `rgb(${r},${g},${bl})`;
}
/* ปรับสีสว่างขึ้น/มืดลง (รับได้ทั้ง #hex และ rgb(...)) */
function shade(col, amt) {
  let r, g, b;
  if (col[0] === '#') {
    const p = parseInt(col.slice(1), 16);
    r = p >> 16; g = (p >> 8) & 255; b = p & 255;
  } else {
    const m = col.match(/\d+/g);
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  r = clamp(r + amt, 0, 255); g = clamp(g + amt, 0, 255); b = clamp(b + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}

/* ============================================================

const AudioSys = {
  ctx: null, master: null, musicGain: null, muted: false,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.32;
      this.musicGain.connect(this.master);
    } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  beep(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.25) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(g); g.connect(this.master); src.start(t);
  },
  jelly(combo) { this.beep(660 + Math.min(combo, 24) * 30, 0.09, 'square', 0.13, 200); },
  bear()   { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.14,'square',0.2),i*70)); },
  potion() { [392,523,659].forEach((f,i)=>setTimeout(()=>this.beep(f,0.12,'triangle',0.25),i*60)); },
  power()  { [262,330,392,523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'sawtooth',0.15),i*50)); },
  jump()   { this.beep(300, 0.15, 'sine', 0.2, 250); },
  jump2()  { this.beep(400, 0.15, 'sine', 0.2, 300); },
  slide()  { this.noise(0.12, 0.1); },
  crash()  { this.noise(0.25, 0.35); this.beep(120, 0.3, 'sawtooth', 0.25, -60); },
  fall()   { this.beep(500, 0.5, 'sine', 0.2, -420); },
  speedup(){ [660,660,880].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'square',0.2),i*90)); },
  over()   { [523,494,440,392,330,262].forEach((f,i)=>setTimeout(()=>this.beep(f,0.22,'triangle',0.2),i*160)); },
  click()  { this.beep(760, 0.06, 'square', 0.15, 120); },
  buy()    { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.1,'triangle',0.22),i*55)); },
  deny()   { this.beep(180, 0.18, 'sawtooth', 0.18, -60); },

  musicTimer: null, step: 0,
  melody: [
    523,0,659,0, 784,0,659,523, 587,0,659,587, 523,0,392,0,
    523,0,659,0, 784,0,880,784, 659,587,523,587, 659,0,523,0,
    440,0,523,0, 659,0,523,440, 494,0,587,494, 392,0,330,0,
    440,0,523,659, 784,0,659,523, 587,659,587,494, 523,0,0,0
  ],
  bass: [131,0,196,0, 165,0,196,0, 147,0,196,0, 131,0,196,0,
         131,0,196,0, 165,0,196,0, 147,0,175,0, 196,0,196,0],
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.step = 0;
    const tick = () => {
      if (this.muted) { this.step++; return; }
      const t = this.ctx.currentTime;
      const m = this.melody[this.step % this.melody.length];
      const b = this.bass[this.step % this.bass.length];
      if (m) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'square'; o.frequency.value = m;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.15);
      }
      if (b) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = b;
        g.gain.setValueAtTime(0.09, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.18);
      }
      this.step++;
    };
    this.musicTimer = setInterval(tick, 130);
  },
  stopMusic() { clearInterval(this.musicTimer); this.musicTimer = null; }
};

/* วางเยลลี่ตามวิถีโค้งกระโดดจริง (จำลองฟิสิกส์เดียวกับผู้เล่น)
   → วิ่งตามเยลลี่ = ผ่านเสมอ (ลายเซ็นเกมเพลย์ของต้นฉบับ) */
function jumpArcJellies(x0, type) {
  const v = G.speed;
  const step = 1 / 120;
  let y = GROUND_Y - 36, vy = JUMP_V, x = x0, lastX = x0 - 999;
  for (let t = 0; t < 2; t += step) {
    vy += effGrav(vy) * step;
    y += vy * step;
    x += v * step;
    if (vy > 0 && y >= GROUND_Y - 36) break;
    if (x - lastX >= 47) { J(x, y, type || 'bar'); lastX = x; }
  }
  return x - x0;   // ระยะโดดจริง ณ ความเร็วปัจจุบัน
}
const spdK = () => G.speed / G.baseSpeed;   // ตัวคูณระยะตามความเร็ว

function rowJellies(x, n, y = GROUND_Y - 36, type = 'bar') {
  for (let i = 0; i < n; i++) J(x + i * 46, y, type);
  return n * 46;
}
function arcJellies(x, n, peak = 150) {
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const y = GROUND_Y - 36 - Math.sin(t * Math.PI) * peak;
    J(x + i * 52, y, 'bar');
  }
  return n * 52;
}

const PATTERNS = [
  x => rowJellies(x, rndi(5, 9)) + 120,
  // 1: โค้งเยลลี่ตามวิถีโดดจริง — อุปสรรควางใต้จุดสูงสุดพอดี
  x => {
    const w = jumpArcJellies(x);
    OB(x + w * 0.45, rnd(0, 1) < 0.5 ? 'spike' : 'rock');
    return w + 90 * spdK();
  },
  // 2: คานสไลด์ + เยลลี่แถวต่ำนำทาง
  x => {
    OB(x + 150, 'bar');
    rowJellies(x, 8, GROUND_Y - 30);
    return 8 * 46 + 160;
  },
  // 3: หลุมเจาะใต้โค้งโดดจริง — โดดตรงต้นโค้ง = ข้ามพอดี
  x => {
    const w = jumpArcJellies(x);
    const pw = Math.min(w * 0.48, 160 * spdK());
    pits.push({ x: x + w * 0.28, w: pw });
    return w + 120;
  },
  x => {
    let cx = x;
    for (let s = 0; s < 3; s++) {
      const y = GROUND_Y - 40 - s * 85;
      for (let i = 0; i < 3; i++) { J(cx, y, 'bar'); cx += 48; }
    }
    J(cx + 10, GROUND_Y - 40 - 2 * 85 - 20, 'pink');
    return cx - x + 160;
  },
  // 5: โดดข้ามหนาม → เว้นระยะตามความเร็ว (มีเวลาตั้งตัว ≥0.55 วิ) → สไลด์ลอดคาน
  x => {
    const w1 = jumpArcJellies(x);
    OB(x + w1 * 0.45, 'spike');
    const g2 = Math.max(240, G.speed * 0.55);
    const barX = x + w1 + g2;
    OB(barX, 'bar');
    rowJellies(barX + 15, 5, GROUND_Y - 30);
    return w1 + g2 + 5 * 46 + 120;
  },
  x => {
    for (let i = 0; i < 6; i++) J(x + i * 50, GROUND_Y - 175 - Math.sin(i * 0.8) * 22, 'coin');
    OB(x + 120, 'rock');
    return 6 * 50 + 150;
  },
  x => {
    const w = rowJellies(x, 8);
    spawnBear(x + w + 30, GROUND_Y - 60);
    return w + 200;
  },
  // 8: หลุมคู่ — ทั้งสองหลุมเจาะตามวิถีโดดจริง เว้นช่วงหายใจตรงกลาง
  x => {
    const w1 = jumpArcJellies(x);
    pits.push({ x: x + w1 * 0.28, w: Math.min(w1 * 0.48, 150 * spdK()) });
    const g2 = Math.max(180, G.speed * 0.45);
    const x2 = x + w1 + g2;
    const w2 = jumpArcJellies(x2);
    pits.push({ x: x2 + w2 * 0.28, w: Math.min(w2 * 0.48, 150 * spdK()) });
    return w1 + g2 + w2 + 100;
  },
  x => {
    for (let i = 0; i < 10; i++)
      J(x + i * 48, GROUND_Y - 36 - (i % 4 < 2 ? 0 : 120), 'bar');
    return 10 * 48 + 120;
  },
  // 10: ชั้นลอย
  x => {
    const y = GROUND_Y - 150;
    const w = rndi(6, 9) * 60;
    platforms.push({ x: x + 80, w, y });
    for (let i = 0; i < Math.floor(w / 52) - 1; i++) J(x + 110 + i * 52, y - 34, 'bar');
    for (let i = 0; i < 4; i++) J(x + 150 + i * 62, GROUND_Y - 36, 'coin');
    if (Math.random() < 0.5) OB(x + 120 + w * 0.5, 'spike');
    return w + 240;
  },
  // 11: ชั้นลอยสองช่วง + หมี
  x => {
    const y = GROUND_Y - 160;
    platforms.push({ x: x + 60, w: 330, y });
    platforms.push({ x: x + 60 + 330 + 130, w: 300, y: y - 60 });
    for (let i = 0; i < 5; i++) J(x + 100 + i * 55, y - 34, 'bar');
    for (let i = 0; i < 4; i++) J(x + 555 + i * 55, y - 94, 'bar');
    spawnBear(x + 60 + 330 + 130 + 300 - 40, y - 60 - 62);
    pits.push({ x: x + 60 + 330 + 10, w: 110 });
    return 60 + 330 + 130 + 300 + 200;
  },
];

const bonusPathY = wx => 250 + Math.sin(wx * 0.004) * 105;

/* ตัวอักษรเยลลี่ "BONUS" — ซิกเนเจอร์ของเกมจริง */
const LETTERS = {
  B: ['1110','1001','1110','1001','1110'],
  O: ['0110','1001','1001','1001','0110'],
  N: ['1001','1101','1011','1001','1001'],
  U: ['1001','1001','1001','1001','0110'],
  S: ['0111','1000','0110','0001','1110'],
};
let bonusLetterQueue = [];
let bonusBearSpawned = false;

function spawnBonusPattern() {
  // ช่วงแรกของโบนัส: สะกดคำว่า BONUS ด้วยเยลลี่
  if (bonusLetterQueue.length) {
    const map = LETTERS[bonusLetterQueue.shift()];
    const x = spawnX;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 4; c++)
        if (map[r][c] === '1') J(x + c * 27, 176 + r * 27, 'bar');
    spawnX = x + 4 * 27 + 46;
    return;
  }
  const x = spawnX;
  for (let i = 0; i < 12; i++) {
    const wx = x + i * 50;
    const y = bonusPathY(wx);
    J(wx, y, 'bar');
    J(wx, y - 46, i % 3 === 0 ? 'coin' : 'bar');
    J(wx, y + 46, i % 4 === 0 ? 'pink' : 'bar');
  }
  spawnX = x + 12 * 50;
}

/* เกาะโจรสลัด: มีแต่เหรียญ ยาใหญ่ และอุปสรรคเบา ๆ */
function spawnCoinPattern() {
  const x = spawnX;
  const r = rnd(0, 1);
  let w;
  if (r < 0.06) {
    rowJellies(x, 4, GROUND_Y - 36, 'coin');
    J(x + 4 * 46 + 20, GROUND_Y - 46, 'potion');
    w = 4 * 46 + 180;
  } else if (r < 0.3) {
    // โค้งเหรียญข้ามอุปสรรค
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      J(x + i * 52, GROUND_Y - 36 - Math.sin(t * Math.PI) * 160, 'coin');
    }
    if (rnd(0, 1) < 0.6) OB(x + 7 * 26 - 26, rnd(0, 1) < 0.5 ? 'spike' : 'rock');
    w = 7 * 52 + 130;
  } else if (r < 0.5) {
    // ชั้นลอย + เหรียญสองชั้น
    const y = GROUND_Y - 150, pw2 = rndi(5, 7) * 60;
    platforms.push({ x: x + 60, w: pw2, y });
    for (let i = 0; i < Math.floor(pw2 / 52) - 1; i++) J(x + 90 + i * 52, y - 34, 'coin');
    for (let i = 0; i < 5; i++) J(x + 100 + i * 56, GROUND_Y - 36, 'coin');
    w = pw2 + 200;
  } else if (r < 0.62) {
    // ฝนเหรียญซิกแซก
    for (let i = 0; i < 10; i++)
      J(x + i * 46, GROUND_Y - 36 - (i % 4 < 2 ? 0 : 120), 'coin');
    w = 10 * 46 + 110;
  } else {
    w = rowJellies(x, rndi(5, 9), GROUND_Y - 36, 'coin') + 110;
    if (rnd(0, 1) < 0.3) pits.push({ x: x + w - 60, w: rndi(110, 150) });
  }
  spawnX = x + w + rnd(40, 110);
}

function spawnPattern() {
  if (G.bonusT > 0) { spawnBonusPattern(); return; }
  if (G.mode === 'coins') { spawnCoinPattern(); return; }
  const x = spawnX;
  let w;
  const roll = rnd(0, 1);
  if (roll < 0.04)        w = spawnItem(x, 'potion');
  else if (roll < 0.068)  w = spawnItem(x, 'giant');
  else if (roll < 0.096)  w = spawnItem(x, 'magnet');
  else if (roll < 0.118)  w = spawnItem(x, 'star');
  else if (roll < 0.142)  w = spawnItem(x, 'blast');
  else if (roll < 0.175)  w = spawnItem(x, 'box');
  else {
    const hard = Math.min(G.stage, 6);
    const pool = [0,1,1,2,2,3,4,5,6,7,9,10,10,11]
      .concat(hard >= 2 ? [3,5,8,10] : [0])
      .concat(hard >= 3 ? [7,8,11] : []);
    w = PATTERNS[pool[rndi(0, pool.length - 1)]](x);
    // ตัวอักษร BONUSTIME ตัวถัดไปโปรยไว้กลางทาง (แบบเกมจริง)
    if (G.btProgress < 9 && rnd(0, 1) < 0.24) {
      const lj = { x: x + rnd(60, Math.max(80, w - 60)), y: GROUND_Y - rnd(120, 205),
                   type: 'letter', ch: BT_WORD[G.btProgress], t: rnd(0, TAU), dead: false };
      jellyList.push(lj);
    }
  }
  spawnX = x + w + rnd(50, 130) * spdK();
}
function spawnItem(x, type) {
  rowJellies(x, 4);
  J(x + 4 * 46 + 20, GROUND_Y - 46, type);
  return 4 * 46 + 180;
}

const keys = {};
let slideHeld = false;
function doSlide(on) { slideHeld = on; }

function doJump() {
  if (G.state !== 'play') return;
  if (P.dead || P.fallingPit || G.bonusT > 0) return;
  if (P.sliding) {
    P.sliding = false;
    P.y -= (P.h - P.h * 0.52) * (P.giantT > 0 ? 1.6 : 1);
  }
  if (P.onGround) {
    P.vy = JUMP_V * (P.giantT > 0 ? 0.94 : 1);
    P.onGround = false; P.jumps = 1;
    P.squash = -0.28;
    AudioSys.jump();
    puff(P.x, P.y + P.h, 6);
  } else if (P.jumps >= 1 && P.jumps < CH().jumps) {
    P.vy = JUMP2_V;
    P.jumps++;
    AudioSys.jump2();
    puff(P.x, P.y + P.h, 8, '#fff');
  }
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  AudioSys.init(); AudioSys.resume();
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (G.state === 'menu') { G.boostSel = {}; setState('prep'); }
    else if (G.state === 'prep') prepGo();
    else if (G.state === 'over') { if (G.overT > 1) startGame(G.mode); }
    else if (['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
    else doJump();
  }
  if (e.code === 'Escape' && ['select','shop','rank','pets','treasure','prep'].includes(G.state)) setState('menu');
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'play') togglePause();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); doSlide(true); }
  if (e.code === 'KeyM') { AudioSys.muted = !AudioSys.muted; }
  if (e.code === 'KeyX' && G.state === 'play') useSkill();
  keys[e.code] = true;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') doSlide(false);
  keys[e.code] = false;
});

/* ---------- UI buttons ---------- */
let uiButtons = [];
function uiClick(x, y) {
  for (const b of uiButtons) {
    if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      AudioSys.click();
      b.cb();
      return true;
    }
  }
  return false;
}
function canvasXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX - r.left) / r.width * W, (clientY - r.top) / r.height * H];
}
function pointerDown(x, y, id) {
  if (G.state === 'play') {
    if (G.paused) { togglePause(); return; }
    if (Math.hypot(x - W / 2, y - 30) < 26) { togglePause(); return; }   // ปุ่มพักกลางบน
    if (Math.hypot(x - W / 2, y - (H - 66)) < 44) { useSkill(); return; } // ปุ่มสกิลกลางล่าง
    if (x < W / 2) { if (id !== undefined) touches[id] = 'L'; else mouseFly = true; doJump(); }
    else { if (id !== undefined) touches[id] = 'R'; doSlide(true); }
    return;
  }
  if (uiClick(x, y)) return;
  if (G.state === 'over' && G.overT > 1.2) startGame(G.mode);
}

const touches = {};
let mouseFly = false;   // เมาส์กดค้างฝั่งซ้าย (ใช้บังคับบินขึ้นช่วงโบนัส)
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  AudioSys.init(); AudioSys.resume();
  for (const t of e.changedTouches) {
    const [x, y] = canvasXY(t.clientX, t.clientY);
    pointerDown(x, y, t.identifier);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (touches[t.identifier] === 'R') doSlide(false);
    delete touches[t.identifier];
  }
});
canvas.addEventListener('mousedown', e => {
  AudioSys.init(); AudioSys.resume();
  const [x, y] = canvasXY(e.clientX, e.clientY);
  pointerDown(x, y);
});
canvas.addEventListener('mouseup', () => { doSlide(false); mouseFly = false; });

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(mode, boosts) {
  G.mode = mode || 'normal';
  G.runBoost = boosts || {};
  G.continueUsed = false;
  G.floorNow = 1; G.floorT = 0;
  // คอร์สตายตัวต่อโหมด — เล่นซ้ำเจอด่านเดิม ฝึกให้เก่งขึ้นได้แบบเกมจริง
  courseRng = mulberry32(G.mode === 'coins' ? 777001 : G.mode === 'tower' ? 555002 : 424242);
  setState('play');
  G.time = G.time; G.dist = 0; G.score = 0; G.coins = 0; G.jellies = 0;
  G.combo = 0; G.comboTimer = 0;
  G.hpMax = 100 + CH().hpBonus + G.upg.hp * 12 + (G.runBoost.energy ? 40 : 0);
  G.hp = G.hpMax;
  G.stage = 1; G.stageTimer = 0;
  G.hpDrain = 3.2;
  G.speed = G.baseSpeed; G.newBest = false; G.rankPos = -1;
  P.y = GROUND_Y - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
  P.sliding = false; P.invT = 0; P.giantT = 0; P.magnetT = 0;
  P.boostT = (2.4 + CH().boostBonus + G.upg.boost * 0.6) * (G.runBoost.fast ? 2 : 1);
  G.bonusT = 0; G.revives = CH().revives + (hasTr(1) ? 1 : 0);
  G.skill = 0; G.scoreMulT = 0;
  P.dead = false; P.fallingPit = false; slideHeld = false; G.paused = false;
  G.runBears = 0; G.runStars = 0; G.maxCombo = 0; G.missionDone = false;
  G.btProgress = 0; G.runBoxes = 0;
  jellyList = []; obstacles = []; pits = []; particles = []; floaters = []; platforms = [];
  Pet.x = 60; Pet.y = 280;
  worldX = 0; spawnX = W + 100;
  skyPrev = 0; skyCur = 0; skyT = 1;
  ovenAmt = 1;                     // เริ่มเกม = อยู่ในเตาอบ
  if (G.mode === 'coins') banner('🏴‍☠️ เกาะโจรสลัด: กวาดเหรียญให้มากที่สุด!', '#ffd24a');
  else if (G.mode === 'tower') { banner('🧊 หอคอยน้ำแข็ง — ชั้นที่ 1!', '#8fd3ff'); skyPrev = 3; skyCur = 3; }
  else banner('EPISODE 1: หนีจากเตาอบ! GO!!', '#ffdd44');
  AudioSys.startMusic();
}

function gameOver() {
  if (G.state !== 'play') return true;
  if (G.revives > 0) {
    G.revives--;
    G.hp = G.hpMax * 0.6;
    P.invT = 3;
    G.flash = 0;
    banner('✨ ชุบชีวิต! REVIVE! ✨', '#ffd24a');
    AudioSys.power();
    sparkle(P.x + P.w / 2, P.y + P.h / 2, 26, '#ffd24a');
    return false;
  }
  // เสนอ Continue ด้วยคริสตัล (ครั้งเดียวต่อรอบ แบบเกมจริง)
  if (!G.continueUsed && G.crystals >= 3) {
    G.state = 'continue';
    G.continueT = 6;
    P.dead = true;
    AudioSys.stopMusic();
    return true;
  }
  settleGameOver();
  return true;
}

function doContinue() {
  G.crystals -= 3; SAVE.set('crystals', G.crystals);
  G.continueUsed = true;
  G.state = 'play';
  P.dead = false; P.fallingPit = false;
  G.hp = G.hpMax * 0.6;
  P.y = Math.min(P.y, GROUND_Y - P.h - 120); P.vy = 0;
  P.invT = 3;
  banner('💎 CONTINUE! ลุยต่อ!', '#7ee0ff');
  AudioSys.power();
  AudioSys.startMusic();
}

function settleGameOver() {
  setState('over'); G.overT = 0;
  P.dead = true;
  puff(P.x + 28, P.y + P.h - 6, 16, '#a97b45');
  sparkle(P.x + 28, P.y + 30, 8, '#ffce2e');
  AudioSys.stopMusic();
  AudioSys.over();
  G.score = Math.floor(G.score);
  if (G.score > G.best) { G.best = G.score; G.newBest = true; SAVE.set('best', G.best); }
  // เปิดกล่องปริศนา: เหรียญ + โอกาสได้คริสตัล 20%
  G.boxCoins = 0; G.boxGems = 0;
  for (let i = 0; i < G.runBoxes; i++) {
    G.boxCoins += rndi(60, 250);
    if (Math.random() < 0.2) G.boxGems++;
  }
  if (G.boxGems > 0) { G.crystals += G.boxGems; SAVE.set('crystals', G.crystals); }
  G.earned = Math.floor((G.coins + Math.floor(G.score / 400) + G.boxCoins) * (hasTr(4) ? 1.5 : 1) * (G.runBoost.coin ? 2 : 1));
  G.bank += G.earned;
  SAVE.set('coins', G.bank);
  const entry = { s: G.score, d: Math.floor(G.dist), c: G.charIdx, t: Date.now() };
  G.board.push(entry);
  G.board.sort((a, b) => b.s - a.s);
  G.board = G.board.slice(0, 10);
  G.rankPos = G.board.indexOf(entry);
  SAVE.set('board', G.board);
  submitOnline();
  // เช็คภารกิจ (+1 คริสตัลด้วย)
  const m = MISSIONS[G.missionIdx];
  if (m && m.check({ dist: G.dist, jellies: G.jellies, score: G.score, combo: G.maxCombo,
                     bears: G.runBears, stars: G.runStars, stage: G.stage })) {
    G.missionDone = true;
    G.missionReward = m.reward;
    G.bank += m.reward;
    G.crystals += 1; SAVE.set('crystals', G.crystals);
    G.missionIdx++;
    SAVE.set('coins', G.bank);
    SAVE.set('mission', G.missionIdx);
  }
  return true;
}
