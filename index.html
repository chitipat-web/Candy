const PHOTO_IMGS = {};
for (const k in PHOTO_HEADS) {
  const im = new Image();
  im.onload = () => { for (const c in portCache) delete portCache[c]; };  // ล้างแคชภาพยืนเมื่อรูปพร้อม
  im.src = PHOTO_HEADS[k];
  PHOTO_IMGS[k] = im;
}

function cookiePortrait(i) {
  let cv = portCache['c' + i];
  if (!cv) {
    cv = document.createElement('canvas');
    cv.width = 260; cv.height = 300;   // ความละเอียด 2 เท่า ภาพคมบนการ์ดใหญ่
    const pc = cv.getContext('2d');
    const old = ctx; ctx = pc;
    pc.save(); pc.translate(130, 260); pc.scale(1.2, 1.2);
    FRONT = true;   // ภาพยืน = หันหน้าตรงแบบภาพทางการ
    try {
      cookieBody(0, 0, 0, 0, 0, 0, CHARS[i],
        CHARS[i].id === 'brave' ? { cane: { x: -27, y: -54, rot: -0.06, flip: true, len: 56 } } : undefined);
    } catch (e) {}
    FRONT = false;
    pc.restore(); ctx = old;
    portCache['c' + i] = cv;
  }
  return cv;
}
function petPortrait(i) {
  let cv = portCache['p' + i];
  if (!cv) {
    cv = document.createElement('canvas');
    cv.width = 180; cv.height = 180;   // ความละเอียด 2 เท่า
    const pc = cv.getContext('2d');
    const old = ctx; ctx = pc;
    pc.save(); pc.translate(90, 92); pc.scale(3, 3);
    try { drawPet(PETS[i]); } catch (e) {}
    pc.restore(); ctx = old;
    portCache['p' + i] = cv;
  }
  return cv;
}

/* ---------- กริดเลือกแบบหลายหน้า (ใช้ร่วมคุกกี้/สัตว์เลี้ยง) ----------
   คลิกการ์ด = ดูรายละเอียด · ซื้อ/เลือกใช้ ด้วยปุ่มในแถบล่าง */
function drawGrid(LIST, kind) {
  const isChar = kind === 'char';
  const cw = 150, chh = 204, gapX = 10, gapY = 8;   // แถวเดียว การ์ดใหญ่พิเศษ
  const x0 = 16, y0 = 76;
  const curIdx = isChar ? G.charIdx : G.petIdx;           // ตัวที่ใช้อยู่
  let focus = isChar ? G.selFocus : G.petFocus;           // ตัวที่กำลังดู
  if (focus == null || focus >= LIST.length) focus = curIdx;
  const ownedArr = isChar ? G.owned : G.petsOwned;

  // ---- สกรอลล์แนวนอนแบบลากเลื่อน (2 แถว เรียงคอลัมน์) ----
  const sKey = isChar ? 'selScroll' : 'petScroll', vKey = sKey + 'V';
  const colsTotal = LIST.length;   // แถวเดียว
  const viewW = W - 32;
  const maxS = Math.max(0, colsTotal * (cw + gapX) - gapX - viewW);
  if (Math.abs(G[vKey] || 0) > 0.4) { G[sKey] = (G[sKey] || 0) + G[vKey]; G[vKey] *= 0.92; }  // แรงเฉื่อยหลังปล่อยนิ้ว
  else {
    G[vKey] = 0;
    // snap เข้าขอบการ์ดนุ่มๆ หลังหยุดไหล (ไม่ทำระหว่างลาก)
    if (!gridDrag) {
      const unit = cw + gapX;
      const target = clamp(Math.round((G[sKey] || 0) / unit) * unit, 0, maxS);
      G[sKey] = (G[sKey] || 0) + (target - (G[sKey] || 0)) * 0.18;
      if (Math.abs(target - G[sKey]) < 0.4) G[sKey] = target;
    }
  }
  G[sKey] = clamp(G[sKey] || 0, 0, maxS);
  const scroll = G[sKey];

  ctx.save();
  ctx.beginPath(); ctx.rect(6, y0 - 6, W - 12, chh + 12); ctx.clip();
  for (let i = 0; i < LIST.length; i++) {
    const it = LIST[i];
    const x = x0 + i * (cw + gapX) - scroll;
    if (x < -cw - 6 || x > W + 6) continue;
    const y = y0;
    const using = i === curIdx;
    const focused = i === focus;
    const owned = ownedArr.includes(i);

    drawPanel(x, y, cw, chh, 12);
    if (focused) {
      ctx.strokeStyle = '#7ec8ff'; ctx.lineWidth = 3.5;
      roundRect(x + 2, y + 2, cw - 4, chh - 4, 10); ctx.stroke();
    }
    if (using) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3;
      roundRect(x + 4.5, y + 4.5, cw - 9, chh - 9, 8); ctx.stroke();
    }
    // ป้ายเกรด
    ctx.fillStyle = GRADES[it.grade] || '#9aa7b0';
    roundRect(x + 6, y + 6, 26, 17, 6); ctx.fill();
    ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(it.grade, x + 19, y + 19);

    // ภาพ (จากแคช)
    ctx.save();
    if (!owned) ctx.globalAlpha = 0.38;
    const bob = focused ? Math.sin(G.time * 5) * 2.5 : 0;
    if (isChar) ctx.drawImage(cookiePortrait(i), x + 3, y + 8 + bob, 144, 166);
    else ctx.drawImage(petPortrait(i), x + 23, y + 42 + bob, 104, 104);
    ctx.restore();
    if (!owned) drawIcon('lock', x + cw - 16, y + 18, 17);
    if (using) {
      ctx.font = 'bold 10px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('✓ ใช้อยู่', x + cw / 2, y + 34);
    }

    // ชื่อ + สถานะ
    ctx.font = 'bold 14px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillStyle = focused ? '#7ec8ff' : using ? '#ffd24a' : '#fff';
    let nm = it.name.replace('คุกกี้', '');
    if (nm.length > 11) nm = nm.slice(0, 10) + '…';
    ctx.fillText(nm, x + cw / 2, y + chh - 24);
    ctx.font = 'bold 13px Trebuchet MS';
    if (owned) {
      ctx.fillStyle = '#aee4ff';
      const lv = (isChar ? G.charLv : G.petLv)[i] || 1;
      const gd = !isChar && (G.petGrade[i] || 0) > 0 ? '  +' + G.petGrade[i] : '';
      if (gd) { ctx.fillStyle = '#ff8ad0'; }
      ctx.fillText('Lv.' + lv + gd, x + cw / 2, y + chh - 9);
    } else {
      ctx.fillStyle = '#ffd24a';
      ctx.fillText('🪙' + (it.cost >= 1000 ? (it.cost / 1000) + 'k' : it.cost), x + cw / 2, y + chh - 9);
    }
    // คลิกการ์ด = โฟกัสดูรายละเอียด (ไม่ซื้อ)
    drawBtn(x, y, cw, chh, '', () => {
      if (isChar) G.selFocus = i; else G.petFocus = i;
      AudioSys.click();
    }, { invisible: true });
  }
  ctx.restore();
  // แถบบอกตำแหน่งสกรอลล์
  if (maxS > 0) {
    const barX = 60, barW = W - 120, barY = y0 + chh + 12;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    roundRect(barX, barY, barW, 6, 3); ctx.fill();
    const thW = Math.max(46, barW * viewW / (colsTotal * (cw + gapX)));
    const thX = barX + (barW - thW) * (scroll / maxS);
    ctx.fillStyle = 'rgba(255,214,138,.85)';
    roundRect(thX, barY, thW, 6, 3); ctx.fill();
  }

  // ---------- แถบรายละเอียดตัวที่กำลังดู ----------
  const cur = LIST[focus];
  const ownedCur = ownedArr.includes(focus);
  const dy = 322;
  drawPanel(16, dy, W - 32, 92, 14);
  ctx.save();
  if (isChar) { ctx.translate(64, dy + 78); ctx.scale(0.42, 0.42);
    ctx.drawImage(cookiePortrait(focus), -65, -140, 130, 150); ctx.restore(); }
  else { ctx.restore(); ctx.drawImage(petPortrait(focus), 28, dy + 12, 68, 68); }
  ctx.textAlign = 'left';
  ctx.font = 'bold 17px Trebuchet MS';
  ctx.fillStyle = '#ffd24a';
  const lvCur = (isChar ? G.charLv : G.petLv)[focus] || 1;
  const gdCur = !isChar ? (G.petGrade[focus] || 0) : 0;
  const title = cur.name + (ownedCur ? '  Lv.' + lvCur + (gdCur > 0 ? ' +' + gdCur : '') : '');
  const wN = ctx.measureText(title).width;
  ctx.fillText(title, 112, dy + 30);
  ctx.fillStyle = GRADES[cur.grade];
  roundRect(112 + wN + 12, dy + 15, 32, 19, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillText(cur.grade, 112 + wN + 28, dy + 29);
  ctx.textAlign = 'left';
  ctx.font = 'bold 15.5px Trebuchet MS'; ctx.fillStyle = '#fff3dc';
  ctx.fillText((cur.desc[0] || '') + (cur.desc[1] ? ' · ' + cur.desc[1] : ''), 112, dy + 53);
  // เอฟเฟกต์พาสซีฟสมบัติสัตว์เลี้ยง (ไต่ตามเกรด)
  if (!isChar && ownedCur) {
    const tpd = petTPdesc(focus);
    if (tpd) { ctx.font = 'bold 14px Trebuchet MS'; ctx.fillStyle = '#ffb0dc';
      ctx.fillText(tpd + (gdCur > 0 ? '' : ' (อัปเกรดเพื่อเพิ่ม)'), 112, dy + 72); }
  }
  // คู่ซี้ Combi — โบนัสพิเศษเฉพาะคู่ (ต่างกันตามสายสกิลคุกกี้)
  ctx.font = 'bold 13.5px Trebuchet MS';
  if (isChar && cur.mate && PET_BY_ID[cur.mate]) {
    const mateOn = PT().id === cur.mate && focus === curIdx;
    ctx.fillStyle = mateOn ? '#7bd94a' : '#c8b8a0';
    ctx.fillText((mateOn ? '💞 COMBI: ' : '🤍 คู่ซี้: ') + PET_BY_ID[cur.mate].name + ' — แต้ม +15% · ' + combiCatOf(cur).label, 112, dy + 72);
  } else if (!isChar) {
    const mate = CHARS.find(c2 => c2.mate === cur.id);
    if (mate) {
      const on = CH().mate === cur.id && focus === curIdx;
      ctx.fillStyle = on ? '#7bd94a' : '#c8b8a0';
      ctx.fillText((on ? '💞 COMBI: ' : '🤍 คู่ซี้: ') + mate.name + ' — แต้ม +15% · ' + combiCatOf(mate).label, 112, dy + 86);
    }
  }

  // ---------- ปุ่มการกระทำในแถบรายละเอียด ----------
  if (!ownedCur) {
    const afford = G.bank >= cur.cost;
    drawBtn(W - 228, dy + 26, 200, 42, 'ซื้อ ' + cur.cost.toLocaleString(),
      () => (isChar ? trySelectChar(focus) : trySelectPet(focus)),
      afford ? { color: '#ffb02e', dark: '#e07b12', font: 14, icon: 'coin' } : { color: '#8a8178', dark: '#6e675f', font: 14, icon: 'coin' });
  } else {
    if (focus !== curIdx) {
      drawBtn(W - 228, dy + 8, 200, 36, '✓ ใช้ตัวนี้',
        () => (isChar ? trySelectChar(focus) : trySelectPet(focus)),
        { color: '#7bd94a', dark: '#57a832', font: 14 });
    } else {
      drawBtn(W - 228, dy + 8, 200, 36, '★ ใช้อยู่', () => {}, { disabled: true, font: 13 });
    }
    // แถวอัปเกรด: คุกกี้ = ปุ่ม Lv เต็มแถว / สัตว์เลี้ยง = Lv (ครึ่งซ้าย) + เกรดสมบัติ +9 (ครึ่งขวา)
    const lvW = isChar ? 200 : 96;
    if (lvCur < 8) {
      // คุกกี้อัปสกิลด้วย ✨ ผงเวทมนตร์ (แบบเกมจริง) / สัตว์เลี้ยงใช้เหรียญ
      const upCost = isChar ? (6 + lvCur * 4) : 300 * lvCur;
      const canAfford = isChar ? G.powder >= upCost : G.bank >= upCost;
      const label = isChar ? '↑ Lv.' + (lvCur + 1) + '  ✨' + upCost
                           : '↑Lv.' + (lvCur + 1) + ' 🪙' + (upCost >= 1000 ? (upCost / 1000).toFixed(1) + 'k' : upCost);
      drawBtn(W - 228, dy + 50, lvW, 36, label, () => {
        if (canAfford) {
          if (isChar) { G.powder -= upCost; SAVE.set('powder', G.powder); G.charLv[focus] = lvCur + 1; SAVE.set('charLv', G.charLv); }
          else { G.bank -= upCost; SAVE.set('coins', G.bank); G.petLv[focus] = lvCur + 1; SAVE.set('petLv', G.petLv); }
          AudioSys.buy();
          uiBurst(W - 128, dy + 68, '#7ec8ff');
          floatText(W / 2, 100, cur.name + ' → Lv.' + (lvCur + 1) + '!', '#aee4ff', true);
        } else { AudioSys.deny(); floatText(W / 2, 100, isChar ? 'ผงเวทมนตร์ไม่พอ!' : 'เหรียญไม่พอ!', '#ff8888', true); }
      }, canAfford ? { color: '#5cb8e8', dark: '#3d92c4', font: isChar ? 13 : 11 } : { color: '#8a8178', dark: '#6e675f', font: isChar ? 13 : 11 });
    } else {
      drawBtn(W - 228, dy + 50, lvW, 36, isChar ? '★ MAX Lv.8' : '★MAX', () => {}, { disabled: true, font: isChar ? 13 : 11 });
    }
    // เกรดสมบัติสัตว์เลี้ยง +0 → +9 (ผลพาสซีฟไต่ถึง +50% ที่ +9)
    if (!isChar) {
      const gd = G.petGrade[focus] || 0;
      if (gd < PET_MAXGRADE) {
        const gCost = petGradeCost(focus, gd);
        drawBtn(W - 228 + 104, dy + 50, 96, 36, '★+' + (gd + 1) + ' 🪙' + (gCost >= 1000 ? (gCost / 1000).toFixed(1) + 'k' : gCost), () => {
          if (G.bank >= gCost) {
            G.bank -= gCost; G.petGrade[focus] = gd + 1;
            SAVE.set('coins', G.bank); SAVE.set('petGrade', G.petGrade);
            AudioSys.buy();
            uiBurst(W - 80, dy + 68, '#ff8ad0');
            const pc = Math.round((gd + 1) * (50 / PET_MAXGRADE));
            floatText(W / 2, 100, cur.name + ' เกรด +' + (gd + 1) + '! (พลังพาสซีฟ +' + pc + '%)', '#ff8ad0', true);
          } else { AudioSys.deny(); floatText(W / 2, 100, 'เหรียญไม่พอ!', '#ff8888', true); }
        }, G.bank >= gCost ? { color: '#c85aa8', dark: '#a03c84', font: 11 } : { color: '#8a8178', dark: '#6e675f', font: 11 });
      } else {
        drawBtn(W - 228 + 104, dy + 50, 96, 36, '★+9 สุด', () => {}, { disabled: true, font: 11 });
      }
    }
  }

  // ---------- แถวล่าง: เลื่อนกริด + ไข่ + กลับ ----------
  const by = 478;
  drawBtn(16, by, 52, 44, '‹', () => {
    G[sKey] = clamp((G[sKey] || 0) - viewW, 0, maxS); G[vKey] = 0;
    AudioSys.click();
  }, { color: '#a08468', dark: '#7d6448', font: 22 });
  drawBtn(74, by, 52, 44, '›', () => {
    G[sKey] = clamp((G[sKey] || 0) + viewW, 0, maxS); G[vKey] = 0;
    AudioSys.click();
  }, { color: '#a08468', dark: '#7d6448', font: 22 });
  ctx.font = 'bold 14px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('ลากเลื่อนดูได้ · มี ' + ownedArr.length + '/' + LIST.length + ' ตัว', 220, by + 27);

  if (!isChar) {
    drawBtn(330, by, 200, 44, 'ฟักไข่ · 800 เหรียญ', () => hatchEgg(false), { color: '#e8b23c', dark: '#c08d1e', font: 14, icon: 'egg' });
    drawBtn(540, by, 200, 44, 'ไข่ทอง · 5 เพชร', () => hatchEgg(true), { color: '#7ec3e8', dark: '#559ec4', font: 14, icon: 'gem' });
  }
  drawBtn(W - 156, by, 140, 44, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- สมบัติ ---------- */
function drawTreasure() {
  ctx.fillStyle = 'rgba(58,32,10,.44)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('สมบัติ', W / 2, 50, 34);
  drawCoinChip(W - 20, 22, G.bank.toLocaleString());
  ctx.font = 'bold 14px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('สวมได้สูงสุด 3 ชิ้น — กำลังสวม ' + G.trEquip.length + '/3 · แตะเพื่อซื้อ/สวม · อัปเกรด +0→+9 ผลไต่ถึง 2 เท่า', W / 2, 76);

  const cw = 150, chh = 122, gap = 6;
  const x0 = (W - (cw * 6 + gap * 5)) / 2;
  TREASURES.forEach((t, i) => {
    const x = x0 + (i % 6) * (cw + gap), y = 90 + Math.floor(i / 6) * (chh + 8);
    const owned = G.trOwned.includes(i);
    const equipped = G.trEquip.includes(i);
    drawPanel(x, y, cw, chh, 12);
    if (equipped) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3.5;
      roundRect(x + 2, y + 2, cw - 4, chh - 4, 10); ctx.stroke();
    }
    ctx.textAlign = 'center';
    ctx.globalAlpha = owned ? 1 : 0.55;
    drawTreasureIcon(t.fx.k, x + cw / 2, y + 30, 34);
    ctx.globalAlpha = 1;
    ctx.font = 'bold 13px Trebuchet MS';
    ctx.fillStyle = equipped ? '#ffd24a' : '#fff';
    ctx.fillText(t.name, x + cw / 2, y + 62);
    ctx.font = 'bold 12px Trebuchet MS'; ctx.fillStyle = '#fff3dc';
    // ตัดคำอธิบายเป็น 2 บรรทัด
    const dwords = t.desc;
    if (dwords.length > 13) {
      const mid = Math.floor(dwords.length / 2);
      let cut = dwords.indexOf(' ', mid); if (cut < 0) cut = mid;
      ctx.fillText(dwords.slice(0, cut), x + cw / 2, y + 78);
      ctx.fillText(dwords.slice(cut + (dwords[cut] === ' ' ? 1 : 0)), x + cw / 2, y + 92);
    } else ctx.fillText(dwords, x + cw / 2, y + 82);
    ctx.font = 'bold 12px Trebuchet MS';
    // ยังไม่ซื้อ: ราคาอยู่ล่าง / สวมอยู่: ป้าย ✓ มุมขวาบน (ไม่ทับคำอธิบาย)
    if (!owned) {
      ctx.fillStyle = '#ffd24a';
      const prTxt = t.cost.toLocaleString();
      drawMiniCoin(x + cw / 2 - ctx.measureText(prTxt).width / 2 - 9, y + chh - 12, 6.5);
      ctx.font = 'bold 12px Trebuchet MS'; ctx.fillStyle = '#ffd24a'; ctx.textAlign = 'center';
      ctx.fillText(prTxt, x + cw / 2 + 6, y + chh - 8);
    } else if (equipped) {
      ctx.fillStyle = 'rgba(30,70,20,.85)';
      roundRect(x + cw - 52, y + 6, 46, 17, 7); ctx.fill();
      ctx.fillStyle = '#8fff70'; ctx.font = 'bold 11px Trebuchet MS';
      ctx.fillText('✓ สวม', x + cw - 29, y + 18.5);
    }
    drawBtn(x, y, cw, chh, '', () => tryTreasure(i), { invisible: true });
    // อัปเกรดสมบัติ +0 → +9 (เหมือนต้นฉบับ) — ผลไต่ถึง 2 เท่าที่ +9
    if (owned) {
      const st = G.trStar[i] || 0;
      // ป้ายเลเวลมุมซ้ายบน (พิลล์เด่น)
      ctx.fillStyle = st >= TR_MAXLV ? '#ff5aa0' : '#7a4ab0';
      roundRect(x + 6, y + 6, 34, 18, 6); ctx.fill();
      ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText('+' + st, x + 23, y + 19);
      if (st < TR_MAXLV) {
        const evCost = trLvCost(i, st);
        const shortC = evCost >= 1000 ? (evCost / 1000).toFixed(1) + 'k' : evCost;
        const canUp = G.bank >= evCost;
        // ปุ่มอัปเกรดเต็มแถบล่าง โชว์ราคาชัดเจน
        drawBtn(x + 8, y + chh - 26, cw - 16, 22, '↑ อัป +' + (st + 1) + ' · ' + shortC, () => {
          if (G.bank >= evCost) {
            G.bank -= evCost;
            G.trStar[i] = st + 1;
            SAVE.set('coins', G.bank); SAVE.set('trStar', G.trStar);
            AudioSys.buy();
            uiBurst(x + cw / 2, y + chh / 2, '#c9a2ff');
            const pc = Math.round((st + 1) * (100 / TR_MAXLV));
            floatText(W / 2, 100, '⬆ ' + t.name + ' +' + (st + 1) + '! (ผลรวม +' + pc + '%)', '#ffd24a', true);
          } else {
            AudioSys.deny();
            floatText(W / 2, 100, 'อัปเกรดต้องใช้ 🪙 ' + evCost.toLocaleString(), '#ff8888', true);
          }
        }, canUp ? { color: '#b06ae0', dark: '#8a4ac0', font: 10 } : { color: '#8a8178', dark: '#6e675f', font: 10 });
      } else {
        ctx.fillStyle = '#ff8ad0'; ctx.font = 'bold 11px Trebuchet MS'; ctx.textAlign = 'center';
        ctx.fillText('★ อัปเต็ม +9 MAX', x + cw / 2, y + chh - 10);
      }
    }
  });

  drawBtn(W / 2 - 90, 488, 180, 42, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- ร้านค้า ---------- */
function drawShop() {
  ctx.fillStyle = 'rgba(58,32,10,.44)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ร้านค้าอัปเกรด', W / 2, 62, 40);
  drawCoinChip(W - 20, 24, G.bank.toLocaleString());

  UPGS.forEach((u, i) => {
    const x = 110, y = 90 + i * 76, w = W - 220, h = 66;
    drawPanel(x, y, w, h, 16);
    // ไอคอน
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(u.icon, x + 42, y + h / 2 + 2);
    ctx.textBaseline = 'alphabetic';
    // ชื่อ + คำอธิบาย
    ctx.textAlign = 'left';
    ctx.font = 'bold 18px Trebuchet MS';
    ctx.fillStyle = '#fff';
    ctx.fillText(u.name, x + 80, y + 27);
    ctx.font = '13px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText(u.desc, x + 80, y + 48);
    // เลเวลพิป
    const lv = G.upg[u.id];
    for (let p = 0; p < u.max; p++) {
      ctx.fillStyle = p < lv ? '#ffd24a' : 'rgba(255,255,255,.18)';
      roundRect(x + 340 + p * 26, y + 25, 20, 16, 5); ctx.fill();
    }
    // ปุ่มซื้อ
    if (lv >= u.max) {
      drawBtn(x + w - 165, y + 12, 145, 42, 'MAX ✓', () => {}, { disabled: true });
    } else {
      const cost = upgCost(u, lv);
      const afford = G.bank >= cost;
      drawBtn(x + w - 165, y + 12, 145, 42, '🪙 ' + cost.toLocaleString(), () => tryUpgrade(u),
        afford ? { color: '#ffb02e', dark: '#e07b12', font: 17 } : { color: '#8a8178', dark: '#6e675f', font: 17 });
    }
  });

  /* ---------- ครัวคุกกี้: อบขนมจากวัตถุดิบที่เก็บระหว่างวิ่ง ---------- */
  drawPanel(174, 468, 478, 60, 14);
  ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd24a';
  ctx.fillText('🍳 ครัวคุกกี้', 190, 492);
  ctx.font = '11px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
  ctx.fillText('อบแล้ว ' + G.cooked, 190, 510);
  INGRS.forEach((ing, i) => {
    ctx.font = '15px Trebuchet MS'; ctx.textAlign = 'left';
    const has = G.ingr[i] || 0;
    ctx.globalAlpha = has >= 3 ? 1 : 0.6;
    ctx.fillText(ing.icon, 292 + i * 70, 498);
    ctx.globalAlpha = 1;
    ctx.font = 'bold 12px Trebuchet MS';
    ctx.fillStyle = has >= 3 ? '#7bd94a' : '#ffe9b8';
    ctx.fillText(Math.min(has, 99) + '/3', 314 + i * 70, 498);
    ctx.fillStyle = '#ffd24a';
  });
  const canCook = INGRS.every((_, i) => (G.ingr[i] || 0) >= 3);
  drawBtn(664, 478, 150, 42, '🔥 อบขนม!', () => {
    if (!canCook) { AudioSys.deny(); floatText(W / 2, 100, 'ต้องมีวัตถุดิบครบอย่างละ 3 ชิ้น (เก็บ 🌾🧂🧈🥛🍫 ระหว่างวิ่ง)', '#ff8888', true); return; }
    INGRS.forEach((_, i) => { G.ingr[i] -= 3; });
    G.cooked++; G.bank += 800; G.crystals += 2;
    SAVE.set('ingr', G.ingr); SAVE.set('cooked', G.cooked);
    SAVE.set('coins', G.bank); SAVE.set('crystals', G.crystals);
    AudioSys.buy();
    banner('🍪 อบขนมสำเร็จ! +800🪙 +2💎', '#ffd24a');
  }, canCook ? { color: '#e8b23c', dark: '#c08d1e', font: 15 } : { color: '#8a8178', dark: '#6e675f', font: 15 });

  drawBtn(20, 478, 140, 42, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448', font: 15 });
}

/* ---------- ตารางอันดับ ---------- */
function drawRank() {
  ctx.fillStyle = 'rgba(58,32,10,.44)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('ตารางอันดับ', W / 2, 46, 30);
  drawCoinChip(W - 20, 20, G.bank.toLocaleString());
  checkMedals();

  // ---- ป้ายลีก + ความคืบหน้าไปขั้นถัดไป ----
  const lt = leagueTier();
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  const nxt = LEAGUES[lt + 1];
  ctx.fillText('ลีก: ' + LEAGUES[lt].icon + ' ' + LEAGUES[lt].name +
    (nxt ? '  —  อีก ' + Math.max(0, nxt.min - G.best).toLocaleString() + ' แต้มถึงขั้น ' + nxt.icon : '  (สูงสุดแล้ว!)'), W / 2, 72);

  // ซ้าย: เครื่องนี้
  drawPanel(40, 82, 430, 330, 18);
  ctx.font = 'bold 18px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.fillText('📱 เครื่องนี้', 255, 104);
  if (G.board.length === 0) {
    ctx.font = '15px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ยังไม่มีสถิติ', 255, 250);
  } else {
    G.board.forEach((e, i) => {
      const y = 132 + i * 28;
      ctx.font = i < 3 ? 'bold 14px Trebuchet MS' : '13px Trebuchet MS';
      ctx.fillStyle = i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 62, y);
      ctx.fillText(CHARS[e.c] ? CHARS[e.c].name : '-', 105, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 385, y);
      ctx.fillText(e.d + 'm', 450, y);
    });
  }

  // ขวา: ออนไลน์
  drawPanel(490, 82, 430, 330, 18);
  ctx.font = 'bold 18px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7ee0ff';
  ctx.fillText('🌐 ทั่วโลก — ชื่อ: ' + (G.name || 'ยังไม่ตั้ง'), 705, 104);
  if (G.online === null) {
    ctx.font = '15px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('กำลังโหลด...', 705, 250);
  } else if (G.onlineErr || G.online.length === 0) {
    ctx.font = '14px Trebuchet MS'; ctx.fillStyle = 'rgba(255,233,184,.85)';
    if (G.onlineErr) {
      ctx.fillText('โหมดออนไลน์ยังไม่เปิดใช้งาน', 705, 226);
      ctx.fillText('(ต้องเล่นผ่านลิงก์เว็บ และเชื่อม Upstash Redis', 705, 252);
      ctx.fillText('ใน Vercel: Storage → Upstash → Connect)', 705, 274);
    } else {
      ctx.fillText('ยังไม่มีใครส่งคะแนน — เป็นคนแรกเลย!', 705, 250);
    }
  } else {
    G.online.slice(0, 10).forEach((e, i) => {
      const y = 132 + i * 28;
      ctx.font = i < 3 ? 'bold 14px Trebuchet MS' : '13px Trebuchet MS';
      ctx.fillStyle = e.n === G.name ? '#7bd94a' : i === 0 ? '#ffd24a' : i === 1 ? '#d8dee9' : i === 2 ? '#e8956a' : '#ffe9b8';
      ctx.textAlign = 'left';
      ctx.fillText((i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'), 512, y);
      ctx.fillText(e.n, 555, y);
      ctx.textAlign = 'right';
      ctx.fillText(e.s.toLocaleString(), 898, y);
    });
  }

  // ---- เหรียญตราความสำเร็จ (Trophy สะสมถาวร — เหรียญวาดเอง 2 แถว) ----
  ctx.font = 'bold 12.5px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('เหรียญตรา ' + G.medals.length + '/' + MEDALS.length + ':', 44, 412);
  MEDALS.forEach((m, i) => {
    const got = G.medals.includes(i);
    const col = i % 11, row = (i / 11) | 0;
    const mx = 176 + col * 70, my = 398 + row * 34;
    // เหรียญกลม: ทอง (ได้แล้ว) / เทา (ยังไม่ได้)
    ctx.globalAlpha = got ? 1 : 0.45;
    ctx.fillStyle = got ? '#e8a90c' : '#7a7268';
    ctx.beginPath(); ctx.arc(mx, my + 8, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = got ? '#ffd84a' : '#9a928a';
    ctx.beginPath(); ctx.arc(mx, my + 8, 8.6, 0, TAU); ctx.fill();
    // ดาวกลางเหรียญ
    ctx.fillStyle = got ? '#b8791e' : '#6a625a';
    ctx.beginPath();
    for (let q = 0; q < 10; q++) {
      const rr = q % 2 ? 2.4 : 5.4, a = -Math.PI / 2 + q * Math.PI / 5;
      ctx[q ? 'lineTo' : 'moveTo'](mx + Math.cos(a) * rr, my + 8 + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '8.5px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.fillStyle = got ? '#ffd24a' : 'rgba(255,233,184,.55)';
    let lbl = got ? m.name : m.need;
    if (lbl.length > 11) lbl = lbl.slice(0, 10) + '…';
    ctx.fillText(lbl, mx, my + 28);
  });
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffe9b8';

  drawBtn(W / 2 - 230, 476, 200, 44, '✏ ตั้งชื่อผู้เล่น', () => {
    const nm = prompt('ตั้งชื่อผู้เล่น (ไม่เกิน 12 ตัวอักษร)', G.name || '');
    if (nm) { G.name = nm.trim().slice(0, 12); SAVE.set('name', G.name); }
  }, { color: '#5cb8e8', dark: '#3d92c4', font: 17 });
  drawBtn(W / 2 + 30, 476, 200, 44, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
}

/* ---------- Continue ด้วยคริสตัล ---------- */
function drawContinue() {
  ctx.fillStyle = 'rgba(30,12,2,.7)';
  ctx.fillRect(0, 0, W, H);
  drawTitleText('เล่นต่อไหม?', W / 2, 150, 52);
  // วงนับถอยหลัง
  const frac = clamp(G.continueT / 6, 0, 1);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(W / 2, 262, 56, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#7ee0ff'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(W / 2, 262, 56, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  ctx.font = 'bold 46px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(G.continueT), W / 2, 278);
  ctx.font = 'bold 17px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('มีคริสตัล 💎 ' + G.crystals + ' — ใช้ 3 เม็ดเพื่อวิ่งต่อจากจุดเดิม', W / 2, 348);
  drawBtn(W / 2 - 230, 384, 220, 56, '💎3  เล่นต่อ!', doContinue, { color: '#5cb8e8', dark: '#3d92c4', font: 21 });
  drawBtn(W / 2 + 10, 384, 220, 56, 'พอแค่นี้', () => settleGameOver(), { color: '#a08468', dark: '#7d6448', font: 19 });
}

/* ---------- game over ---------- */
function drawGameOver() {
  const a = clamp(G.overT / 0.6, 0, 1);
  ctx.fillStyle = `rgba(30,12,2,${a * 0.72})`;
  ctx.fillRect(0, 0, W, H);
  if (a < 1) return;

  drawTitleText('พลังคุกกี้หมดแล้ว!', W / 2, 120, 52, '#ffb98a', '#ff7a4a');

  drawPanel(W / 2 - 240, 150, 480, 236, 20);
  const rows = [
    ['คะแนนรวม', Math.floor(G.score).toLocaleString()],
    ['ระยะทาง', Math.floor(G.dist).toLocaleString() + ' m'],
    ['เยลลี่ที่เก็บ', G.jellies.toLocaleString()],
    ['เหรียญที่ได้ (+โบนัส)', G.earned.toLocaleString() + ' เหรียญ'],
    ['ผงเวทมนตร์', '+' + (G.earnedPowder || 0)],
    G.runBoxes > 0
      ? ['กล่องปริศนา x' + G.runBoxes, '🎁 +' + (G.boxCoins || 0).toLocaleString() + '🪙' + (G.boxGems ? ' +' + G.boxGems + '💎' : '')]
      : G.mode === 'tower' ? ['ชั้นสูงสุดรอบนี้', '🧊 ชั้น ' + G.floorNow]
      : ['ด่านที่ไปถึง', 'ด่าน ' + G.stage],
  ];
  ctx.font = 'bold 21px Trebuchet MS';
  rows.forEach(([k, v], i) => {
    const y = 186 + i * 34;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe9b8'; ctx.fillText(k, W / 2 - 20, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(v, W / 2 + 20, y);
  });
  // ผลภารกิจ
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px Trebuchet MS';
  if (G.missionDone) {
    ctx.fillStyle = '#7bd94a';
    ctx.fillText('📜 ภารกิจสำเร็จ! รับ 🪙 ' + G.missionReward.toLocaleString() + ' +1💎', W / 2, 366);
  } else if (MISSIONS[G.missionIdx]) {
    ctx.fillStyle = 'rgba(255,233,184,.75)';
    ctx.fillText('📜 ภารกิจ: ' + MISSIONS[G.missionIdx].desc, W / 2, 366);
  }

  ctx.textAlign = 'center';
  if (G.newBest && Math.floor(G.time * 3) % 2 === 0) {
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('🎉 สถิติใหม่! 🎉', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🎉 สถิติใหม่! 🎉', W / 2, 424);
  } else if (G.rankPos >= 0 && G.rankPos < 3) {
    ctx.font = 'bold 24px Trebuchet MS';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
    ctx.fillStyle = '#ffd24a';
    ctx.fillText(['🥇','🥈','🥉'][G.rankPos] + ' ติดอันดับ ' + (G.rankPos + 1) + ' ของเครื่องนี้!', W / 2, 424);
  } else {
    ctx.font = 'bold 20px Trebuchet MS';
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('🏆 สถิติสูงสุด: ' + G.best.toLocaleString(), W / 2, 424);
  }

  if (G.overT > 0.9) {
    drawBtn(W / 2 - 230, 448, 220, 54, '▶ เล่นอีกครั้ง', () => startGame(G.mode), { color: '#ffb02e', dark: '#e07b12' });
    drawBtn(W / 2 + 10, 448, 220, 54, '🏠 เมนูหลัก', () => setState('menu'), { color: '#a08468', dark: '#7d6448' });
  }
}

/* ---------- หน้าแผนที่ผจญภัย: เลือกด่าน + ดาวที่เก็บได้ ---------- */
function drawAdvMap() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3a2416'); g.addColorStop(1, '#20140a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawTitleText('🗺️ โหมดผจญภัย', W / 2, 54, 32);
  const sb = G.starBest || [0,0,0,0,0];
  for (let i = 0; i < LEVELS.length; i++) {
    const col = i % 3, row = (i / 3) | 0;
    const x = W / 2 + (col - 1) * 240 - (row === 1 ? 120 : 0), y = 150 + row * 170;
    const unlocked = i === 0 || epUnlocked(i);
    const cx = x, cy = y;
    // การ์ดด่าน
    drawBtn(cx - 100, cy - 52, 200, 118, '', () => {
      if (unlocked) { G.episode = i; SAVE.set('ep', i); startGame('story'); }
      else floatText(W / 2, 100, 'ปลดล็อกที่ ' + EPISODES[i].unlock + 'm (โหมดอิสระ)', '#ff8888', true);
    }, { color: unlocked ? '#5a4230' : '#3a3028', dark: unlocked ? '#3a2a1c' : '#282018', radius: 14 });
    ctx.textAlign = 'center';
    ctx.font = '30px serif';
    ctx.fillText(EPISODES[i].icon, cx, cy - 16);
    ctx.font = 'bold 16px Trebuchet MS'; ctx.fillStyle = unlocked ? '#ffe9b8' : 'rgba(200,180,150,.5)';
    ctx.fillText('ด่าน ' + (i + 1), cx, cy + 8);
    ctx.font = 'bold 13px Trebuchet MS'; ctx.fillStyle = unlocked ? '#e0c8a0' : 'rgba(180,160,130,.5)';
    ctx.fillText(EPISODES[i].name, cx, cy + 28);
    // ดาว 3 ดวง
    for (let q = 0; q < 3; q++) {
      const got = (sb[i] || 0) > q;
      ctx.save(); ctx.translate(cx + (q - 1) * 26, cy + 50); ctx.scale(0.42, 0.42);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 17 : 42;
        ctx[k ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath();
      ctx.fillStyle = got ? '#ffd24a' : 'rgba(120,100,70,.5)'; ctx.fill();
      ctx.restore();
    }
    if (!unlocked) { ctx.font = '22px serif'; ctx.fillText('🔒', cx, cy - 40); }
  }
  drawBtn(W / 2 - 90, 486, 180, 44, '← กลับเมนู', () => setState('menu'), { color: '#8494a4', dark: '#63707c', font: 15 });
}

/* ---------- หน้าจอผ่านด่าน (ผจญภัย) + ดาว 3 ดวง ---------- */
function drawLevelClear() {
  ctx.fillStyle = 'rgba(20,10,4,.72)';
  ctx.fillRect(0, 0, W, H);
  const lv = LV();
  // ป้ายหัว
  ctx.font = 'bold 44px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.9)';
  ctx.strokeText('🎉 ผ่านด่าน! 🎉', W / 2, 108);
  ctx.fillStyle = '#ffe066'; ctx.fillText('🎉 ผ่านด่าน! 🎉', W / 2, 108);
  ctx.font = 'bold 20px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
  ctx.fillText('ด่าน ' + (G.episode + 1) + ': ' + EP().name, W / 2, 140);

  // ดาว 3 ดวง (เด้งเข้าทีละดวง)
  const cond = [
    { on: true, label: 'ถึงเส้นชัย' },
    { on: G.jellies >= lv.jelly, label: 'เก็บเยลลี่ ' + G.jellies + '/' + lv.jelly },
    { on: G.runHit <= lv.maxHit, label: 'โดนชน ' + G.runHit + ' (≤' + lv.maxHit + ')' },
  ];
  for (let i = 0; i < 3; i++) {
    const appearT = 0.4 + i * 0.35;
    const sc = G.clearT < appearT ? 0 : Math.min(1, 1.4 - Math.abs(1 - (G.clearT - appearT) * 3.5));
    const cx = W / 2 + (i - 1) * 108, cy = 214;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc || 0.001, sc || 0.001);
    const got = cond[i].on;
    // ดาว
    ctx.beginPath();
    for (let q = 0; q < 10; q++) {
      const a = -Math.PI / 2 + q * Math.PI / 5, r = q % 2 ? 17 : 42;
      ctx[q ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = got ? '#ffd24a' : 'rgba(120,100,70,.55)';
    ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = got ? '#c8951e' : 'rgba(80,64,40,.6)'; ctx.stroke();
    if (got && sc > 0.9) { ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(-12, -14, 5, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (sc > 0.5) {
      ctx.font = 'bold 14px Trebuchet MS'; ctx.fillStyle = got ? '#ffe9b8' : 'rgba(200,180,150,.7)';
      ctx.fillText(cond[i].label, cx, cy + 62);
    }
  }

  // รางวัล
  ctx.font = 'bold 22px Trebuchet MS'; ctx.fillStyle = '#ffd24a';
  {
    const rw = [['+' + (G.earned || 0).toLocaleString(), 'coin'], ['+' + G.stars, 'gem']];
    if (G.earnedPowder) rw.push(['+' + G.earnedPowder, 'sparkle']);
    let totW = 0;
    for (const [txt] of rw) totW += ctx.measureText(txt).width + 46;
    let rx = W / 2 - totW / 2;
    for (const [txt, ic] of rw) {
      drawIcon(ic, rx + 12, 324, 22);
      ctx.textAlign = 'left';
      ctx.fillText(txt, rx + 26, 330);
      rx += ctx.measureText(txt).width + 46;
    }
    ctx.textAlign = 'center';
  }
  if ((G.starBest[G.episode] || 0) >= 3) {
    ctx.font = 'bold 16px Trebuchet MS'; ctx.fillStyle = '#7bff9b';
    ctx.fillText('⭐ เก็บครบ 3 ดาวแล้ว!', W / 2, 358);
  }

  const hasNext = G.episode < LEVELS.length - 1;
  drawBtn(W / 2 - 232, 400, 148, 52, '🔁 เล่นซ้ำ', () => startGame('story'), { color: '#a08468', dark: '#7d6448', font: 15 });
  drawBtn(W / 2 - 74, 400, 148, 52, '🏠 เมนู', () => setState('menu'), { color: '#8494a4', dark: '#63707c', font: 15 });
  if (hasNext) {
    const nextUnlocked = epUnlocked(G.episode + 1);
    drawBtn(W / 2 + 84, 400, 148, 52, nextUnlocked ? '▶ ด่านต่อไป' : '🔒 ล็อก', () => {
      if (nextUnlocked) { G.episode++; SAVE.set('ep', G.episode); startGame('story'); }
      else floatText(W / 2, 130, 'วิ่งให้ถึง ' + EPISODES[G.episode + 1].unlock + 'm ในโหมดอิสระก่อน!', '#ff8888', true);
    }, { color: nextUnlocked ? '#ffb02e' : '#8a7a5a', dark: nextUnlocked ? '#e07b12' : '#6a5c40', font: 15 });
  }
}

/* ---------- shape helpers ---------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s, y - s * 0.5, x, y + s * 0.35);
  ctx.closePath();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(G.paused && G.state === 'play' ? 0 : dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
