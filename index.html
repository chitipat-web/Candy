}
function drawLollipop(x, groundY, s, alt) {
  ctx.save();
  ctx.translate(x, groundY); ctx.scale(s, s);
  ctx.fillStyle = '#f7e6c9';
  ctx.fillRect(-5, -120, 10, 120);
  const r = 34;
  ctx.beginPath(); ctx.arc(0, -140, r, 0, TAU);
  ctx.fillStyle = alt ? '#ff6b8d' : '#7ecbff'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 6;
  ctx.beginPath();
  for (let a = 0; a < TAU * 2.4; a += 0.15) {
    const rr = a / (TAU * 2.4) * (r - 6);
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr - 140;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}

function drawGroundAndPits() {
  const gc = G.mode === 'normal' ? EP().ground : ['#c98d4e', '#a96f37', '#7a4a20'];
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, gc[0]);
  g.addColorStop(0.15, gc[1]);
  g.addColorStop(1, gc[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  // ขอบไอซิ่ง + ครีมหยด (ซ่อนตอนอยู่ในเตาอบ)
  if (ovenAmt < 0.95) {
  ctx.fillStyle = '#f2d8a7';
  const off = -(worldX % 64);
  for (let x = off - 64; x < W + 64; x += 64) {
    ctx.beginPath();
    ctx.arc(x + 32, GROUND_Y + 3, 10, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillRect(0, GROUND_Y, W, 6);
  const offD = -(worldX % 192);
  for (let x = offD - 192; x < W + 192; x += 192) {
    ctx.beginPath();
    ctx.moveTo(x + 20, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 26, GROUND_Y + 22, x + 20, GROUND_Y + 24);
    ctx.quadraticCurveTo(x + 14, GROUND_Y + 22, x + 20, GROUND_Y + 5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 120, GROUND_Y + 5);
    ctx.quadraticCurveTo(x + 127, GROUND_Y + 17, x + 120, GROUND_Y + 19);
    ctx.quadraticCurveTo(x + 113, GROUND_Y + 17, x + 120, GROUND_Y + 5);
    ctx.fill();
  }
  // เม็ดน้ำตาลหลากสีโรยบนไอซิ่ง
  const offS = -(worldX % 96);
  const sprCols = ['#ff6b8d', '#7ecbff', '#7bd94a', '#ffd24a', '#c592ff'];
  for (let x = offS - 96, i = 0; x < W + 96; x += 32, i++) {
    const wx = Math.round((x + worldX) / 32);
    ctx.save();
    ctx.translate(x + 16, GROUND_Y + 1 + (wx % 3));
    ctx.rotate((wx * 1.7) % TAU);
    ctx.fillStyle = sprCols[((wx % 5) + 5) % 5];
    roundRect(-4, -1.6, 8, 3.2, 1.6); ctx.fill();
    ctx.restore();
  }
  }  // จบส่วนไอซิ่ง/เม็ดน้ำตาล

  ctx.fillStyle = 'rgba(90,50,20,.55)';
  const off2 = -(worldX % 160);
  for (let x = off2 - 160; x < W + 160; x += 160) {
    ctx.beginPath(); ctx.arc(x + 40, GROUND_Y + 42, 7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 110, GROUND_Y + 70, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 75, GROUND_Y + 95, 6, 0, TAU); ctx.fill();
  }

  /* --- ในเตาอบ: พื้นตะแกรงเหล็ก + ไฟลุกข้างล่าง (แบบเกมจริง) --- */
  if (ovenAmt > 0.01) {
    ctx.save();
    ctx.globalAlpha = ovenAmt;
    // แสงไฟใต้ตะแกรง
    const fgr = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    fgr.addColorStop(0, '#2a0a04');
    fgr.addColorStop(0.4, '#77220a');
    fgr.addColorStop(1, '#e8641e');
    ctx.fillStyle = fgr;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    // เปลวไฟลุกวูบวาบ
    for (let x = -20; x < W + 40; x += 46) {
      const ph = Math.sin(G.time * 9 + x * 0.7) * 0.5 + 0.5;
      const fh = 30 + ph * 34;
      const fx = x + Math.sin(G.time * 5 + x) * 5;
      ctx.fillStyle = 'rgba(255,110,25,.8)';
      ctx.beginPath();
      ctx.moveTo(fx - 17, H);
      ctx.quadraticCurveTo(fx - 15, H - fh * 0.6, fx, H - fh - 20);
      ctx.quadraticCurveTo(fx + 15, H - fh * 0.6, fx + 17, H);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,210,74,.85)';
      ctx.beginPath();
      ctx.moveTo(fx - 8, H);
      ctx.quadraticCurveTo(fx - 7, H - fh * 0.4, fx, H - fh * 0.72 - 10);
      ctx.quadraticCurveTo(fx + 7, H - fh * 0.4, fx + 8, H);
      ctx.fill();
    }
    // รางตะแกรงบน
    ctx.fillStyle = '#3a3a46';
    ctx.fillRect(0, GROUND_Y, W, 13);
    ctx.fillStyle = '#5c5c6c';
    ctx.fillRect(0, GROUND_Y, W, 4.5);
    ctx.fillStyle = '#1e1e26';
    ctx.fillRect(0, GROUND_Y + 13, W, 3);
    // ซี่ตะแกรงแนวตั้ง (มองเห็นไฟลอดช่อง)
    const goff = -(worldX % 76);
    for (let x = goff - 76; x < W + 76; x += 76) {
      ctx.fillStyle = '#31313c';
      ctx.fillRect(x, GROUND_Y + 14, 22, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fillRect(x + 2.5, GROUND_Y + 14, 4.5, H - GROUND_Y - 14);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(x + 17, GROUND_Y + 14, 5, H - GROUND_Y - 14);
    }
    ctx.restore();
  }

  for (const p of pits) {
    const px = p.x - worldX;
    if (px > W || px + p.w < 0) continue;
    ctx.fillStyle = '#1d1006';
    ctx.fillRect(px, GROUND_Y, p.w, H - GROUND_Y);
    const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 60);
    gg.addColorStop(0, 'rgba(0,0,0,.65)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(px, GROUND_Y, p.w, 60);
    ctx.fillStyle = '#8a5a28';
    ctx.fillRect(px - 4, GROUND_Y, 6, 18);
    ctx.fillRect(px + p.w - 2, GROUND_Y, 6, 18);
  }
}

function drawPlatforms() {

    fy = 2; fx2 = 0;
  } else if (S === 'globe') {
    ctx.fillStyle = C2;
    roundRect(-11, 6, 22, 7, 3); ctx.fill();
    ctx.fillStyle = C1; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(0, -2, 11, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    for (const [x, y] of [[-4, -6], [3, -1], [-1, 3], [5, -7]])
      { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, TAU); ctx.fill(); }
    line(1.8, '#dff2ff');
    ctx.beginPath(); ctx.arc(0, -2, 11, 0, TAU); ctx.stroke();
    face = false;
  } else if (S === 'candy') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = C2;
    for (const sgn of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sgn * 9, -3); ctx.lineTo(sgn * 17, -7); ctx.lineTo(sgn * 17, 7); ctx.lineTo(sgn * 9, 3);
      ctx.closePath(); ctx.fill();
    }
    line(2, 'rgba(255,255,255,.6)');
    ctx.beginPath(); ctx.arc(0, 0, 6, 0.6, 2.4); ctx.stroke();
  } else if (S === 'bird') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    if (ex === 2) { line(4, C1);
      ctx.beginPath(); ctx.moveTo(-8, -8); ctx.quadraticCurveTo(-14, -18, -6, -20) ; ctx.stroke(); }
    ctx.fillStyle = '#ff9d2e';
    ctx.beginPath(); ctx.moveTo(11, -2); ctx.lineTo(18, 1); ctx.lineTo(11, 4); ctx.closePath(); ctx.fill();
    if (ex === 1) { ctx.fillStyle = '#f2e060';
      ctx.beginPath(); ctx.moveTo(-2, -10); ctx.lineTo(0, -19); ctx.lineTo(3, -10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C2;
      ctx.beginPath(); ctx.arc(0, -2, 4.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -2, 4.6, 0, TAU); ctx.fill(); }
    ctx.fillStyle = C2; ctx.globalAlpha = 0.7;
    ctx.save(); ctx.rotate(0.3 + flap * 0.5);
    ctx.beginPath(); ctx.ellipse(-7, 5, 8, 4.4, 0, 0, TAU); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  } else if (S === 'fish') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.ellipse(1, 0, 11, 8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-17, -7); ctx.lineTo(-17, 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.moveTo(2, -7); ctx.quadraticCurveTo(5, -14, 1, -16); ctx.stroke();
    line(2, C2);
    ctx.beginPath(); ctx.moveTo(2, -8); ctx.quadraticCurveTo(6, -13, 2, -17); ctx.stroke();
    fy = 0;
  } else if (S === 'ring') {
    line(6, C1);
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.stroke();
    line(2, C2);
    ctx.beginPath(); ctx.arc(0, 0, 11, 0.5, 1.6); ctx.stroke();
    face = false;
  } else if (S === 'boat') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(-15, -2); ctx.lineTo(15, -2); ctx.lineTo(9, 9); ctx.lineTo(-9, 9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, -17); ctx.lineTo(10, -6); ctx.closePath(); ctx.fill();
    fy = 3; fx2 = -4;
  } else if (S === 'robot') {
    ctx.fillStyle = C1;
    roundRect(-11, -11, 22, 20, 5); ctx.fill();
    ctx.fillStyle = C2;
    roundRect(-7, -6, 14, 8, 3); ctx.fill();
    line(2.4, C1);
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, -16); ctx.stroke();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.arc(0, -17, 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.arc(-3, -2, 1.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -2, 1.8, 0, TAU); ctx.fill();
    face = false;
  } else if (S === 'watch') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    line(2, C3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, 2); ctx.stroke();
    ctx.fillStyle = C1;
    roundRect(-3, -16, 6, 5, 2); ctx.fill();
    face = false;
  } else if (S === 'egg') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 13.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = C2;
    for (const [x, y, r] of [[-4, -5, 2.6], [5, 1, 3], [-2, 7, 2.2]])
      { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    fy = -1;
  } else if (S === 'bulb') {
    for (const dx of [-8, 8]) {
      ctx.fillStyle = dx < 0 ? C1 : C2;
      ctx.beginPath(); ctx.arc(dx, -3, 7.5, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a97a8';
      roundRect(dx - 3.4, 4, 6.8, 5, 2); ctx.fill();
    }
    face = false;
  } else if (S === 'disc') {
    ctx.fillStyle = C1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(0, 4 - i * 4, 14 - i * 1.2, 5.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = i === 1 ? C2 : C1;
    }
    ctx.fillStyle = '#e8a03a';
    ctx.beginPath(); ctx.ellipse(0, -5, 6, 2.6, 0, 0, TAU); ctx.fill();
    fy = -8; fx2 = 0;
  } else if (S === 'drum') {
    ctx.fillStyle = C1;
    roundRect(-11, -8, 22, 18, 4); ctx.fill();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.ellipse(0, -8, 11, 4.4, 0, 0, TAU); ctx.fill();
    line(2, C2);
    ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-4, 6); ctx.moveTo(-4, -1); ctx.lineTo(4, 6); ctx.moveTo(4, -1); ctx.lineTo(11, -2 + 8); ctx.stroke();
    fy = 3; fx2 = 0; face = false;
  } else if (S === 'castanet') {
    for (const [dy, open] of [[-6, -0.35 - Math.abs(flap) * 0.3], [5, 0]]) {
      ctx.save(); ctx.translate(0, dy); ctx.rotate(open);
      ctx.fillStyle = C1;
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.arc(9, -8, 2.4, 0, TAU); ctx.fill();
    fy = 6; fx2 = -2;
  } else if (S === 'megaphone') {
    ctx.save(); ctx.rotate(-0.2);
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(10, -12); ctx.lineTo(10, 12); ctx.lineTo(-10, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C2;
    roundRect(-15, -5, 6, 10, 2.5); ctx.fill();
    ctx.restore();
    face = false;
  } else if (S === 'locket') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(0, 12);
    ctx.quadraticCurveTo(-14, 2, -9, -6);
    ctx.quadraticCurveTo(-4, -12, 0, -5);
    ctx.quadraticCurveTo(4, -12, 9, -6);
    ctx.quadraticCurveTo(14, 2, 0, 12);
    ctx.fill();
    line(2.2, C1);
    ctx.beginPath(); ctx.arc(0, -12, 5, Math.PI * 0.2, Math.PI * 0.8, true); ctx.stroke();
    ctx.fillStyle = C2;
    ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, TAU); ctx.fill();
    face = false;
  } else if (S === 'bomb') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 2, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = C1;
    roundRect(-4, -14, 8, 5, 2); ctx.fill();
    line(2.4, C2);
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.quadraticCurveTo(6, -18, 8, -15); ctx.stroke();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(9, -15, 2.6 + Math.abs(flap), 0, TAU); ctx.fill();
    fy = 2;
  } else if (S === 'tail') {
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.moveTo(-12, 10);
    ctx.quadraticCurveTo(-4, -2, 2, -8);
    ctx.quadraticCurveTo(8, -13, 13, -10);
    ctx.quadraticCurveTo(10, -4, 2, 2);
    ctx.quadraticCurveTo(-4, 8, -12, 10);
    ctx.fill();
    ctx.fillStyle = C2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(-10 + i * 7, 9 - i * 5);
      ctx.lineTo(-5 + i * 7, 13 - i * 5); ctx.lineTo(-3 + i * 7, 6 - i * 5);
      ctx.closePath(); ctx.fill();
    }
    face = false;
  } else {
    /* สำรอง: ก้อนกลมยิ้ม */
    ctx.fillStyle = C1;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
  }
  if (face) {
    ctx.fillStyle = C3;
    ctx.beginPath(); ctx.arc(fx2 - 3, fy - 2, 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(fx2 + 5, fy - 2, 2, 0, TAU); ctx.fill();
    ctx.strokeStyle = C3; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(fx2 + 1, fy + 1, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
  AUTOL = false;
  finishSprite(dk(p.c1 || '#ffd24a', 0.42));
  if (useCache) {
    petCCtx.clearRect(0, 0, petCC.width, petCC.height);
    petCCtx.drawImage(olOut, 0, 0);
    petCCid = p.id; petCCt = nowS;
  }
  }
  ctx = mainCtx;
  ctx.save();
  if (!pet) ctx.translate(Pet.x, Pet.y);
  ctx.drawImage(useCache ? petCC : olOut, -C_OX, -100, 200, 205);
  ctx.restore();
}

function drawJellies() {
  for (const j of jellyList) {
    const x = j.x - worldX;
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(G.time * 4 + j.t) * 4;
    const y = j.y + bob;
    ctx.save();
    ctx.translate(x, y);
    switch (j.type) {
      case 'bar': {
        // แสงเรืองนุ่ม ๆ ด้านหลัง
        ctx.fillStyle = 'rgba(255,220,90,.16)';
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        const w = 26, h = 13;
        ctx.fillStyle = '#e8a90c';
        roundRect(-w/2, -h/2, w, h, 6); ctx.fill();
        ctx.fillStyle = '#ffce2e';
        roundRect(-w/2, -h/2, w, h - 3.5, 6); ctx.fill();
        ctx.fillStyle = '#ffe883';
        roundRect(-w/2 + 1.5, -h/2 + 1.5, w - 3, 4.5, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        roundRect(-w/2+3, -h/2+2, w-16, 3.4, 2); ctx.fill();
        break;
      }
      case 'pink': {
        ctx.fillStyle = 'rgba(255,123,172,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e0568c';
        heart(0, 1.8, 15); ctx.fill();
        ctx.fillStyle = '#ff7bac';
        heart(0, 0, 15); ctx.fill();
        ctx.fillStyle = '#ffa8ca';
        heart(-1, -2, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(-5, -6, 3.2, 0, TAU); ctx.fill();
        break;
      }
      case 'coin': {
        ctx.fillStyle = 'rgba(255,216,74,.2)';
        ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
        ctx.fillStyle = '#b8830a';
        ctx.beginPath(); ctx.arc(0, 1.6, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ffd84a';
        ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.ellipse(-3.4, -4.2, 4.2, 2.4, -0.6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e8a90c';
        ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('C', 0, 1);
        break;
      }
      case 'bear': {
        if (j.v === 'b') { ctx.scale(1.5, 1.5); drawBearJelly('#ffab2e'); }
        else drawBearJelly(j.v === 'p' ? '#ff8fc0' : '#ffab2e');
        break;
      }
      case 'potion': {
        ctx.fillStyle = '#e94f4f';
        ctx.beginPath(); ctx.arc(0, 3, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f9f4ea';
        ctx.fillRect(-5, -16, 10, 8);
        ctx.fillStyle = '#c9c2b4';
        ctx.fillRect(-6, -18, 12, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, 0, 12, 5); ctx.fillRect(-2.5, -3.5, 5, 12);
        itemBubble('#7bff9b');
        break;
      }
      case 'giant': {
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
        ctx.fillStyle = '#ff9d2e';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('G', 0, 1);
        itemBubble('#ffd24a');
        break;
      }
      case 'magnet': {
        ctx.strokeStyle = '#e0453a'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(0, -2, 10, Math.PI, 0, false); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-10, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(10, 8); ctx.stroke();
        ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-10, 12); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(10, 12); ctx.stroke();
        itemBubble('#7ecbff');
        break;
      }
      case 'letter': {
        // ลูกกวาดอักษร BONUSTIME
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.15);
        ctx.fillStyle = 'rgba(255,157,214,.25)';
        ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
        ctx.fillStyle = '#e5579a';
        roundRect(-13, -13, 26, 26, 8); ctx.fill();
        ctx.fillStyle = '#ff8fc0';
        roundRect(-13, -13, 26, 21, 8); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        roundRect(-10, -10, 20, 7, 4); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 17px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(j.ch, 0, 1.5);
        ctx.textBaseline = 'alphabetic';
        break;
      }
      case 'ingr': {
        // ถุงวัตถุดิบอบขนม
        ctx.rotate(Math.sin(G.time * 2.6 + j.t) * 0.12);
        ctx.fillStyle = 'rgba(255,233,184,.25)';
        ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
        ctx.fillStyle = INGRS[j.kind].c;
        roundRect(-12, -12, 24, 24, 9); ctx.fill();
        ctx.strokeStyle = 'rgba(90,52,19,.55)'; ctx.lineWidth = 2.4;
        roundRect(-12, -12, 24, 24, 9); ctx.stroke();
        ctx.font = '15px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(INGRS[j.kind].icon, 0, 1);
        ctx.textBaseline = 'alphabetic';
        break;
      }
      case 'confetti': {
        ctx.rotate(G.time * 4 + j.t);
        ctx.fillStyle = `hsl(${(j.t * 120) % 360},90%,65%)`;
        roundRect(-7, -4.5, 14, 9, 3.5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        roundRect(-5, -3, 6, 3, 1.5); ctx.fill();
        break;
      }
      case 'blast': {
        // เยลลี่จรวดพุ่ง
        ctx.rotate(-0.5);
        ctx.fillStyle = '#ff9d2e';
        roundRect(-6, -14, 12, 24, 6); ctx.fill();
        ctx.fillStyle = '#e0453a';
        ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(0, -22); ctx.lineTo(6, -12); ctx.fill();
        ctx.fillStyle = '#ffd24a';
        ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(0, 20 + Math.sin(G.time * 14) * 3); ctx.lineTo(5, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(0, -6, 3.4, 0, TAU); ctx.fill();
        ctx.rotate(0.5);
        itemBubble('#ff9d2e');
        break;
      }
      case 'box': {
        // กล่องปริศนา
        ctx.rotate(Math.sin(G.time * 2.5 + j.t) * 0.1);
        ctx.fillStyle = '#8a5a28';
        roundRect(-14, -11, 28, 24, 5); ctx.fill();
        ctx.fillStyle = '#a97b45';
        roundRect(-14, -11, 28, 9, 5); ctx.fill();
        ctx.fillStyle = '#e8b23c';
        ctx.fillRect(-3, -11, 6, 24);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', 0, 3);
        ctx.textBaseline = 'alphabetic';
        itemBubble('#e8b23c');
        break;
      }
      case 'star': {
        ctx.rotate(Math.sin(G.time * 3 + j.t) * 0.25);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? 16 : 7;
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.beginPath(); ctx.arc(-3, -4, 3, 0, TAU); ctx.fill();
        itemBubble('#ffe066');
        break;
      }
    }
    ctx.restore();
  }
}
/* ฟองแก้วครอบไอเทม (แบบเกมจริง) */
function itemBubble(c) {
  const bobA = Math.sin(G.time * 5) * 0.06;
  ctx.fillStyle = 'rgba(215,238,255,.14)';
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 27, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 21, Math.PI * (1.12 + bobA), Math.PI * (1.42 + bobA)); ctx.stroke();
  ctx.strokeStyle = c; ctx.globalAlpha = 0.35 + Math.sin(G.time * 6) * 0.2;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function glowRing(c) {
  ctx.strokeStyle = c; ctx.globalAlpha = 0.5 + Math.sin(G.time * 6) * 0.3;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(G.time * 6) * 3, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawBearJelly(c) {
  c = c || '#ffab2e';
  const hl = 'rgba(255,255,255,.55)';
  ctx.fillStyle = ballGrad(0, -4, 30, c);
  ctx.beginPath(); ctx.arc(-13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(13, -18, 8, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.fill();
  roundRect(-14, 2, 28, 22, 10); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 24, 6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 24, 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = shade(c, -48); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -8, 17, 0, TAU); ctx.stroke();
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.arc(-6, -13, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a4a10';
  ctx.beginPath(); ctx.arc(-6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(6, -8, 2.2, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(0, -4, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  glowRing(c);
}

/* ---------- obstacles ---------- */
function drawObstacles() {
  for (const o of obstacles) {
    const x = o.x - worldX;
    if (x < -140 || x > W + 60) continue;
    ctx.save();
    ctx.translate(x, GROUND_Y);
    if (o.type === 'spike') {
      for (let i = 0; i < 3; i++) {
        const bx = i * 16 - 2;
        ctx.fillStyle = i % 2 ? '#ff5f7e' : '#ff8fa8';
        ctx.beginPath();
        ctx.moveTo(bx, 0); ctx.lineTo(bx + 8, -46 - (i===1?8:0)); ctx.lineTo(bx + 16, 0);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.moveTo(bx + 3, -6); ctx.lineTo(bx + 7, -32); ctx.lineTo(bx + 9, -6);
        ctx.fill();
      }
    } else if (o.type === 'rock') {

}

/* ---------- player ---------- */
function drawPlayer() {
  if (P.fallingPit && P.y > H) return;
  const scale = P.giantT > 0 ? 1.6 : 1;
  const blink = P.invT > 0 && Math.floor(G.time * 14) % 2 === 0;
  if (blink) return;

  ctx.save();
  const ph = (P.sliding ? P.h * 0.52 : P.h) * scale;
  ctx.translate(P.x + P.w * scale / 2, P.y + ph);

  if (!P.fallingPit) {
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const shY = GROUND_Y - (P.y + ph);
    ctx.beginPath();
    ctx.ellipse(0, shY + 6, 30 * scale * (1 - clamp(shY/300,0,0.5)), 8 * scale, 0, 0, TAU);
    ctx.fill();
  }

  ctx.scale(scale, scale);
  // squash & stretch (จุดหมุนอยู่ที่เท้า)
  if (Math.abs(P.squash) > 0.01 && !P.sliding)
    ctx.scale(1 + P.squash * 0.45, 1 - P.squash * 0.4);
  if (P.giantT > 0 && P.giantT < 1.2 && Math.floor(G.time * 10) % 2 === 0)
    ctx.globalAlpha = 0.6;

  if (P.boostT > 0 || G.bonusT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.4 + Math.sin(G.time * 12) * 0.15;
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.ellipse(-6, -P.h / 2, 46, 52, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,180,60,.65)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const yy = -14 - i * 16, ln = 30 + ((P.anim * 9 + i * 3) % 4) * 10;
      ctx.beginPath(); ctx.moveTo(-32, yy); ctx.lineTo(-32 - ln, yy); ctx.stroke();
    }
  }

  if (G.bonusT > 0 && !P.dead)
    ctx.rotate(clamp(P.vy * 0.0007, -0.32, 0.32));   // เอียงหัวตามทิศบิน

  const run = P.anim;
  if (P.dead) {
    // ล้มคว่ำหมุนตัวตอนพลังหมด (แบบเกมจริง)
    const t = clamp(G.overT * 1.5, 0, 1);
    ctx.translate(0, -Math.sin(Math.min(t, 1) * Math.PI) * 26);
    ctx.rotate(Math.min(t * 2.4, Math.PI / 2));
    cookieBody(0, 0.8, -0.5, 3.3, 2.3, 0);
  } else {
    if (P.stumbleT > 0)
      ctx.rotate(Math.sin(G.time * 36) * 0.14 * (P.stumbleT / 0.5));
    if (P.sliding) drawCookieSlide(run);
    else if (!P.onGround) drawCookieJump(P.jumps >= 2);
    else drawCookieRun(run);
  }

  if (P.magnetT > 0) {
    ctx.strokeStyle = 'rgba(126,203,255,.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -G.time * 60;
    ctx.beginPath(); ctx.arc(0, -P.h/2, 66, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ============================================================
   ตัวละครแบบภาพวาด 2D — เฉดแสงเงา พื้นผิว เครื่องแต่งกาย
   (จุดกำเนิด = กึ่งกลางเท้า) — ch = ตัวละคร
   ============================================================ */
function ballGrad(x, y, r, c) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.12, x, y, r);
  g.addColorStop(0, shade(c, 40));
  g.addColorStop(0.55, c);
  g.addColorStop(1, shade(c, -26));
  return g;
}

const LASH_IDS = ['bright', 'princess', 'skatingq', 'cheer', 'kumiho', 'blackberry', 'pinkchoco',

function decosOf(ch) {
  if (!ch.deco) return null;

}
/* วาด deco ตามเฟส: back(หลังตัว) body(บนตัว) hair/head/face(ในเฮดบล็อก) held(ของถือ) */

/* ผม + หมวก + หน้า วาดในพิกัดหัว (เรียกภายใน head block) */
function runHeadDecos(ch, RIM, EYE) {

  const line = (w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; };

      ctx.beginPath(); ctx.moveTo(8, -20); ctx.quadraticCurveTo(8, -30, 6, -32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -34); ctx.stroke();
      ctx.restore();
    } else if (p === 'lollipop') {

      line(3.4, '#f7e6c9');
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -8); ctx.stroke();
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -15, 8.5, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      for (let aa = 0; aa < TAU * 2; aa += 0.3) {
        const rr = aa / (TAU * 2) * 6;
        const px = Math.cos(aa) * rr, py = -15 + Math.sin(aa) * rr;

      ctx.restore();

        ctx.beginPath(); ctx.arc(x, y, 3.4, 0, TAU); ctx.fill();

}

function cookieBody(bodyTilt, legA, legB, armA, armB, headBob, ch, joints) {
  ch = ch || CH();
  joints = joints || {};
  const kA = joints.kA !== undefined ? joints.kA : 0.14;
  const kB = joints.kB !== undefined ? joints.kB : 0.14;
  const eA = joints.eA !== undefined ? joints.eA : 0.5;
  const eB = joints.eB !== undefined ? joints.eB : 0.5;
  const B = ch.body, ICING = ch.icing;
  const RIM = shade(B, -80);
  const EYE = ch.eye || '#2b8fd6';
  /* สีชุดสำหรับแขน-ขา: ดึงจากชุดที่ใส่ → ใส่เสื้อผ้าจริงทั้งตัวทุกท่า (แบบสไปรต์ทางการ) */
  const ds0 = decosOf(ch) || [];
  const pickC = (...names) => { for (const n of names) { const f = ds0.find(q => q.p === n); if (f) return f.c; } return null; };
  const SLV = pickC('sleeves', 'suit', 'robe', 'armor', 'dress');
  const LEGC = pickC('pants', 'suit', 'robe', 'overalls');
  const SHOEST = ds0.find(q => q.p === 'bootfeet' || q.p === 'sneakfeet' || q.p === 'flamefeet') || null;
  const SHOE = pickC('shoes', 'boots', 'bootfeet', 'sneakfeet', 'flamefeet') || (LEGC ? dk(LEGC, 0.72) : null);
  const GLOVE = pickC('gloves');
  const CUFF = pickC('cuffs') || (SLV ? dk(SLV, 0.76) : null);
  // ความเรียวแขนขา ตั้งจากผลวัดสไปรต์ทางการรายตัว: stub ป้อม / slim เรียว / xslim เรียวพิเศษ

  const main = ctx;

    }
  }

    const w1 = Math.sin(P.anim * 2.4) * 5, w2 = Math.sin(P.anim * 2.4 + 1.2) * 7;
    ctx.fillStyle = '#1e3270';
    ctx.beginPath();

    ctx.quadraticCurveTo(-48, -46 + w2, -42, -44 + w2);

  /* ---------- ทรงขนมปังขิงชิ้นเดียวตามสไปรต์ต้นฉบับ ----------
     แขน = ปีกป้อมเรียวสั้น · ขา = ตอสั้น · ตัวทรงลูกแพร์ · หัวโตครึ่งตัว
     วาดสองพาส (ขอบ→เนื้อ) ให้หลอมเป็นก้อนเดียว ขอบเส้นเดียวรอบตัว */
  const drawParts = (mode) => {
    const col = mode === 'rim' ? RIM : B;
    const grow = mode === 'rim' ? 5.4 : 0;
    const pad = mode === 'rim' ? 2.6 : 0;
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    const segP = (len, w) => {
      ctx.lineWidth = w + grow;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, len); ctx.stroke();
    };
    // ขา: ตอสั้นป้อม / เรียวยาว (สีกางเกง + รองเท้าตามทรงจริง: บูท/ผ้าใบ/เปลวไฟ)
    const legP = (hip, knee, ox) => {
      ctx.save();
      if (mode === 'fill' && LEGC) { ctx.strokeStyle = LEGC; ctx.fillStyle = LEGC; }
      ctx.translate(ox || 0, -26);
      ctx.rotate(hip);

      ctx.translate(0, 9);
      ctx.rotate(knee * 0.75);
      segP(9, 12.5 * LW);
      const fxq = FRONT ? 0 : 2;
      if (mode === 'fill' && SHOE) ctx.fillStyle = SHOE;
      if (mode === 'fill') AUTOL = true;   // เท้า/รองเท้ามีเส้นขอบของตัวเอง
      if (SHOEST && SHOEST.p === 'flamefeet') {
        // เท้าเปลวไฟ (วิญญาณเพลิง)
        ctx.beginPath();
        ctx.moveTo(-6 - pad, 16 + pad);
        ctx.quadraticCurveTo(-10 - pad, 5 - pad, fxq, 2 - pad);
        ctx.quadraticCurveTo(10 + pad, 5 - pad, 7 + pad, 16 + pad);
        ctx.quadraticCurveTo(3, 10, 1, 15);
        ctx.quadraticCurveTo(-2, 10, -6 - pad, 16 + pad);
        ctx.closePath(); ctx.fill();
      } else if (SHOEST && SHOEST.p === 'bootfeet') {
        // บูทมีข้อ: แข้งบูท + หัวบูท
        roundRect(fxq - 5.5 - pad, -pad, 11 + pad * 2, 9 + pad * 2, 3.5); ctx.fill();
        ctx.beginPath(); ctx.ellipse(fxq + 1, 11, 9 + pad, 5.8 + pad, 0, 0, TAU); ctx.fill();
      } else {

          ctx.fillStyle = '#f4f4f0';

        ctx.fillStyle = 'rgba(70,35,10,.16)';

      ctx.save();

      if (mode === 'fill') AUTOL = true;   // มือมีเส้นขอบของตัวเอง
      // นิ้วโป้งนวมเล็ก ๆ แบบสไปรต์จริง แล้วค่อยวางฝ่ามือทับ
      ctx.beginPath(); ctx.arc(-4.6 * HW, 13.2, 2.9 * HW + pad, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 11, 7.2 * HW + pad, 0, TAU); ctx.fill();

    else { armP(armA, eA); armP(armB, eB); }

    ctx.translate(0, -84 + headBob);
    if (mode === 'fill') AUTOL = true;
    ctx.beginPath(); ctx.ellipse(0.5, 0, 32 * HS + pad, 28.5 * HS + pad, 0, 0, TAU); ctx.fill();
    AUTOL = false;
    ctx.restore();

  /* ---------- รายละเอียดบนตัว ---------- */
  if (ch.id === 'brave') {
    // กะโหลกขาวแบน 2 เม็ด เบ้าตาดำชัดแบบต้นฉบับ

      ctx.save();
      ctx.translate(sx, sy); ctx.scale(s, s);

      ctx.beginPath(); ctx.ellipse(-1.8, -0.9, 1.25, 1.6, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(1.8, -0.9, 1.25, 1.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(58,42,26,.85)';

  ctx.save();

  ctx.beginPath(); ctx.ellipse(-2, -16, 26, 15, 0.08, 0, TAU); ctx.fill();
  ctx.fillStyle = B; // กลบส่วนกลางให้เหลือเป็นแถบโค้งบน
  ctx.beginPath(); ctx.ellipse(-1, -11, 24.5, 13, 0.08, 0, TAU); ctx.fill();

  ctx.beginPath(); ctx.ellipse(0.5, 24, 30, 12, 0, 0, TAU); ctx.fill();

  if (ch.id === 'berry') {

    ctx.beginPath(); ctx.moveTo(0, -33); ctx.lineTo(2, -42); ctx.stroke();
  } else if (!ch.deco) {
    /* ปอยผมหวัดขาวหนาแบบต้นฉบับ: ซิกแซกใหญ่มุมบนซ้าย + ปลายพลิ้ว */
    const qf = Math.floor(G.time * 12) / 12;

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4.4;

    ctx.fillStyle = '#28418c';

    ctx.fillStyle = '#1e3270';
    ctx.beginPath();
    ctx.moveTo(-30, -6.5); ctx.lineTo(-49, 2); ctx.lineTo(-45, 9.5); ctx.lineTo(-29, 0.5);

    // ผ้าปิดจมูก-ปาก (เลื่อนตามหน้าตอนหันตรง)
    ctx.fillStyle = '#28418c';
    ctx.beginPath(); ctx.arc(FRONT ? 0.5 : 11.5, 8, 21, Math.PI * 0.06, Math.PI * 0.94); ctx.closePath(); ctx.fill();
  } else if (ch.id === 'angel') {
    ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.ellipse(0, -40, 18, 5.8, 0, 0, TAU); ctx.stroke();
  }

  if (FRONT) ctx.translate(-11.5, 0);   // หันหน้าตรง: เลื่อนตา-ปากมากึ่งกลางหัว
  const eyeStyle = ch.deco ? (ch.eyeS || 'round') : (ch.eyeS === 'round' ? 'round' : 'fierce');
  if (eyeStyle === 'fierce') {
  /* --- คิ้วขาวหนาเฉียง + ตาครึ่งวงฟ้า "มุ่งมั่น" (แบบสไปรต์เป๊ะ) --- */

  const eye = (ex, ey, r, tilt) => {
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(tilt);
    ctx.fillStyle = EYE;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-r * 0.4, r * 0.28, r * 0.2, 0, TAU); ctx.fill();
    ctx.restore();
  };
  eye(1.5, -2.6, 6.2, 0.3);
  eye(21.5, -2.6, 5.8, -0.28);
  } else if (eyeStyle === 'round') {
    /* ตากลมโตแบบคลาสสิก: วงรีตั้ง + ประกายคู่ + ขนตาสำหรับสาว ๆ */
    const lash = LASH_IDS.includes(ch.id);
    /* เรขาคณิตตาตามสไปรต์จริง: ตาห่างกว้าง อยู่ค่อนล่างของหัว
       รูม่านตาดำกินเกือบเต็มดวง + ประกาย 2 เม็ด ไม่มีเปลือกตาหนา */
    for (const [ex, r] of [[-2, 8.4], [25, 7.9]]) {

      ctx.beginPath(); ctx.ellipse(ex, -1, r + 1.3, r + 2.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = EYE;
      ctx.beginPath(); ctx.ellipse(ex, -1, r, r + 1.1, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#241a10';
      ctx.beginPath(); ctx.ellipse(ex + 0.6, 0, r * 0.78, r * 0.86, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.97)';
      ctx.beginPath(); ctx.arc(ex - r * 0.32, -4.6, r * 0.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(ex + r * 0.34, 3.2, r * 0.18, 0, TAU); ctx.fill();
      if (lash) {
        ctx.strokeStyle = RIM; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
        const sgn = ex < 10 ? -1 : 1;
        for (const [aa, ll] of [[-1.15, 4.2], [-0.75, 3.6], [-0.35, 3]]) {
          const bx2 = ex + Math.cos(aa) * (r + 1.2) * sgn, by2 = -3 + Math.sin(aa) * (r + 2.4);
          ctx.beginPath(); ctx.moveTo(bx2, by2);
          ctx.lineTo(bx2 + Math.cos(aa - 0.3) * ll * sgn, by2 + Math.sin(aa - 0.3) * ll);
          ctx.stroke();
        }
      }
    }
    // แก้มแดงนุ่มเป็นค่าเริ่มต้นของสายน่ารัก (ถ้าไม่มีแก้มเฉพาะตัวอยู่แล้ว)
    if (lash && !ds0.some(q => q.p === 'blushdot' || q.p === 'heartcheek' || q.p === 'flamecheek')) {
      ctx.fillStyle = 'rgba(255,120,130,.26)';
      ctx.beginPath(); ctx.ellipse(-11, 8.6, 4.6, 3.1, 0.1, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(34, 8.6, 4.4, 3, -0.1, 0, TAU); ctx.fill();
    }
  } else if (eyeStyle === 'sharp') {
    /* ตาเรียวเฉียบ */
    for (const [ex, tilt] of [[-2, 0.18], [25, -0.18]]) {
      ctx.save(); ctx.translate(ex, -3); ctx.rotate(tilt);
      ctx.fillStyle = RIM;
      ctx.beginPath(); ctx.ellipse(0, 0, 7.4, 4.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = EYE;
      ctx.beginPath(); ctx.ellipse(0, 0.4, 6, 3.4, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a1e14';
      ctx.beginPath(); ctx.arc(1, 0.4, 2, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = RIM; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - 7, -9.5); ctx.lineTo(ex + 6, -7); ctx.stroke();
    }
  } else {
    /* happy: ตาหลับยิ้ม */
    ctx.strokeStyle = RIM; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-2, 0, 6.4, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(25, 0, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  if (ch.id === 'ninja') {
    /* นินจาปิดหน้า — ไม่วาดปาก (ตามสไปรต์จริง) */
  } else if (eyeStyle === 'fierce') {
  /* --- ยิ้มเจ้าเล่ห์แดงหนา + ติ่งมุมปาก + จุดแก้ม --- */
  ctx.strokeStyle = '#d5342b'; ctx.lineWidth = 4.6;
  ctx.beginPath();
  ctx.moveTo(0.5, 10);
  ctx.quadraticCurveTo(11, 15.8, 21.5, 9.2);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-1.2, 8.6, 1.8, Math.PI * 0.35, Math.PI * 1.35); ctx.stroke();
  // ติ่งมุมปากเข้ม + ไฝจุดเล็ก
  ctx.fillStyle = RIM;
  ctx.beginPath(); ctx.ellipse(-8.5, 5.2, 1.5, 2.1, 0.5, 0, TAU); ctx.fill();
  } else {
    /* ยิ้มเรียบง่ายแบบสไปรต์คลาสสิก (เล็กลง อยู่ต่ำลง ตามต้นฉบับ) */
    ctx.strokeStyle = '#d5342b'; ctx.lineWidth = 3.8;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(11.5, 8, 6, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }
  if (ch.id === 'berry') {
    ctx.fillStyle = ch.cheek;
    ctx.beginPath(); ctx.ellipse(-8.5, 8, 5, 3.6, 0.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(27, 8, 4.2, 3.2, -0.1, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* --- สตรอว์เบอร์รีคู่ใจ (เฉพาะคุกกี้สตรอว์เบอร์รี) --- */
  if (ch.id === 'berry') {
    ctx.save();
    ctx.translate(30, -32);
    ctx.rotate(0.15);
    ctx.fillStyle = '#e8506e';
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.quadraticCurveTo(11, -7, 10, 2);
    ctx.quadraticCurveTo(8, 11, 0, 13);
    ctx.quadraticCurveTo(-8, 11, -10, 2);
    ctx.quadraticCurveTo(-11, -7, 0, -9);
    ctx.fill();
    ctx.fillStyle = '#3f8a4a';
    for (const aa of [-0.7, 0, 0.7]) {
      ctx.save(); ctx.rotate(aa);
      ctx.beginPath(); ctx.ellipse(0, -10, 3, 5, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,244,220,.95)';
    for (const [dx, dy] of [[-4, 0], [4, -1], [0, 6], [-2, -5], [5, 5]])
      { ctx.beginPath(); ctx.ellipse(dx, dy, 1.1, 1.7, 0.3, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  /* --- ไม้เท้าลูกกวาด: ลายแดงเฉียงแบบสไปรต์ --- */
  if (ch.id === 'brave') {
    ctx.save();
    const cn = joints.cane;   // ท่ายืน: ถือไม้เท้าด้วยแขนที่เหยียดออก (ตำแหน่งกำหนดเอง)
    let botY = 42;
    if (cn) {
      ctx.translate(cn.x, cn.y);
      ctx.rotate(cn.rot || 0);
      if (cn.flip) ctx.scale(-1, 1);
      botY = cn.len || 42;
    } else {
      // ถือด้วยมือหลัง ปลายไม้ลากไปข้างหลังแบบท่าวิ่งต้นฉบับ
      const cq = Math.floor(((P.anim * 1.15 % TAU) + TAU) % TAU / TAU * 8) / 8 * TAU;
      ctx.translate(-30 + Math.sin(cq - 0.6) * 1.6, -48 + Math.sin(cq - 0.6) * 2.4);
      ctx.rotate(0.35 + Math.sin(cq - 0.6) * 0.07 + (P.onGround ? 0 : -0.12));
      ctx.scale(-1, 1);
    }
    const hookPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.arc(9, -20, 9, Math.PI, Math.PI * 1.98, false);
    };
    // ขอบ
    ctx.lineCap = 'round';
    ctx.strokeStyle = RIM; ctx.lineWidth = 11.2;
    ctx.beginPath(); ctx.moveTo(0, botY); ctx.lineTo(0, -20); ctx.stroke();
    hookPath(); ctx.stroke();
    // เนื้อขาว
    ctx.strokeStyle = '#fdfaf4'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, botY); ctx.lineTo(0, -20); ctx.stroke();
    hookPath(); ctx.stroke();
    // ลายแดงเฉียงบนแท่ง (ขาวเป็นพื้น แดงเป็นแถบพาดตามภาพต้นฉบับ)
    ctx.strokeStyle = '#e03028'; ctx.lineWidth = 6; ctx.lineCap = 'butt';
    for (let yy = botY - 6; yy > -18; yy -= 13) {
      ctx.beginPath(); ctx.moveTo(-4.1, yy + 3.4); ctx.lineTo(4.1, yy - 3.4); ctx.stroke();
    }
    // แต้มแดงบนตะขอ
    ctx.lineCap = 'butt'; ctx.lineWidth = 6;
    for (const [a1, a2] of [[1.08, 1.24], [1.44, 1.6], [1.78, 1.92]]) {
      ctx.beginPath(); ctx.arc(9, -20, 9, Math.PI * a1, Math.PI * a2); ctx.stroke();
    }
    // มือกำ (สีเนื้อกลืนแขน)
    ctx.fillStyle = B;
    ctx.beginPath(); ctx.arc(0, 12, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = RIM; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.arc(0, 12, 7, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  runHeldDecos(ch, RIM);

  finishSprite(dk(B, 0.42));
  ctx = main;
  // บีบแนวตั้งเล็กน้อยตอนแปะ (ยึดตำแหน่งเท้าเดิม) — สไปรต์จริงป้อมกว้าง W:H ≈ 0.8
  ctx.drawImage(olOut, -C_OX, -C_OY * SQ, 200, 205 * SQ);
}


function drawCookieRun(t, ch) {
  t *= 1.15;
  /* จังหวะแบบสไปรต์เกมจริง: ล็อกท่าเป็นสเต็ป 8 เฟรมต่อรอบ (~12fps)
     ทำให้ท่า "คม" เป็นเฟรม ๆ ไม่ใช่ tween ลื่น ๆ */
  const STEPS = 8;
  const tq = Math.floor(((t % TAU) + TAU) % TAU / TAU * STEPS) / STEPS * TAU;
  const s = Math.sin(tq), c = Math.cos(tq);
  const sB = Math.sin(tq + Math.PI);
  /* squash & stretch ในวงจรวิ่ง: หดตอนเท้ากระแทกพื้น ยืดตอนถีบตัวลอย */
  const sy = 1 - 0.06 * Math.cos(tq * 2 + 0.5);
  ctx.save();
  ctx.translate(0, -Math.abs(c) * 3.4);          // ตัวเด้งตามก้าว
  ctx.scale(2 - sy, sy);                          // ยืด-หดรักษาปริมาตร (จุดหมุนที่เท้า)
  /* ท่าควบแบบต้นฉบับ: สวิงหน้าแรงกว่าหลัง + เข่าพับสูงตอนตวัดขากลับ */
  const hipA = s < 0 ? s * 1.3 : s * 0.95;
  const hipB = sB < 0 ? sB * 1.3 : sB * 0.95;
  const kneeA = 0.1 + Math.pow(Math.max(0, Math.sin(tq - 0.7)), 1.3) * 1.55;
  const kneeB = 0.1 + Math.pow(Math.max(0, Math.sin(tq + Math.PI - 0.7)), 1.3) * 1.55;
  cookieBody(
    0.26 + Math.sin(tq * 2) * 0.03,               // เอนหน้าแรงแบบภาพวิ่งต้นฉบับ
    hipA, hipB,
    4.15 + s * 0.22,                              // แขนหลังกำไม้เท้าลากตามหลัง
    1.75 - s * 0.85,                              // แขนหน้าสะบัดขึ้นหน้า-บน
    Math.abs(c) * -2.6,
    ch,
    { kA: kneeA, kB: kneeB, eA: 0.95, eB: 0.72 + s * 0.35 }
  );
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.lineCap='round';
  for (let i = 0; i < 3; i++) {
    const yy = -30 - i * 18, ln = 14 + ((t * 7 + i * 2) % 3) * 5;
    ctx.beginPath(); ctx.moveTo(-30, yy); ctx.lineTo(-30 - ln, yy); ctx.stroke();
  }
}
function drawCookieJump(second) {
  if (second) {
    // ตีลังกาม้วนตัว — หมุนทีละสเต็ป 10 เฟรมแบบสไปรต์
    ctx.save();
    ctx.translate(0, -40);
    ctx.rotate(Math.floor((P.anim * 1.8 % TAU) / (TAU / 10)) * (TAU / 10));
    ctx.translate(0, 40);
    cookieBody(0, 1.15, -0.7, 2.5, 3.2, 0, undefined,
      { kA: 1.5, kB: 1.35, eA: 1.25, eB: 1.2 });

  } else if (P.vy < 0) {
    // พุ่งขึ้น: เข่าหน้ายกพับ ขาหลังเหยียดถีบ แขนสะบัดขึ้น
    cookieBody(0.17, -0.75, 1.05, 1.9, 3.55, 1,

      { kA: 1.35, kB: 0.25, eA: 0.9, eB: 0.35 });
  } else {
    // ร่วงลง: ขาถ่างเตรียมรับพื้น แขนกางทรงตัว
    cookieBody(0.1, 0.55, -0.8, 2.15, 3.35, -1,
      undefined,
      { kA: 0.5, kB: 0.75, eA: 0.45, eB: 0.6 });

}
function drawCookieSlide(t) {
  // สไลด์เท้านำ ตัวเอนราบ แขนหลังกวาดพื้น
  ctx.save();

}

/* ---------- particles & floaters ---------- */
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.t * 6);
      ctx.fillRect(-p.r, -p.r/3, p.r*2, p.r/1.5);
      ctx.fillRect(-p.r/3, -p.r, p.r/1.5, p.r*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  for (const f of floaters) {
    const a = 1 - f.t / 1.4;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = `bold ${f.big ? 24 : 17}px Trebuchet MS`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.c;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   UI WIDGETS
   ============================================================ */
function drawBtn(x, y, w, h, label, cb, opt = {}) {
  uiButtons.push({ x, y, w, h, cb, disabled: opt.disabled });
  if (opt.invisible) return;   // พื้นที่คลิกล่องหน (การ์ดกริด)
  const base = opt.disabled ? '#8a8178' : (opt.color || '#ff8b3d');
  const dark = opt.disabled ? '#6e675f' : (opt.dark || '#d96a1e');
  // เงา
  ctx.fillStyle = 'rgba(60,25,0,.4)';
  roundRect(x, y + 4, w, h, h / 2.4); ctx.fill();
  // ปุ่ม
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, base); g.addColorStop(1, dark);
  ctx.fillStyle = g;
  roundRect(x, y, w, h, h / 2.4); ctx.fill();
  // ไฮไลต์บน
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  roundRect(x + 6, y + 4, w - 12, h * 0.32, h * 0.16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, h / 2.4); ctx.stroke();
  // ตัวหนังสือ
  ctx.font = `bold ${opt.font || 21}px Trebuchet MS`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(80,35,0,.7)';
  ctx.strokeText(label, x + w / 2, y + h / 2 + 1);
  ctx.fillStyle = opt.disabled ? '#d5cfc8' : '#fff';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function drawPanel(x, y, w, h, r = 18) {

function drawTitleText(text, x, y, size, fill1 = '#ffe9a0', fill2 = '#ff8b2e') {

/* ---------- HUD ---------- */
function drawHUD() {
  const bx = 24, by = 20, bw = 330, bh = 26;
  ctx.fillStyle = 'rgba(60,30,0,.55)';
  roundRect(bx - 4, by - 4, bw + 8, bh + 8, 14); ctx.fill();
  const hpFrac = G.hp / G.hpMax;
  const hpC = hpFrac > 0.5 ? '#7bd94a' : hpFrac > 0.25 ? '#ffce2e' : '#ff5f5f';
  ctx.fillStyle = '#3d2410';
  roundRect(bx, by, bw, bh, 11); ctx.fill();
  if (hpFrac > 0.01) {
    ctx.fillStyle = hpC;
    roundRect(bx, by, Math.max(14, bw * hpFrac), bh, 11); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    roundRect(bx + 3, by + 3, Math.max(8, bw * hpFrac - 6), 8, 5); ctx.fill();
  }

  // หน้าคุกกี้ที่หัวแถบพลัง
  ctx.save();
  ctx.translate(bx + 2, by + bh / 2);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 21, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().body;
  ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
  ctx.fillStyle = CH().icing;
  ctx.beginPath(); ctx.arc(0, -3, 18, Math.PI * 1.05, Math.PI * 1.95);
  ctx.quadraticCurveTo(10, -15, 4, -9);
  ctx.quadraticCurveTo(0, -16, -4, -9);
  ctx.quadraticCurveTo(-8, -16, -12, -7);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.ellipse(-4, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 1, 2.4, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a28'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(1, 6, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  if (hpFrac < 0.25 && Math.floor(G.time * 3) % 2 === 0) {
    ctx.fillStyle = '#ff5f5f';
    ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'left';
    ctx.fillText('⚠ พลังใกล้หมด! เก็บยาเพิ่มพลัง!', bx + 10, by + bh + 22);
  }

  ctx.textAlign = 'right';
  ctx.font = 'bold 30px Trebuchet MS';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.8)';
  const sc = Math.floor(G.score).toLocaleString();
  ctx.strokeText(sc, W - 26, 46);
  ctx.fillStyle = '#fff';
  ctx.fillText(sc, W - 26, 46);
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8';
  ctx.strokeStyle = 'rgba(60,30,0,.7)'; ctx.lineWidth = 3;
  const meta = `🏃 ${Math.floor(G.dist)} m    🍬 ${G.jellies}    🪙 ${G.coins}`;
  ctx.strokeText(meta, W - 26, 72);
  ctx.fillText(meta, W - 26, 72);
  // ชั้นหอคอย
  if (G.mode === 'tower') {
    ctx.textAlign = 'right';
    ctx.font = 'bold 19px Trebuchet MS';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,40,70,.8)';
    const ft = '🧊 ชั้น ' + G.floorNow + '  (' + Math.ceil(20 - G.floorT) + ' วิ)';
    ctx.strokeText(ft, W - 26, 118);
    ctx.fillStyle = '#aee4ff';
    ctx.fillText(ft, W - 26, 118);
  }
  // ความคืบหน้าตัวอักษร BONUSTIME
  if (G.bonusT <= 0 && G.mode === 'normal') {
    ctx.font = 'bold 15px Trebuchet MS';
    for (let i = 0; i < 9; i++) {
      const cx2 = W - 26 - (8 - i) * 15;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.7)';
      ctx.strokeText(BT_WORD[i], cx2, 94);
      ctx.fillStyle = i < G.btProgress ? '#ff9dd6' : 'rgba(255,255,255,.28)';
      ctx.fillText(BT_WORD[i], cx2, 94);
    }
  }

  if (G.combo >= 5) {
    ctx.textAlign = 'center';
    const pop = 1 + Math.max(0, 0.4 - G.comboTimer) * 0.6;
    ctx.save();
    ctx.translate(W / 2, 96);
    ctx.scale(pop, pop);
    ctx.font = 'bold 30px Trebuchet MS';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,30,0,.85)';
    ctx.strokeText(G.combo + ' COMBO!', 0, 0);
    ctx.fillStyle = `hsl(${(G.combo * 14) % 360},90%,65%)`;
    ctx.fillText(G.combo + ' COMBO!', 0, 0);
    ctx.restore();
  }

  let iy = by + bh + (G.hp / G.hpMax < 0.25 ? 38 : 14) + 8;
  ctx.textAlign = 'left'; ctx.font = 'bold 15px Trebuchet MS';
  if (P.giantT > 0) {
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('🍭 ยักษ์: ' + P.giantT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (P.magnetT > 0) {
    ctx.fillStyle = '#7ecbff';
    ctx.fillText('🧲 แม่เหล็ก: ' + P.magnetT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.bonusT > 0) {
    ctx.fillStyle = '#ffe066';
    ctx.fillText('⭐ BONUS TIME: ' + G.bonusT.toFixed(1) + 's', bx, iy); iy += 22;
  }
  if (G.revives > 0) {
    ctx.fillStyle = '#ffb0c8';
    ctx.fillText('💖 ชุบชีวิต x' + G.revives, bx, iy);
  }

  /* ปุ่มโปร่งแสง Jump / Slide มุมล่างจอ (แบบเกมจริง) */
  const bubbleBtn = (x, label, pressed) => {
    ctx.save();
    ctx.globalAlpha = pressed ? 0.5 : 0.24;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.fill();
    ctx.globalAlpha = pressed ? 0.95 : 0.5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, H - 72, 50, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, H - 72, 41, Math.PI * 1.12, Math.PI * 1.42); ctx.stroke();
    ctx.font = 'bold 21px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,.55)';
    ctx.strokeText(label, x, H - 64);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x, H - 64);
    ctx.restore();
  };
  bubbleBtn(82, 'Jump', !P.onGround);
  bubbleBtn(W - 82, 'Slide', P.sliding);

  // ปุ่มสกิลไม้ตายกลางล่าง (Magic Candy)
  {
    const sx = W / 2, sy = H - 66, r = 40;
    const ready = G.skill >= 100;
    ctx.save();
    ctx.globalAlpha = ready ? 0.95 : 0.55;
    ctx.fillStyle = 'rgba(50,25,5,.6)';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    // วงเกจชาร์จ
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, 0, TAU); ctx.stroke();
    ctx.strokeStyle = ready ? '#ffe066' : '#7ee0ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(sx, sy, r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * (G.skill / 100)); ctx.stroke();
    // ไอคอนลูกกวาดสกิล
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🍭', sx, sy + 1);
    ctx.textBaseline = 'alphabetic';
    if (ready) {
      const pul = 1 + Math.sin(G.time * 8) * 0.08;
      ctx.strokeStyle = `rgba(255,224,102,${0.5 + Math.sin(G.time * 8) * 0.3})`;
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(sx, sy, r * pul + 4, 0, TAU); ctx.stroke();
      ctx.font = 'bold 14px Trebuchet MS';
      ctx.fillStyle = '#ffe066';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,30,0,.8)';
      ctx.strokeText('สกิลพร้อม! (X)', sx, sy + r + 20);
      ctx.fillText('สกิลพร้อม! (X)', sx, sy + r + 20);
    }
    ctx.restore();
  }

  // ปุ่มพักเกมกลางบน
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(60,30,0,.5)';
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, 30, 20, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#fff';
  roundRect(W / 2 - 7, 22, 5, 16, 2); ctx.fill();
  roundRect(W / 2 + 2, 22, 5, 16, 2); ctx.fill();
  ctx.restore();

  // จอพักเกม
  if (G.paused) {
    ctx.fillStyle = 'rgba(30,12,2,.66)';
    ctx.fillRect(0, 0, W, H);
    drawTitleText('พักเกม', W / 2, 240, 54);
    ctx.font = 'bold 22px Trebuchet MS'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,.9)';
    ctx.strokeText('แตะที่ไหนก็ได้ หรือกด P เพื่อเล่นต่อ', W / 2, 300);
    ctx.fillStyle = '#ffe9b8';
    ctx.fillText('แตะที่ไหนก็ได้ หรือกด P เพื่อเล่นต่อ', W / 2, 300);
  }
}

function drawBanner() {
  if (!G.banner || G.bannerT > 1.6) return;
  const a = G.bannerT < 0.25 ? G.bannerT / 0.25 : G.bannerT > 1.25 ? (1.6 - G.bannerT) / 0.35 : 1;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,.85)';
  ctx.strokeText(G.banner.text, W / 2, 200);
  ctx.fillStyle = G.banner.color;
  ctx.fillText(G.banner.text, W / 2, 200);
  ctx.globalAlpha = 1;
}

      ctx.fillText(d.gems ? '💎' : '🪙', x + 35, y + 52);

  }

/* ---------- เตรียมพร้อมก่อนวิ่ง: เลือกบูสต์ใช้ครั้งเดียว ---------- */
function prepTotal() {
  return BOOSTS.reduce((s, b) => s + (G.boostSel[b.id] ? b.cost : 0), 0);
}
function prepGo() {
  const total = prepTotal();
  if (total > G.bank) { AudioSys.deny(); floatText(W / 2, 120, 'เหรียญไม่พอสำหรับบูสต์!', '#ff8888', true); return; }
  if (total > 0) { G.bank -= total; SAVE.set('coins', G.bank); AudioSys.buy(); }
  startGame('normal', Object.assign({}, G.boostSel));
}

  ctx.save();

  drawCookieRun(P.anim);
  ctx.restore();
  ctx.save();
  ctx.translate(70, 230 + Math.sin(G.time * 4) * 8);
  drawPet(PT());
  ctx.restore();
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(CH().name + '  Lv.' + (G.charLv[G.charIdx] || 1), 150, 372);
  ctx.font = '13px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
  ctx.fillText(PT().name + '  Lv.' + petLvNow(), 150, 394);

  // ---- คู่วิ่งผลัด (Relay) แบบเกมจริง: ล้มแล้วตัวสำรองวิ่งต่อ ----
  drawPanel(28, 408, 250, 96, 12);
  ctx.font = 'bold 13.5px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = '#7bd94a';
  ctx.fillText('🏃 คู่วิ่งผลัด (RELAY)', 152, 428);
  const relayOK = G.relayIdx >= 0 && G.relayIdx !== G.charIdx && G.owned.includes(G.relayIdx);
  if (relayOK) {
    ctx.drawImage(cookiePortrait(G.relayIdx), 40, 428, 56, 64);
    ctx.font = 'bold 12.5px Trebuchet MS'; ctx.fillStyle = '#fff';
    let rn = CHARS[G.relayIdx].name.replace('คุกกี้', '');
    if (rn.length > 12) rn = rn.slice(0, 11) + '…';
    ctx.fillText(rn, 168, 452);
    ctx.font = '11px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText('ล้มเมื่อไหร่ รับไม้ต่อทันที', 168, 470);
  } else {
    ctx.font = '12px Trebuchet MS'; ctx.fillStyle = '#c8b8a0';
    ctx.fillText('ไม่ใช้ตัวสำรอง', 152, 460);
  }
  const relayCycle = dir => {
    const owned = CHARS.map((c2, i2) => i2).filter(i2 => G.owned.includes(i2) && i2 !== G.charIdx);
    if (!owned.length) return;
    const opts = [-1, ...owned];
    let at = opts.indexOf(G.relayIdx); if (at < 0) at = 0;
    G.relayIdx = opts[(at + dir + opts.length) % opts.length];
    SAVE.set('relay', G.relayIdx);
    AudioSys.click();
  };
  drawBtn(34, 466, 34, 30, '‹', () => relayCycle(-1), { color: '#a08468', dark: '#7d6448', font: 16 });
  drawBtn(238, 466, 34, 30, '›', () => relayCycle(1), { color: '#a08468', dark: '#7d6448', font: 16 });

  // การ์ดบูสต์ 2x2
  ctx.font = 'bold 15px Trebuchet MS';
  ctx.fillStyle = '#ffe9b8'; ctx.textAlign = 'center';
  ctx.fillText('บูสต์ใช้ครั้งเดียว (เลือกได้หลายอัน)', 610, 96);
  BOOSTS.forEach((b, i) => {
    const x = 330 + (i % 2) * 290, y = 110 + Math.floor(i / 2) * 122;
    const on = !!G.boostSel[b.id];
    drawPanel(x, y, 276, 108, 14);
    if (on) {
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 4;
      roundRect(x + 2, y + 2, 272, 104, 12); ctx.stroke();
    }
    ctx.font = '30px Trebuchet MS'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.icon, x + 38, y + 42);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px Trebuchet MS';
    ctx.fillStyle = on ? '#ffd24a' : '#fff';
    ctx.fillText(b.name, x + 70, y + 34);
    ctx.font = '12.5px Trebuchet MS'; ctx.fillStyle = '#ffe9b8';
    ctx.fillText(b.desc, x + 70, y + 55);
    drawBtn(x + 16, y + 66, 244, 32, on ? '✓ เลือกแล้ว — 🪙 ' + b.cost.toLocaleString() : '🪙 ' + b.cost.toLocaleString(),
      () => {
        if (!G.boostSel[b.id] && prepTotal() + b.cost > G.bank) { AudioSys.deny(); return; }
        G.boostSel[b.id] = !G.boostSel[b.id];
        AudioSys.click();
      },
      on ? { color: '#7bd94a', dark: '#57a832', font: 14 } : { color: '#a08468', dark: '#7d6448', font: 14 });
  });

  const total = prepTotal();
  ctx.font = 'bold 16px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillStyle = total > G.bank ? '#ff8888' : '#ffe9b8';
  ctx.fillText('รวมค่าบูสต์: 🪙 ' + total.toLocaleString(), 610, 376);

  // ---- เลือกตอน (EPISODE) — ปลดล็อกด้วยสถิติระยะทาง ----
  ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe9b8';
  ctx.fillText('เลือกตอน (สถิติไกลสุด ' + G.distBest.toLocaleString() + ' m):', 310, 404);
  EPISODES.forEach((ep2, i) => {
    const bx = 310 + i * 118, by2 = 412, bw = 110, bh = 40;
    const un = epUnlocked(i);
    const cur = G.episode === i;
    drawBtn(bx, by2, bw, bh,
      (un ? ep2.icon + ' ' : '🔒 ') + 'EP' + (i + 1),
      () => {
        if (!un) { AudioSys.deny(); floatText(W / 2, 100, 'ต้องวิ่งให้ถึง ' + ep2.unlock.toLocaleString() + ' m ก่อน!', '#ff8888', true); return; }
        G.episode = i; SAVE.set('ep', i); AudioSys.click();
        floatText(W / 2, 100, 'EPISODE ' + (i + 1) + ': ' + ep2.name, '#ffd24a', true);
      },
      cur && un ? { color: '#7bd94a', dark: '#57a832', font: 13 }
        : un ? { color: '#5cb8e8', dark: '#3d92c4', font: 13 }
        : { color: '#8a8178', dark: '#6e675f', font: 13 });
  });
  ctx.font = 'bold 12px Trebuchet MS'; ctx.textAlign = 'left';
  ctx.fillStyle = '#c8e8ff';
  ctx.fillText('▶ EP' + (G.episode + 1) + ' ' + EP().name + (G.episode > 0 ? ' (เร็ว+' + EP().spd + ' พลังลดไวขึ้น)' : ''), 310, 472);

  drawBtn(W / 2 + 30, 480, 270, 44, '🏁 GO!!', prepGo, { color: '#ffb02e', dark: '#e07b12', font: 22 });
  drawBtn(W - 176, 480, 150, 44, '← กลับ', () => setState('menu'), { color: '#a08468', dark: '#7d6448', font: 15 });
}
